apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- pairs:
    app.kubernetes.io/managed-by: argocd

resources:
  # Monitoring
  - manifests/monitoring/namespace.yaml
  - manifests/monitoring/node-exporter.yaml
  
  # Heimdall
  - manifests/heimdall/namespace.yaml
  - manifests/heimdall/deployment.yaml
  - manifests/heimdall/ingress.yaml

  # Vaultwarden
  - manifests/vaultwarden/namespace.yaml
  - manifests/vaultwarden/deployment.yaml

  # Code Server
  - manifests/code-server/namespace.yaml
  - manifests/code-server/deployment.yaml
  - manifests/code-server/ingress.yaml

  # Grafana
  - manifests/grafana/namespace.yaml
  - manifests/grafana/deployment.yaml
  - manifests/grafana/ingress.yaml

  # Prometheus
  - manifests/prometheus/namespace.yaml
  - manifests/prometheus/configmap.yaml
  - manifests/prometheus/rbac.yaml  #
  - manifests/prometheus/deployment.yaml
  - manifests/prometheus/ingress.yaml

  # ArgoCD Ingress
  - manifests/argocd/ingress.yaml

  # cert-manager
  - manifests/cert-manager/namespace.yaml
  - manifests/cert-manager/application.yaml

  # Ingress NGINX
  - manifests/ingress-nginx/namespace.yaml
  - manifests/ingress-nginx/application.yaml

  # MetalLB
  - manifests/metallb/namespace.yaml
  - manifests/metallb/application.yaml
  - manifests/metallb/config.yaml

  # Vault Secret Manager
  - manifests/vault/namespace.yaml
  - manifests/vault/application.yaml

  # Harbor Container Registry
  - manifests/harbor/namespace.yaml
  - manifests/harbor/application.yaml

  # Kured - OS Reboot Daemon
  - manifests/kured/namespace.yaml
  - manifests/kured/application.yaml

  # External DNS
  - manifests/external-dns/namespace.yaml
  - manifests/external-dns/application.yaml

  # AlertManager
  - manifests/alertmanager/namespace.yaml
  - manifests/alertmanager/configmap.yaml
  - manifests/alertmanager/deployment.yaml

  # Loki Log Aggregation
  - manifests/loki/namespace.yaml
  - manifests/loki/application.yaml

  # Alloy Log Collector
  - manifests/alloy/namespace.yaml
  - manifests/alloy/application.yaml

  # Cloudflare Tunnel
  - manifests/cloudflared/namespace.yaml
  - manifests/cloudflared/deployment.yaml

  # UniFi Network Server
  - manifests/unifi/namespace.yaml
  - manifests/unifi/deployment.yaml

  # Ollama GPU
  - manifests/ollama/namespace.yaml
  - manifests/ollama/rbac.yaml
  - manifests/ollama/pvc.yaml
  - manifests/ollama/service.yaml
  - manifests/ollama/deployment.yaml

  # Joplin Server
  - manifests/joplin/namespace.yaml
  - manifests/joplin/rbac.yaml
  # joplin/secret.yaml removed — plaintext postgres password moved to runtime-only k8s Secret
  # (managed out-of-band, rotated, sourced from Vault in future refactor)
  - manifests/joplin/certificate.yaml
  - manifests/joplin/deployment.yaml
  - manifests/joplin/service.yaml
  - manifests/joplin/ingress.yaml
  # Browser Service
  - manifests/browser-service/namespace.yaml
  - manifests/browser-service/rbac.yaml
  - manifests/browser-service/deployment.yaml
  - manifests/browser-service/service.yaml
  
  # Research Worker
  - manifests/research-worker/namespace.yaml
  - manifests/research-worker/rbac.yaml
  - manifests/research-worker/configmap.yaml
  - manifests/research-worker/cronjob.yaml

  # Chill Farm — only-chill.com static site
  - manifests/chill-farm/namespace.yaml
  - manifests/chill-farm/configmap.yaml
  - manifests/chill-farm/nginx-config.yaml
  - manifests/chill-farm/deployment.yaml
  - manifests/chill-farm/service.yaml
  - manifests/chill-farm/ingress.yaml
  # Chill Farm — "The Commons" multiplayer pasture (dependency-free node WS server)
  - manifests/chill-farm/pasture-src.yaml
  - manifests/chill-farm/pasture-deployment.yaml
  - manifests/chill-farm/pasture-service.yaml
  # Chill Farm — "/ranch" hammock lounge chat (dependency-free node WS server)
  - manifests/chill-farm/ranch-src.yaml
  - manifests/chill-farm/ranch-deployment.yaml
  - manifests/chill-farm/ranch-service.yaml