apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifi
  namespace: unifi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-data
  namespace: unifi
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: unifi
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.0.0.165"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: unifi
  ports:
  - name: web-admin
    port: 8443
    targetPort: 8443
    protocol: TCP
  - name: device-inform
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: stun
    port: 3478
    targetPort: 3478
    protocol: UDP
  - name: discovery
    port: 10001
    targetPort: 10001
    protocol: UDP
  - name: l2-discovery
    port: 1900
    targetPort: 1900
    protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: unifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      serviceAccountName: unifi
      containers:
      - name: unifi
        image: jacobalberty/unifi:v8.6
        ports:
        - containerPort: 8443
          protocol: TCP
        - containerPort: 8080
          protocol: TCP
        - containerPort: 3478
          protocol: UDP
        - containerPort: 10001
          protocol: UDP
        - containerPort: 1900
          protocol: UDP
        env:
        - name: TZ
          value: America/Chicago
        - name: UNIFI_STDOUT
          value: "true"
        volumeMounts:
        - name: unifi-data
          mountPath: /unifi
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
      volumes:
      - name: unifi-data
        persistentVolumeClaim:
          claimName: unifi-data
