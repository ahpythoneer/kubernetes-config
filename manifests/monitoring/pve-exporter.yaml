# Proxmox VE exporter. Its config is rendered at startup by the Vault agent from
# secret/proxmox/monitoring (read-only PVEAuditor API token) — no credentials in git or
# in Kubernetes Secrets. Vault role/policy: pve-exporter (read that one path only).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pve-exporter
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: pve-exporter
        vault.hashicorp.com/agent-inject-secret-pve.yml: secret/data/proxmox/monitoring
        vault.hashicorp.com/agent-inject-template-pve.yml: |
          {{- with secret "secret/data/proxmox/monitoring" -}}
          default:
            user: {{ index (.Data.data.token_id | split "!") 0 }}
            token_name: {{ index (.Data.data.token_id | split "!") 1 }}
            token_value: {{ .Data.data.token_secret }}
            verify_ssl: {{ .Data.data.verify_ssl }}
          {{- end }}
    spec:
      serviceAccountName: pve-exporter   # Vault k8s auth needs its token mounted
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pve-exporter
        image: prompve/prometheus-pve-exporter:3.10.1
        args: ["--config.file=/vault/secrets/pve.yml"]
        ports:
        - name: http
          containerPort: 9221
        readinessProbe:
          tcpSocket: {port: http}
          initialDelaySeconds: 5
        resources:
          requests: {cpu: 10m, memory: 48Mi}
          limits: {memory: 192Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - name: tmp            # python needs a writable tmpdir; root FS stays read-only
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  selector:
    app: pve-exporter
  ports:
  - name: http
    port: 9221
    targetPort: http
