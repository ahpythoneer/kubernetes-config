# Proxmox VE exporter. Config (API token monitoring@pve!prometheus, role PVEAuditor —
# read-only) comes from the runtime-only Secret monitoring/pve-exporter (key pve.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pve-exporter
        image: prompve/prometheus-pve-exporter:3.10.1
        args: ["--config.file=/etc/prometheus/pve.yml"]
        ports:
        - name: http
          containerPort: 9221
        readinessProbe:
          tcpSocket: {port: http}
          initialDelaySeconds: 5
        resources:
          requests: {cpu: 10m, memory: 48Mi}
          limits: {memory: 192Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: pve-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  selector:
    app: pve-exporter
  ports:
  - name: http
    port: 9221
    targetPort: http
