apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: prometheus
data:
  alerts.yml: |
    groups:
    # ---------------------------------------------------------------- nodes
    - name: nodes
      rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is unreachable"
          description: "node-exporter on {{ $labels.instance }} has not answered for 2 minutes (powered off, rebooting or network down). 10.0.128.110 is DGX Spark 1."

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is NotReady"
          description: "{{ $labels.node }} has been NotReady for 2 minutes; its pods are not being managed."

      - alert: KubeNodeCordoned
        expr: kube_node_spec_unschedulable == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has been cordoned for 30 minutes"
          description: "Forgotten uncordon after maintenance? Run: kubectl uncordon {{ $labels.node }}"

      - alert: KubeAPIServerDown
        expr: up{job="kubernetes-apiserver"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes API server {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape the API server at {{ $labels.instance }}. With 2 etcd members, losing a control plane node stops the API."

      - alert: NodeDiskFilling
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"
          description: "Over 85% used for 10 minutes."

      - alert: NodeDiskCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"}) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"
          description: "Over 95% used; kubelet will start evicting pods soon."

      - alert: NodeMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% used"
          description: "Over 90% for 10 minutes."

      - alert: NodeCPUHigh
        expr: (100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% busy"
          description: "Over 90% for 15 minutes."

      - alert: GPUHot
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU on {{ $labels.Hostname }} is {{ $value }}°C"
          description: "Tesla T4 above 85°C for 5 minutes."

    # ---------------------------------------------------------------- vault
    - name: vault
      rules:
      - alert: VaultNotReady
        expr: kube_statefulset_status_replicas_ready{namespace="vault",statefulset="vault"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault is sealed or down"
          description: "vault-0 has not been Ready for 2 minutes. The auto-unsealer normally fixes a seal within ~10s, so it is failing or Vault itself is broken. Apps using Vault secrets (joplin, vaultwarden, grafana...) will stall."

      - alert: VaultUnsealerDown
        expr: kube_deployment_status_replicas_available{namespace="vault",deployment="vault-unsealer"} < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vault auto-unsealer is not running"
          description: "Vault will stay sealed after its next restart until this is fixed (check Secret vault/vault-unseal-key)."

    # ---------------------------------------------------------------- workloads
    # research-worker is excluded: its CronJob is known-broken (missing python 'requests').
    - name: workloads
      rules:
      - alert: PodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",namespace!="research-worker"}[5m]) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} keeps restarting. Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous"

      - alert: PodImagePullFailing
        expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName",namespace!="research-worker"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
          description: "Container {{ $labels.container }}: {{ $labels.reason }} for 10 minutes (registry, Harbor mirror or tag problem)."

      - alert: PodContainerCreateError
        expr: kube_pod_container_status_waiting_reason{reason=~"CreateContainerError|CreateContainerConfigError|RunContainerError",namespace!="research-worker"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot start ({{ $labels.reason }})"
          description: "Container {{ $labels.container }} fails to be created — missing secret/configmap, bad mount, or runtime (e.g. GPU) problem."

      - alert: PodNotReady
        expr: (kube_pod_status_ready{condition="false",namespace!="research-worker"} * on(namespace, pod) group_left() kube_pod_status_phase{phase="Running"}) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is running but not Ready"
          description: "Not Ready for 15 minutes (failing readiness probe, or stuck waiting on a dependency such as Vault)."

      - alert: PodPendingTooLong
        expr: kube_pod_status_phase{phase="Pending",namespace!="research-worker"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 15 minutes"
          description: "Not scheduled or stuck initialising (no node fits, PVC not bound, init container waiting)."

      - alert: DeploymentUnavailable
        expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} is missing replicas"
          description: "Only {{ $value }} replica(s) available, below the desired count, for 10 minutes."

      - alert: StatefulSetNotReady
        expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} is not fully ready"
          description: "Ready replicas below desired for 10 minutes."

      - alert: DaemonSetNotReady
        expr: kube_daemonset_status_number_ready < kube_daemonset_status_desired_number_scheduled
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} is not ready on every node"
          description: "Some nodes are missing a ready {{ $labels.daemonset }} pod (networking, GPU or monitoring agent)."

      - alert: JobFailed
        expr: kube_job_status_failed{namespace!="research-worker"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
          description: "Check its pod logs; delete the Job to clear this alert."

    # ---------------------------------------------------------------- proxmox
    # node-02 is intentionally powered off (node-01 has the capacity) — excluded.
    - name: proxmox
      rules:
      - alert: ProxmoxNodeDown
        expr: pve_up{id=~"node/.*",id!="node/node-02"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox node {{ $labels.id }} is down"
          description: "Every VM on it (k8s nodes, AD, TrueNAS, Guacamole...) is affected."

      - alert: ProxmoxStorageFilling
        expr: (pve_disk_usage_bytes{id=~"storage/.*",id!~"storage/node-02/.*"} / pve_disk_size_bytes{id=~"storage/.*",id!~"storage/node-02/.*"}) * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox storage {{ $labels.id }} is {{ $value | printf \"%.0f\" }}% full"
          description: "VM disks on this pool can't grow once it fills up."

      - alert: ProxmoxVMStopped
        expr: pve_up{id=~"qemu/.*|lxc/.*"} == 0 and pve_up{id=~"qemu/.*|lxc/.*"} offset 30m == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox guest {{ $labels.id }} stopped"
          description: "It was running 30 minutes ago. If this was intentional, ignore — the alert clears on its own."

      - alert: ProxmoxExporterDown
        expr: up{job="pve"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox metrics are not being collected"
          description: "pve-exporter can't reach 10.0.0.41 or the API token stopped working (PVEAuditor on monitoring@pve and its token)."

    # ---------------------------------------------------------------- monitoring itself
    - name: monitoring
      rules:
      - alert: KubeStateMetricsDown
        expr: absent(up{job="kube-state-metrics"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "kube-state-metrics is down"
          description: "Pod, node and Vault alerts are blind until it is back."
