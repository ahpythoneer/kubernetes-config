apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: prometheus
data:
  alerts.yml: |
    groups:
    # ---------------------------------------------------------------- nodes
    - name: nodes
      rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is unreachable"
          description: "node-exporter on {{ $labels.instance }} has not answered for 2 minutes (powered off, rebooting or network down). 10.0.128.110 is DGX Spark 1."

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is NotReady"
          description: "{{ $labels.node }} has been NotReady for 2 minutes; its pods are not being managed."

      - alert: KubeNodeCordoned
        expr: kube_node_spec_unschedulable == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has been cordoned for 30 minutes"
          description: "Forgotten uncordon after maintenance? Run: kubectl uncordon {{ $labels.node }}"

      - alert: KubeAPIServerDown
        expr: up{job="kubernetes-apiserver"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes API server {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape the API server at {{ $labels.instance }}. With 2 etcd members, losing a control plane node stops the API."

      - alert: NodeDiskFilling
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"
          description: "Over 85% used for 10 minutes."

      - alert: NodeDiskCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|fuse.*|nfs.*|ramfs"}) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"
          description: "Over 95% used; kubelet will start evicting pods soon."

      - alert: NodeMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% used"
          description: "Over 90% for 10 minutes."

      - alert: NodeCPUHigh
        expr: (100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% busy"
          description: "Over 90% for 15 minutes."

      - alert: GPUHot
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU on {{ $labels.Hostname }} is {{ $value }}°C"
          description: "Tesla T4 above 85°C for 5 minutes."

    # ---------------------------------------------------------------- vault
    - name: vault
      rules:
      - alert: VaultNotReady
        expr: kube_statefulset_status_replicas_ready{namespace="vault",statefulset="vault"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault is sealed or down"
          description: "vault-0 has not been Ready for 2 minutes. The auto-unsealer normally fixes a seal within ~10s, so it is failing or Vault itself is broken. Apps using Vault secrets (joplin, vaultwarden, grafana...) will stall."

      - alert: VaultUnsealerDown
        expr: kube_deployment_status_replicas_available{namespace="vault",deployment="vault-unsealer"} < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Vault auto-unsealer is not running"
          description: "Vault will stay sealed after its next restart until this is fixed (check Secret vault/vault-unseal-key)."

      - alert: VaultInjectorDown
        expr: absent(kube_deployment_status_replicas_available{namespace="vault",deployment="vault-agent-injector"} >= 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault agent injector is down"
          description: "No injector replica is available. Pods in Vault-using namespaces cannot be created (webhook failurePolicy Fail) until it is back."

      - alert: VaultInjectionMissing
        expr: |
          (kube_pod_annotations{annotation_vault_hashicorp_com_agent_inject="true"}
            unless on(namespace, pod) kube_pod_init_container_info{container="vault-agent-init"})
          * on(namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is running without its Vault secrets"
          description: "The pod asks for Vault injection but has no vault-agent sidecar, so it started without secrets. Delete the pod to recreate it, and add namespace {{ $labels.namespace }} to the injector namespaceSelector in manifests/vault/application.yaml."

    # ---------------------------------------------------------------- workloads
    # research-worker is excluded: its CronJob is known-broken (missing python 'requests').
    - name: workloads
      rules:
      - alert: PodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",namespace!="research-worker"}[5m]) >= 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} keeps restarting. Check: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous"

      - alert: PodImagePullFailing
        expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName",namespace!="research-worker"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
          description: "Container {{ $labels.container }}: {{ $labels.reason }} for 10 minutes (registry, Harbor mirror or tag problem)."

      - alert: PodContainerCreateError
        expr: kube_pod_container_status_waiting_reason{reason=~"CreateContainerError|CreateContainerConfigError|RunContainerError",namespace!="research-worker"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot start ({{ $labels.reason }})"
          description: "Container {{ $labels.container }} fails to be created — missing secret/configmap, bad mount, or runtime (e.g. GPU) problem."

      - alert: PodNotReady
        expr: (kube_pod_status_ready{condition="false",namespace!="research-worker"} * on(namespace, pod) group_left() kube_pod_status_phase{phase="Running"}) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is running but not Ready"
          description: "Not Ready for 15 minutes (failing readiness probe, or stuck waiting on a dependency such as Vault)."

      - alert: PodPendingTooLong
        expr: kube_pod_status_phase{phase="Pending",namespace!="research-worker"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 15 minutes"
          description: "Not scheduled or stuck initialising (no node fits, PVC not bound, init container waiting)."

      - alert: DeploymentUnavailable
        expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} is missing replicas"
          description: "Only {{ $value }} replica(s) available, below the desired count, for 10 minutes."

      - alert: StatefulSetNotReady
        expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} is not fully ready"
          description: "Ready replicas below desired for 10 minutes."

      - alert: DaemonSetNotReady
        expr: kube_daemonset_status_number_ready < kube_daemonset_status_desired_number_scheduled
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} is not ready on every node"
          description: "Some nodes are missing a ready {{ $labels.daemonset }} pod (networking, GPU or monitoring agent)."

      - alert: JobFailed
        expr: kube_job_status_failed{namespace!="research-worker"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
          description: "Check its pod logs; delete the Job to clear this alert."

    # ---------------------------------------------------------------- proxmox
    # node-02 is intentionally powered off (node-01 has the capacity) — excluded.
    - name: proxmox
      rules:
      - alert: ProxmoxNodeDown
        expr: pve_up{id=~"node/.*",id!="node/node-02"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox node {{ $labels.id }} is down"
          description: "Every VM on it (k8s nodes, AD, TrueNAS, Guacamole...) is affected."

      - alert: ProxmoxStorageFilling
        expr: (pve_disk_usage_bytes{id=~"storage/.*",id!~"storage/node-02/.*"} / pve_disk_size_bytes{id=~"storage/.*",id!~"storage/node-02/.*"}) * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox storage {{ $labels.id }} is {{ $value | printf \"%.0f\" }}% full"
          description: "VM disks on this pool can't grow once it fills up."

      - alert: ProxmoxVMStopped
        expr: pve_up{id=~"qemu/.*|lxc/.*"} == 0 and pve_up{id=~"qemu/.*|lxc/.*"} offset 30m == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox guest {{ $labels.id }} stopped"
          description: "It was running 30 minutes ago. If this was intentional, ignore — the alert clears on its own."

      - alert: ProxmoxExporterDown
        expr: up{job="pve"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox metrics are not being collected"
          description: "pve-exporter can't reach 10.0.0.41 or the API token stopped working (PVEAuditor on monitoring@pve and its token)."

    # ---------------------------------------------------------------- monitoring itself
    - name: monitoring
      rules:
      - alert: KubeStateMetricsDown
        expr: absent(up{job="kube-state-metrics"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "kube-state-metrics is down"
          description: "Pod, node and Vault alerts are blind until it is back."

    # ---------------------------------------------------------------- backups
    # Written by /opt/vaultwarden/backup-to-onedrive.sh (cron 03:00) on 10.0.0.25 through
    # node-exporter's textfile collector (/opt/vaultwarden/metrics).
    - name: backups
      rules:
      - alert: VaultwardenBackupFailed
        expr: vaultwarden_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Primary Vaultwarden backup to OneDrive failed"
          description: "The last run of /opt/vaultwarden/backup-to-onedrive.sh on {{ $labels.instance }} failed. See /opt/vaultwarden/backup.log on the VM."

      - alert: VaultwardenBackupStale
        expr: time() - vaultwarden_backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful Vaultwarden backup for over 26 hours"
          description: "Last success was {{ $value | humanizeDuration }} ago. The cron job may not be running (check crontab -l and /opt/vaultwarden/backup.log on 10.0.0.25)."

      - alert: PostgresBackupStale
        expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="databases",cronjob="postgresql-backup"}) > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No successful PostgreSQL backup for over 26 hours"
          description: "CronJob databases/postgresql-backup last succeeded {{ $value | humanizeDuration }} ago. Check: kubectl -n databases get jobs; kubectl -n databases logs job/<latest>"

      - alert: VaultwardenBackupMetricsMissing
        expr: absent(vaultwarden_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Vaultwarden backup status is not being reported"
          description: "node-exporter on 10.0.0.25 is down or /opt/vaultwarden/metrics/vaultwarden_backup.prom is missing, so backup failures would go unnoticed."

    # ---------------------------------------------------------------- clipdrop (homelab/ops#28)
    # From 2026-11-19 to 11-25 every crawl "succeeded" while verifying 1 of 112 coupon pages
    # (Great Clips changed the date format); nothing alerted. These rules catch that class of break.
    - name: clipdrop
      rules:
      - alert: ClipDropVerificationBroken
        expr: clipdrop_last_crawl_pages_no_date > 0.5 * clipdrop_last_crawl_pages_fetched and clipdrop_last_crawl_pages_fetched >= 10   # value = pages without a date
        labels:
          severity: warning
        annotations:
          summary: "ClipDrop can't read coupon end dates any more"
          description: "{{ $value }} of the coupon pages fetched in the last crawl loaded but had no readable end date. Great Clips probably changed the offers.greatclips.com page format: compare a page with parseOfferPage() in crawler.js."

      - alert: ClipDropCouponPagesFailing
        expr: clipdrop_last_crawl_pages_errors > 0.5 * clipdrop_last_crawl_pages_fetched and clipdrop_last_crawl_pages_fetched >= 10   # value = failed pages
        labels:
          severity: warning
        annotations:
          summary: "ClipDrop's coupon page checks are failing"
          description: "{{ $value }} coupon page fetches failed with HTTP errors in the last crawl (blocked or rate limited?)."

      - alert: ClipDropCrawlStale
        expr: time() - clipdrop_last_crawl_timestamp_seconds > 30 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ClipDrop hasn't crawled in over 30 hours"
          description: "The daily 06:00 crawl did not finish. Check: kubectl -n clips logs deploy/clipdrop"

      - alert: ClipDropMetricsMissing
        expr: absent(clipdrop_coupons_live)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "ClipDrop metrics are not being scraped"
          description: "Service clips/clipdrop-metrics (port 9464) is not answering, so the other ClipDrop alerts are blind."

      - alert: ClipDropSourceFailing
        expr: clipdrop_source_ok == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "ClipDrop source {{ $labels.source }} failed in the last crawl"
          description: "The coupon source {{ $labels.source }} errored; the crawl log has the reason."

      - alert: ClipDropFewCoupons
        expr: clipdrop_coupons_live{scope="local"} < 5
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "ClipDrop is showing only {{ $value }} local coupons"
          description: "Unusually few. Either a quiet week or a source/parsing problem worth a look."
