apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-skills
  namespace: hermes-agent
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: hermes-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "hermes-agent"
        # chat-ops credentials (homelab/ops#19), one raw value per file
        vault.hashicorp.com/agent-inject-secret-telegram-token: secret/data/chatops/telegram
        vault.hashicorp.com/agent-inject-template-telegram-token: |
          {{- with secret "secret/data/chatops/telegram" -}}{{ .Data.data.bot_token }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-allowed-user: secret/data/chatops/telegram
        vault.hashicorp.com/agent-inject-template-allowed-user: |
          {{- with secret "secret/data/chatops/telegram" -}}{{ .Data.data.allowed_user_id }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-runner-token: secret/data/chatops/runner
        vault.hashicorp.com/agent-inject-template-runner-token: |
          {{- with secret "secret/data/chatops/runner" -}}{{ .Data.data.token }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-forgejo-token: secret/data/chatops/forgejo
        vault.hashicorp.com/agent-inject-template-forgejo-token: |
          {{- with secret "secret/data/chatops/forgejo" -}}{{ .Data.data.token }}{{- end -}}
    spec:
      serviceAccountName: hermes-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      # Hermes chat-ops: Telegram <-> local LLM <-> Forgejo / cluster status / claude-runner.
      # Replaced the Joplin note poller (homelab/ops#18) on 2026-11-14; old code is in git history.
      - name: hermes
        image: python@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535  # python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["python", "-u", "/app/hermes.py"]
        env:
        - {name: PRIMARY_LLM_URL, value: "http://10.0.128.110:11434"}   # DGX Spark
        - {name: PRIMARY_MODEL, value: "hermes3:70b-64k"}
        - {name: FALLBACK_LLM_URL, value: "http://ollama.ollama.svc.cluster.local:11434"}  # cluster T4
        - {name: FALLBACK_MODEL, value: "hermes3:8b-64k"}
        - {name: RUNNER_URL, value: "http://claude-runner.code-server.svc:8787"}
        - {name: FORGEJO_URL, value: "http://forgejo-http.forgejo.svc:3000"}
        - {name: FORGEJO_REPO, value: "homelab/ops"}
        - {name: PROMETHEUS_URL, value: "http://prometheus.prometheus.svc"}
        - {name: STATE_FILE, value: "/app/skills/chatops-state.json"}
        volumeMounts:
        - name: app
          mountPath: /app/hermes.py
          subPath: hermes.py
        - name: app
          mountPath: /app/SOUL.md
          subPath: SOUL.md
        - name: skills
          mountPath: /app/skills
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: app
        configMap:
          name: hermes-app
      - name: skills
        persistentVolumeClaim:
          claimName: hermes-skills
