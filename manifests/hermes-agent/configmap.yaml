apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes-agent
data:
  SOUL.md: |
    # Hermes Agent — Homelab AI Orchestrator

    You are the central AI orchestrator for a self-healing Kubernetes homelab.
    Your purpose is to refine ideas from Joplin notes into actionable plans,
    execute research, and produce high-quality outputs.

    ## Your Environment
    - K8s cluster: 4 nodes (2 control-plane, 2 workers)
    - GPU (K8s): Tesla T4, 15GB VRAM — for fast, simple tasks
    - GPU (DGX Spark): NVIDIA GB10, 128GB — for heavy reasoning
    - Services: Joplin, Grafana, Prometheus, Harbor, Vaultwarden, Ollama
    - Browser Service: available for web research

    ## Your Workflow
    1. **Watch**: Monitor Joplin for notes tagged `#hermes` or `#research`
    2. **Classify**: Determine task complexity (simple → K8s Ollama, complex → DGX Spark)
    3. **Research**: Use browser-service for web lookups when needed
    4. **Plan**: Break complex tasks into steps
    5. **Execute**: Process each step using the appropriate model
    6. **Report**: Write results back to Joplin as refined notes

    ## Guidelines
    - Always cite sources when doing web research
    - Break large tasks into subtasks
    - Use the K8s Ollama (hermes3:8b-64k) for classification, tagging, summarization
    - Use the DGX Spark Ollama (hermes3:70b) for deep reasoning, code gen, planning
    - Never modify infrastructure without explicit approval
    - Write results back to Joplin in clean, structured markdown

  providers.yaml: |
    providers:
      k8s-ollama:
        type: ollama
        base_url: http://ollama.ollama.svc.cluster.local:11434
        default_model: hermes3:8b-64k
        description: "Fast local inference (Tesla T4) for simple tasks"
        capabilities:
          - classification
          - summarization
          - tagging
          - quick-qa

      dgx-spark:
        type: ollama
        base_url: http://10.0.129.94:11434
        default_model: hermes3:70b
        description: "Heavy inference (GB10 128GB) for complex reasoning"
        capabilities:
          - deep-reasoning
          - code-generation
          - research-synthesis
          - planning
          - long-form-writing

    routing:
      default_provider: k8s-ollama
      complexity_threshold: 0.7
      rules:
        - pattern: "classify|tag|summarize|extract|quick"
          provider: k8s-ollama
        - pattern: "research|plan|design|analyze|implement|write|code"
          provider: dgx-spark

  orchestrator.py: |
    #!/usr/bin/env python3
    import os
    import json
    import time
    import logging
    import uuid
    import re
    from urllib.request import Request, urlopen
    from urllib.error import URLError, HTTPError
    from datetime import datetime, timezone

    logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
    log = logging.getLogger('hermes')

    JOPLIN_HOST = os.environ.get('JOPLIN_HOST', 'https://joplin.racktocloud.com')
    JOPLIN_TOKEN = os.environ.get('JOPLIN_TOKEN', '')
    K8S_OLLAMA = os.environ.get('K8S_OLLAMA_URL', 'http://ollama.ollama.svc.cluster.local:11434')
    DGX_OLLAMA = os.environ.get('DGX_OLLAMA_URL', 'http://10.0.129.94:11434')
    POLL_INTERVAL = int(os.environ.get('POLL_INTERVAL', '60'))
    K8S_MODEL = os.environ.get('K8S_MODEL', 'hermes3:8b-64k')
    DGX_MODEL = os.environ.get('DGX_MODEL', 'hermes3:70b')
    HERMES_FOLDER = os.environ.get('HERMES_FOLDER', 'Hermes Output')
    TRIGGER_PREFIX = '[hermes]'

    PROCESSED = set()
    CURSOR_FILE = '/app/skills/.sync_cursor'

    COMPLEX_KEYWORDS = [
        'research', 'plan', 'design', 'analyze', 'implement',
        'write', 'code', 'architect', 'deep dive', 'compare',
        'strategy', 'review', 'audit', 'investigate'
    ]

    def joplin_get(path, parse_json=True):
        url = f'{JOPLIN_HOST}/api/items/root:/{path}:/content'
        req = Request(url)
        req.add_header('Cookie', f'sessionId={JOPLIN_TOKEN}')
        try:
            with urlopen(req, timeout=30) as resp:
                data = resp.read()
                if parse_json:
                    return json.loads(data.decode())
                return data.decode()
        except HTTPError as e:
            if e.code == 404:
                return None
            log.error(f'Joplin GET {path}: HTTP {e.code}')
            return None
        except Exception as e:
            log.error(f'Joplin GET {path}: {e}')
            return None

    def joplin_put(path, content):
        url = f'{JOPLIN_HOST}/api/items/root:/{path}:/content'
        body = content.encode('utf-8') if isinstance(content, str) else content
        req = Request(url, data=body, method='PUT')
        req.add_header('Cookie', f'sessionId={JOPLIN_TOKEN}')
        req.add_header('Content-Type', 'application/octet-stream')
        try:
            with urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode())
        except HTTPError as e:
            log.error(f'Joplin PUT {path}: HTTP {e.code} - {e.read().decode()[:200]}')
            return None
        except Exception as e:
            log.error(f'Joplin PUT {path}: {e}')
            return None

    def joplin_list():
        url = f'{JOPLIN_HOST}/api/items/root:/:/children'
        req = Request(url)
        req.add_header('Cookie', f'sessionId={JOPLIN_TOKEN}')
        try:
            with urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode())
        except Exception as e:
            log.error(f'Joplin list: {e}')
            return None

    def joplin_delta(cursor=''):
        url = f'{JOPLIN_HOST}/api/items/root:/:/delta'
        if cursor:
            url += f'?cursor={cursor}'
        req = Request(url)
        req.add_header('Cookie', f'sessionId={JOPLIN_TOKEN}')
        try:
            with urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode())
        except Exception as e:
            log.error(f'Joplin delta: {e}')
            return None

    def load_cursor():
        try:
            with open(CURSOR_FILE, 'r') as f:
                return f.read().strip()
        except FileNotFoundError:
            return ''

    def save_cursor(cursor):
        try:
            with open(CURSOR_FILE, 'w') as f:
                f.write(cursor)
        except Exception as e:
            log.warning(f'Failed to save cursor: {e}')

    def parse_old_format(content):
        lines = content.split('\n')
        if not lines:
            return None
        title = lines[0].strip()
        metadata = {}
        body_lines = []
        in_metadata = False
        for i, line in enumerate(lines[1:], 1):
            if re.match(r'^id: [a-f0-9]{32}$', line.strip()):
                in_metadata = True
            if in_metadata:
                m = re.match(r'^(\w+): (.*)$', line.strip())
                if m:
                    metadata[m.group(1)] = m.group(2)
            else:
                body_lines.append(line)
        body = '\n'.join(body_lines).strip()
        item_type = metadata.get('type_', '')
        return {
            'title': title,
            'body': body,
            'note_id': metadata.get('id', ''),
            'parent_id': metadata.get('parent_id', ''),
            'type': int(item_type) if item_type.isdigit() else 0,
            'format': 'old',
        }

    def extract_diff_text(diff_json_str):
        try:
            diffs = json.loads(diff_json_str)
            parts = []
            for patch in diffs:
                for op, text in patch.get('diffs', []):
                    if op == 1:
                        parts.append(text)
            return ''.join(parts).replace('\\n', '\n')
        except (json.JSONDecodeError, TypeError, KeyError):
            return ''

    def parse_delta_format(content):
        lines = content.split('\n')
        metadata = {}
        for line in lines:
            m = re.match(r'^(\w+): (.*)$', line.strip())
            if m:
                metadata[m.group(1)] = m.group(2)
        item_type = metadata.get('item_type', '0')
        type_ = metadata.get('type_', '0')
        if type_ != '13':
            return None
        title = extract_diff_text(metadata.get('title_diff', '[]'))
        body = extract_diff_text(metadata.get('body_diff', '[]'))
        meta_diff = metadata.get('metadata_diff', '{}')
        try:
            meta_obj = json.loads(meta_diff)
            new_meta = meta_obj.get('new', {})
        except (json.JSONDecodeError, TypeError):
            new_meta = {}
        deleted_time = new_meta.get('deleted_time', 0)
        if deleted_time and deleted_time > 0:
            return None
        return {
            'title': title,
            'body': body,
            'note_id': metadata.get('item_id', new_meta.get('id', '')),
            'parent_id': new_meta.get('parent_id', ''),
            'type': int(item_type) if str(item_type).isdigit() else 0,
            'format': 'delta',
        }

    def parse_item(content):
        if not content:
            return None
        if 'title_diff:' in content and 'body_diff:' in content:
            return parse_delta_format(content)
        if 'type_:' in content:
            return parse_old_format(content)
        return None

    def is_hermes_note(parsed):
        if not parsed or parsed['type'] != 1:
            return False
        title_lower = parsed['title'].lower()
        if title_lower.startswith(TRIGGER_PREFIX):
            return True
        if '#hermes' in parsed['body'].lower():
            return True
        return False

    def classify_complexity(text):
        text_lower = text.lower()
        score = sum(1 for kw in COMPLEX_KEYWORDS if kw in text_lower)
        if score >= 2 or len(text.split()) > 500:
            return 'complex'
        return 'simple'

    def ollama_generate(prompt, complexity='simple'):
        if complexity == 'complex':
            base_url, model = DGX_OLLAMA, DGX_MODEL
        else:
            base_url, model = K8S_OLLAMA, K8S_MODEL
        log.info(f'Routing to {"DGX Spark" if complexity == "complex" else "K8s Ollama"} ({model})')
        url = f'{base_url}/api/generate'
        body = json.dumps({
            'model': model,
            'prompt': prompt,
            'stream': False,
            'options': {'num_ctx': 65536}
        }).encode()
        req = Request(url, data=body, method='POST')
        req.add_header('Content-Type', 'application/json')
        try:
            with urlopen(req, timeout=300) as resp:
                result = json.loads(resp.read().decode())
                return result.get('response', '')
        except Exception as e:
            log.error(f'Ollama failed ({model}): {e}')
            if complexity == 'complex':
                log.info('Falling back to K8s Ollama')
                return ollama_generate(prompt, 'simple')
            return None

    def ensure_hermes_folder():
        folder_id = uuid.uuid4().hex
        existing = joplin_list()
        if not existing:
            return folder_id
        for item in existing.get('items', []):
            name = item.get('name', '')
            if name.endswith('.md') and not name.startswith('.'):
                content = joplin_get(name, parse_json=False)
                if content and 'type_: 2' in content:
                    parsed = parse_old_format(content)
                    if parsed and parsed['title'] == HERMES_FOLDER:
                        return parsed['note_id']
        now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
        folder_content = f"""{HERMES_FOLDER}

    id: {folder_id}
    created_time: {now}
    updated_time: {now}
    user_created_time: {now}
    user_updated_time: {now}
    encryption_cipher_text:
    encryption_applied: 0
    parent_id:
    is_shared: 0
    share_id:
    master_key_id:
    icon:
    user_data:
    type_: 2"""
        result = joplin_put(f'{folder_id}.md', folder_content)
        if result:
            log.info(f'Created "{HERMES_FOLDER}" folder: {folder_id}')
        return folder_id

    def write_result_note(title, body, folder_id):
        note_id = uuid.uuid4().hex
        now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
        note_content = f"""[Hermes] {title}

    {body}

    id: {note_id}
    parent_id: {folder_id}
    created_time: {now}
    updated_time: {now}
    user_created_time: {now}
    user_updated_time: {now}
    encryption_cipher_text:
    encryption_applied: 0
    is_conflict: 0
    latitude: 0.00000000
    longitude: 0.00000000
    altitude: 0.0000
    author:
    source_url:
    is_todo: 0
    todo_due: 0
    todo_completed: 0
    source: hermes-agent
    source_application: hermes-orchestrator
    application_data:
    order: 0
    markup_language: 1
    is_shared: 0
    share_id:
    conflict_original_id:
    master_key_id:
    user_data:
    type_: 1"""
        result = joplin_put(f'{note_id}.md', note_content)
        if result:
            log.info(f'Wrote result note: [Hermes] {title}')
        return result

    def process_note(parsed, folder_id):
        note_id = parsed['note_id']
        title = parsed['title']
        body = parsed['body']

        if title.lower().startswith(TRIGGER_PREFIX):
            title = title[len(TRIGGER_PREFIX):].strip()

        if note_id in PROCESSED:
            return
        PROCESSED.add(note_id)

        log.info(f'Processing: {title}')
        complexity = classify_complexity(body)
        log.info(f'Complexity: {complexity}')

        prompt = f"""You are Hermes, a research assistant. Process the following note and provide:
    1. A refined, well-structured version of the content
    2. Key insights or action items extracted
    3. Suggestions for next steps

    ## Note Title: {title}

    ## Note Content:
    {body}

    ## Instructions:
    - Maintain the original intent
    - Add structure with headers and bullet points
    - Highlight actionable items with checkboxes
    - If research is needed, list specific questions to investigate
    """

        response = ollama_generate(prompt, complexity)
        if not response:
            log.error(f'No AI response for: {title}')
            return

        model_used = DGX_MODEL if complexity == 'complex' else K8S_MODEL
        result_body = f"""# AI-Refined: {title}

    *Processed by Hermes Agent | Complexity: {complexity} | Model: {model_used}*

    ---

    {response}

    ---
    *Original note ID: {note_id}*"""

        write_result_note(title, result_body, folder_id)
        log.info(f'Done: {title}')

    def scan_all_items():
        items_data = joplin_list()
        if not items_data:
            return []
        hermes_notes = []
        for item in items_data.get('items', []):
            name = item.get('name', '')
            if not name.endswith('.md') or name.startswith('.'):
                continue
            content = joplin_get(name, parse_json=False)
            if not content:
                continue
            parsed = parse_item(content)
            if is_hermes_note(parsed):
                hermes_notes.append(parsed)
        return hermes_notes

    def poll_delta(cursor):
        delta = joplin_delta(cursor)
        if not delta:
            return cursor, []
        new_cursor = delta.get('cursor', cursor)
        hermes_notes = []
        for item in delta.get('items', []):
            name = item.get('item_name', '')
            if not name.endswith('.md') or name.startswith('.'):
                continue
            if item.get('type') == 3:
                continue
            content = joplin_get(name, parse_json=False)
            if not content:
                continue
            parsed = parse_item(content)
            if is_hermes_note(parsed):
                hermes_notes.append(parsed)
        return new_cursor, hermes_notes

    def health_check():
        checks = {
            'Joplin': f'{JOPLIN_HOST}/api/ping',
            'K8s Ollama': f'{K8S_OLLAMA}/api/tags',
            'DGX Ollama': f'{DGX_OLLAMA}/api/tags',
        }
        for name, url in checks.items():
            try:
                req = Request(url, method='GET')
                if 'joplin' in name.lower():
                    req.add_header('Cookie', f'sessionId={JOPLIN_TOKEN}')
                with urlopen(req, timeout=10) as resp:
                    log.info(f'{name}: OK')
            except Exception as e:
                log.warning(f'{name}: UNREACHABLE ({e})')
                if name == 'DGX Ollama':
                    log.info('DGX offline — K8s Ollama only')

    def main():
        log.info('=== Hermes Orchestrator Starting ===')
        if not JOPLIN_TOKEN:
            log.error('JOPLIN_TOKEN not set')
            while not os.environ.get('JOPLIN_TOKEN'):
                time.sleep(30)
            JOPLIN_TOKEN = os.environ['JOPLIN_TOKEN']

        health_check()
        folder_id = ensure_hermes_folder()
        log.info(f'Output folder: {folder_id}')

        cursor = load_cursor()
        if not cursor:
            log.info('No cursor — doing initial full scan')
            notes = scan_all_items()
            if notes:
                log.info(f'Found {len(notes)} hermes note(s) on initial scan')
                for n in notes:
                    process_note(n, folder_id)
            delta = joplin_delta('')
            if delta:
                cursor = delta.get('cursor', '')
                save_cursor(cursor)
                log.info('Initial cursor saved')

        log.info(f'Polling every {POLL_INTERVAL}s (trigger: title starts with "{TRIGGER_PREFIX}" or body contains #hermes)')
        while True:
            try:
                new_cursor, notes = poll_delta(cursor)
                if notes:
                    log.info(f'Delta: {len(notes)} new hermes note(s)')
                    for n in notes:
                        process_note(n, folder_id)
                if new_cursor != cursor:
                    cursor = new_cursor
                    save_cursor(cursor)
            except Exception as e:
                log.error(f'Poll error: {e}', exc_info=True)
            time.sleep(POLL_INTERVAL)

    if __name__ == '__main__':
        main()
