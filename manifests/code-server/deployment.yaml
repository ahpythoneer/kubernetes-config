apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server
  namespace: code-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-storage
  namespace: code-server
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 20Gi
---
# Secret removed — code-server reads its password from Vault agent at
# /vault/secrets/code-server (secret/code-server in kv-v2). Managed via
# vault.hashicorp.com/agent-inject annotations on the Deployment below.
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: code-server
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: code-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: code-server
        vault.hashicorp.com/agent-inject-secret-code-server: secret/data/code-server
        vault.hashicorp.com/agent-inject-template-code-server: '{{- with secret "secret/data/code-server"
          -}}\nexport PASSWORD="{{ .Data.data.password }}"\n{{- end }}'
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: code-server
        # pinned (was :latest); 4.145.2. Bump deliberately.
        image: codercom/code-server@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
        # The image gives user "coder" passwordless sudo. no_new_privs makes sudo unusable, so the IDE
        # (and the Claude runner that will live here, issue #19) can't become root.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8443
        env: null
        volumeMounts:
        - name: code-server-data
          mountPath: /home/coder
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m
      volumes:
      - name: code-server-data
        persistentVolumeClaim:
          claimName: code-server-storage
      serviceAccountName: code-server
