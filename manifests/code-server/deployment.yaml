apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server
  namespace: code-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-storage
  namespace: code-server
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 20Gi
---
# Secret removed — code-server reads its password from Vault agent at
# /vault/secrets/code-server (secret/code-server in kv-v2). Managed via
# vault.hashicorp.com/agent-inject annotations on the Deployment below.
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: code-server
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: code-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: code-server
spec:
  replicas: 1
  # never two pods at once: they would share one git workspace and the runner queue is in memory
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: code-server
        vault.hashicorp.com/agent-inject-secret-code-server: secret/data/code-server
        # Block scalar on purpose: the old single-quoted string kept "\n" literally, so the rendered
        # file was one line ("\nexport PASSWORD=...") and the password never reached code-server.
        vault.hashicorp.com/agent-inject-template-code-server: |
          {{- with secret "secret/data/code-server" -}}
          export PASSWORD="{{ .Data.data.password }}"
          {{- end }}
        # claude-runner credentials (homelab/ops#19): raw values, one file each
        vault.hashicorp.com/agent-inject-secret-claude-token: secret/data/chatops/claude
        vault.hashicorp.com/agent-inject-template-claude-token: |
          {{- with secret "secret/data/chatops/claude" -}}{{ .Data.data.oauth_token }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-github-token: secret/data/chatops/github
        vault.hashicorp.com/agent-inject-template-github-token: |
          {{- with secret "secret/data/chatops/github" -}}{{ .Data.data.token }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-runner-token: secret/data/chatops/runner
        vault.hashicorp.com/agent-inject-template-runner-token: |
          {{- with secret "secret/data/chatops/runner" -}}{{ .Data.data.token }}{{- end -}}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # pinned + checksum-verified Claude Code and kubectl, cached on the volume
      - name: chatops-toolbox
        image: codercom/code-server@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
        command: ["/usr/lib/code-server/lib/node", "/runner/toolbox.js"]
        env:
        - {name: CLAUDE_VERSION, value: "2.1.325"}
        - {name: CLAUDE_SHA256, value: 0dc4f4a9a165fc60746d7ae8489712e5fc352f1e7ad4eb22e7141bd0812eb0cf}
        - {name: KUBECTL_VERSION, value: v1.36.5}
        - {name: KUBECTL_SHA256, value: 33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: code-server-data, mountPath: /home/coder}
        - {name: claude-runner, mountPath: /runner, readOnly: true}
      containers:
      - name: claude-runner
        image: codercom/code-server@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
        command: ["/usr/lib/code-server/lib/node", "/runner/server.js"]
        env:
        - {name: CLAUDE_VERSION, value: "2.1.325"}
        ports:
        - {name: runner, containerPort: 8787}
        readinessProbe:
          httpGet: {path: /healthz, port: runner}
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 2Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: code-server-data, mountPath: /home/coder}
        - {name: claude-runner, mountPath: /runner, readOnly: true}
      - name: code-server
        # pinned (was :latest); 4.145.2. Bump deliberately.
        image: codercom/code-server@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
        # The image gives user "coder" passwordless sudo. no_new_privs makes sudo unusable, so the IDE
        # (and the Claude runner that will live here, issue #19) can't become root.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # Load the Vault-rendered PASSWORD (it overrides config.yaml), then the image's own entrypoint.
        command: ["/bin/sh", "-c"]
        args:
        - set -a && . /vault/secrets/code-server && set +a && exec /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 .
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code-server-data
          mountPath: /home/coder
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m
      volumes:
      - name: claude-runner
        configMap:
          name: claude-runner
      - name: code-server-data
        persistentVolumeClaim:
          claimName: code-server-storage
      serviceAccountName: code-server
