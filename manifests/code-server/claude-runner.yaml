# claude-runner sidecar (in the code-server pod): Claude Code headless executor for chat-ops,
# homelab/ops#19. Code: manifests/code-server/runner/ (ConfigMap generated by kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: claude-runner
  namespace: code-server
spec:
  type: ClusterIP
  selector:
    app: code-server
  ports:
  - name: runner
    port: 8787
    targetPort: 8787
---
# The IDE stays reachable as before (ingress-nginx -> 8080); the runner API only from Hermes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-server
  namespace: code-server
spec:
  podSelector:
    matchLabels:
      app: code-server
  policyTypes: [Ingress]
  ingress:
  - ports:
    - port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes-agent
    ports:
    - port: 8787
---
# What Claude (and the code-server IDE, which shares this ServiceAccount) may do in the cluster.
# Read: almost everything EXCEPT Secrets. Write: only the operational verbs the runner allows;
# real changes go through git -> ArgoCD.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chatops-executor
rules:
- apiGroups: [""]
  resources: [pods, pods/log, services, endpoints, namespaces, nodes, configmaps, events,
              persistentvolumeclaims, persistentvolumes, serviceaccounts, replicationcontrollers,
              resourcequotas, limitranges]
  verbs: [get, list, watch]
- apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, discovery.k8s.io,
              storage.k8s.io, rbac.authorization.k8s.io, apiextensions.k8s.io,
              admissionregistration.k8s.io, events.k8s.io, metrics.k8s.io, argoproj.io,
              cert-manager.io, metallb.io, cilium.io, nvidia.com, coordination.k8s.io]
  resources: ["*"]
  verbs: [get, list, watch]
# kubectl rollout restart = patch on the workload
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [patch]
- apiGroups: [""]
  resources: [pods]
  verbs: [delete]
# kubectl create job --from=cronjob/...
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create]
# ArgoCD hard refresh (annotation)
- apiGroups: [argoproj.io]
  resources: [applications]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chatops-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chatops-executor
subjects:
- kind: ServiceAccount
  name: code-server
  namespace: code-server
