apiVersion: apps/v1
kind: Deployment
metadata:
  name: chill-farm
  namespace: chill-farm
  labels:
    app: chill-farm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chill-farm
  template:
    metadata:
      labels:
        app: chill-farm
      annotations:
        # bump this to force a rollout when the site content changes
        chill-farm/content-rev: "4"
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-charset
          mountPath: /etc/nginx/conf.d/charset.conf
          subPath: charset.conf
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
      volumes:
      - name: site
        configMap:
          name: chill-farm-site
          items:
          - key: index.html
            path: index.html
          - key: careers.html
            path: careers/index.html
      - name: nginx-charset
        configMap:
          name: chill-farm-nginx
          items:
          - key: charset.conf
            path: charset.conf
