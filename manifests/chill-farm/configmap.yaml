    .emotebar button\"), function(b){\n    b.addEventListener(\"click\", function(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:\"emote\", e:b.getAttribute(\"data-e\") })); });\n  });\n\n  // ---------- player chat ----------\n  var chatlogEl = document.getElementById(\"chatlog\"), chatIn = document.getElementById(\"chatIn\");\n  function addChatLine(name, hue, text){\n    var d = document.createElement(\"div\"); d.className = \"cm\";\n    var b = document.createElement(\"b\"); b.textContent = name; b.style.color = \"hsl(\"+hue+\",70%,80%)\"; d.appendChild(b);\n    d.appendChild(document.createTextNode(text)); chatlogEl.appendChild(d);\n    while (chatlogEl.children.length > 5) chatlogEl.removeChild(chatlogEl.firstChild);\n    setTimeout(function(){ d.classList.add(\"fade\"); setTimeout(function(){ if (d.parentNode) d.remove(); }, 700); }, 12000);\n  }\n  function sendChat(){ var t = chatIn.value.trim(); if (!t) return; if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:\"chat\", text:t })); chatIn.value = \"\"; }\n  document.getElementById(\"chatSend\").addEventListener(\"click\", sendChat);\n  chatIn.addEventListener(\"keydown\", function(e){ if (e.key===\"Enter\"){ e.preventDefault(); sendChat(); } });\n  setInterval(function(){\n    if (reduce) return; var ids = Object.keys(sheep);\n    for (var i=0;i<ids.length;i++) for (var j=i+1;j<ids.length;j++){ var a=sheep[ids[i]], b=sheep[ids[j]]; if(!a||!b) continue;\n      var d=Math.hypot(a.rx-b.rx, a.ry-b.ry);\n      if (d<38 && Math.random()<0.12){ nuzzles.push({ x:(a.rx+b.rx)/2, y:(a.ry+b.ry)/2, t:performance.now() }); } }\n  }, 1600);\n\n  // ---------- voice: let the sheep speak (browser TTS, opt-in) ----------\n  var voiceOn = false, ttsVoice = null;\n  function pickVoice(){ if (!window.speechSynthesis) return; var vs = speechSynthesis.getVoices();\n    for (var i=0;i<vs.length;i++){ if (/en[-_]/i.test(vs[i].lang)){ ttsVoice = vs[i]; break; } } }\n  if (window.speechSynthesis){ pickVoice(); spee