center;gap:.5rem;font-family:var(--display);font-size:1.05rem;color:#fff;text-decoration:none;text-shadow:0 2px 4px rgba(0,0,0,.4);}\n  .brand .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--wheat);color:#5a4a20;border-radius:50%;font-size:1rem;box-shadow:inset 0 0 0 2px #5a4a20;}\n  .top nav{display:flex;gap:.7rem;align-items:center;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;}\n  .top nav a{color:#fff;text-decoration:none;opacity:.9;}\n  .pill{background:rgba(30,50,25,.55);border:2px solid rgba(255,255,255,.35);border-radius:30px;padding:.3rem .8rem;color:#fff;white-space:nowrap;font-family:var(--mono);}\n  .pill b{color:var(--wheat);font-size:1.05em;}\n\n  .score{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:18;text-align:center;font-family:var(--display);\n    text-shadow:0 3px 0 rgba(30,50,25,.4);pointer-events:none;}\n  .score .big{font-size:clamp(2.4rem,10vw,3.6rem);line-height:1;}\n  .score .lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;opacity:.9;}\n\n  .board-hint{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;\n    background:rgba(30,50,25,.5);color:#fff;border-radius:30px;padding:.4rem 1rem;font-family:var(--mono);font-size:.74rem;text-align:center;max-width:90vw;transition:opacity 1s;}\n  .board-hint.fade{opacity:0;}\n\n  .warn{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);z-index:19;pointer-events:none;\n    background:rgba(200,50,40,.92);color:#fff;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;\n    font-size:clamp(1rem,4vw,1.5rem);padding:.6rem 1.3rem;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);\n    opacity:0;transition:opacity .3s;}\n  .warn.show{opacity:1;animation:warnPulse .6s ease-in-out infinite;}\n  @keyframes warnPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) 