      .job h3 { font-size:1.35rem; text-transform:uppercase; margin:.15rem 0 .5rem; }
      .job p { font-size:.92rem; color:var(--ink-soft); margin:0 0 1rem; }
      .job .meta { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1.1rem; }
      .job .tag { font-family:var(--mono); font-size:.68rem; letter-spacing:.06em; background:var(--parch-2); color:var(--ink-soft);
        border:1px solid var(--line); border-radius:20px; padding:.2rem .6rem; }
      .job .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
      .job .pay { font-family:var(--mono); font-size:.72rem; color:var(--wheat-deep); }

      .btn { display:inline-block; text-decoration:none; cursor:pointer; font-family:var(--display); text-transform:uppercase;
        letter-spacing:.06em; font-size:.92rem; color:#f4ead0; background:var(--terra); padding:.6rem 1.3rem; border-radius:40px;
        border:2px solid var(--saddle-dk); box-shadow:0 5px 0 var(--saddle-dk); transition:transform .2s var(--ease-chill), box-shadow .2s; }
      .btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--saddle-dk); }
      .btn.ghost { background:transparent; color:var(--ink); box-shadow:0 5px 0 var(--line); border-color:var(--line); }
      .btn.big { font-size:1.05rem; padding:.85rem 2rem; box-shadow:0 6px 0 var(--saddle-dk); }

      /* closing */
      .closing { text-align:center; background:linear-gradient(180deg, var(--parch), var(--parch-2)); }
      .closing h2 { font-size:clamp(1.8rem,5vw,2.8rem); text-transform:uppercase; }
      .closing p { color:var(--ink-soft); max-width:52ch; margin:.6rem auto 1.4rem; }

      footer { background:var(--saddle-dk); color:#e9d7b5; text-align:center; padding:clamp(2.2rem,6vw,3.4rem) 1.5rem 2.4rem; }
      footer .fbrand { font-family:var(--display); font-size:1.6rem; text-transform:uppercase; letter-spacing:.06em; color:#ffe6ad; }
      footer .crew { font-family:var(--mono); font-size:.78rem; letter-spacing:.1em; color:#cbb187; margin-top:.8rem; line-height:1.9; }
      footer .fine { font-size:.74rem; color:#a58a63; margin-top:1.4rem; }
      footer a { color:#ffe6ad; }

      .reveal { opacity:0; transform:translateY(24px); transition:opacity .8s var(--ease-chill), transform .8s var(--ease-chill); }
      .reveal.in { opacity:1; transform:none; }

      .chill-modal { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:1.2rem;
        background:color-mix(in srgb, var(--saddle-dk) 74%, transparent); backdrop-filter:blur(4px);
        opacity:0; visibility:hidden; transition:opacity .45s var(--ease-chill), visibility .45s; }
      .chill-modal.open { opacity:1; visibility:visible; }
      .chill-modal__card { background:var(--card); color:var(--ink); border:3px double var(--saddle); border-radius:16px;
        padding:clamp(1.6rem,5vw,2.6rem); max-width:460px; text-align:center; box-shadow:0 26px 60px rgba(0,0,0,.5);
        transform:translateY(18px) scale(.96); transition:transform .45s var(--ease-chill); }
      .chill-modal.open .chill-modal__card { transform:none; }
      .chill-modal .cm-emoji { font-size:3.4rem; animation:breathe 5s ease-in-out infinite; }
      .chill-modal h2 { font-size:clamp(1.5rem,5vw,2.1rem); text-transform:uppercase; margin:.5rem 0 .2rem; }
      .chill-modal p { color:var(--ink-soft); font-size:.98rem; margin:.6rem 0 0; }

      @media (prefers-reduced-motion: reduce){
        *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
        .reveal { opacity:1; transform:none; }
      }
    </style>

