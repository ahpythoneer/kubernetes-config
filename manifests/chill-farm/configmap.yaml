    \ ctx.ellipse(x,y-u*19,u*10,u*3,0,0,6.28); ctx.fill();\n    ctx.beginPath(); ctx.ellipse(x,y-u*22,u*5,u*4,0,0,6.28); ctx.fill();\n    // rod\n    ctx.strokeStyle=\"#7a5230\"; ctx.lineWidth=u*1.6;\n    ctx.beginPath(); ctx.moveTo(x+facing*u*4,y+u*2); ctx.lineTo(x+facing*u*16,y-u*14); ctx.stroke();\n    // your ring\n    if (mine){ ctx.strokeStyle=\"rgba(255,214,80,.9)\"; ctx.lineWidth=u*2; ctx.beginPath(); ctx.arc(x,y-u*2,u*22,0,6.28); ctx.stroke(); }\n    // name\n    if (g.name){ ctx.font=\"700 \"+(u*10)+\"px 'Courier New',monospace\"; ctx.textAlign=\"center\";\n      ctx.fillStyle=\"rgba(10,30,30,.5)\"; ctx.fillText(g.name,x+1,y+u*28+1);\n      ctx.fillStyle=mine?\"#fff\":\"hsl(\"+g.hue+\",70%,85%)\"; ctx.fillText(g.name,x,y+u*28); }\n  }\n  requestAnimationFrame(render);\n\n  // ---------- opt-in pond ambience: gentle water + birds ----------\n  var audio={on:false,ac:null,master:null,timer:0};\n  function buildAudio(){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return false; var ac=new AC(); audio.ac=ac;\n    var master=ac.createGain(); master.gain.value=0; master.connect(ac.destination); audio.master=master;\n    var buf=ac.createBuffer(1,Math.floor(ac.sampleRate*2),ac.sampleRate),d=buf.getChannelData(0);\n    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;\n    var src=ac.createBufferSource(); src.buffer=buf; src.loop=true;\n    var lp=ac.createBiquadFilter(); lp.type=\"lowpass\"; lp.frequency.value=360;\n    var wg=ac.createGain(); wg.gain.value=0.05; src.connect(lp); lp.connect(wg); wg.connect(master); src.start(); return true; }\n  function bird(){ var ac=audio.ac; if(!ac||!audio.on)return; var t=ac.currentTime;\n    var o=ac.createOscillator(),g=ac.createGain(); o.type=\"sine\"; o.connect(g); g.connect(audio.master);\n    o.frequency.setValueAtTime(1800+Math.random()*500,t); o.frequency.linearRampToValueAtTime(2400,t+0.08); o.frequency.linearRampToValueAtTime(2000,t+0.16);\n    g.gain.setValueAtTime(0,t); g.gain.linearRampTo