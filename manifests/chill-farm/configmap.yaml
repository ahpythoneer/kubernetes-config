  ranch.html: "<meta charset=\"utf-8\" />\n<title>The Ranch — Chill Farm Lounge</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<meta name=\"description\" content=\"A cozy evening lounge. Swing in a hammock, set your name, and chat with whoever's chilling at Chill Farm right now.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#241a3a\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"The Ranch — Chill Farm Lounge\" />\n<meta property=\"og:description\" content=\"A cozy evening lounge. Swing in a hammock, set your name, and chat with whoever's chilling — hosted by Sam, the AI ranch host.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/ranch/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<script>if(\"serviceWorker\" in navigator)addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/sw.js\").catch(function(){});});</script>\n<style>\n  :root{\n    --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#3a2416; --terra:#c15a34;\n    --ink:#f0e4cf; --ink-soft:#c9b79a;\n    --display:\"Rockwell\",\"Rockwell Nova\",\"Roboto Slab\",\"Courier New\",Georgia,serif;\n    --body:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n    --mono:\"Courier New\",ui-monospace,monospace;\n    --ease:cubic-bezier(.22,.61,.36,1);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);\n    background:#241a3a;-webkit-text-size-adjust:100%;}\n\n  /* evening sky — this page commits to one cozy dusk world on purpose */\n  .scene{position:fixed;inset:0;overflow:hidden;\n    background:linear-gradient(180deg,#1a1436 0%,#3a2550 40%,#7d4a5a 72%,#c8794a 100%);}\n  .stars{position:absolute;inset:0;height:70%;pointer-events:none;}\n  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fdf5d8;opacity:.85;\n    animation:tw 4s ease-in-out infinite;}\n  @keyframes tw{0%,100%{opacity:.3;}50%{opacity:.9;}}\n  .moon{position:absolute;top:8%;right:12%;width:80px;height:80px;border-radius:50%;\n    background:radial-gradient(circle at 38% 35%,#fbf5db,#e9e0c2 65%);box-shadow:0 0 50px 14px rgba(240,230,190,.35);}\n  .hills{position:absolute;left:-5%;width:110%;bottom:0;height:26%;background:#2a1e30;border-radius:50% 50% 0 0/100% 100% 0 0;}\n  .hills.b{bottom:0;height:18%;background:#1d1422;}\n\n  /* string lights */\n  .lights{position:absolute;top:0;left:0;right:0;height:60px;pointer-events:none;}\n  .bulb{position:absolute;top:0;width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px 2px currentColor;\n    animation:glow 3s ease-in-out infinite;}\n  @keyframes glow{0%,100%{opacity:.55;}50%{opacity:1;}}\n\n  /* hammocks */\n  .hammocks{position:absolute;inset:0;}\n  .hammock{position:absolute;transform:translate(-50%,-50%);width:150px;text-align:center;z-index:2;}\n  .hammock .swing{display:inline-block;transform-origin:top center;animation:sway 5s ease-in-out infinite;}\n  .hammock:nth-child(even) .swing{animation-duration:6.2s;}\n  @keyframes sway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}\n  .rope{position:relative;width:132px;height:2px;margin:0 auto;background:#c79a5c;}\n  .rope::before,.rope::after{content:\"\";position:absolute;top:0;width:2px;height:30px;background:#c79a5c;transform-origin:top;}\n  .rope::before{left:0;transform:rotate(24deg);}\n  .rope::after{right:0;transform:rotate(-24deg);}\n  .cloth{width:112px;height:40px;margin:26px auto 0;border-radius:6px 6px 56px 56px/6px 6px 60px 60px;\n    background:repeating-linear-gradient(90deg,#caa15e 0 7px,#b98a48 7px 14px);\n    box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.3);}\n  .rider{position:relative;margin-top:-52px;font-size:2rem;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));}\n\
    \  .nm{margin-top:14px;font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;color:var(--ink);\n    text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n  .hammock.me .cloth{background:repeating-linear-gradient(90deg,#ffd98a 0 7px,#e9b45c 7px 14px);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 0 0 2px rgba(255,214,80,.5),0 6px 14px rgba(0,0,0,.35);}\n  .hammock.me .nm{color:#ffe6ad;}\n\n  .bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-6px);z-index:5;\n    background:#fbf4e2;color:#33261a;font-size:.82rem;line-height:1.3;padding:.5rem .7rem;border-radius:12px;\n    max-width:200px;min-width:36px;box-shadow:0 8px 20px rgba(0,0,0,.35);word-wrap:break-word;\n    animation:pop .3s var(--ease);}\n  .bubble::after{content:\"\";position:absolute;top:100%;left:50%;transform:translateX(-50%);\n    border:7px solid transparent;border-top-color:#fbf4e2;}\n  @keyframes pop{from{opacity:0;transform:translate(-50%,4px) scale(.8);}to{opacity:1;transform:translate(-50%,-6px) scale(1);}}\n  .bubble.leaving{opacity:0;transition:opacity .6s;}\n\n  /* top bar */\n  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;\n    gap:.6rem;padding:.7rem 1rem;background:linear-gradient(180deg,rgba(20,15,30,.55),transparent);}\n  .brand{display:flex;align-items:center;gap:.5rem;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;\n    color:#fff;text-decoration:none;text-shadow:0 2px 4px rgba(0,0,0,.5);}\n  .brand .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--wheat);color:var(--saddle-dk);\n    border-radius:50%;font-size:1rem;box-shadow:inset 0 0 0 2px var(--saddle-dk);}\n  .top nav{display:flex;gap:1rem;align-items:center;font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;}\n  .top nav a{color:#f0e4cf;text-decoration:none;opacity:.85;}\n  .top nav a:hover{opacity:1;}\n  .count{background:rgba(20,15,30,.55);border:1px solid rgba(217,164,65,.5);border-radius:30px;padding:.3rem .7rem;\n    color:#ffe6ad;white-space:nowrap;}\n\n  /* chat dock */\n  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:.6rem;display:flex;flex-direction:column;gap:.5rem;\n    background:linear-gradient(0deg,rgba(20,14,28,.82),rgba(20,14,28,.4) 70%,transparent);}\n  .log{max-width:720px;width:100%;margin:0 auto;max-height:26vh;overflow-y:auto;display:flex;flex-direction:column;gap:.25rem;\n    font-size:.86rem;padding:0 .2rem;}\n  .line{line-height:1.35;text-shadow:0 1px 2px rgba(0,0,0,.5);word-wrap:break-word;}\n  .line b{font-family:var(--mono);font-size:.8rem;}\n  .line.sys{color:var(--ink-soft);font-style:italic;font-size:.78rem;}\n  .inputs{max-width:720px;width:100%;margin:0 auto;display:flex;gap:.5rem;flex-wrap:wrap;}\n  .inputs input{font-family:var(--body);font-size:16px;border-radius:30px;border:2px solid var(--wheat);\n    background:rgba(251,244,226,.95);color:#33261a;padding:.6rem .9rem;outline:none;}\n  #nameIn{flex:0 0 130px;min-width:110px;font-family:var(--mono);}\n  #msgIn{flex:1 1 200px;min-width:140px;}\n  #sendBtn,#orderBtn{flex:0 0 auto;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;\n    color:#f4ead0;background:var(--terra);border:2px solid var(--saddle-dk);border-radius:30px;padding:.55rem 1.2rem;\n    cursor:pointer;box-shadow:0 4px 0 var(--saddle-dk);}\n  #orderBtn{background:var(--wheat-deep);padding:.55rem .8rem;}\n  #sendBtn:active,#orderBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--saddle-dk);}\n  @media (max-width:520px){ #nameIn{flex:1 1 100%;} }\n\n  .conn{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,15,30,.8);\n    color:#ffe6ad;font-family:var(--mono);text-align:center;padding:1.5rem;transition:opacity .5s;}\n  .conn.hide{opacity:0;pointer-events:none;}\n  .conn .big{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;margin-bottom:.4rem;color:#fff;}\n\n  @media (prefers-reduced-motion:\
    \ reduce){\n    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;}\n  }\n\n/* ===== cozy pass (Animal-Crossing-ish): rounder, pillow shadows, springy taps ===== */\n:root{ --cozy-ease:cubic-bezier(.34,1.56,.64,1); }\n.chip,.castbtn,.chatdock,.dock,.hud,.cpanel,.bookpanel,.askbar,.emotebar,.chbox,.inputs{ border-radius:20px !important; }\n.chip{ border:2.5px solid rgba(255,247,232,.85) !important; box-shadow:0 4px 0 rgba(74,47,28,.35) !important;\n  transition:transform .12s var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.chip:hover{ transform:translateY(-2px); }\n.chip:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(74,47,28,.35) !important; }\n.chatdock,.dock,.hud,.cpanel,.bookpanel,.askbar,.emotebar{ border:3px solid rgba(255,247,232,.72) !important;\n  box-shadow:0 8px 0 rgba(74,47,28,.22), 0 14px 26px rgba(20,12,6,.32) !important; }\n.castbtn{ border-radius:26px !important; border:4px solid #fff7e8 !important;\n  box-shadow:0 7px 0 var(--saddle-dk,#4a2f1c) !important;\n  transition:transform .1s var(--cozy-ease), box-shadow .1s var(--cozy-ease); }\n.castbtn:active{ transform:translateX(-50%) translateY(4px) !important; box-shadow:0 3px 0 var(--saddle-dk,#4a2f1c) !important; }\n.badge{ border-radius:50% !important; box-shadow:0 3px 0 rgba(74,47,28,.3) !important; }\ninput,textarea{ border-radius:16px !important; }\nbutton{ transition:transform .12s var(--cozy-ease); }\n</style>\n\n<div class=\"scene\">\n  <div class=\"stars\" id=\"stars\"></div>\n  <div class=\"moon\"></div>\n  <div class=\"lights\" id=\"lights\"></div>\n  <div class=\"hills\"></div>\n  <div class=\"hills b\"></div>\n  <div class=\"hammocks\" id=\"hammocks\"></div>\n</div>\n\n<header class=\"top\">\n  <a class=\"brand\" href=\"/\"><span class=\"badge\">\U0001F319</span> The Ranch</a>\n  <nav>\n    <a href=\"/pasture/\">Pasture</a>\n    <a href=\"/pond/\">Pond</a>\n    <a href=\"/cross/\">Hoof It</a>\n    <a href=\"/splash/\">Splash</a>\n    <a href=\"/\">Home</a>\n    <button id=\"voiceBtn\" class=\"count\" style=\"cursor:pointer;font-family:var(--mono);font-size:.76rem\">\U0001F5E3️ voice</button>\n    <button id=\"sndBtn\" class=\"count\" style=\"cursor:pointer;font-family:var(--mono);font-size:.76rem\">\U0001F508 sound</button>\n    <span class=\"count\">\U0001F6D6 <b id=\"count\">–</b> loungin'</span>\n  </nav>\n</header>\n\n<div class=\"dock\">\n  <div class=\"log\" id=\"log\"></div>\n  <div class=\"inputs\">\n    <input id=\"nameIn\" maxlength=\"18\" placeholder=\"your name\" autocomplete=\"off\" />\n    <input id=\"msgIn\" maxlength=\"240\" placeholder=\"say something chill…\" autocomplete=\"off\" enterkeyhint=\"send\" />\n    <button id=\"orderBtn\" type=\"button\" title=\"Order a drink from Sam\">\U0001F379</button>\n    <button id=\"sendBtn\" type=\"button\">Send</button>\n  </div>\n</div>\n\n<div class=\"conn\" id=\"conn\"><div><div class=\"big\">\U0001F319 finding the ranch…</div><div id=\"connMsg\">pulling up a hammock for you</div></div></div>\n\n<script>\n(function(){\n  \"use strict\";\n  // starfield + string lights (decorative)\n  var starC = document.getElementById(\"stars\");\n  for (var i=0;i<70;i++){ var s=document.createElement(\"div\"); s.className=\"star\";\n    s.style.left=(Math.random()*100)+\"%\"; s.style.top=(Math.random()*100)+\"%\";\n    s.style.animationDelay=(Math.random()*4)+\"s\"; starC.appendChild(s); }\n  var lightC = document.getElementById(\"lights\"), lcols=[\"#ffd36b\",\"#ff8f6b\",\"#8fe0ff\",\"#c9ff8f\",\"#ff6ba1\"];\n  for (var b=0;b<24;b++){ var bl=document.createElement(\"div\"); bl.className=\"bulb\";\n    bl.style.left=(b/23*100)+\"%\"; bl.style.top=(6+Math.sin(b/23*Math.PI)* -14 + 14)+\"px\";\n    bl.style.color=lcols[b%lcols.length]; bl.style.animationDelay=(Math.random()*3)+\"s\"; lightC.appendChild(bl); }\n\n  var hammocksEl = document.getElementById(\"hammocks\"), logEl = document.getElementById(\"log\"),\n      countEl = document.getElementById(\"count\"), nameIn = document.getElementById(\"nameIn\"),\n      msgIn = document.getElementById(\"\
    msgIn\"), sendBtn = document.getElementById(\"sendBtn\"),\n      connEl = document.getElementById(\"conn\"), connMsg = document.getElementById(\"connMsg\");\n  var myId = null, hammocks = {};   // id -> element\n\n  // stable per-browser identity + saved name (shared with the pasture sheep)\n  var token; try { token = localStorage.getItem(\"chillId\"); if (!token){ token = \"r\"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(\"chillId\", token); } } catch(e){ token = \"r\"+Math.random().toString(36).slice(2); }\n  try { var savedName = localStorage.getItem(\"chill-name\"); if (savedName) nameIn.value = savedName; } catch(e){}\n\n  function slotPos(slot){\n    var perRow = Math.max(3, Math.min(5, Math.floor(innerWidth/220)));\n    var row = Math.floor(slot/perRow), col = slot % perRow;\n    var span = 76 / perRow;\n    var x = 12 + col*span + span/2 + (row%2 ? span/2.5 : 0);\n    var y = 30 + (row % 3)*18 + (Math.floor(row/3)*4);\n    return { x: Math.min(90, x), y: Math.min(72, y) };\n  }\n  function riderFor(g){ return g.emoji || (g.id===myId ? \"\U0001F920\" : \"\U0001F60C\"); }\n  function makeHammock(g){\n    var h = document.createElement(\"div\"); h.className = \"hammock\" + (g.id===myId ? \" me\":\"\") + (g.host ? \" host\":\"\");\n    h.innerHTML = '<div class=\"swing\"><div class=\"rope\"></div><div class=\"cloth\"></div>'+\n      '<div class=\"rider\">'+riderFor(g)+'</div></div><div class=\"nm\"></div>';\n    h.querySelector(\".nm\").textContent = g.name;\n    var p = slotPos(g.slot); h.style.left = p.x+\"%\"; h.style.top = p.y+\"%\";\n    hammocksEl.appendChild(h); return h;\n  }\n  function reconcile(guests){\n    var seen = {};\n    for (var i=0;i<guests.length;i++){ var g=guests[i]; seen[g.id]=1;\n      var h = hammocks[g.id];\n      if (!h){ h = hammocks[g.id] = makeHammock(g); }\n      else { var p=slotPos(g.slot); h.style.left=p.x+\"%\"; h.style.top=p.y+\"%\"; h.querySelector(\".nm\").textContent=g.name; }\n      h.classList.toggle(\"me\", g.id===myId);\n      h.querySelector(\".rider\").textContent = riderFor(g);\n    }\n    for (var id in hammocks) if (!seen[id]){ hammocks[id].remove(); delete hammocks[id]; }\n  }\n  addEventListener(\"resize\", function(){ if (lastGuests) reconcile(lastGuests); });\n\n  function addLine(name, hue, text, sys){\n    var d = document.createElement(\"div\"); d.className = \"line\" + (sys ? \" sys\":\"\");\n    if (sys){ d.textContent = text; }\n    else { var nb=document.createElement(\"b\"); nb.style.color=\"hsl(\"+hue+\",70%,78%)\"; nb.textContent=name;\n      d.appendChild(nb); d.appendChild(document.createTextNode(\" \" + text)); }\n    logEl.appendChild(d);\n    while (logEl.children.length > 80) logEl.removeChild(logEl.firstChild);\n    logEl.scrollTop = logEl.scrollHeight;\n  }\n  function bubble(id, text){\n    var h = hammocks[id]; if (!h) return;\n    var prev = h.querySelector(\".bubble\"); if (prev) prev.remove();\n    var bub = document.createElement(\"div\"); bub.className=\"bubble\"; bub.textContent = text;\n    h.querySelector(\".swing\").appendChild(bub);\n    setTimeout(function(){ bub.classList.add(\"leaving\"); setTimeout(function(){ bub.remove(); }, 600); }, 5200);\n  }\n\n  var lastGuests = null, curGuests = {};\n  // ---- websocket ----\n  var ws, retry=0, replaced=false;\n  function connect(){\n    if (replaced) return;\n    var proto = location.protocol===\"https:\" ? \"wss\":\"ws\";\n    try { ws = new WebSocket(proto+\"://\"+location.host+\"/rw\"); } catch(e){ scheduleRetry(); return; }\n    ws.onopen = function(){ retry=0; connEl.classList.add(\"hide\");\n      ws.send(JSON.stringify({ t:\"hello\", token:token, name:(nameIn.value.trim()||undefined) })); };\n    ws.onclose = function(ev){\n      if (ev && ev.code===4001){ replaced=true; connEl.classList.remove(\"hide\");\n        connEl.querySelector(\".big\").textContent=\"\U0001F6D6 Already loungin'\";\n        connMsg.textContent=\"You're chilling in another tab. Refresh here to bring your hammock back.\"; return; }\n      connEl.classList.remove(\"hide\"\
    ); connMsg.textContent=\"reconnecting…\"; scheduleRetry(); };\n    ws.onerror = function(){ try{ ws.close(); }catch(e){} };\n    ws.onmessage = function(ev){ onMsg(ev.data); };\n  }\n  function scheduleRetry(){ if (replaced) return; retry=Math.min(retry+1,6); setTimeout(connect, 500*retry); }\n  function onMsg(data){\n    var m; try { m=JSON.parse(data); } catch(e){ return; }\n    if (m.t===\"welcome\"){ myId=m.id; }\n    else if (m.t===\"hist\"){ logEl.innerHTML=\"\"; for (var i=0;i<m.msgs.length;i++){ var x=m.msgs[i]; addLine(x.name,x.hue,x.text,false); } }\n    else if (m.t===\"r\"){ lastGuests=m.guests; curGuests={}; for (var j=0;j<m.guests.length;j++) curGuests[m.guests[j].id]=m.guests[j]; reconcile(m.guests); countEl.textContent=m.n; }\n    else if (m.t===\"chat\"){ addLine(m.m.name, m.m.hue, m.m.text, false); bubble(m.m.id, m.m.text); if (m.m.id>=2000000) speakR(m.m.text); }\n  }\n  connect();\n\n  // ---- send + name ----\n  function sendChat(){\n    var t = msgIn.value.trim(); if (!t || !ws || ws.readyState!==1) return;\n    ws.send(JSON.stringify({ t:\"chat\", text:t })); msgIn.value=\"\";\n  }\n  sendBtn.addEventListener(\"click\", sendChat);\n  msgIn.addEventListener(\"keydown\", function(e){ if (e.key===\"Enter\"){ e.preventDefault(); sendChat(); } });\n  var orderBtn = document.getElementById(\"orderBtn\");\n  orderBtn.addEventListener(\"click\", function(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:\"order\" })); });\n\n  // voice: Sam & visiting execs speak (opt-in)\n  var voiceOn = false, ttsVoice = null;\n  function pickVoice(){ if (!window.speechSynthesis) return; var vs = speechSynthesis.getVoices(); for (var i=0;i<vs.length;i++){ if (/en[-_]/i.test(vs[i].lang)){ ttsVoice = vs[i]; break; } } }\n  if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }\n  function speakR(text){ if (!voiceOn || !window.speechSynthesis) return; try { var u=new SpeechSynthesisUtterance(text); if (ttsVoice) u.voice=ttsVoice; u.rate=0.98; u.pitch=1.0; u.volume=0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }\n  var voiceBtn = document.getElementById(\"voiceBtn\");\n  voiceBtn.addEventListener(\"click\", function(){ voiceOn = !voiceOn; voiceBtn.textContent = voiceOn ? \"\U0001F5E3️ voice on\" : \"\U0001F5E3️ voice\";\n    if (voiceOn && window.speechSynthesis){ try { var w=new SpeechSynthesisUtterance(\"chill\"); w.volume=0; speechSynthesis.speak(w); } catch(e){} } });\n  function setName(){\n    var n = nameIn.value.trim(); if (!n) return;\n    try { localStorage.setItem(\"chill-name\", n); } catch(e){}\n    if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:\"name\", name:n }));\n  }\n  nameIn.addEventListener(\"change\", setName);\n  nameIn.addEventListener(\"keydown\", function(e){ if (e.key===\"Enter\"){ e.preventDefault(); setName(); msgIn.focus(); } });\n\n  // ---------- opt-in evening ambience: soft wind + crickets ----------\n  var audio = { on:false, ac:null, master:null, timer:0 };\n  function buildAudio(){\n    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;\n    var ac = new AC(); audio.ac = ac;\n    var master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); audio.master = master;\n    var buf = ac.createBuffer(1, Math.floor(ac.sampleRate*2), ac.sampleRate), d = buf.getChannelData(0);\n    for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*0.5;\n    var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;\n    var lp = ac.createBiquadFilter(); lp.type=\"lowpass\"; lp.frequency.value = 420;\n    var wg = ac.createGain(); wg.gain.value = 0.04;\n    src.connect(lp); lp.connect(wg); wg.connect(master); src.start();\n    return true;\n  }\n  function cricket(){\n    var ac = audio.ac; if (!ac || !audio.on) return; var t = ac.currentTime;\n    for (var k=0;k<4;k++){ var o=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();\n      o.type=\"square\"; o.frequency.value = 4300 + Math.random()*300; bp.type=\"bandpass\"; bp.frequency.value=4500; bp.Q.value=8;\n\
    \      o.connect(bp); bp.connect(g); g.connect(audio.master);\n      var st=t+k*0.03; g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.06,st+0.004); g.gain.linearRampToValueAtTime(0,st+0.02);\n      o.start(st); o.stop(st+0.03); }\n    audio.timer = setTimeout(cricket, 800 + Math.random()*1800);\n  }\n  var sndBtn = document.getElementById(\"sndBtn\");\n  sndBtn.addEventListener(\"click\", function(){\n    if (!audio.on){\n      if (!audio.ac && !buildAudio()) return;\n      if (audio.ac.state === \"suspended\") audio.ac.resume();\n      audio.on = true; audio.master.gain.setTargetAtTime(0.6, audio.ac.currentTime, 0.4);\n      sndBtn.textContent = \"\U0001F50A sound\"; cricket();\n    } else {\n      audio.on = false; clearTimeout(audio.timer);\n      if (audio.master) audio.master.gain.setTargetAtTime(0, audio.ac.currentTime, 0.3);\n      sndBtn.textContent = \"\U0001F508 sound\";\n    }\n  });\n})();\n</script>\n"
  pond.html: "<meta charset=\"utf-8\" />\n<title>The Pond — Chill Farm</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\" />\n<meta name=\"description\" content=\"A lazy fishing pond where the whole point is to catch nothing. Cast a line, wait, and relax at Chill Farm.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#4a7a86\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"The Pond — Chill Farm\" />\n<meta property=\"og:description\" content=\"A lazy fishing pond where the whole point is to catch nothing. Cast a line, wait, and relax.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/pond/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<script>if(\"serviceWorker\" in navigator)addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/sw.js\").catch(function(){});});</script>\n<style>\n  :root{\n    --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#3a2416; --terra:#c15a34;\n    --ink:#22303a; --ink-soft:#5c6f78; --card:#eaf3f2;\n    --display:\"Rockwell\",\"Rockwell Nova\",\"Roboto Slab\",\"Courier New\",Georgia,serif;\n    --body:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n    --mono:\"Courier New\",ui-monospace,monospace;\n    --ease:cubic-bezier(.22,.61,.36,1);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:#eaf3f2;background:#6a9a6a;-webkit-text-size-adjust:100%;}\n  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}\n\n  .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:.6rem;\n    padding:.7rem 1rem;background:linear-gradient(180deg,rgba(20,40,45,.5),transparent);}\n  .brand{display:flex;align-items:center;gap:.5rem;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;color:#fff;text-decoration:none;text-shadow:0 2px 4px rgba(0,0,0,.5);}\n  .brand .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--wheat);color:var(--saddle-dk);border-radius:50%;font-size:1rem;box-shadow:inset 0 0 0 2px var(--saddle-dk);}\n  .top nav{display:flex;gap:.9rem;align-items:center;font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;}\n  .top nav a{color:#eaf3f2;text-decoration:none;opacity:.85;}\n  .top nav a:hover{opacity:1;}\n  .chip{background:rgba(20,40,45,.55);border:1px solid rgba(217,164,65,.5);border-radius:30px;padding:.3rem .7rem;color:#ffe6ad;white-space:nowrap;cursor:pointer;font:inherit;}\n  .chip b{color:#fff;}\n\n  .castbtn{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;font-family:var(--display);\n    text-transform:uppercase;letter-spacing:.05em;font-size:1.05rem;color:#f4ead0;background:var(--terra);\n    border:2px solid var(--saddle-dk);border-radius:40px;padding:.8rem 2rem;cursor:pointer;box-shadow:0 6px 0 var(--saddle-dk);\n    transition:transform .15s var(--ease),box-shadow .15s,background .3s;}\n  .castbtn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 1px 0 var(--saddle-dk);}\n  .castbtn.waiting{background:var(--saddle);}\n\n  .log{position:fixed;right:12px;bottom:12px;z-index:15;width:min(280px,84vw);max-height:34vh;overflow-y:auto;\n    background:rgba(20,40,45,.66);border:1px solid rgba(217,164,65,.4);border-radius:14px;padding:.6rem .8rem;\n    backdrop-filter:blur(4px);font-family:var(--mono);font-size:.74rem;line-height:1.5;color:#dfeceb;}\n  .log h4{margin:0 0 .4rem;font-family:var(--display);font-size:.9rem;color:#ffe6ad;text-transform:uppercase;letter-spacing:.04em;}\n  .log .row b{color:#ffd98a;}\n  @media (max-width:560px){ .log{max-height:26vh;width:74vw;} }\n  .chatdock{position:fixed;left:12px;bottom:12px;z-index:16;display:flex;gap:.4rem;align-items:center;\n\
    \    background:rgba(20,40,45,.72);border:1px solid rgba(217,164,65,.5);border-radius:30px;padding:.35rem .4rem .35rem .9rem;\n    backdrop-filter:blur(5px);width:min(320px,42vw);}\n  .chatdock input{flex:1;min-width:0;font:inherit;font-size:16px;border:none;outline:none;background:transparent;color:#fff;}\n  .chatdock input::placeholder{color:rgba(255,255,255,.5);}\n  .chatdock #chatSend{flex:0 0 auto;border:none;border-radius:50%;width:32px;height:32px;background:var(--wheat);color:var(--saddle-dk);cursor:pointer;font-size:1rem;padding:0;}\n  .chatlog{position:fixed;left:12px;bottom:62px;z-index:15;width:min(320px,52vw);display:flex;flex-direction:column;gap:.2rem;pointer-events:none;align-items:flex-start;}\n  .chatlog .cm{background:rgba(20,40,45,.6);border-radius:12px;padding:.25rem .6rem;font-size:.8rem;color:#dfeceb;max-width:100%;word-wrap:break-word;transition:opacity .6s;}\n  .chatlog .cm.fade{opacity:0;}\n  .chatlog .cm b{color:#ffd98a;font-family:var(--mono);font-size:.72rem;margin-right:.3rem;}\n  @media (max-width:600px){ .castbtn{bottom:66px;} .chatdock{width:calc(100vw - 24px);} .chatlog{width:60vw;bottom:112px;} .log{top:54px;bottom:auto;max-height:20vh;} }\n\n  .hint{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:15;pointer-events:none;\n    background:rgba(20,40,45,.55);color:#dfeceb;border:1px solid rgba(217,164,65,.35);border-radius:30px;\n    padding:.4rem 1rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;text-align:center;max-width:90vw;transition:opacity 1s var(--ease);}\n  .hint.fade{opacity:0;}\n\n  .conn{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,40,45,.8);color:#ffe6ad;\n    font-family:var(--mono);text-align:center;padding:1.5rem;transition:opacity .5s;}\n  .conn.hide{opacity:0;pointer-events:none;}\n  .conn .big{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;margin-bottom:.4rem;color:#fff;}\n\n/* ===== cozy pass (Animal-Crossing-ish): rounder, pillow shadows, springy taps ===== */\n:root{ --cozy-ease:cubic-bezier(.34,1.56,.64,1); }\n.chip,.castbtn,.chatdock,.dock,.hud,.cpanel,.bookpanel,.askbar,.emotebar,.chbox,.inputs{ border-radius:20px !important; }\n.chip{ border:2.5px solid rgba(255,247,232,.85) !important; box-shadow:0 4px 0 rgba(74,47,28,.35) !important;\n  transition:transform .12s var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.chip:hover{ transform:translateY(-2px); }\n.chip:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(74,47,28,.35) !important; }\n.chatdock,.dock,.hud,.cpanel,.bookpanel,.askbar,.emotebar{ border:3px solid rgba(255,247,232,.72) !important;\n  box-shadow:0 8px 0 rgba(74,47,28,.22), 0 14px 26px rgba(20,12,6,.32) !important; }\n.castbtn{ border-radius:26px !important; border:4px solid #fff7e8 !important;\n  box-shadow:0 7px 0 var(--saddle-dk,#4a2f1c) !important;\n  transition:transform .1s var(--cozy-ease), box-shadow .1s var(--cozy-ease); }\n.castbtn:active{ transform:translateX(-50%) translateY(4px) !important; box-shadow:0 3px 0 var(--saddle-dk,#4a2f1c) !important; }\n.badge{ border-radius:50% !important; box-shadow:0 3px 0 rgba(74,47,28,.3) !important; }\ninput,textarea{ border-radius:16px !important; }\nbutton{ transition:transform .12s var(--cozy-ease); }\n</style>\n\n<canvas id=\"c\"></canvas>\n\n<header class=\"top\">\n  <a class=\"brand\" href=\"/\"><span class=\"badge\">\U0001F3A3</span> The Pond</a>\n  <nav>\n    <a href=\"/pasture/\">Pasture</a>\n    <a href=\"/ranch/\">Ranch</a>\n    <button class=\"chip\" id=\"sndBtn\" title=\"Pond ambience\">\U0001F508 sound</button>\n    <span class=\"chip\" style=\"cursor:default\">\U0001F3A3 <b id=\"count\">–</b> fishin'</span>\n  </nav>\n</header>\n\n<div class=\"hint\" id=\"hint\">tap the water (or the button) to cast a line · the whole point is to catch nothing · relax</div>\n<button class=\"castbtn\" id=\"castbtn\">\U0001F3A3 Cast a line</button>\n\n<div class=\"log\" id=\"log\"><h4>\U0001F41F The Catch Log</h4><div id=\"logrows\"></div></div>\n\n<div class=\"chatlog\" id=\"chatlog\"></div>\n\
    <div class=\"chatdock\" id=\"chatdock\">\n  <input id=\"chatIn\" maxlength=\"160\" placeholder=\"say something…\" autocomplete=\"off\" enterkeyhint=\"send\" />\n  <button type=\"button\" id=\"chatSend\" aria-label=\"send\">➤</button>\n</div>\n\n<div class=\"conn\" id=\"conn\"><div><div class=\"big\">\U0001F3A3 finding the pond…</div><div id=\"connMsg\">wading out to a good spot</div></div></div>\n\n<script>\n(function(){\n  \"use strict\";\n  var reduce = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  var cv = document.getElementById(\"c\"), ctx = cv.getContext(\"2d\");\n  var W = 1000, H = 620, PCX = 500, PCY = 300, PRX = 400, PRY = 210, SPOTS = 14;\n  var anglers = {}, myId = null, myCasting = false, catchPops = [], lilies = [], chatBubbles = {};\n  var connEl = document.getElementById(\"conn\"), connMsg = document.getElementById(\"connMsg\");\n  var countEl = document.getElementById(\"count\"), castbtn = document.getElementById(\"castbtn\");\n  var logrows = document.getElementById(\"logrows\");\n\n  var view = { s:1, ox:0, oy:0, dpr:1 };\n  function resize(){\n    var dpr = Math.min(window.devicePixelRatio||1, 2); view.dpr = dpr;\n    cv.width = Math.floor(innerWidth*dpr); cv.height = Math.floor(innerHeight*dpr);\n    var s = Math.max(cv.width/W, cv.height/H); view.s = s; view.ox = (cv.width-W*s)/2; view.oy = (cv.height-H*s)/2;\n  }\n  addEventListener(\"resize\", resize); resize();\n  function X(x){ return view.ox + x*view.s; } function Y(y){ return view.oy + y*view.s; }\n  function toWorld(px,py){ return { x:(px*view.dpr - view.ox)/view.s, y:(py*view.dpr - view.oy)/view.s }; }\n  for (var i=0;i<7;i++) lilies.push({ a:Math.random()*6.28, r:0.45+Math.random()*0.4, ph:Math.random()*6 });\n\n  function bankPos(slot){\n    var a = (slot%SPOTS)/SPOTS*Math.PI*2 - Math.PI/2;\n    var ring = 1.16 + Math.floor(slot/SPOTS)*0.16;\n    return { x: PCX+Math.cos(a)*PRX*ring, y: PCY+Math.sin(a)*PRY*ring, a:a };\n  }\n\n  // ---------- websocket ----------\n  var ws, retry=0, replaced=false;\n  var token; try{ token=localStorage.getItem(\"chillId\"); if(!token){ token=\"p\"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(\"chillId\",token);} }catch(e){ token=\"p\"+Math.random().toString(36).slice(2); }\n  var myName=null; try{ myName=localStorage.getItem(\"chill-name\")||null; }catch(e){}\n  function connect(){\n    if (replaced) return;\n    var proto = location.protocol===\"https:\"?\"wss\":\"ws\";\n    try{ ws=new WebSocket(proto+\"://\"+location.host+\"/pw\"); }catch(e){ return retryFn(); }\n    ws.onopen=function(){ retry=0; connEl.classList.add(\"hide\"); ws.send(JSON.stringify({t:\"hello\",token:token,name:myName||undefined})); };\n    ws.onclose=function(ev){ if(ev&&ev.code===4001){ replaced=true; connEl.classList.remove(\"hide\"); connEl.querySelector(\".big\").textContent=\"\U0001F3A3 Already fishin'\"; connMsg.textContent=\"You're at the pond in another tab. Refresh here to take your spot back.\"; return; }\n      connEl.classList.remove(\"hide\"); connMsg.textContent=\"reconnecting…\"; retryFn(); };\n    ws.onerror=function(){ try{ws.close();}catch(e){} };\n    ws.onmessage=function(ev){ onMsg(ev.data); };\n  }\n  function retryFn(){ if(replaced)return; retry=Math.min(retry+1,6); setTimeout(connect,600*retry); }\n  function onMsg(data){\n    var m; try{ m=JSON.parse(data); }catch(e){ return; }\n    if (m.t===\"welcome\"){ myId=m.id; }\n    else if (m.t===\"r\"){\n      var seen={};\n      for (var i=0;i<m.anglers.length;i++){ var a=m.anglers[i]; seen[a.id]=1;\n        var g=anglers[a.id]; if(!g){ g=anglers[a.id]={ rx:a.bx||PCX, ry:a.by||PCY }; }\n        g.name=a.name; g.hue=a.hue; g.slot=a.slot; g.casting=a.casting; g.bx=a.bx; g.by=a.by;\n        if(a.id===myId){ myCasting=a.casting; updateCastBtn(); }\n      }\n      for (var id in anglers) if(!seen[id]) delete anglers[id];\n      countEl.textContent=m.n;\n    }\n    else if (m.t===\"log\"){ catchLog=m.entries||[]; renderLog(); }\n    else if (m.t===\"catch\"){\n      catchLog.push({name:m.name,catch:m.catch,ts:Date.now()});\
    \ if(catchLog.length>30)catchLog.shift(); renderLog();\n      var ang=anglers[m.id]; if(ang) catchPops.push({ id:m.id, text:m.catch, t:performance.now() });\n    }\n    else if (m.t===\"chat\"){ chatBubbles[m.m.id]={ text:m.m.text, t:performance.now() }; addChatLine(m.m.name, m.m.hue, m.m.text); }\n    else if (m.t===\"chathist\"){ (m.msgs||[]).forEach(function(x){ addChatLine(x.name, x.hue, x.text); }); }\n  }\n  connect();\n\n  var catchLog=[];\n  function renderLog(){\n    logrows.innerHTML=\"\";\n    for (var i=Math.max(0,catchLog.length-14);i<catchLog.length;i++){ var e=catchLog[i];\n      var d=document.createElement(\"div\"); d.className=\"row\"; var b=document.createElement(\"b\"); b.textContent=e.name;\n      d.appendChild(b); d.appendChild(document.createTextNode(\" caught \"+e.catch)); logrows.appendChild(d); }\n    logrows.scrollTop=logrows.scrollHeight;\n  }\n\n  // ---------- interaction ----------\n  function cast(){ if(ws&&ws.readyState===1&&!myCasting) ws.send(JSON.stringify({t:\"cast\"})); }\n  function reel(){ if(ws&&ws.readyState===1&&myCasting) ws.send(JSON.stringify({t:\"reel\"})); }\n  function updateCastBtn(){ castbtn.textContent = myCasting ? \"\U0001F3A3 Reel in\" : \"\U0001F3A3 Cast a line\"; castbtn.classList.toggle(\"waiting\", myCasting); }\n  castbtn.addEventListener(\"click\", function(){ myCasting ? reel() : cast(); });\n  var hintEl=document.getElementById(\"hint\"), hintT=setTimeout(function(){ hintEl.classList.add(\"fade\"); }, 9000);\n  cv.addEventListener(\"pointerdown\", function(){ hintEl.classList.add(\"fade\"); if(!myCasting) cast(); });\n\n  // ---------- player chat ----------\n  var chatlogEl=document.getElementById(\"chatlog\"), chatIn=document.getElementById(\"chatIn\");\n  function addChatLine(name, hue, text){\n    var d=document.createElement(\"div\"); d.className=\"cm\"; var b=document.createElement(\"b\"); b.textContent=name; b.style.color=\"hsl(\"+hue+\",70%,80%)\"; d.appendChild(b);\n    d.appendChild(documen