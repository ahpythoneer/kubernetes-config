    <script>
    (function(){
      "use strict";
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var toastEl = document.getElementById("toast"), toastT;
      function toast(msg){
        toastEl.textContent = msg; toastEl.classList.add("show");
        clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
      }

      document.getElementById("yr").textContent = new Date().getFullYear();

      /* ---------- time-of-day sky engine: the ranch runs on your real clock ---------- */
      var root = document.documentElement, tBtn = document.getElementById("themeBtn");
      var skyEl = document.querySelector(".sky"), orbEl = document.getElementById("orb");
      var canvas = document.getElementById("stars"), ctx = canvas.getContext("2d");
      var isNight = false, cloudsEl = null;

      var MODES = ["auto", "day", "night"], mode = "auto";
      try { var sm = localStorage.getItem("chill-mode"); if (MODES.indexOf(sm) >= 0) mode = sm; } catch (e) {}

      // sky keyframes across 24h — [topRGB, midRGB, lowRGB]
      var SKY = [
        { h:0,    c:[[20,18,48],[36,26,58],[58,37,69]] },
        { h:6,    c:[[90,74,123],[208,122,122],[240,161,90]] },
        { h:9,    c:[[125,180,224],[195,226,242],[242,230,190]] },
        { h:13,   c:[[109,176,232],[174,218,242],[233,241,218]] },
        { h:17,   c:[[111,168,216],[240,201,122],[244,165,92]] },
        { h:19,   c:[[106,90,154],[224,132,74],[242,184,74]] },
        { h:20.5, c:[[43,42,90],[125,74,107],[194,91,84]] },
        { h:22,   c:[[23,20,54],[40,29,70],[74,44,72]] },
        { h:24,   c:[[20,18,48],[36,26,58],[58,37,69]] }
      ];
      function lerp(a,b,t){ return a+(b-a)*t; }
      function rgb(a){ return "rgb("+Math.round(a[0])+","+Math.round(a[1])+","+Math.round(a[2])+")"; }
      function skyAt(h){
        for (var i=0;i<SKY.length-1;i++){
          if (h>=SKY[i].h && h<=SKY[i+1].h){
            var t=(h-SKY[i].h)/(SKY[i+1].h-SKY[i].h), o=[];
            for (var k=0;k<3;k++) o.push([lerp(SKY[i].c[k][0],SKY[i+1].c[k][0],t), lerp(SKY[i].c[k][1],SKY[i+1].c[k][1],t), lerp(SKY[i].c[k][2],SKY[i+1].c[k][2],t)]);
            return o;
          }
        }
        return SKY[0].c;
      }
      function effHour(){
        if (mode === "day") return 13;
        if (mode === "night") return 22.5;
        var d = new Date(); return d.getHours() + d.getMinutes()/60;
      }
      function applyScene(){
        var h = effHour(), night = (h < 6 || h >= 19.5);
        isNight = night;
        var c = skyAt(h);
        skyEl.style.background = "linear-gradient(180deg,"+rgb(c[0])+" 0%,"+rgb(c[1])+" 62%,"+rgb(c[2])+" 100%)";
        var t, orbCol, orbGlow;
        if (!night){ t=(h-6)/(19.5-6); orbCol="#ffd257"; orbGlow="#ffe9a8"; }
        else { var nh=(h<6)?h+24:h; t=(nh-19.5)/((6+24)-19.5); orbCol="#f4ecd0"; orbGlow="#d9d2f0"; }
        t = Math.max(0, Math.min(1, t));
        orbEl.style.left = (8 + t*84) + "%";
        orbEl.style.top  = (60 - Math.sin(t*Math.PI)*44) + "%";
        root.style.setProperty("--orb", orbCol);
        root.style.setProperty("--orb-glow", orbGlow);
        root.setAttribute("data-theme", night ? "dark" : "light");
        if (cloudsEl) cloudsEl.classList.toggle("on", !night);
        tBtn.textContent = mode==="auto" ? "🕐" : (mode==="day" ? "☀️" : "🌙");
        tBtn.title = "Time of day: " + mode + (mode==="auto" ? " — follows your local time" : " (locked)");
      }
      tBtn.addEventListener("click", function(){
        mode = MODES[(MODES.indexOf(mode)+1) % MODES.length];
        try { localStorage.setItem("chill-mode", mode); } catch (e) {}
        applyScene();
        toast(mode==="auto" ? "🕐 Auto — the ranch follows your clock." : mode==="day" ? "☀️ Locked to daytime." : "🌙 Locked to night. Extra chill.");
      });

      // clouds (daytime) drifting behind the hills
      cloudsEl = document.createElement("div"); cloudsEl.className = "clouds";
      for (var ci=0; ci<5; ci++){
        var cl = document.createElement("div"); cl.className = "cloud";
        cl.style.top = (5 + Math.random()*34) + "%";
        cl.style.transform = "scale(" + (0.55 + Math.random()*0.95) + ")";
        var dur = 62 + Math.random()*74;
        cl.style.animationDuration = dur + "s";
        cl.style.animationDelay = (-Math.random()*dur) + "s";
        cloudsEl.appendChild(cl);
      }
      var heroEl = document.querySelector(".hero");
      heroEl.insertBefore(cloudsEl, heroEl.querySelector(".hill.far"));

      // starfield + fireflies (night)
      var stars = [], flies = [];
      function seedSky(){
        var hero = document.getElementById("top");
        canvas.width = hero.clientWidth; canvas.height = hero.clientHeight;
        stars = []; for (var i=0;i<90;i++) stars.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height*0.66, r:Math.random()*1.4+0.3, p:Math.random()*6 });
        flies = []; for (var j=0;j<14;j++) flies.push({ x:Math.random()*canvas.width, y:canvas.height*(0.55+Math.random()*0.4), p:Math.random()*6, sp:0.2+Math.random()*0.5 });
      }
      seedSky(); addEventListener("resize", seedSky);
      function drawSky(t){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        if (isNight){
          for (var i=0;i<stars.length;i++){ var s=stars[i], tw=reduce?0.85:(0.6+0.4*Math.sin(t/700+s.p));
            ctx.globalAlpha=tw; ctx.fillStyle="#fdf5d8"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
          for (var j=0;j<flies.length;j++){ var f=flies[j];
            var gx=f.x+Math.sin(t/1000*f.sp+f.p)*30, gy=f.y+Math.cos(t/1300*f.sp+f.p)*18;
            ctx.globalAlpha=reduce?0.7:(0.35+0.45*(0.5+0.5*Math.sin(t/500+f.p)));
            ctx.fillStyle="#eaff8a"; ctx.shadowColor="#c8ff5a"; ctx.shadowBlur=10;
            ctx.beginPath(); ctx.arc(gx,gy,1.7,0,6.28); ctx.fill(); ctx.shadowBlur=0; }
          ctx.globalAlpha=1;
        }
        requestAnimationFrame(drawSky);
      }
      requestAnimationFrame(drawSky);

      // shooting-star wishes (night)
      var FORTUNES = ["Today's forecast: 100% chill.","A nap is a sound financial decision.","The backlog can wait. It always could.","Go outside — the ranch misses you.","You're exactly on schedule. There is no schedule.","Sip water, then sip lemonade.","Deadlines are just suggestions in formal wear.","Do less, but enjoy it more.","The most productive thing you'll do today is rest."];
      var starHintShown = false;
      function launchStar(){
        var hero = document.getElementById("top"), Wp = hero.clientWidth, Hp = hero.clientHeight;
        var el = document.createElement("div"); el.className = "shooting-star";
        var x0 = Wp*(0.08+Math.random()*0.5), y0 = Hp*(0.04+Math.random()*0.2);
        var x1 = x0 + Wp*(0.25+Math.random()*0.25), y1 = y0 + Hp*(0.32+Math.random()*0.26);
        var ang = Math.atan2(y1-y0, x1-x0) * 180/Math.PI, caught = false;
        el.style.transform = "translate("+x0+"px,"+y0+"px) rotate("+ang+"deg)";
        hero.appendChild(el);
        el.addEventListener("pointerdown", function(e){ e.stopPropagation(); if (caught) return; caught = true; wishGranted(x0,y0); el.remove(); });
        if (!starHintShown){ starHintShown = true; toast("🌠 psst… catch a shooting star to make a wish"); }
        var t0 = null, dur = 2600;
        (function step(ts){ if (!t0) t0 = ts; var p = Math.min((ts-t0)/dur, 1);
          el.style.transform = "translate("+(x0+(x1-x0)*p)+"px,"+(y0+(y1-y0)*p)+"px) rotate("+ang+"deg)";
          el.style.opacity = p<0.1 ? p/0.1 : (p>0.8 ? 1-(p-0.8)/0.2 : 1);
          if (p<1 && !caught) requestAnimationFrame(step); else if (!caught) el.remove();
        })(performance.now());
      }
      function wishGranted(x,y){
        toast("🌠 " + FORTUNES[(Math.random()*FORTUNES.length)|0]);
        var hero = document.getElementById("top");
        for (var i=0;i<8;i++){ (function(){ var s=document.createElement("div"); s.className="sparkle"; s.textContent="✦";
          s.style.left=x+"px"; s.style.top=y+"px"; hero.appendChild(s);
          var a=Math.random()*6.28, r=20+Math.random()*44;
          requestAnimationFrame(function(){ s.style.transform="translate("+Math.cos(a)*r+"px,"+Math.sin(a)*r+"px) scale(0)"; s.style.opacity="0"; });
          setTimeout(function(){ s.remove(); }, 900);
        })(); }
      }
      (function scheduleStar(){
        setTimeout(function(){ if (isNight && !document.hidden && !reduce) launchStar(); scheduleStar(); }, 20000 + Math.random()*22000);
      })();

      // live presence — how many sheep are grazing in The Commons right now
      var presEl = document.getElementById("presence"), presCount = document.getElementById("presCount");
      function pollPresence(){
        fetch("/ws/stats", { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(d){
          if (d && d.sheep > 0){ presCount.textContent = d.sheep; presEl.classList.add("show"); }
          else presEl.classList.remove("show");
        }).catch(function(){});
      }
      pollPresence(); setInterval(pollPresence, 5000);

      applyScene();
      setInterval(applyScene, 60000);

      /* ---------- scroll reveals ---------- */
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: .12 });
      document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

      /* duplicate marquee content for seamless loop */
      var mt = document.getElementById("mtrack");
      if (mt) mt.innerHTML += mt.innerHTML;

      /* ---------- animated counters (fire when ledger visible) ---------- */
      var counted = false;
      function runCounters(){
        if (counted) return; counted = true;
        document.querySelectorAll(".num").forEach(function(el){
          var target = +el.getAttribute("data-target"), start = null, dur = 2200;
          function step(ts){
            if(!start) start = ts;
            var p = Math.min((ts-start)/dur, 1), eased = 1-Math.pow(1-p,3);
            el.textContent = Math.floor(eased*target).toLocaleString();
            if(p<1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();
          }
          if (reduce) el.textContent = target.toLocaleString(); else requestAnimationFrame(step);
        });
      }
      var lio = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting) runCounters(); });
      }, { threshold: .4 });
      var ledgerEl = document.querySelector(".ledger-panel"); if (ledgerEl) lio.observe(ledgerEl);

      /* ---------- tumbleweeds roll by, slowly ---------- */
      function tumble(){
        if (reduce || document.hidden) return;
        var t = document.createElement("div");
        t.className = "tumble"; t.textContent = "🌾";
        t.style.bottom = (2 + Math.random()*10) + "vh";
        t.style.fontSize = (1.4 + Math.random()*1.6) + "rem";
        var dur = 14 + Math.random()*10;
        t.style.animationDuration = dur + "s";
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, dur*1000 + 200);
      }
      setTimeout(tumble, 2500);
      setInterval(function(){ if(Math.random()>.3) tumble(); }, 9000);

      /* ---------- EASTER EGGS ---------- */

      /* 1. the sun/moon puts on shades after a few clicks */
      var orb = document.getElementById("orb"), orbClicks = 0;
      orb.addEventListener("click", function(){
        orbClicks++;
        if (orbClicks === 5){ orb.classList.add("cool"); toast("😎 The sun agrees. Stay cool."); }
        else if (orbClicks > 5){ tumble(); }
        else { toast(["Howdy ☀️","Nice and warm.","Keep it comin'…","One more…"][orbClicks-1] || "☀️"); }
      });

      /* 2. push the sign and it swings */
      var sign = document.getElementById("sign");
      sign.addEventListener("click", function(){
        sign.classList.remove("swing"); void sign.offsetWidth; sign.classList.add("swing");
      });

      /* 3. click the brand 5x -> Chief Napping Officer appears */
      var brand = document.getElementById("brand"), bClicks = 0, cno = document.getElementById("cno"), bT;
      brand.addEventListener("click", function(){
        bClicks++; clearTimeout(bT); bT = setTimeout(function(){ bClicks = 0; }, 1200);
        if (bClicks >= 5){ cno.classList.add("up"); toast("🐈 The Chief Napping Officer has awoken. Briefly."); bClicks = 0; }
      });
      cno.addEventListener("click", function(){ toast("💤 CNO says: back to nap. Company policy."); setTimeout(function(){ cno.classList.remove("up"); }, 1800); });

      /* 4. type "chill" anywhere */
      var buf = "";
      addEventListener("keydown", function(e){
        if (e.key && e.key.length === 1) buf = (buf + e.key.toLowerCase()).slice(-14);

        if (buf.indexOf("chill") > -1){ buf = ""; for (var i=0;i<6;i++) setTimeout(tumble, i*160); toast("🌾 Maximum tumbleweeds. Very chill of you."); }

        /* 5. Konami code -> MAXIMUM CHILL mode */
        konami(e.key);
      });

      var kseq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"], kpos = 0;
      function konami(key){
        if (!key) return;
        key = (key.length === 1) ? key.toLowerCase() : key;
        if (key === kseq[kpos]){ kpos++; if (kpos === kseq.length){ kpos = 0; maxChill(); } }
        else { kpos = (key === kseq[0]) ? 1 : 0; }
      }
      var maxOn = false;
      function maxChill(){
        maxOn = !maxOn;
        document.body.classList.toggle("maxchill", maxOn);
        toast(maxOn ? "🧘 MAXIMUM CHILL ENGAGED. Everything… slow… down…" : "⏱️ Back to regular chill.");
        if (maxOn && !reduce){ for (var i=0;i<10;i++) setTimeout(tumble, i*220); }
      }

      /* ---------- "working too hard" apply modal ---------- */
      var modal = document.getElementById("chillModal");
      function openModal(){ modal.classList.add("open"); var b = modal.querySelector("[data-close]"); if(b) b.focus(); }
      function closeModal(){ modal.classList.remove("open"); }
      document.querySelectorAll(".js-apply").forEach(function(el){
        el.addEventListener("click", function(e){ e.preventDefault(); openModal(); });
      });
      modal.addEventListener("click", function(e){ if (e.target === modal || e.target.hasAttribute("data-close")) closeModal(); });
      addEventListener("keydown", function(e){ if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

      /* ---------- scroll cop: catches fast scrollers being un-chill ---------- */
      var CP = document.getElementById("chillPolice"),
          cpEmoji = document.getElementById("cpEmoji"),
          cpTitle = document.getElementById("cpTitle"),
          cpMsg = document.getElementById("cpMsg");
      var CP_MSGS = [
        { e:"🐢", t:"Whoa there, partner", m:"This is a chill farm — ease off the throttle." },
        { e:"😎", t:"Too much hustle", m:"You're scrolling like it's a Monday. Breathe." },
        { e:"🌵", t:"Easy, cowboy", m:"The backlog isn't going anywhere. Neither should you." },
        { e:"🧘", t:"Please relax", m:"Detected: excessive productivity energy. Slow it down." },
        { e:"🍹", t:"Sip, don't gulp", m:"Enjoy the ranch at ranch speed." }
      ];
      var cpCount = 0, cpCool = false, cpHideT, cpSamples = [];
      function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
      function cpFire(){
        if (cpCool) return;
        var m = (cpCount >= CP_MSGS.length + 2)
          ? { e:"😤", t:"Okay, showoff", m:"You're speed-running our whole vibe on purpose now." }
          : CP_MSGS[cpCount % CP_MSGS.length];
        cpCount++;
        cpEmoji.textContent = m.e; cpTitle.textContent = m.t; cpMsg.textContent = m.m;
        CP.classList.add("show");
        clearTimeout(cpHideT); cpHideT = setTimeout(function(){ CP.classList.remove("show"); }, 2200);
        cpCool = true; setTimeout(function(){ cpCool = false; }, 9000);
      }
      addEventListener("scroll", function(){
        var t = now(), y = window.scrollY || document.documentElement.scrollTop || 0;
        cpSamples.push([t, y]);
        while (cpSamples.length > 1 && t - cpSamples[0][0] > 450) cpSamples.shift();
        if (cpSamples.length > 1){
          var span = t - cpSamples[0][0], dist = Math.abs(y - cpSamples[0][1]);
          if (span > 0 && dist > 500 && dist / span > 2.3) cpFire();   // ~2300+ px/sec = too eager
        }
      }, { passive: true });

      /* 6. console note for the curious */
      try {
        console.log("%c🤠 Welcome to Chill Farm","font:700 22px Rockwell,serif;color:#c15a34;");
        console.log("%cWe're hiring people to chill — we've got so much chill in the backlog.\nTry the Konami code. Try typing 'chill'. Click the sun five times.\nhowdy@only-chill.com","font:13px monospace;color:#7a4a26;");
      } catch(_){}
    })();
    </script>
