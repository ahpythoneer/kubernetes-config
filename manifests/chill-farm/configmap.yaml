    <div class="toast" id="toast"></div>
    <div class="cno" id="cno" title="The Chief Napping Officer">🐈 <span class="zzz">💤</span></div>

    <script>
    (function(){
      "use strict";
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var toastEl = document.getElementById("toast"), toastT;
      function toast(msg){
        toastEl.textContent = msg; toastEl.classList.add("show");
        clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
      }

      document.getElementById("yr").textContent = new Date().getFullYear();

      /* ---------- theme toggle: change the time of day ---------- */
      var root = document.documentElement, tBtn = document.getElementById("themeBtn");
      function isDark(){
        var t = root.getAttribute("data-theme");
        if (t) return t === "dark";
        return matchMedia("(prefers-color-scheme: dark)").matches;
      }
      function syncIcon(){ tBtn.textContent = isDark() ? "🌙" : "🌤️"; }
      tBtn.addEventListener("click", function(){
        var next = isDark() ? "light" : "dark";
        root.setAttribute("data-theme", next);
        syncIcon(); startStars();
        toast(next === "dark" ? "🌙 Sun's down. Extra chill unlocked." : "🌤️ Mornin'. Back to the good chill.");
      });
      syncIcon();

      /* ---------- starfield (night only) ---------- */
      var canvas = document.getElementById("stars"), ctx = canvas.getContext("2d"), starTimer;
      function startStars(){
        if (!isDark()) { ctx && ctx.clearRect(0,0,canvas.width,canvas.height); return; }
        var hero = document.getElementById("top");
        canvas.width = hero.clientWidth; canvas.height = hero.clientHeight;
        var stars = [];
        for (var i=0;i<90;i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height*0.7, r: Math.random()*1.4+0.3, p: Math.random()*6 });
        var t0 = 0;
        function draw(t){
          if (!isDark()) return;
          ctx.clearRect(0,0,canvas.width,canvas.height);
          for (var i=0;i<stars.length;i++){
            var s = stars[i], tw = reduce ? 0.85 : (0.6 + 0.4*Math.sin(t/700 + s.p));
            ctx.globalAlpha = tw; ctx.fillStyle = "#fdf5d8";
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (!reduce) starTimer = requestAnimationFrame(draw);
        }
        cancelAnimationFrame(starTimer);
        draw(0);
      }
      addEventListener("resize", startStars);
      startStars();

      /* ---------- scroll reveals ---------- */
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: .12 });
      document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

      /* duplicate marquee content for seamless loop */
      var mt = document.getElementById("mtrack");
      if (mt) mt.innerHTML += mt.innerHTML;

      /* ---------- animated counters (fire when ledger visible) ---------- */
      var counted = false;
      function runCounters(){
        if (counted) return; counted = true;
        document.querySelectorAll(".num").forEach(function(el){
          var target = +el.getAttribute("data-target"), start = null, dur = 2200;
          function step(ts){
            if(!start) start = ts;
            var p = Math.min((ts-start)/dur, 1), eased = 1-Math.pow(1-p,3);
            el.textContent = Math.floor(eased*target).toLocaleString();
            if(p<1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();
          }
          if (reduce) el.textContent = target.toLocaleString(); else requestAnimationFrame(step);
        });
      }
      var lio = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting) runCounters(); });
      }, { threshold: .4 });
      var ledgerEl = document.querySelector(".ledger-panel"); if (ledgerEl) lio.observe(ledgerEl);

      /* ---------- tumbleweeds roll by, slowly ---------- */
      function tumble(){
        if (reduce || document.hidden) return;
        var t = document.createElement("div");
        t.className = "tumble"; t.textContent = "🌾";
        t.style.bottom = (2 + Math.random()*10) + "vh";
        t.style.fontSize = (1.4 + Math.random()*1.6) + "rem";
        var dur = 14 + Math.random()*10;
        t.style.animationDuration = dur + "s";
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, dur*1000 + 200);
      }
      setTimeout(tumble, 2500);
      setInterval(function(){ if(Math.random()>.3) tumble(); }, 9000);

      /* ---------- EASTER EGGS ---------- */

      /* 1. the sun/moon puts on shades after a few clicks */
      var orb = document.getElementById("orb"), orbClicks = 0;
      orb.addEventListener("click", function(){
        orbClicks++;
        if (orbClicks === 5){ orb.classList.add("cool"); toast("😎 The sun agrees. Stay cool."); }
        else if (orbClicks > 5){ tumble(); }
        else { toast(["Howdy ☀️","Nice and warm.","Keep it comin'…","One more…"][orbClicks-1] || "☀️"); }
      });

      /* 2. push the sign and it swings */
      var sign = document.getElementById("sign");
      sign.addEventListener("click", function(){
        sign.classList.remove("swing"); void sign.offsetWidth; sign.classList.add("swing");
      });

      /* 3. click the brand 5x -> Chief Napping Officer appears */
      var brand = document.getElementById("brand"), bClicks = 0, cno = document.getElementById("cno"), bT;
      brand.addEventListener("click", function(){
        bClicks++; clearTimeout(bT); bT = setTimeout(function(){ bClicks = 0; }, 1200);
        if (bClicks >= 5){ cno.classList.add("up"); toast("🐈 The Chief Napping Officer has awoken. Briefly."); bClicks = 0; }
      });
      cno.addEventListener("click", function(){ toast("💤 CNO says: back to nap. Company policy."); setTimeout(function(){ cno.classList.remove("up"); }, 1800); });

      /* 4. type "chill" anywhere */
      var buf = "";
      addEventListener("keydown", function(e){
        if (e.key && e.key.length === 1) buf = (buf + e.key.toLowerCase()).slice(-14);

        if (buf.indexOf("chill") > -1){ buf = ""; for (var i=0;i<6;i++) setTimeout(tumble, i*160); toast("🌾 Maximum tumbleweeds. Very chill of you."); }

        /* 5. Konami code -> MAXIMUM CHILL mode */
        konami(e.key);
      });

      var kseq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"], kpos = 0;
      function konami(key){
        if (!key) return;
        key = (key.length === 1) ? key.toLowerCase() : key;
        if (key === kseq[kpos]){ kpos++; if (kpos === kseq.length){ kpos = 0; maxChill(); } }
        else { kpos = (key === kseq[0]) ? 1 : 0; }
      }
      var maxOn = false;
      function maxChill(){
        maxOn = !maxOn;
        document.body.classList.toggle("maxchill", maxOn);
        toast(maxOn ? "🧘 MAXIMUM CHILL ENGAGED. Everything… slow… down…" : "⏱️ Back to regular chill.");
        if (maxOn && !reduce){ for (var i=0;i<10;i++) setTimeout(tumble, i*220); }
      }

      /* ---------- "working too hard" apply modal ---------- */
      var modal = document.getElementById("chillModal");
      function openModal(){ modal.classList.add("open"); var b = modal.querySelector("[data-close]"); if(b) b.focus(); }
      function closeModal(){ modal.classList.remove("open"); }
      document.querySelectorAll(".js-apply").forEach(function(el){
        el.addEventListener("click", function(e){ e.preventDefault(); openModal(); });
      });
      modal.addEventListener("click", function(e){ if (e.target === modal || e.target.hasAttribute("data-close")) closeModal(); });
      addEventListener("keydown", function(e){ if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

      /* 6. console note for the curious */
      try {
        console.log("%c🤠 Welcome to Chill Farm","font:700 22px Rockwell,serif;color:#c15a34;");
        console.log("%cWe're hiring people to chill — we've got so much chill in the backlog.\nTry the Konami code. Try typing 'chill'. Click the sun five times.\nhowdy@only-chill.com","font:13px monospace;color:#7a4a26;");
      } catch(_){}
    })();
    </script>
  careers.html: |
    <meta charset="utf-8" />
    <title>Careers — Chill Farm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open roles at Chill Farm. We're hiring professional relaxers — no experience hustling required. Salary paid in sunsets." />
    <style>
      :root {
        --sky-top:#8ec5e8; --sky-mid:#f5c877; --sky-low:#f2a65a; --orb:#ffd257; --orb-glow:#ffe9a8;
        --hill-far:#c9b46e; --hill-mid:#8a9a55; --hill-near:#5f6f42;
        --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#4a2f1c; --denim:#3f6386; --terra:#c15a34;
        --parch:#f4ead0; --parch-2:#ece0c2; --ink:#33261a; --ink-soft:#5c4a38; --card:#fbf4e2; --line:#d8c6a0;
        --page-bg:#f4ead0; --shadow:rgba(74,47,28,.20);
        --display:"Rockwell","Rockwell Nova","Roboto Slab","Courier New",Georgia,serif;
        --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --mono:"Courier New",ui-monospace,monospace;
        --ease-chill:cubic-bezier(.22,.61,.36,1);
      }
      @media (prefers-color-scheme: dark){ :root{
        --sky-top:#1a1633; --sky-mid:#4a2d55; --sky-low:#b5533f; --orb:#f4ecd0; --orb-glow:#d9d2f0;
        --hill-far:#6a5a44; --hill-mid:#3f4a34; --hill-near:#28311f;
        --parch:#221a24; --parch-2:#1a141c; --ink:#f0e4cf; --ink-soft:#c3b199; --card:#2a2030; --line:#43364a;
        --page-bg:#1a141c; --shadow:rgba(0,0,0,.45);
      }}
      :root[data-theme="light"]{ --sky-top:#8ec5e8; --sky-mid:#f5c877; --sky-low:#f2a65a; --orb:#ffd257; --orb-glow:#ffe9a8;
        --hill-far:#c9b46e; --hill-mid:#8a9a55; --hill-near:#5f6f42;
        --parch:#f4ead0; --parch-2:#ece0c2; --ink:#33261a; --ink-soft:#5c4a38; --card:#fbf4e2; --line:#d8c6a0; --page-bg:#f4ead0; --shadow:rgba(74,47,28,.20); }
      :root[data-theme="dark"]{ --sky-top:#1a1633; --sky-mid:#4a2d55; --sky-low:#b5533f; --orb:#f4ecd0; --orb-glow:#d9d2f0;
        --hill-far:#6a5a44; --hill-mid:#3f4a34; --hill-near:#28311f;
        --parch:#221a24; --parch-2:#1a141c; --ink:#f0e4cf; --ink-soft:#c3b199; --card:#2a2030; --line:#43364a; --page-bg:#1a141c; --shadow:rgba(0,0,0,.45); }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin:0; font-family:var(--body); color:var(--ink); background:var(--page-bg); line-height:1.6;
        overflow-x:hidden; transition:background .8s var(--ease-chill), color .8s var(--ease-chill); }
      h1,h2,h3 { font-family:var(--display); font-weight:700; line-height:1.04; text-wrap:balance; margin:0; }
      a { color:inherit; }
      ::selection { background:var(--wheat); color:var(--saddle-dk); }

      .topbar { position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
        padding:.7rem clamp(1rem,4vw,2.4rem); backdrop-filter:blur(6px);
        background:color-mix(in srgb, var(--page-bg) 78%, transparent);
        border-bottom:1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
      .brand { display:flex; align-items:center; gap:.55rem; font-family:var(--display); font-size:1.05rem; letter-spacing:.04em; text-decoration:none; }
      .brand .badge { width:26px; height:26px; display:grid; place-items:center; background:var(--wheat); color:var(--saddle-dk);
        border-radius:50%; font-size:1rem; box-shadow:inset 0 0 0 2px var(--saddle-dk); }
      .navlinks { display:flex; gap:1.4rem; align-items:center; font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; }
      .navlinks a { text-decoration:none; opacity:.8; transition:opacity .3s; }
      .navlinks a:hover { opacity:1; }
      .theme-toggle { border:1px solid color-mix(in srgb, var(--ink) 25%, transparent); background:transparent; color:inherit;
        cursor:pointer; width:40px; height:40px; border-radius:50%; font-size:1.1rem; display:grid; place-items:center;
        transition:transform .5s var(--ease-chill), background .3s; }
      .theme-toggle:hover { transform:rotate(40deg); background:color-mix(in srgb, var(--wheat) 25%, transparent); }
      @media (max-width:640px){ .navlinks a:not(.home-link){ display:none; } }

      /* banner */
      .banner { position:relative; overflow:hidden; padding:clamp(3rem,8vw,5.5rem) clamp(1.2rem,6vw,3rem) clamp(2.5rem,6vw,4rem);
        background:linear-gradient(180deg, var(--sky-top), var(--sky-mid) 130%); }
      .banner .sun { position:absolute; top:-40px; right:8%; width:150px; height:150px; border-radius:50%;
        background:radial-gradient(circle at 38% 35%, var(--orb-glow), var(--orb) 60%);
        box-shadow:0 0 70px 24px color-mix(in srgb, var(--orb) 55%, transparent); animation:breathe 9s ease-in-out infinite; }
      @keyframes breathe { 0%,100%{ box-shadow:0 0 60px 18px color-mix(in srgb,var(--orb) 55%,transparent);} 50%{ box-shadow:0 0 90px 30px color-mix(in srgb,var(--orb) 70%,transparent);} }
      .banner .wrap { position:relative; z-index:2; }
      .wrap { max-width:1080px; margin:0 auto; }
      .eyebrow { font-family:var(--mono); font-size:.76rem; letter-spacing:.34em; text-transform:uppercase; color:var(--saddle-dk);
        display:inline-flex; align-items:center; gap:.6rem; }
      .eyebrow::before { content:""; width:26px; height:2px; background:var(--saddle-dk); display:inline-block; }
      .banner h1 { font-size:clamp(2.4rem,8vw,4.6rem); text-transform:uppercase; letter-spacing:.01em; margin:.5rem 0 .6rem; color:var(--saddle-dk); }
      .banner .lead { font-size:clamp(1.05rem,2.4vw,1.3rem); color:var(--saddle-dk); max-width:56ch; opacity:.9; }
      .banner .pill { display:inline-block; margin-top:1.2rem; font-family:var(--mono); font-size:.76rem; letter-spacing:.14em;
        text-transform:uppercase; background:var(--saddle-dk); color:#ffe6ad; padding:.5rem 1rem; border-radius:40px; }

      .band { padding:clamp(3rem,8vw,6rem) clamp(1.2rem,6vw,3rem); }

      /* job grid */
      .jobs { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:clamp(1rem,3vw,1.6rem); margin-top:.5rem; }
      .job { position:relative; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:1.5rem 1.4rem;
        display:flex; flex-direction:column; box-shadow:0 10px 24px var(--shadow);
        transition:transform .45s var(--ease-chill), box-shadow .45s; }
      .job:hover { transform:translateY(-6px); box-shadow:0 22px 40px var(--shadow); }
      .job .ji { font-size:2.2rem; }
      .job .dept { font-family:var(--mono); font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--terra);
