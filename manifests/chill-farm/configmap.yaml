      applyScene(); setInterval(applyScene, 60000);

      // live presence from the pasture
      var presEl = document.getElementById("presence"), presCount = document.getElementById("presCount");
      function pollPresence(){
        fetch("/ws/stats", { cache:"no-store" }).then(function(r){ return r.json(); }).then(function(d){
          if (d && d.sheep > 0){ presCount.textContent = d.sheep; presEl.classList.add("show"); }
          else presEl.classList.remove("show");
        }).catch(function(){});
      }
      pollPresence(); setInterval(pollPresence, 5000);

      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold:.12, rootMargin:"0px 0px -8% 0px" });
      document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

      var modal = document.getElementById("chillModal");
      function openModal(){ modal.classList.add("open"); var b = modal.querySelector("[data-close]"); if (b) b.focus(); }
      function closeModal(){ modal.classList.remove("open"); }
      document.querySelectorAll(".js-apply").forEach(function(el){ el.addEventListener("click", function(e){ e.preventDefault(); openModal(); }); });
      modal.addEventListener("click", function(e){ if (e.target === modal || e.target.hasAttribute("data-close")) closeModal(); });
      addEventListener("keydown", function(e){ if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

      /* scroll cop */
      var CP = document.getElementById("chillPolice"),
          cpEmoji = document.getElementById("cpEmoji"), cpTitle = document.getElementById("cpTitle"), cpMsg = document.getElementById("cpMsg");
      var CP_MSGS = [
        { e:"🐢", t:"Whoa there, partner", m:"This is a chill farm — ease off the throttle." },
        { e:"😎", t:"Too much hustle", m:"You're scrolling like it's a Monday. Breathe." },
        { e:"🌵", t:"Easy, cowboy", m:"These jobs aren't going anywhere. Neither should you." },
        { e:"🧘", t:"Please relax", m:"Detected: excessive productivity energy. Slow it down." },
        { e:"🍹", t:"Sip, don't gulp", m:"Read the listings at ranch speed." }
      ];
      var cpCount = 0, cpCool = false, cpHideT, cpSamples = [];
      function pnow(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
      function cpFire(){
        if (cpCool) return;
        var m = (cpCount >= CP_MSGS.length + 2)
          ? { e:"😤", t:"Okay, showoff", m:"You're speed-running our whole vibe on purpose now." }
          : CP_MSGS[cpCount % CP_MSGS.length];
        cpCount++;
        cpEmoji.textContent = m.e; cpTitle.textContent = m.t; cpMsg.textContent = m.m;
        CP.classList.add("show");
        clearTimeout(cpHideT); cpHideT = setTimeout(function(){ CP.classList.remove("show"); }, 2200);
        cpCool = true; setTimeout(function(){ cpCool = false; }, 9000);
      }
      addEventListener("scroll", function(){
        var t = pnow(), y = window.scrollY || document.documentElement.scrollTop || 0;
        cpSamples.push([t, y]);
        while (cpSamples.length > 1 && t - cpSamples[0][0] > 450) cpSamples.shift();
