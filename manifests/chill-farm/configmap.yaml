apiVersion: v1
kind: ConfigMap
metadata:
  name: chill-farm-site
  namespace: chill-farm
  labels:
    app: chill-farm
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  index.html: "<meta charset=\"utf-8\" />\n<title>Chill Farm — We're Hiring People to Chill</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<meta name=\"description\" content=\"Chill Farm: we are hiring people to chill as we have so much chill in the backlog. A ranch for professional relaxers.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#4a2f1c\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"Chill Farm — We're Hiring People to Chill\" />\n<meta property=\"og:description\" content=\"A ranch for professional relaxers. Graze in a live multiplayer meadow, chat in the hammock lounge, fish at the pond — no experience hustling required.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<style>\n  /* ============================================================\n     CHILL FARM — only-chill.com\n     A ranch that runs entirely on chill.\n     Theme toggle changes the time of day: light = golden hour, dark = dusk.\n     ============================================================ */\n\n  :root {\n    /* ---- time-of-day: GOLDEN AFTERNOON (light) ---- */\n    --sky-top:    #8ec5e8;   /* warm afternoon blue   */\n    --sky-mid:    #f5c877;   /* low golden light      */\n    --sky-low:    #f2a65a;   /* horizon amber         */\n    --orb:        #ffd257;   /* the sun               */\n    --orb-glow:   #ffe9a8;\n    --hill-far:   #c9b46e;   /* dry wheat hills       */\n    --hill-mid:   #8a9a55;   /* sage                  */\n    --hill-near:  #5f6f42;   /* deep sage             */\n\n    --wheat:      #d9a441;   /* primary accent, wheat gold */\n    --wheat-deep: #b5822c;\n    --saddle:     #7a4a26;   /* wood                  */\n    --saddle-dk:  #4a2f1c;\n    --denim:      #3f6386;   /* small cool pop        */\n    --terra:      #c15a34;   /* branding-iron red     */\n\n    --parch:      #f4ead0;   /* content ground        */\n    --parch-2:    #ece0c2;\n    --ink:        #33261a;   /* warm near-black text  */\n    --ink-soft:   #5c4a38;\n    --card:       #fbf4e2;\n    --line:       #d8c6a0;\n\n    --page-bg:    #f4ead0;\n    --shadow:     rgba(74,47,28,.20);\n\n    --display: \"Rockwell\", \"Rockwell Nova\", \"Roboto Slab\", \"Courier New\", Georgia, serif;\n    --body: system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n    --mono: \"Courier New\", ui-monospace, monospace;\n\n    --ease-chill: cubic-bezier(.22,.61,.36,1);\n  }\n\n  @media (prefers-color-scheme: dark) {\n    :root {\n      --sky-top:  #1a1633;\n      --sky-mid:  #4a2d55;\n      --sky-low:  #b5533f;\n      --orb:      #f4ecd0;   /* the moon */\n      --orb-glow: #d9d2f0;\n      --hill-far: #6a5a44;\n      --hill-mid: #3f4a34;\n      --hill-near:#28311f;\n\n      --parch:    #221a24;\n      --parch-2:  #1a141c;\n      --ink:      #f0e4cf;\n      --ink-soft: #c3b199;\n      --card:     #2a2030;\n      --line:     #43364a;\n\n      --page-bg:  #1a141c;\n      --shadow:   rgba(0,0,0,.45);\n    }\n  }\n  /* explicit toggle wins in both directions */\n  :root[data-theme=\"light\"] {\n    --sky-top:#8ec5e8; --sky-mid:#f5c877; --sky-low:#f2a65a; --orb:#ffd257; --orb-glow:#ffe9a8;\n    --hill-far:#c9b46e; --hill-mid:#8a9a55; --hill-near:#5f6f42;\n    --parch:#f4ead0; --parch-2:#ece0c2; --ink:#33261a; --ink-soft:#5c4a38; --card:#fbf4e2; --line:#d8c6a0;\n    --page-bg:#f4ead0; --shadow:rgba(74,47,28,.20);\n  }\n  :root[data-theme=\"dark\"] {\n    --sky-top:#1a1633; --sky-mid:#4a2d55; --sky-low:#b5533f; --orb:#f4ecd0; --orb-glow:#d9d2f0;\n    --hill-far:#6a5a44; --hill-mid:#3f4a34; --hill-near:#28311f;\n    --parch:#221a24; --parch-2:#1a141c; --ink:#f0e4cf; --ink-soft:#c3b199; --card:#2a2030; --line:#43364a;\n    --page-bg:#1a141c; --shadow:rgba(0,0,0,.45);\n  }\n\n  * {\
    \ box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body {\n    margin: 0;\n    font-family: var(--body);\n    color: var(--ink);\n    background: var(--page-bg);\n    line-height: 1.6;\n    overflow-x: hidden;\n    transition: background .8s var(--ease-chill), color .8s var(--ease-chill);\n  }\n  h1,h2,h3 { font-family: var(--display); font-weight: 700; line-height: 1.02; text-wrap: balance; margin: 0; }\n  a { color: inherit; }\n  ::selection { background: var(--wheat); color: var(--saddle-dk); }\n\n  /* ---------- top bar ---------- */\n  .topbar {\n    position: fixed; inset: 0 0 auto 0; z-index: 40;\n    display: flex; align-items: center; justify-content: space-between;\n    padding: .7rem clamp(1rem, 4vw, 2.4rem);\n    backdrop-filter: blur(6px);\n    background: color-mix(in srgb, var(--page-bg) 62%, transparent);\n    border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);\n  }\n  .brand { display: flex; align-items: center; gap: .55rem; font-family: var(--display); font-size: 1.05rem; letter-spacing: .04em; cursor: pointer; user-select: none; }\n  .brand .badge { width: 26px; height: 26px; display: grid; place-items: center; background: var(--wheat); color: var(--saddle-dk); border-radius: 50%; font-size: 1rem; box-shadow: inset 0 0 0 2px var(--saddle-dk); }\n  .navlinks { display: flex; gap: 1.4rem; align-items: center; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }\n  .navlinks a { text-decoration: none; opacity: .8; transition: opacity .3s; }\n  .navlinks a:hover { opacity: 1; }\n  .dropdown { position: relative; display: inline-flex; }\n  .dd-toggle { font: inherit; font-family: var(--body); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase;\n    color: inherit; background: none; border: none; cursor: pointer; opacity: .8; padding: 0; }\n  .dd-toggle:hover { opacity: 1; }\n  .dd-menu { position: absolute; top: calc(100% + .7rem); left: 50%; transform: translateX(-50%) translateY(-6px);\n    min-width: 168px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: .4rem;\n    box-shadow: 0 14px 32px rgba(0,0,0,.28); display: flex; flex-direction: column; gap: .2rem;\n    opacity: 0; visibility: hidden; transition: opacity .25s var(--ease-chill), transform .25s var(--ease-chill), visibility .25s; z-index: 50; }\n  .dd-menu::before { content: \"\"; position: absolute; left: 0; right: 0; bottom: 100%; height: .8rem; }  /* hover bridge */\n  .dropdown:hover .dd-menu, .dropdown.open .dd-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }\n  .dd-menu a { text-decoration: none; text-transform: none; letter-spacing: 0; font-size: .92rem; color: var(--ink);\n    opacity: 1; padding: .5rem .7rem; border-radius: 8px; white-space: nowrap; }\n  .dd-menu a:hover { background: color-mix(in srgb, var(--wheat) 30%, transparent); opacity: 1; }\n  .theme-toggle {\n    border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent);\n    background: transparent; color: inherit; cursor: pointer;\n    width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem;\n    display: grid; place-items: center; transition: transform .5s var(--ease-chill), background .3s;\n  }\n  .theme-toggle:hover { transform: rotate(40deg); background: color-mix(in srgb, var(--wheat) 25%, transparent); }\n  @media (max-width: 720px){ .navlinks a:not(.hire-link){ display:none; } }\n\n  /* ---------- HERO scene ---------- */\n  .hero { position: relative; height: 100svh; min-height: 620px; overflow: hidden; display: grid; place-items: center; }\n  .sky {\n    position: absolute; inset: 0;\n    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 62%, var(--sky-low) 100%);\n    transition: background .8s var(--ease-chill);\n  }\n  /* sun / moon */\n  .orb {\n    position: absolute; top: 16%; left: 50%; transform: translateX(-50%);\n    width: 150px; height: 150px; border-radius: 50%;\n    background: radial-gradient(circle at 38% 35%, var(--orb-glow), var(--orb) 60%);\n    box-shadow: 0 0 70px 24px\
    \ color-mix(in srgb, var(--orb) 60%, transparent);\n    cursor: pointer; z-index: 3; animation: breathe 9s ease-in-out infinite;\n    transition: background .8s var(--ease-chill), box-shadow .8s;\n  }\n  @keyframes breathe { 0%,100%{ box-shadow:0 0 60px 18px color-mix(in srgb,var(--orb) 55%,transparent);} 50%{ box-shadow:0 0 90px 30px color-mix(in srgb,var(--orb) 70%,transparent);} }\n  .orb .shades { position: absolute; inset: 0; display: grid; place-items: center; font-size: 4.6rem; opacity: 0; transform: scale(.4) rotate(-12deg); transition: opacity .5s, transform .5s var(--ease-chill); pointer-events: none; }\n  .orb.cool .shades { opacity: 1; transform: scale(1) rotate(0); }\n\n  /* stars — only visible at night */\n  .stars { position: absolute; inset: 0; z-index: 2; opacity: 0; transition: opacity 1s; pointer-events: none; }\n  :root[data-theme=\"dark\"] .stars { opacity: 1; }\n  @media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]) .stars { opacity: 1; } }\n\n  /* layered hills */\n  .hill { position: absolute; left: -5%; width: 110%; z-index: 4; transition: background .8s var(--ease-chill); }\n  .hill.far  { bottom: 20%; height: 34%; background: var(--hill-far);  border-radius: 50% 50% 0 0 / 90% 90% 0 0; opacity: .9; }\n  .hill.mid  { bottom: 10%; height: 30%; background: var(--hill-mid);  border-radius: 46% 54% 0 0 / 100% 100% 0 0; }\n  .hill.near { bottom: 0;   height: 22%; background: var(--hill-near); border-radius: 50% 50% 0 0 / 80% 80% 0 0; z-index: 8; }\n\n  /* little sun-glint fence + cactus on the near hill */\n  .foreprops { position: absolute; bottom: 0; left: 0; width: 100%; height: 24%; z-index: 9; pointer-events: none; }\n  .cactus { position: absolute; bottom: 6%; font-size: clamp(2.2rem, 6vw, 3.4rem); filter: drop-shadow(0 3px 0 rgba(0,0,0,.15)); }\n  .cactus.a { left: 8%; }\n  .cactus.b { right: 12%; bottom: 9%; font-size: clamp(1.6rem,4vw,2.4rem); }\n\n  /* the hanging wooden sign — the wordmark */\n  .signwrap { position: relative; z-index: 12; text-align: center; margin-top: -6vh; padding: 0 1rem; }\n  .ropes { display: flex; justify-content: center; gap: min(46vw, 420px); height: 46px; }\n  .ropes span { width: 5px; height: 100%; background: repeating-linear-gradient(45deg, #b98a4e 0 5px, #9c6f38 5px 10px); border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.3); }\n  .sign {\n    display: inline-block; transform-origin: top center;\n    padding: clamp(.7rem,2.5vw,1.4rem) clamp(1.2rem,5vw,3rem);\n    background:\n      linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.14)),\n      repeating-linear-gradient(90deg, #7a4a26 0 6px, #83512b 6px 12px, #6e421f 12px 18px);\n    border: 4px solid #5b3618;\n    border-radius: 10px;\n    box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 2px rgba(0,0,0,.18), inset 0 2px 6px rgba(255,255,255,.12);\n    animation: sway 7s ease-in-out infinite;\n    cursor: pointer;\n  }\n  .sign:hover { animation-play-state: paused; }\n  .sign.swing { animation: bigswing 2.4s var(--ease-chill); }\n  @keyframes sway { 0%,100%{ transform: rotate(-1.1deg);} 50%{ transform: rotate(1.1deg);} }\n  @keyframes bigswing { 0%{transform:rotate(-9deg);} 30%{transform:rotate(7deg);} 55%{transform:rotate(-4deg);} 78%{transform:rotate(2deg);} 100%{transform:rotate(0);} }\n  .sign .kicker { font-family: var(--mono); font-size: clamp(.6rem,1.6vw,.78rem); letter-spacing: .5em; text-transform: uppercase; color: #f3d9a6; margin-left: .5em; }\n  .sign h1 {\n    color: #f6e7c4; font-size: clamp(2.6rem, 11vw, 7rem); letter-spacing: .02em; text-transform: uppercase;\n    text-shadow: 0 2px 0 #2c1a0c, 0 -1px 0 rgba(255,255,255,.15), 1px 3px 5px rgba(0,0,0,.4);\n    margin: .1em 0;\n  }\n  .sign .est { font-family: var(--mono); font-size: clamp(.58rem,1.5vw,.74rem); letter-spacing: .3em; color: #e7c891; }\n\n  .scrollcue { position: absolute; bottom: 1.4rem; left: 50%; transform: translateX(-50%); z-index: 12; font-family: var(--mono); font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; opacity: .7; animation: bob 3s ease-in-out infinite; color: color-mix(in\
    \ srgb, var(--ink) 85%, #fff); }\n  @keyframes bob { 0%,100%{ transform: translate(-50%,0);} 50%{ transform: translate(-50%,8px);} }\n\n  /* drifting clouds (daytime) */\n  .clouds { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.4s var(--ease-chill); }\n  .clouds.on { opacity: 1; }\n  .cloud { position: absolute; left: -22%; width: 120px; height: 38px; background: rgba(255,255,255,.9);\n    border-radius: 40px; filter: blur(1px);\n    box-shadow: 34px 8px 0 -6px rgba(255,255,255,.9), 66px -4px 0 -3px rgba(255,255,255,.92), -30px 6px 0 -8px rgba(255,255,255,.88);\n    animation: drift linear infinite; }\n  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(150vw); } }\n\n  /* shooting star + wish sparkles */\n  .shooting-star { position: absolute; top: 0; left: 0; width: 4px; height: 4px; border-radius: 50%; background: #fff;\n    box-shadow: 0 0 10px 3px rgba(255,255,255,.9); z-index: 6; cursor: pointer; pointer-events: auto; will-change: transform, opacity; }\n  .shooting-star::after { content: \"\"; position: absolute; right: 4px; top: 1px; width: 70px; height: 2px;\n    background: linear-gradient(90deg, transparent, rgba(255,255,255,.85)); }\n  .sparkle { position: absolute; z-index: 6; color: var(--wheat); font-size: 1rem; pointer-events: none;\n    transition: transform .85s var(--ease-chill), opacity .85s var(--ease-chill); }\n\n  /* live community presence chip (pulled from the pasture game server) */\n  .presence { position: fixed; left: 1rem; bottom: 1rem; z-index: 35; display: inline-flex; align-items: center; gap: .55rem;\n    background: var(--saddle-dk); color: #ffe6ad; border: 2px solid var(--wheat); border-radius: 40px; padding: .5rem 1rem;\n    font-family: var(--mono); font-size: .76rem; letter-spacing: .04em; text-decoration: none;\n    box-shadow: 0 10px 26px var(--shadow); transform: translateY(180%); opacity: 0;\n    transition: transform .5s var(--ease-chill), opacity .4s var(--ease-chill); }\n  .presence.show { transform: none; opacity: 1; }\n  .presence:hover { border-color: #ffe6ad; }\n  .presence b { color: #fff; font-variant-numeric: tabular-nums; }\n  .presence .dot { width: 8px; height: 8px; border-radius: 50%; background: #7ee081; box-shadow: 0 0 8px #7ee081; animation: livepulse 2s ease-in-out infinite; }\n  @keyframes livepulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }\n\n  /* live from the meadow: cam + forecast */\n  .live-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(1rem,3vw,1.8rem); margin-top: 2.4rem; align-items: stretch; }\n  @media (max-width: 760px){ .live-grid { grid-template-columns: 1fr; } }\n  .cam { position: relative; display: block; border-radius: 16px; overflow: hidden; border: 3px solid var(--saddle);\n    box-shadow: 0 14px 34px var(--shadow); aspect-ratio: 16/9; background: #3f5a2c; text-decoration: none; }\n  .cam canvas { width: 100%; height: 100%; display: block; }\n  .cam-tag { position: absolute; top: .6rem; left: .6rem; background: rgba(30,20,12,.7); color: #ffe6ad;\n    font-family: var(--mono); font-size: .72rem; letter-spacing: .05em; padding: .3rem .7rem; border-radius: 20px; }\n  .cam-tag b { color: #fff; }\n  .cam::after { content: \"enter the meadow →\"; position: absolute; bottom: .6rem; right: .6rem; background: var(--terra);\n    color: #f4ead0; font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; font-size: .78rem;\n    padding: .35rem .8rem; border-radius: 20px; opacity: .92; }\n  .forecast { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: clamp(1.4rem,3vw,2rem);\n    box-shadow: 0 10px 24px var(--shadow); display: flex; flex-direction: column; justify-content: center; }\n  .forecast .fc-emoji { font-size: 2.6rem; animation: breathe 6s ease-in-out infinite; }\n  .forecast h3 { font-size: 1.3rem; text-transform: uppercase; margin: .4rem 0 .5rem; }\n  .forecast p { color: var(--ink-soft); font-size: 1.02rem; line-height: 1.5; margin: 0; }\n\n  /* tumbleweeds roll\
    \ across everything, slowly (it's chill) */\n  .tumble { position: fixed; bottom: 4vh; left: -8vw; z-index: 30; font-size: 2rem; pointer-events: none; animation: roll linear forwards; filter: drop-shadow(0 4px 3px rgba(0,0,0,.2)); }\n  @keyframes roll { from { transform: translateX(0) rotate(0);} to { transform: translateX(120vw) rotate(1800deg);} }\n\n  /* ---------- generic section ---------- */\n  main { position: relative; z-index: 20; }\n  .band { padding: clamp(3.5rem, 9vw, 7rem) clamp(1.2rem, 6vw, 3rem); }\n  .wrap { max-width: 1080px; margin: 0 auto; }\n  .eyebrow { font-family: var(--mono); font-size: .76rem; letter-spacing: .34em; text-transform: uppercase; color: var(--wheat-deep); display: inline-flex; align-items: center; gap: .6rem; }\n  .eyebrow::before { content: \"\"; width: 26px; height: 2px; background: var(--wheat-deep); display: inline-block; }\n  h2.title { font-size: clamp(2rem, 6vw, 3.4rem); text-transform: uppercase; letter-spacing: .01em; margin: .5rem 0 1rem; }\n  .lead { font-size: clamp(1.05rem, 2.4vw, 1.3rem); color: var(--ink-soft); max-width: 60ch; }\n\n  /* reveal on scroll */\n  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s var(--ease-chill), transform .9s var(--ease-chill); }\n  .reveal.in { opacity: 1; transform: none; }\n\n  /* ---------- motto rope banner ---------- */\n  .motto { background: var(--saddle-dk); color: #f4ead0; text-align: center; position: relative; }\n  .motto .wrap { padding-block: .5rem; }\n  .rope-edge { height: 12px; width: 100%; background: repeating-linear-gradient(-45deg, var(--wheat) 0 10px, var(--wheat-deep) 10px 20px); }\n  .motto h2 { font-size: clamp(1.5rem, 4.6vw, 2.9rem); text-transform: uppercase; color: #ffe6ad; text-shadow: 0 2px 0 #000; }\n  .motto p { font-family: var(--mono); letter-spacing: .12em; color: #e9cf9f; margin-top: 1rem; }\n  .brandmark-iron { font-size: 2.4rem; display: inline-block; animation: breathe 6s ease-in-out infinite; }\n\n  /* ---------- marquee ---------- */\n  .marquee { overflow: hidden; background: var(--wheat); color: var(--saddle-dk); border-block: 3px solid var(--saddle-dk); }\n  .marquee-track { display: inline-flex; gap: 2.4rem; white-space: nowrap; padding: .55rem 0; font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 1.05rem; animation: scrollx 26s linear infinite; }\n  .marquee:hover .marquee-track { animation-play-state: paused; }\n  .marquee-track span::after { content: \"✦\"; margin-left: 2.4rem; opacity: .6; }\n  @keyframes scrollx { from { transform: translateX(0);} to { transform: translateX(-50%);} }\n\n  /* ---------- team ---------- */\n  .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: clamp(1rem, 3vw, 1.8rem); margin-top: 2.6rem; }\n  .badgecard {\n    position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 14px;\n    padding: 1.6rem 1.3rem 1.4rem; text-align: center; overflow: hidden;\n    box-shadow: 0 10px 24px var(--shadow); transition: transform .5s var(--ease-chill), box-shadow .5s;\n  }\n  .badgecard::before { content: \"\"; position: absolute; inset: 6px; border: 1px dashed var(--line); border-radius: 10px; pointer-events: none; }\n  .badgecard:hover { transform: translateY(-8px) rotate(-.6deg); box-shadow: 0 22px 40px var(--shadow); }\n  .avatar {\n    width: 92px; height: 92px; margin: 0 auto .9rem; border-radius: 50%;\n    display: grid; place-items: center; font-size: 2.8rem;\n    background: radial-gradient(circle at 40% 35%, var(--orb-glow), var(--wheat));\n    box-shadow: inset 0 0 0 4px var(--saddle-dk), 0 6px 14px var(--shadow);\n  }\n  .badgecard .role { font-family: var(--mono); font-size: .72rem; letter-spacing: .22em; text-transform: uppercase; color: var(--terra); font-weight: 700; }\n  .badgecard h3 { font-size: 1.5rem; margin: .3rem 0 .1rem; text-transform: uppercase; }\n  .badgecard .title { font-size: .92rem; color: var(--ink-soft); min-height: 2.6em; }\n  .badgecard .bio { font-size: .84rem; color: var(--ink-soft); margin-top: .7rem;\
    \ border-top: 1px solid var(--line); padding-top: .7rem; }\n  .badgecard .chillstat { margin-top: .8rem; font-family: var(--mono); font-size: .74rem; letter-spacing: .05em; color: var(--wheat-deep); }\n  .badgecard .pin { position: absolute; top: .7rem; right: .8rem; font-size: 1rem; opacity: .5; }\n\n  /* ---------- ledger / backlog counter ---------- */\n  .ledger { background: var(--parch-2); }\n  .ledger-panel {\n    background: var(--saddle-dk); color: #f4ead0; border-radius: 16px; padding: clamp(1.6rem,5vw,3rem);\n    box-shadow: 0 18px 44px var(--shadow); border: 3px solid #5b3618; position: relative; overflow: hidden;\n  }\n  .ledger-panel::after { content: \"★ ★ ★\"; position: absolute; top: .8rem; right: 1.2rem; letter-spacing: .5em; color: var(--wheat); opacity: .5; font-size: .8rem; }\n  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 1.4rem 1rem; margin-top: 1.4rem; }\n  .stat { text-align: center; }\n  .stat .num { font-family: var(--display); font-size: clamp(2rem, 6vw, 3.2rem); color: #ffe0a0; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1; }\n  .stat .lbl { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: #e2c48f; margin-top: .5rem; }\n  .backlog-note { font-family: var(--mono); font-size: .8rem; color: #e9cf9f; margin-top: 1.6rem; text-align: center; border-top: 1px dashed rgba(244,234,208,.3); padding-top: 1.2rem; }\n  .chillbar { height: 16px; border-radius: 10px; background: rgba(0,0,0,.3); overflow: hidden; margin-top: .5rem; border: 1px solid rgba(255,255,255,.15); }\n  .chillbar > i { display: block; height: 100%; width: 98%; background: repeating-linear-gradient(90deg, var(--wheat) 0 12px, var(--wheat-deep) 12px 24px); animation: nudge 5s ease-in-out infinite; }\n  @keyframes nudge { 0%,100%{ width: 97%;} 50%{ width: 99%;} }\n\n  /* ---------- values ---------- */\n  .values-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 1.4rem; margin-top: 2.4rem; }\n  .value { background: var(--card); border: 2px solid var(--line); border-left: 6px solid var(--wheat); border-radius: 12px; padding: 1.4rem 1.3rem; transition: transform .4s var(--ease-chill); }\n  .value:hover { transform: translateX(4px); }\n  .value .ic { font-size: 2rem; }\n  .value h3 { font-size: 1.2rem; margin: .5rem 0 .3rem; text-transform: uppercase; letter-spacing: .02em; }\n  .value p { font-size: .92rem; color: var(--ink-soft); margin: 0; }\n\n  /* ---------- hire CTA ---------- */\n  .hire { text-align: center; background: linear-gradient(180deg, var(--parch), var(--parch-2)); }\n  .poster {\n    display: inline-block; max-width: 640px; margin: 0 auto; text-align: center;\n    background: var(--card); border: 3px double var(--saddle); border-radius: 8px;\n    padding: clamp(1.6rem,5vw,2.8rem); box-shadow: 0 14px 34px var(--shadow); transform: rotate(-.7deg);\n  }\n  .poster .wanted { font-family: var(--display); text-transform: uppercase; letter-spacing: .3em; color: var(--terra); font-size: .9rem; }\n  .poster h2 { font-size: clamp(1.8rem,6vw,3rem); text-transform: uppercase; margin: .4rem 0; }\n  .poster p { color: var(--ink-soft); }\n  .btn {\n    display: inline-block; margin-top: 1.4rem; text-decoration: none; cursor: pointer;\n    font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 1.05rem;\n    color: #f4ead0; background: var(--terra); padding: .85rem 2rem; border-radius: 40px;\n    border: 2px solid var(--saddle-dk); box-shadow: 0 6px 0 var(--saddle-dk);\n    transition: transform .2s var(--ease-chill), box-shadow .2s;\n  }\n  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--saddle-dk); }\n  .btn.ghost { background: transparent; color: var(--ink); box-shadow: 0 6px 0 var(--line); border-color: var(--line); }\n  .cta-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }\n\n  /* ---------- footer night ---------- */\n  footer { background: var(--saddle-dk); color: #e9d7b5; text-align: center;\
    \ padding: clamp(2.5rem,7vw,4rem) 1.5rem 2.5rem; position: relative; }\n  footer .fbrand { font-family: var(--display); font-size: 1.8rem; text-transform: uppercase; letter-spacing: .06em; color: #ffe6ad; }\n  footer .crew { font-family: var(--mono); font-size: .78rem; letter-spacing: .1em; color: #cbb187; margin-top: .8rem; line-height: 1.9; }\n  footer .fine { font-size: .74rem; color: #a58a63; margin-top: 1.6rem; }\n  footer a { color: #ffe6ad; }\n\n  /* toast for easter eggs — hidden with opacity+visibility so no empty sliver ever peeks */\n  .toast { position: fixed; left: 50%; bottom: 2rem; transform: translate(-50%, 160%); z-index: 60;\n    background: var(--saddle-dk); color: #ffe6ad; font-family: var(--mono); font-size: .85rem; letter-spacing: .05em;\n    padding: .8rem 1.4rem; border-radius: 40px; border: 2px solid var(--wheat); box-shadow: 0 10px 30px rgba(0,0,0,.4);\n    opacity: 0; visibility: hidden;\n    transition: transform .5s var(--ease-chill), opacity .4s var(--ease-chill), visibility .5s; pointer-events: none; }\n  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }\n\n  /* ---------- \"you're working too hard\" modal (shared with /careers) ---------- */\n  .chill-modal { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 1.2rem;\n    background: color-mix(in srgb, var(--saddle-dk) 74%, transparent); backdrop-filter: blur(4px);\n    opacity: 0; visibility: hidden; transition: opacity .45s var(--ease-chill), visibility .45s; }\n  .chill-modal.open { opacity: 1; visibility: visible; }\n  .chill-modal__card { background: var(--card); color: var(--ink); border: 3px double var(--saddle);\n    border-radius: 16px; padding: clamp(1.6rem,5vw,2.6rem); max-width: 460px; text-align: center;\n    box-shadow: 0 26px 60px rgba(0,0,0,.5); transform: translateY(18px) scale(.96); transition: transform .45s var(--ease-chill); }\n  .chill-modal.open .chill-modal__card { transform: none; }\n  .chill-modal .cm-emoji { font-size: 3.4rem; animation: breathe 5s ease-in-out infinite; }\n  .chill-modal h2 { font-size: clamp(1.5rem,5vw,2.1rem); text-transform: uppercase; margin: .5rem 0 .2rem; letter-spacing: .01em; }\n  .chill-modal p { color: var(--ink-soft); font-size: .98rem; margin: .6rem 0 0; }\n\n  /* ---------- scroll cop: fires when you scroll too fast ---------- */\n  .chill-police { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 1.2rem;\n    pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .3s var(--ease-chill), visibility .3s; }\n  .chill-police.show { opacity: 1; visibility: visible; }\n  .chill-police__card { background: var(--saddle-dk); color: #ffe6ad; border: 3px dashed var(--wheat);\n    border-radius: 18px; padding: 1.4rem 1.9rem; max-width: min(90vw, 440px); text-align: center;\n    box-shadow: 0 24px 60px rgba(0,0,0,.5); transform: scale(1.5) rotate(-7deg); transition: transform .4s var(--ease-chill); }\n  .chill-police.show .chill-police__card { transform: scale(1) rotate(-3deg); }\n  .chill-police .cp-emoji { font-size: 2.8rem; line-height: 1; }\n  .chill-police h3 { font-family: var(--display); text-transform: uppercase; font-size: 1.5rem; margin: .35rem 0 .2rem;\n    letter-spacing: .02em; color: #ffe6ad; }\n  .chill-police p { font-family: var(--mono); font-size: .84rem; letter-spacing: .04em; color: #e9cf9f; margin: 0; }\n\n  /* MAXIMUM CHILL mode slows the whole ranch down */\n  body.maxchill * { animation-duration: 3s !important; transition-duration: 1.4s !important; }\n  body.maxchill { filter: saturate(1.15) brightness(1.02); }\n\n  /* Chief Napping Officer easter egg */\n  .cno { position: fixed; right: 1rem; bottom: -80px; z-index: 55; font-size: 2.6rem; cursor: pointer; transition: bottom .7s var(--ease-chill); user-select: none; }\n  .cno.up { bottom: .4rem; }\n  .cno .zzz { position: absolute; top: -10px; right: -6px; font-size: 1rem; animation: floatz 3s ease-in-out infinite; }\n  @keyframes floatz { 0%{ opacity:0; transform: translateY(0);} 50%{opacity:1;} 100%{ opacity:0;\
    \ transform: translateY(-14px);} }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }\n    .reveal { opacity: 1; transform: none; }\n  }\n\n/* ===== cozy-ranch pass: consistent rounded + pillow chrome across the site ===== */\n:root{ --cozy-ease:cubic-bezier(.34,1.56,.64,1); }\n.btn,.cta,.pill,.tag,.dd-toggle{ border-radius:16px !important;\n  transition:transform .12s var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.btn,.cta,.dd-toggle{ box-shadow:0 5px 0 rgba(74,47,28,.28) !important; }\n.btn:active,.cta:active,.dd-toggle:active{ transform:translateY(3px) !important; box-shadow:0 2px 0 rgba(74,47,28,.28) !important; }\n.btn:hover,.cta:hover{ transform:translateY(-2px); }\n.dd-menu{ border-radius:18px !important; overflow:hidden;\n  box-shadow:0 8px 0 rgba(74,47,28,.2), 0 14px 24px rgba(20,12,6,.28) !important; }\n.dd-menu a{ transition:background .12s ease; }\n.badge,.badgecard{ box-shadow:0 3px 0 rgba(74,47,28,.28) !important; }\n.chill-modal__card,.chill-police__card,.ledger-panel,.badgecard{ border-radius:22px !important; }\n.navlinks a{ border-radius:12px !important; }\n</style>\n\n<!-- ========================= TOP BAR ========================= -->\n<header class=\"topbar\">\n  <div class=\"brand\" id=\"brand\" title=\"Give it a few clicks…\">\n    <span class=\"badge\">\U0001F920</span> Chill&nbsp;Farm\n  </div>\n  <nav class=\"navlinks\">\n    <a href=\"#crew\">The Crew</a>\n    <a href=\"#backlog\">The Backlog</a>\n    <a href=\"#values\">How We Chill</a>\n    <a href=\"/careers/\">Careers</a>\n    <div class=\"dropdown\">\n      <button type=\"button\" class=\"dd-toggle\" aria-haspopup=\"true\" aria-expanded=\"false\">Chill Zone ▾</button>\n      <div class=\"dd-menu\">\n        <a href=\"/pasture/\">\U0001F411 The Pasture</a>\n        <a href=\"/ranch/\">\U0001F319 The Ranch</a>\n        <a href=\"/pond/\">\U0001F3A3 The Pond</a>\n        <a href=\"/cross/\">\U0001F6A6 Hoof It!</a>\n        <a href=\"/splash/\">\U0001F4A6 Super Soaker Splash</a>\n      </div>\n    </div>\n    <a href=\"#hire\" class=\"hire-link\">We're Hiring</a>\n    <button class=\"theme-toggle\" id=\"themeBtn\" aria-label=\"Change the time of day\" title=\"Sunrise / Sunset\">\U0001F324️</button>\n  </nav>\n</header>\n\n<!-- ========================= HERO ========================= -->\n<section class=\"hero\" id=\"top\">\n  <div class=\"sky\"></div>\n  <canvas class=\"stars\" id=\"stars\"></canvas>\n  <div class=\"orb\" id=\"orb\" title=\"Howdy, sunshine\">\n    <span class=\"shades\">\U0001F60E</span>\n  </div>\n  <div class=\"hill far\"></div>\n  <div class=\"hill mid\"></div>\n  <div class=\"hill near\"></div>\n  <div class=\"foreprops\">\n    <span class=\"cactus a\">\U0001F335</span>\n    <span class=\"cactus b\">\U0001F335</span>\n  </div>\n\n  <div class=\"signwrap\">\n    <div class=\"ropes\"><span></span><span></span></div>\n    <div class=\"sign\" id=\"sign\" title=\"Go on, give it a push\">\n      <div class=\"kicker\">— Est. Whenever We Felt Like It —</div>\n      <h1>Chill Farm</h1>\n      <div class=\"est\">only-chill.com · a working ranch for professional relaxers</div>\n    </div>\n  </div>\n\n  <div class=\"scrollcue\">scroll gently ↓</div>\n</section>\n\n<main>\n  <!-- ===================== MOTTO ===================== -->\n  <section class=\"motto\" id=\"motto\">\n    <div class=\"rope-edge\"></div>\n    <div class=\"wrap band reveal\">\n      <div class=\"brandmark-iron\">\U0001F525</div>\n      <h2>We're Hiring People to Chill</h2>\n      <p>…because we've got <strong>so much chill in the backlog</strong>.</p>\n    </div>\n    <div class=\"rope-edge\"></div>\n  </section>\n\n  <!-- ===================== MARQUEE ===================== -->\n  <div class=\"marquee\" aria-hidden=\"true\">\n    <div class=\"marquee-track\" id=\"mtrack\">\n      <span>Zero Deadlines</span><span>Unlimited Hammocks</span><span>Siesta-Driven Development</span><span>Nap\
    \ Equity</span><span>Bring Your Own Vibe</span><span>Sunset O'Clock</span>\n    </div>\n  </div>\n\n  <!-- ===================== LIVE FROM THE MEADOW ===================== -->\n  <section class=\"band\" id=\"live\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Live Right Now</span>\n        <h2 class=\"title\">Live from the Meadow</h2>\n        <p class=\"lead\">The Commons never closes. Here's the actual meadow this very second — plus today's official forecast, straight from the ranch.</p>\n      </div>\n      <div class=\"live-grid reveal\">\n        <a class=\"cam\" href=\"/pasture/\" title=\"Enter the meadow\">\n          <canvas id=\"camCanvas\" width=\"640\" height=\"360\"></canvas>\n          <span class=\"cam-tag\">\U0001F534 LIVE · <b id=\"camN\">–</b> grazing</span>\n        </a>\n        <div class=\"forecast\">\n          <div class=\"fc-emoji\">\U0001F52E</div>\n          <h3>Today's Chill Forecast</h3>\n          <p id=\"fcText\">Reading the clouds…</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== THE CREW ===================== -->\n  <section class=\"band\" id=\"crew\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">The Chief Chillers</span>\n        <h2 class=\"title\">Meet the C-Suite of Chill</h2>\n        <p class=\"lead\">Five seasoned professionals, zero urgency. Every one of them a \"Chilling Officer\" — because at Chill Farm the \"C\" was never negotiable.</p>\n      </div>\n\n      <div class=\"team-grid\">\n        <article class=\"badgecard reveal\">\n          <span class=\"pin\">\U0001F4CC</span>\n          <div class=\"avatar\">\U0001F9D1‍\U0001F33E</div>\n          <div class=\"role\">CEO</div>\n          <h3>Aman Patel</h3>\n          <div class=\"title\">Chilling Employee Officer</div>\n          <div class=\"bio\">Founded the farm on a hammock and never got up. Sets the vision, mostly by staring at clouds.</div>\n          <div class=\"chillstat\">Chill Level: ████████░░ 8.9 / 10</div>\n        </article>\n\n        <article class=\"badgecard reveal\">\n          <span class=\"pin\">\U0001F4CC</span>\n          <div class=\"avatar\">\U0001F6E0️</div>\n          <div class=\"role\">CTO</div>\n          <h3>Cody Beeston</h3>\n          <div class=\"title\">Chilling Technology Officer</div>\n          <div class=\"bio\">Automated the entire ranch so nobody has to lift a finger. His deploys ship themselves while he snoozes.</div>\n          <div class=\"chillstat\">Chill Level: █████████░ 9.4 / 10</div>\n        </article>\n\n        <article class=\"badgecard reveal\">\n          <span class=\"pin\">\U0001F4CC</span>\n          <div class=\"avatar\">\U0001F9E2</div>\n          <div class=\"role\">COO</div>\n          <h3>Joseph Taylor</h3>\n          <div class=\"title\">Chilling Operations Officer</div>\n          <div class=\"bio\">Keeps operations running smoothly by keeping them running slowly. A firm believer in \"it'll get done… eventually.\"</div>\n          <div class=\"chillstat\">Chill Level: ████████░░ 8.6 / 10</div>\n        </article>\n\n        <article class=\"badgecard reveal\">\n          <span class=\"pin\">\U0001F4CC</span>\n          <div class=\"avatar\">\U0001F4B0</div>\n          <div class=\"role\">CFO</div>\n          <h3>Elias Torres</h3>\n          <div class=\"title\">Chilling Financial Officer</div>\n          <div class=\"bio\">Balances the books and the vibes. Invests exclusively in lemonade, sunshine, and comfortable furniture.</div>\n          <div class=\"chillstat\">Chill Level: █████████░ 9.1 / 10</div>\n        </article>\n\n        <article class=\"badgecard reveal\">\n          <span class=\"pin\">\U0001F4CC</span>\n          <div class=\"avatar\">\U0001F324️</div>\n          <div class=\"role\">CPO</div>\n          <h3>Francisco Ramos</h3>\n          <div class=\"title\">Chilling People Officer</div>\n          <div class=\"bio\">Our newest hire and resident work-life philosopher. Lives by one motto — <em>\"there is life outside\
    \ work\"</em> — and makes sure everyone clocks out to go live it.</div>\n          <div class=\"chillstat\">Chill Level: █████████░ 9.6 / 10</div>\n        </article>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== BACKLOG LEDGER ===================== -->\n  <section class=\"band ledger\" id=\"backlog\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">The Chill Ledger</span>\n        <h2 class=\"title\">So Much Chill in the Backlog</h2>\n        <p class=\"lead\">Our books are open. This is a live tally of everything the ranch has left to chill through. Frankly, we're behind.</p>\n      </div>\n\n      <div class=\"ledger-panel reveal\">\n        <div class=\"stat-row\">\n          <div class=\"stat\"><div class=\"num\" id=\"c1\" data-target=\"1428506\">0</div><div class=\"lbl\">Units of Chill in Backlog</div></div>\n          <div class=\"stat\"><div class=\"num\" id=\"c2\" data-target=\"0\">0</div><div class=\"lbl\">Deadlines Met (On Purpose)</div></div>\n          <div class=\"stat\"><div class=\"num\" id=\"c3\" data-target=\"97\">0</div><div class=\"lbl\">% Hammock Uptime</div></div>\n          <div class=\"stat\"><div class=\"num\" id=\"c4\" data-target=\"4\">0</div><div class=\"lbl\">Naps Currently In Progress</div></div>\n        </div>\n        <div class=\"chillbar\" title=\"Backlog burn-down (we are not burning it down)\"><i></i></div>\n        <div class=\"backlog-note\">At current pace, the backlog will be cleared by approximately <strong>never</strong>. We consider this job security.</div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== VALUES ===================== -->\n  <section class=\"band\" id=\"values\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">The Ranch Code</span>\n        <h2 class=\"title\">How We Chill</h2>\n        <p class=\"lead\">Four principles branded into every fence post on the property.</p>\n      </div>\n      <div class=\"values-grid\">\n        <div class=\"value reveal\"><div class=\"ic\">\U0001F305</div><h3>Sunset-Driven</h3><p>We work to the rhythm of the light. When the sun clocks out, so do we. No exceptions, no overtime, no email after golden hour.</p></div>\n        <div class=\"value reveal\"><div class=\"ic\">\U0001FA91</div><h3>Comfort First</h3><p>Every chair reclines. Every deadline is a suggestion. If a task can't be done from a hammock, we question whether it needs doing.</p></div>\n        <div class=\"value reveal\"><div class=\"ic\">\U0001F91D</div><h3>Radical Ease</h3><p>We over-communicate the vibes and under-commit the timelines. Honesty about how relaxed we are is our whole culture.</p></div>\n        <div class=\"value reveal\"><div class=\"ic\">\U0001F33E</div><h3>Slow & Steady</h3><p>The backlog isn't a problem to solve — it's a pasture to graze. We chill through it one unhurried afternoon at a time.</p></div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== HIRE ===================== -->\n  <section class=\"band hire\" id=\"hire\">\n    <div class=\"wrap reveal\">\n      <div class=\"poster\">\n        <div class=\"wanted\">✦ Wanted ✦</div>\n        <h2>Professional Chillers</h2>\n        <p>No experience required — in fact, we'd prefer you've never hustled a day in your life. Must supply own sunglasses. Ability to nap under pressure a plus.</p>\n        <p style=\"font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;margin-top:1rem;\">STATUS: <strong style=\"color:var(--terra)\">ALWAYS OPEN</strong> · SALARY: PAID IN SUNSETS</p>\n        <div class=\"cta-row\">\n          <button class=\"btn js-apply\" type=\"button\">Apply to Chill</button>\n          <a class=\"btn ghost\" href=\"/careers/\">See All Open Roles</a>\n        </div>\n      </div>\n    </div>\n  </section>\n</main>\n\n<!-- ===================== FOOTER ===================== -->\n<footer>\n  <div class=\"fbrand\">\U0001F920 Chill Farm</div>\n  <div class=\"crew\">\n    Aman Patel · CEO &nbsp;|&nbsp; Cody Beeston · CTO<br>\n    Joseph\
    \ Taylor · COO &nbsp;|&nbsp; Elias Torres · CFO<br>\n    Francisco Ramos · CPO\n  </div>\n  <div class=\"fine\">\n    <a href=\"/hall/\" style=\"color:#ffe6ad\">\U0001F3C6 Hall of Chill</a> · <a href=\"/news/\" style=\"color:#ffe6ad\">\U0001F4F0 The Daily Chill</a> · <a href=\"/pond/\" style=\"color:#ffe6ad\">\U0001F3A3 The Pond</a><br>\n    only-chill.com — no cattle were rushed in the making of this ranch.<br>\n    © <span id=\"yr\"></span> Chill Farm. All rights relaxed.\n  </div>\n</footer>\n\n<!-- \"you're working too hard\" modal -->\n<div class=\"chill-modal\" id=\"chillModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cmTitle\">\n  <div class=\"chill-modal__card\">\n    <div class=\"cm-emoji\">\U0001F334</div>\n    <h2 id=\"cmTitle\">Chill, lad —<br>you're working too hard</h2>\n    <p>Applications are closed on account of it being a <em>beautiful day</em>. Go find a hammock — we'll notice you eventually.</p>\n    <button class=\"btn\" type=\"button\" data-close style=\"margin-top:1.4rem;\">Okay, I'll relax \U0001F60C</button>\n  </div>\n</div>\n\n<!-- scroll cop -->\n<div class=\"chill-police\" id=\"chillPolice\" aria-hidden=\"true\">\n  <div class=\"chill-police__card\">\n    <div class=\"cp-emoji\" id=\"cpEmoji\">\U0001F422</div>\n    <h3 id=\"cpTitle\">Whoa there, partner</h3>\n    <p id=\"cpMsg\">This is a chill farm — ease off the throttle.</p>\n  </div>\n</div>\n\n<a class=\"presence\" id=\"presence\" href=\"/pasture/\" title=\"Join the herd\"><span class=\"dot\"></span><b id=\"presCount\">0</b>&nbsp;grazing in The Commons →</a>\n\n<div class=\"toast\" id=\"toast\"></div>\n<div class=\"cno\" id=\"cno\" title=\"The Chief Napping Officer\">\U0001F408 <span class=\"zzz\">\U0001F4A4</span></div>\n\n<script>\n(function(){\n  \"use strict\";\n  var reduce = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  var toastEl = document.getElementById(\"toast\"), toastT;\n  function toast(msg){\n    toastEl.textContent = msg; toastEl.classList.add(\"show\");\n    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove(\"show\"); }, 2600);\n  }\n\n  document.getElementById(\"yr\").textContent = new Date().getFullYear();\n\n  /* ---------- time-of-day sky engine: the ranch runs on your real clock ---------- */\n  var root = document.documentElement, tBtn = document.getElementById(\"themeBtn\");\n  var skyEl = document.querySelector(\".sky\"), orbEl = document.getElementById(\"orb\");\n  var canvas = document.getElementById(\"stars\"), ctx = canvas.getContext(\"2d\");\n  var isNight = false, cloudsEl = null;\n\n  var MODES = [\"auto\", \"day\", \"night\"], mode = \"auto\";\n  try { var sm = localStorage.getItem(\"chill-mode\"); if (MODES.indexOf(sm) >= 0) mode = sm; } catch (e) {}\n\n  // sky keyframes across 24h — [topRGB, midRGB, lowRGB]\n  var SKY = [\n    { h:0,    c:[[20,18,48],[36,26,58],[58,37,69]] },\n    { h:6,    c:[[90,74,123],[208,122,122],[240,161,90]] },\n    { h:9,    c:[[125,180,224],[195,226,242],[242,230,190]] },\n    { h:13,   c:[[109,176,232],[174,218,242],[233,241,218]] },\n    { h:17,   c:[[111,168,216],[240,201,122],[244,165,92]] },\n    { h:19,   c:[[106,90,154],[224,132,74],[242,184,74]] },\n    { h:20.5, c:[[43,42,90],[125,74,107],[194,91,84]] },\n    { h:22,   c:[[23,20,54],[40,29,70],[74,44,72]] },\n    { h:24,   c:[[20,18,48],[36,26,58],[58,37,69]] }\n  ];\n  function lerp(a,b,t){ return a+(b-a)*t; }\n  function rgb(a){ return \"rgb(\"+Math.round(a[0])+\",\"+Math.round(a[1])+\",\"+Math.round(a[2])+\")\"; }\n  function skyAt(h){\n    for (var i=0;i<SKY.length-1;i++){\n      if (h>=SKY[i].h && h<=SKY[i+1].h){\n        var t=(h-SKY[i].h)/(SKY[i+1].h-SKY[i].h), o=[];\n        for (var k=0;k<3;k++) o.push([lerp(SKY[i].c[k][0],SKY[i+1].c[k][0],t), lerp(SKY[i].c[k][1],SKY[i+1].c[k][1],t), lerp(SKY[i].c[k][2],SKY[i+1].c[k][2],t)]);\n        return o;\n      }\n    }\n    return SKY[0].c;\n  }\n  function effHour(){\n    if (mode === \"day\") return 13;\n    if (mode === \"night\") return 22.5;\n    var d = new Date(); return d.getHours() + d.getMinutes()/60;\n\
    \  }\n  function applyScene(){\n    var h = effHour(), night = (h < 6 || h >= 19.5);\n    isNight = night;\n    var c = skyAt(h);\n    skyEl.style.background = \"linear-gradient(180deg,\"+rgb(c[0])+\" 0%,\"+rgb(c[1])+\" 62%,\"+rgb(c[2])+\" 100%)\";\n    var t, orbCol, orbGlow;\n    if (!night){ t=(h-6)/(19.5-6); orbCol=\"#ffd257\"; orbGlow=\"#ffe9a8\"; }\n    else { var nh=(h<6)?h+24:h; t=(nh-19.5)/((6+24)-19.5); orbCol=\"#f4ecd0\"; orbGlow=\"#d9d2f0\"; }\n    t = Math.max(0, Math.min(1, t));\n    orbEl.style.left = (8 + t*84) + \"%\";\n    orbEl.style.top  = (60 - Math.sin(t*Math.PI)*44) + \"%\";\n    root.style.setProperty(\"--orb\", orbCol);\n    root.style.setProperty(\"--orb-glow\", orbGlow);\n    root.setAttribute(\"data-theme\", night ? \"dark\" : \"light\");\n    if (cloudsEl) cloudsEl.classList.toggle(\"on\", !night);\n    tBtn.textContent = mode===\"auto\" ? \"\U0001F550\" : (mode===\"day\" ? \"☀️\" : \"\U0001F319\");\n    tBtn.title = \"Time of day: \" + mode + (mode===\"auto\" ? \" — follows your local time\" : \" (locked)\");\n  }\n  tBtn.addEventListener(\"click\", function(){\n    mode = MODES[(MODES.indexOf(mode)+1) % MODES.length];\n    try { localStorage.setItem(\"chill-mode\", mode); } catch (e) {}\n    applyScene();\n    toast(mode===\"auto\" ? \"\U0001F550 Auto — the ranch follows your clock.\" : mode===\"day\" ? \"☀️ Locked to daytime.\" : \"\U0001F319 Locked to night. Extra chill.\");\n  });\n\n  // clouds (daytime) drifting behind the hills\n  cloudsEl = document.createElement(\"div\"); cloudsEl.className = \"clouds\";\n  for (var ci=0; ci<5; ci++){\n    var cl = document.createElement(\"div\"); cl.className = \"cloud\";\n    cl.style.top = (5 + Math.random()*34) + \"%\";\n    cl.style.transform = \"scale(\" + (0.55 + Math.random()*0.95) + \")\";\n    var dur = 62 + Math.random()*74;\n    cl.style.animationDuration = dur + \"s\";\n    cl.style.animationDelay = (-Math.random()*dur) + \"s\";\n    cloudsEl.appendChild(cl);\n  }\n  var heroEl = document.querySelector(\".hero\");\n  heroEl.insertBefore(cloudsEl, heroEl.querySelector(\".hill.far\"));\n\n  // starfield + fireflies (night)\n  var stars = [], flies = [];\n  function seedSky(){\n    var hero = document.getElementById(\"top\");\n    canvas.width = hero.clientWidth; canvas.height = hero.clientHeight;\n    stars = []; for (var i=0;i<90;i++) stars.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height*0.66, r:Math.random()*1.4+0.3, p:Math.random()*6 });\n    flies = []; for (var j=0;j<14;j++) flies.push({ x:Math.random()*canvas.width, y:canvas.height*(0.55+Math.random()*0.4), p:Math.random()*6, sp:0.2+Math.random()*0.5 });\n  }\n  seedSky(); addEventListener(\"resize\", seedSky);\n  function drawSky(t){\n    ctx.clearRect(0,0,canvas.width,canvas.height);\n    if (isNight){\n      for (var i=0;i<stars.length;i++){ var s=stars[i], tw=reduce?0.85:(0.6+0.4*Math.sin(t/700+s.p));\n        ctx.globalAlpha=tw; ctx.fillStyle=\"#fdf5d8\"; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }\n      for (var j=0;j<flies.length;j++){ var f=flies[j];\n        var gx=f.x+Math.sin(t/1000*f.sp+f.p)*30, gy=f.y+Math.cos(t/1300*f.sp+f.p)*18;\n        ctx.globalAlpha=reduce?0.7:(0.35+0.45*(0.5+0.5*Math.sin(t/500+f.p)));\n        ctx.fillStyle=\"#eaff8a\"; ctx.shadowColor=\"#c8ff5a\"; ctx.shadowBlur=10;\n        ctx.beginPath(); ctx.arc(gx,gy,1.7,0,6.28); ctx.fill(); ctx.shadowBlur=0; }\n      ctx.globalAlpha=1;\n    }\n    requestAnimationFrame(drawSky);\n  }\n  requestAnimationFrame(drawSky);\n\n  // shooting-star wishes (night)\n  var FORTUNES = [\"Today's forecast: 100% chill.\",\"A nap is a sound financial decision.\",\"The backlog can wait. It always could.\",\"Go outside — the ranch misses you.\",\"You're exactly on schedule. There is no schedule.\",\"Sip water, then sip lemonade.\",\"Deadlines are just suggestions in formal wear.\",\"Do less, but enjoy it more.\",\"The most productive thing you'll do today is rest.\"];\n  var starHintShown = false;\n  function launchStar(){\n    var hero = document.getElementById(\"top\"), Wp = hero.clientWidth,\
    \ Hp = hero.clientHeight;\n    var el = document.createElement(\"div\"); el.className = \"shooting-star\";\n    var x0 = Wp*(0.08+Math.random()*0.5), y0 = Hp*(0.04+Math.random()*0.2);\n    var x1 = x0 + Wp*(0.25+Math.random()*0.25), y1 = y0 + Hp*(0.32+Math.random()*0.26);\n    var ang = Math.atan2(y1-y0, x1-x0) * 180/Math.PI, caught = false;\n    el.style.transform = \"translate(\"+x0+\"px,\"+y0+\"px) rotate(\"+ang+\"deg)\";\n    hero.appendChild(el);\n    el.addEventListener(\"pointerdown\", function(e){ e.stopPropagation(); if (caught) return; caught = true; wishGranted(x0,y0); el.remove(); });\n    if (!starHintShown){ starHintShown = true; toast(\"\U0001F320 psst… catch a shooting star to make a wish\"); }\n    var t0 = null, dur = 2600;\n    (function step(ts){ if (!t0) t0 = ts; var p = Math.min((ts-t0)/dur, 1);\n      el.style.transform = \"translate(\"+(x0+(x1-x0)*p)+\"px,\"+(y0+(y1-y0)*p)+\"px) rotate(\"+ang+\"deg)\";\n      el.style.opacity = p<0.1 ? p/0.1 : (p>0.8 ? 1-(p-0.8)/0.2 : 1);\n      if (p<1 && !caught) requestAnimationFrame(step); else if (!caught) el.remove();\n    })(performance.now());\n  }\n  function wishGranted(x,y){\n    toast(\"\U0001F320 \" + FORTUNES[(Math.random()*FORTUNES.length)|0]);\n    var hero = document.getElementById(\"top\");\n    for (var i=0;i<8;i++){ (function(){ var s=document.createElement(\"div\"); s.className=\"sparkle\"; s.textContent=\"✦\";\n      s.style.left=x+\"px\"; s.style.top=y+\"px\"; hero.appendChild(s);\n      var a=Math.random()*6.28, r=20+Math.random()*44;\n      requestAnimationFrame(function(){ s.style.transform=\"translate(\"+Math.cos(a)*r+\"px,\"+Math.sin(a)*r+\"px) scale(0)\"; s.style.opacity=\"0\"; });\n      setTimeout(function(){ s.remove(); }, 900);\n    })(); }\n  }\n  (function scheduleStar(){\n    setTimeout(function(){ if (isNight && !document.hidden && !reduce) launchStar(); scheduleStar(); }, 20000 + Math.random()*22000);\n  })();\n\n  // live presence — how many sheep are grazing in The Commons right now\n  var presEl = document.getElementById(\"presence\"), presCount = document.getElementById(\"presCount\");\n  function pollPresence(){\n    fetch(\"/ws/stats\", { cache:\"no-store\" }).then(function(r){ return r.json(); }).then(function(d){\n      if (d && d.sheep > 0){ presCount.textContent = d.sheep; presEl.classList.add(\"show\"); }\n      else presEl.classList.remove(\"show\");\n    }).catch(function(){});\n  }\n  pollPresence(); setInterval(pollPresence, 5000);\n\n  applyScene();\n  setInterval(applyScene, 60000);\n\n  /* ---------- scroll reveals ---------- */\n  var io = new IntersectionObserver(function(entries){\n    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add(\"in\"); io.unobserve(e.target); } });\n  }, { threshold: .12 });\n  document.querySelectorAll(\".reveal\").forEach(function(el){ io.observe(el); });\n\n  /* duplicate marquee content for seamless loop */\n  var mt = document.getElementById(\"mtrack\");\n  if (mt) mt.innerHTML += mt.innerHTML;\n\n  /* ---------- animated counters (fire when ledger visible) ---------- */\n  var counted = false;\n  function runCounters(){\n    if (counted) return; counted = true;\n    document.querySelectorAll(\".num\").forEach(function(el){\n      var target = +el.getAttribute(\"data-target\"), start = null, dur = 2200;\n      function step(ts){\n        if(!start) start = ts;\n        var p = Math.min((ts-start)/dur, 1), eased = 1-Math.pow(1-p,3);\n        el.textContent = Math.floor(eased*target).toLocaleString();\n        if(p<1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();\n      }\n      if (reduce) el.textContent = target.toLocaleString(); else requestAnimationFrame(step);\n    });\n  }\n  var lio = new IntersectionObserver(function(entries){\n    entries.forEach(function(e){ if(e.isIntersecting) runCounters(); });\n  }, { threshold: .4 });\n  var ledgerEl = document.querySelector(\".ledger-panel\"); if (ledgerEl) lio.observe(ledgerEl);\n\n  /* ---------- tumbleweeds roll by, slowly ---------- */\n  function tumble(){\n    if (reduce\
    \ || document.hidden) return;\n    var t = document.createElement(\"div\");\n    t.className = \"tumble\"; t.textContent = \"\U0001F33E\";\n    t.style.bottom = (2 + Math.random()*10) + \"vh\";\n    t.style.fontSize = (1.4 + Math.random()*1.6) + \"rem\";\n    var dur = 14 + Math.random()*10;\n    t.style.animationDuration = dur + \"s\";\n    document.body.appendChild(t);\n    setTimeout(function(){ t.remove(); }, dur*1000 + 200);\n  }\n  setTimeout(tumble, 2500);\n  setInterval(function(){ if(Math.random()>.3) tumble(); }, 9000);\n\n  /* ---------- EASTER EGGS ---------- */\n\n  /* 1. the sun/moon puts on shades after a few clicks */\n  var orb = document.getElementById(\"orb\"), orbClicks = 0;\n  orb.addEventListener(\"click\", function(){\n    orbClicks++;\n    if (orbClicks === 5){ orb.classList.add(\"cool\"); toast(\"\U0001F60E The sun agrees. Stay cool.\"); }\n    else if (orbClicks > 5){ tumble(); }\n    else { toast([\"Howdy ☀️\",\"Nice and warm.\",\"Keep it comin'…\",\"One more…\"][orbClicks-1] || \"☀️\"); }\n  });\n\n  /* 2. push the sign and it swings */\n  var sign = document.getElementById(\"sign\");\n  sign.addEventListener(\"click\", function(){\n    sign.classList.remove(\"swing\"); void sign.offsetWidth; sign.classList.add(\"swing\");\n  });\n\n  /* 3. click the brand 5x -> Chief Napping Officer appears */\n  var brand = document.getElementById(\"brand\"), bClicks = 0, cno = document.getElementById(\"cno\"), bT;\n  brand.addEventListener(\"click\", function(){\n    bClicks++; clearTimeout(bT); bT = setTimeout(function(){ bClicks = 0; }, 1200);\n    if (bClicks >= 5){ cno.classList.add(\"up\"); toast(\"\U0001F408 The Chief Napping Officer has awoken. Briefly.\"); bClicks = 0; }\n  });\n  cno.addEventListener(\"click\", function(){ toast(\"\U0001F4A4 CNO says: back to nap. Company policy.\"); setTimeout(function(){ cno.classList.remove(\"up\"); }, 1800); });\n\n  /* 4. type \"chill\" anywhere */\n  var buf = \"\";\n  addEventListener(\"keydown\", function(e){\n    if (e.key && e.key.length === 1) buf = (buf + e.key.toLowerCase()).slice(-14);\n\n    if (buf.indexOf(\"chill\") > -1){ buf = \"\"; for (var i=0;i<6;i++) setTimeout(tumble, i*160); toast(\"\U0001F33E Maximum tumbleweeds. Very chill of you.\"); }\n\n    /* 5. Konami code -> MAXIMUM CHILL mode */\n    konami(e.key);\n  });\n\n  var kseq = [\"ArrowUp\",\"ArrowUp\",\"ArrowDown\",\"ArrowDown\",\"ArrowLeft\",\"ArrowRight\",\"ArrowLeft\",\"ArrowRight\",\"b\",\"a\"], kpos = 0;\n  function konami(key){\n    if (!key) return;\n    key = (key.length === 1) ? key.toLowerCase() : key;\n    if (key === kseq[kpos]){ kpos++; if (kpos === kseq.length){ kpos = 0; maxChill(); } }\n    else { kpos = (key === kseq[0]) ? 1 : 0; }\n  }\n  var maxOn = false;\n  function maxChill(){\n    maxOn = !maxOn;\n    document.body.classList.toggle(\"maxchill\", maxOn);\n    toast(maxOn ? \"\U0001F9D8 MAXIMUM CHILL ENGAGED. Everything… slow… down…\" : \"⏱️ Back to regular chill.\");\n    if (maxOn && !reduce){ for (var i=0;i<10;i++) setTimeout(tumble, i*220); }\n  }\n\n  /* ---------- \"working too hard\" apply modal ---------- */\n  var modal = document.getElementById(\"chillModal\");\n  function openModal(){ modal.classList.add(\"open\"); var b = modal.querySelector(\"[data-close]\"); if(b) b.focus(); }\n  function closeModal(){ modal.classList.remove(\"open\"); }\n  document.querySelectorAll(\".js-apply\").forEach(function(el){\n    el.addEventListener(\"click\", function(e){ e.preventDefault(); openModal(); });\n  });\n  modal.addEventListener(\"click\", function(e){ if (e.target === modal || e.target.hasAttribute(\"data-close\")) closeModal(); });\n  addEventListener(\"keydown\", function(e){ if (e.key === \"Escape\" && modal.classList.contains(\"open\")) closeModal(); });\n\n  /* ---------- scroll cop: catches fast scrollers being un-chill ---------- */\n  var CP = document.getElementById(\"chillPolice\"),\n      cpEmoji = document.getElementById(\"cpEmoji\"),\n      cpTitle = document.getElementById(\"cpTitle\"),\n      cpMsg = document.getElementById(\"cpMsg\");\n  var CP_MSGS\
    \ = [\n    { e:\"\U0001F422\", t:\"Whoa there, partner\", m:\"This is a chill farm — ease off the throttle.\" },\n    { e:\"\U0001F60E\", t:\"Too much hustle\", m:\"You're scrolling like it's a Monday. Breathe.\" },\n    { e:\"\U0001F335\", t:\"Easy, cowboy\", m:\"The backlog isn't going anywhere. Neither should you.\" },\n    { e:\"\U0001F9D8\", t:\"Please relax\", m:\"Detected: excessive productivity energy. Slow it down.\" },\n    { e:\"\U0001F379\", t:\"Sip, don't gulp\", m:\"Enjoy the ranch at ranch speed.\" }\n  ];\n  var cpCount = 0, cpCool = false, cpHideT, cpSamples = [];\n  function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }\n  function cpFire(){\n    if (cpCool) return;\n    var m = (cpCount >= CP_MSGS.length + 2)\n      ? { e:\"\U0001F624\", t:\"Okay, showoff\", m:\"You're speed-running our whole vibe on purpose now.\" }\n      : CP_MSGS[cpCount % CP_MSGS.length];\n    cpCount++;\n    cpEmoji.textContent = m.e; cpTitle.textContent = m.t; cpMsg.textContent = m.m;\n    CP.classList.add(\"show\");\n    clearTimeout(cpHideT); cpHideT = setTimeout(function(){ CP.classList.remove(\"show\"); }, 2200);\n    cpCool = true; setTimeout(function(){ cpCool = false; }, 9000);\n  }\n  addEventListener(\"scroll\", function(){\n    var t = now(), y = window.scrollY || document.documentElement.scrollTop || 0;\n    cpSamples.push([t, y]);\n    while (cpSamples.length > 1 && t - cpSamples[0][0] > 450) cpSamples.shift();\n    if (cpSamples.length > 1){\n      var span = t - cpSamples[0][0], dist = Math.abs(y - cpSamples[0][1]);\n      if (span > 0 && dist > 500 && dist / span > 2.3) cpFire();   // ~2300+ px/sec = too eager\n    }\n  }, { passive: true });\n\n  /* 6. console note for the curious */\n  try {\n    console.log(\"%c\U0001F920 Welcome to Chill Farm\",\"font:700 22px Rockwell,serif;color:#c15a34;\");\n    console.log(\"%cWe're hiring people to chill — we've got so much chill in the backlog.\\nTry the Konami code. Try typing 'chill'. Click the sun five times.\\nhowdy@only-chill.com\",\"font:13px monospace;color:#7a4a26;\");\n  } catch(_){}\n})();\n</script>\n\n<script>\n/* PWA + today's forecast + the live meadow-cam (read-only spectator) */\n(function(){\n  if (\"serviceWorker\" in navigator) navigator.serviceWorker.register(\"/sw.js\").catch(function(){});\n\n  // Chill Zone dropdown (click/tap toggle; hover works via CSS)\n  document.querySelectorAll(\".dropdown\").forEach(function(dd){\n    var btn = dd.querySelector(\".dd-toggle\");\n    btn.addEventListener(\"click\", function(e){ e.stopPropagation(); var open = dd.classList.toggle(\"open\"); btn.setAttribute(\"aria-expanded\", open ? \"true\" : \"false\"); });\n  });\n  document.addEventListener(\"click\", function(){ document.querySelectorAll(\".dropdown.open\").forEach(function(dd){ dd.classList.remove(\"open\"); dd.querySelector(\".dd-toggle\").setAttribute(\"aria-expanded\", \"false\"); }); });\n  document.addEventListener(\"keydown\", function(e){ if (e.key === \"Escape\") document.querySelectorAll(\".dropdown.open\").forEach(function(dd){ dd.classList.remove(\"open\"); }); });\n\n  var fcEl = document.getElementById(\"fcText\");\n  function loadForecast(){ fetch(\"/ws/forecast\", { cache:\"no-store\" }).then(function(r){ return r.json(); }).then(function(d){ if (d && d.text) fcEl.textContent = d.text; }).catch(function(){}); }\n  loadForecast(); setInterval(loadForecast, 600000);\n\n\n  var cv = document.getElementById(\"camCanvas\"), ctx = cv.getContext(\"2d\");\n  var camSheep = [], camMt = 13, camWS = null, camRetry = 0;\n  var camNEl = document.getElementById(\"camN\");\n  var reduce = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  var W = 1600, H = 900;\n  function camConnect(){\n    var proto = location.protocol === \"https:\" ? \"wss\" : \"ws\";\n    try { camWS = new WebSocket(proto + \"://\" + location.host + \"/ws\"); } catch(e){ return camRetryFn(); }\n    camWS.onopen = function(){ camRetry = 0; camWS.send(JSON.stringify({ t:\"spectate\" })); };\n    camWS.onclose = function(){ camRetryFn();\
    \ };\n    camWS.onerror = function(){ try{ camWS.close(); }catch(e){} };\n    camWS.onmessage = function(ev){ var m; try { m = JSON.parse(ev.data); } catch(e){ return; }\n      if (m.t === \"s\"){ camSheep = m.sheep; if (typeof m.mt === \"number\") camMt = m.mt; camNEl.textContent = m.n; } };\n  }\n  function camRetryFn(){ camRetry = Math.min(camRetry + 1, 6); setTimeout(camConnect, 1000 * camRetry); }\n  camConnect();\n  function camNight(){ var h = camMt; if (h>=7&&h<18) return 0; if (h>=18&&h<20) return (h-18)/2; if (h>=5&&h<7) return (7-h)/2; return 1; }\n  function camRender(){\n    var cw = cv.width, chh = cv.height, s = Math.max(cw/W, chh/H), ox = (cw-W*s)/2, oy = (chh-H*s)/2, t = performance.now();\n    function X(x){ return ox + x*s; } function Y(y){ return oy + y*s; }\n    ctx.clearRect(0,0,cw,chh);\n    var gr = ctx.createLinearGradient(0,0,0,chh); gr.addColorStop(0,\"#5a7a3c\"); gr.addColorStop(1,\"#3f5a2c\");\n    ctx.fillStyle = gr; ctx.fillRect(0,0,cw,chh);\n    var cx = X(W*0.5), cy = Y(H*0.6), nf = camNight();\n    var g = ctx.createRadialGradient(cx,cy,0,cx,cy,s*80*(0.6+nf*0.7));\n    g.addColorStop(0,\"rgba(255,150,50,\"+(0.2+nf*0.35)+\")\"); g.addColorStop(1,\"rgba(255,150,50,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,s*80,0,6.28); ctx.fill();\n    var fl = reduce ? 1 : (0.8 + 0.2*Math.sin(t/90));\n    ctx.fillStyle = \"#ffb347\"; ctx.beginPath(); ctx.ellipse(cx,cy,s*6,s*10*fl,0,0,6.28); ctx.fill();\n    var arr = camSheep.slice().sort(function(a,b){ return a[2]-b[2]; });\n    for (var i=0;i<arr.length;i++){ var sp = arr[i], x = X(sp[1]), y = Y(sp[2]);\n      ctx.fillStyle = \"rgba(20,35,15,.25)\"; ctx.beginPath(); ctx.ellipse(x,y+s*6,s*15,s*5,0,0,6.28); ctx.fill();\n      ctx.fillStyle = sp[4]>0 ? \"#fff0c0\" : \"#f3efe4\"; ctx.beginPath(); ctx.ellipse(x,y,s*15,s*11,0,0,6.28); ctx.fill();\n      ctx.fillStyle = \"#42352a\"; ctx.beginPath(); ctx.arc(x-s*13,y-s*3,s*6,0,6.28); ctx.fill();\n      if (sp[4]>0){ ctx.fillStyle = \"#ffd86b\"; ctx.beginPath(); ctx.arc(x,y-s*16,s*4,0,6.28); ctx.fill(); }\n    }\n    if (nf>0){ ctx.fillStyle = \"rgba(18,22,60,\"+(nf*0.5)+\")\"; ctx.fillRect(0,0,cw,chh); }\n    requestAnimationFrame(camRender);\n  }\n  requestAnimationFrame(camRender);\n})();\n</script>\n"
  careers.html: "<meta charset=\"utf-8\" />\n<title>Careers — Chill Farm</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<meta name=\"description\" content=\"Open roles at Chill Farm. We're hiring professional relaxers — no experience hustling required. Salary paid in sunsets.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#4a2f1c\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"Careers — Chill Farm\" />\n<meta property=\"og:description\" content=\"Now hiring professional relaxers. No experience hustling required. Salary paid in sunsets.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/careers/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<script>if(\"serviceWorker\" in navigator)addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/sw.js\").catch(function(){});});</script>\n<style>\n  :root {\n    --sky-top:#8ec5e8; --sky-mid:#f5c877; --sky-low:#f2a65a; --orb:#ffd257; --orb-glow:#ffe9a8;\n    --hill-far:#c9b46e; --hill-mid:#8a9a55; --hill-near:#5f6f42;\n    --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#4a2f1c; --denim:#3f6386; --terra:#c15a34;\n    --parch:#f4ead0; --parch-2:#ece0c2; --ink:#33261a; --ink-soft:#5c4a38; --card:#fbf4e2; --line:#d8c6a0;\n    --page-bg:#f4ead0; --shadow:rgba(74,47,28,.20);\n    --display:\"Rockwell\",\"Rockwell Nova\",\"Roboto Slab\",\"Courier New\",Georgia,serif;\n    --body:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n    --mono:\"Courier New\",ui-monospace,monospace;\n    --ease-chill:cubic-bezier(.22,.61,.36,1);\n  }\n  @media (prefers-color-scheme: dark){ :root{\n    --sky-top:#1a1633; --sky-mid:#4a2d55; --sky-low:#b5533f; --orb: