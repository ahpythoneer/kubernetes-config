    <div class="toast" id="toast"></div>
    <div class="cno" id="cno" title="The Chief Napping Officer">🐈 <span class="zzz">💤</span></div>

    <script>
    (function(){
      "use strict";
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var toastEl = document.getElementById("toast"), toastT;
      function toast(msg){
        toastEl.textContent = msg; toastEl.classList.add("show");
        clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
      }

      document.getElementById("yr").textContent = new Date().getFullYear();

      /* ---------- theme toggle: change the time of day ---------- */
      var root = document.documentElement, tBtn = document.getElementById("themeBtn");
      function isDark(){
        var t = root.getAttribute("data-theme");
        if (t) return t === "dark";
        return matchMedia("(prefers-color-scheme: dark)").matches;
      }
      function syncIcon(){ tBtn.textContent = isDark() ? "🌙" : "🌤️"; }
      tBtn.addEventListener("click", function(){
        var next = isDark() ? "light" : "dark";
        root.setAttribute("data-theme", next);
        syncIcon(); startStars();
        toast(next === "dark" ? "🌙 Sun's down. Extra chill unlocked." : "🌤️ Mornin'. Back to the good chill.");
      });
      syncIcon();

      /* ---------- starfield (night only) ---------- */
      var canvas = document.getElementById("stars"), ctx = canvas.getContext("2d"), starTimer;
      function startStars(){
        if (!isDark()) { ctx && ctx.clearRect(0,0,canvas.width,canvas.height); return; }
        var hero = document.getElementById("top");
        canvas.width = hero.clientWidth; canvas.height = hero.clientHeight;
        var stars = [];
        for (var i=0;i<90;i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height*0.7, r: Math.random()*1.4+0.3, p: Math.random()*6 });
        var t0 = 0;
        function draw(t){
          if (!isDark()) return;
          ctx.clearRect(0,0,canvas.width,canvas.height);
          for (var i=0;i<stars.length;i++){
            var s = stars[i], tw = reduce ? 0.85 : (0.6 + 0.4*Math.sin(t/700 + s.p));
            ctx.globalAlpha = tw; ctx.fillStyle = "#fdf5d8";
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (!reduce) starTimer = requestAnimationFrame(draw);
        }
        cancelAnimationFrame(starTimer);
        draw(0);
      }
      addEventListener("resize", startStars);
      startStars();

      /* ---------- scroll reveals ---------- */
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: .12 });
      document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

      /* duplicate marquee content for seamless loop */
      var mt = document.getElementById("mtrack");
      if (mt) mt.innerHTML += mt.innerHTML;

      /* ---------- animated counters (fire when ledger visible) ---------- */
      var counted = false;
      function runCounters(){
        if (counted) return; counted = true;
        document.querySelectorAll(".num").forEach(function(el){
          var target = +el.getAttribute("data-target"), start = null, dur = 2200;
          function step(ts){
            if(!start) start = ts;
            var p = Math.min((ts-start)/dur, 1), eased = 1-Math.pow(1-p,3);
            el.textContent = Math.floor(eased*target).toLocaleString();
            if(p<1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();
          }
          if (reduce) el.textContent = target.toLocaleString(); else requestAnimationFrame(step);
        });
      }
      var lio = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting) runCounters(); });
      }, { threshold: .4 });
      var ledgerEl = document.querySelector(".ledger-panel"); if (ledgerEl) lio.observe(ledgerEl);

      /* ---------- tumbleweeds roll by, slowly ---------- */
      function tumble(){
        if (reduce || document.hidden) return;
        var t = document.createElement("div");
        t.className = "tumble"; t.textContent = "🌾";
        t.style.bottom = (2 + Math.random()*10) + "vh";
        t.style.fontSize = (1.4 + Math.random()*1.6) + "rem";
        var dur = 14 + Math.random()*10;
        t.style.animationDuration = dur + "s";
        document.body.appendChild(t);
        setTimeout(function(){ t.remove(); }, dur*1000 + 200);
      }
      setTimeout(tumble, 2500);
      setInterval(function(){ if(Math.random()>.3) tumble(); }, 9000);

      /* ---------- EASTER EGGS ---------- */

      /* 1. the sun/moon puts on shades after a few clicks */
      var orb = document.getElementById("orb"), orbClicks = 0;
      orb.addEventListener("click", function(){
        orbClicks++;
        if (orbClicks === 5){ orb.classList.add("cool"); toast("😎 The sun agrees. Stay cool."); }
        else if (orbClicks > 5){ tumble(); }
        else { toast(["Howdy ☀️","Nice and warm.","Keep it comin'…","One more…"][orbClicks-1] || "☀️"); }
      });

      /* 2. push the sign and it swings */
      var sign = document.getElementById("sign");
      sign.addEventListener("click", function(){
        sign.classList.remove("swing"); void sign.offsetWidth; sign.classList.add("swing");
      });

      /* 3. click the brand 5x -> Chief Napping Officer appears */
      var brand = document.getElementById("brand"), bClicks = 0, cno = document.getElementById("cno"), bT;
      brand.addEventListener("click", function(){
        bClicks++; clearTimeout(bT); bT = setTimeout(function(){ bClicks = 0; }, 1200);
        if (bClicks >= 5){ cno.classList.add("up"); toast("🐈 The Chief Napping Officer has awoken. Briefly."); bClicks = 0; }
      });
      cno.addEventListener("click", function(){ toast("💤 CNO says: back to nap. Company policy."); setTimeout(function(){ cno.classList.remove("up"); }, 1800); });

      /* 4. type "chill" anywhere */
      var buf = "";
      addEventListener("keydown", function(e){
        if (e.key && e.key.length === 1) buf = (buf + e.key.toLowerCase()).slice(-14);

        if (buf.indexOf("chill") > -1){ buf = ""; for (var i=0;i<6;i++) setTimeout(tumble, i*160); toast("🌾 Maximum tumbleweeds. Very chill of you."); }

        /* 5. Konami code -> MAXIMUM CHILL mode */
        konami(e.key);
      });

      var kseq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"], kpos = 0;
      function konami(key){
        if (!key) return;
        key = (key.length === 1) ? key.toLowerCase() : key;
        if (key === kseq[kpos]){ kpos++; if (kpos === kseq.length){ kpos = 0; maxChill(); } }
        else { kpos = (key === kseq[0]) ? 1 : 0; }
      }
      var maxOn = false;
      function maxChill(){
        maxOn = !maxOn;
        document.body.classList.toggle("maxchill", maxOn);
        toast(maxOn ? "🧘 MAXIMUM CHILL ENGAGED. Everything… slow… down…" : "⏱️ Back to regular chill.");
        if (maxOn && !reduce){ for (var i=0;i<10;i++) setTimeout(tumble, i*220); }
      }

      /* 6. console note for the curious */
      try {
        console.log("%c🤠 Welcome to Chill Farm","font:700 22px Rockwell,serif;color:#c15a34;");
        console.log("%cWe're hiring people to chill — we've got so much chill in the backlog.\nTry the Konami code. Try typing 'chill'. Click the sun five times.\nhowdy@only-chill.com","font:13px monospace;color:#7a4a26;");
      } catch(_){}
    })();
    </script>
