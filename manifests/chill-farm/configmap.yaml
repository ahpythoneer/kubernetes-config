var(--mono);text-align:center;padding:1.5rem;transition:opacity .5s;}\n  .conn.hide{opacity:0;pointer-events:none;}\n  .conn .big{font-family:var(--display);font-size:1.6rem;margin-bottom:.4rem;}\n</style>\n\n<canvas id=\"c\"></canvas>\n\n<header class=\"top\">\n  <a class=\"brand\" href=\"/\"><span class=\"badge\">\U0001F411</span> Hoof It!</a>\n  <nav>\n    <a href=\"/pasture/\">Pasture</a>\n    <span class=\"pill\">\U0001F411 <b id=\"count\">–</b></span>\n  </nav>\n</header>\n\n<div class=\"score\"><div class=\"big\" id=\"scoreNum\">0</div><div class=\"lbl\">crossings · best <span id=\"bestNum\">0</span></div></div>\n<div class=\"lead\" id=\"lead\"><h4>\U0001F3C6 Top Crossers</h4><div id=\"leadrows\"></div></div>\n<div class=\"warn\" id=\"warn\">\U0001F682 The Train is coming!</div>\n<div class=\"board-hint\" id=\"hint\">hop with the arrows, WASD, swipe, or the buttons · reach the far meadow · mind the Train</div>\n\n<div class=\"chatdock\" id=\"chatdock\">\n  <input id=\"chatIn\" maxlength=\"160\" placeholder=\"say something…\" autocomplete=\"off\" enterkeyhint=\"send\" />\n  <button type=\"button\" id=\"chatSend\" aria-label=\"send\">➤</button>\n</div>\n\n<div class=\"dpad\">\n  <button class=\"up\" data-d=\"up\" aria-label=\"up\">▲</button>\n  <button class=\"left\" data-d=\"left\" aria-label=\"left\">◀</button>\n  <button class=\"down\" data-d=\"down\" aria-label=\"down\">▼</button>\n  <button class=\"right\" data-d=\"right\" aria-label=\"right\">▶</button>\n</div>\n\n<div class=\"conn\" id=\"conn\"><div><div class=\"big\">\U0001F411 finding the road…</div><div id=\"connMsg\">warming up your hooves</div></div></div>\n\n<script>\n(function(){\n  \"use strict\";\n  var reduce = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  var cv = document.getElementById(\"c\"), ctx = cv.getContext(\"2d\");\n  var COLS=13, ROWS=15, LANES=[], TRAIN_ROW=6, TRAIN_LEN=4;\n  var myId=null, players={}, roster={}, off=[], train={s:\"idle\",x:0,d:1};\n  var pops=[], shake=0, myScore=0, myBest=0;\n  var connEl=document.getElementById(\"conn\"), connMsg=document.getElementById(\"\
    connMsg\");\n\n  var view={s:1,ox:0,oy:0,dpr:1,cell:40};\n  function resize(){\n    var dpr=Math.min(window.devicePixelRatio||1,2); view.dpr=dpr;\n    cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);\n    var cell=Math.min((cv.width*0.98)/COLS, (cv.height-190*dpr)/ROWS);\n    view.cell=cell; view.ox=(cv.width-COLS*cell)/2; view.oy=(cv.height-ROWS*cell)/2 - 8*dpr;\n  }\n  addEventListener(\"resize\", resize); resize();\n  function cx(col){ return view.ox + col*view.cell; }             // left of cell col\n  function cy(row){ return view.oy + (ROWS-1-row)*view.cell; }    // top of cell row (row 0 at bottom)\n\n  // ---------- websocket ----------\n  var ws, retry=0, replaced=false;\n  var token; try{ token=localStorage.getItem(\"chillId\"); if(!token){ token=\"x\"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(\"chillId\",token);} }catch(e){ token=\"x\"+Math.random().toString(36).slice(2); }\n  var myName=null; try{ myName=localStorage.getItem(\"chill-name\")||null; }catch(e){}\n  function connect(){\n    if(replaced) return;\n    var proto=location.protocol===\"https:\"?\"wss\":\"ws\";\n    try{ ws=new WebSocket(proto+\"://\"+location.host+\"/cw\"); }catch(e){ return retryFn(); }\n    ws.onopen=function(){ retry=0; connEl.classList.add(\"hide\"); ws.send(JSON.stringify({t:\"hello\",token:token,name:myName||undefined})); };\n    ws.onclose=function(ev){ if(ev&&ev.code===4001){ replaced=true; connEl.classList.remove(\"hide\"); connEl.querySelector(\".big\").textContent=\"\U0001F411 Already hoofin'\"; connMsg.textContent=\"You're playing in another tab. Refresh here to take over.\"; return; }\n      connEl.classList.remove(\"hide\"); connMsg.textContent=\"reconnecting…\"; retryFn(); };\n    ws.onerror=function(){ try{ws.close();}catch(e){} };\n    ws.onmessage=function(ev){ onMsg(ev.data); };\n  }\n  function retryFn(){ if(replaced)return; retry=Math.min(retry+1,6); setTimeout(connect,600*retry); }\n  function onMsg(data){\n    var m; try{ m=JSON.parse(data); }catch(e){ return; }\n    if(m.t===\"welcome\"){ myId=m.id; COLS=m.cols; ROWS=m.rows; LANES=m.lanes; TRAIN_ROW=m.trainRow; resize(); }\n    else if(m.t===\"r\"){ roster={}; var top=[]; for(var i=0;i<m.players.length;i++){ var p=m.players[i]; roster[p.id]={name:p.name,hue:p.hue,score:p.score,best:p.best}; top.push(p); if(p.id===myId){ myScore=p.score; myBest=p.best; } }\n      document.getElementById(\"count\").textContent=m.n; document.getElementById(\"scoreNum\").textContent=myScore; document.getElementById(\"bestNum\").textContent=myBest;\n      top.sort(function(a,b){return b.best-a.best;}); renderLead(top.slice(0,5)); }\n    else if(m.t===\"st\"){ off=m.off; train=m.train;\n      var seen={};\n      for(var j=0;j<m.players.length;j++){ var a=m.players[j],id=a[0]; seen[id]=1; var g=players[id]; if(!g){ g=players[id]={rx:a[1],ry:a[2]}; } g.col=a[1]; g.row=a[2]; }\n      for(var id2 in players) if(!seen[id2]) delete players[id2];\n    }\n    else if(m.t===\"bonk\"){ var pb=players[m.id]; if(pb) pops.push({x:pb.rx,y:pb.ry,t:performance.now(),kind:m.train?\"train\":\"bonk\"}); if(m.id===myId){ shake=m.train?14:8; showBoardMsg(m.train?\"\U0001F682 Flattened by the grind!\":\"\U0001F635 Spooked! Back you go.\"); } }\n    else if(m.t===\"cross\"){ var pc=players[m.id]; if(pc) pops.push({x:pc.rx,y:pc.ry,t:performance.now(),kind:\"cross\"}); if(m.id===myId){ showBoardMsg(\"\U0001F389 You made it across!\"); } }\n    else if(m.t===\"chat\"){ var cg=players[m.m.id]; if(cg) chatBubbles[m.m.id]={text:m.m.text,t:performance.now()}; }\n  }\n  connect();\n\n  function renderLead(top){ var el=document.getElementById(\"leadrows\"); el.innerHTML=\"\"; if(!top.length){ el.textContent=\"be the first!\"; return; }\n    top.forEach(function(p,i){ var d=document.createElement(\"div\"); d.className=\"row\"; var b=document.createElement(\"b\"); b.textContent=(i+1)+\". \"+p.name; d.appendChild(b); d.appendChild(document.createTextNode(\" — \"+p.best)); el.appendChild(d); }); }\n\n  var hintEl=document.getElementById(\"hint\"); setTimeout(function(){\
    \ hintEl.classList.add(\"fade\"); },9000);\n  var bmT; function showBoardMsg(txt){ hintEl.textContent=txt; hintEl.classList.remove(\"fade\"); clearTimeout(bmT); bmT=setTimeout(function(){ hintEl.classList.add(\"fade\"); },2200); }\n\n  // ---------- input ----------\n  var lastHop=0;\n  function hop(d){ var n=performance.now(); if(n-lastHop<110) return; lastHop=n; if(ws&&ws.readyState===1) ws.send(JSON.stringify({t:\"hop\",d:d})); hintEl.classList.add(\"fade\"); }\n  addEventListener(\"keydown\",function(e){ var k=e.key;\n    if(k===\"ArrowUp\"||k===\"w\"||k===\"W\"){ e.preventDefault(); hop(\"up\"); }\n    else if(k===\"ArrowDown\"||k===\"s\"||k===\"S\"){ e.preventDefault(); hop(\"down\"); }\n    else if(k===\"ArrowLeft\"||k===\"a\"||k===\"A\"){ e.preventDefault(); hop(\"left\"); }\n    else if(k===\"ArrowRight\"||k===\"d\"||k===\"D\"){ e.preventDefault(); hop(\"right\"); }\n  });\n  Array.prototype.forEach.call(document.querySelectorAll(\".dpad button\"),function(b){\n    b.addEventListener(\"click\",function(e){ e.preventDefault(); hop(b.getAttribute(\"data-d\")); });\n  });\n  // swipe + tap-to-hop-up on the canvas\n  var tsx=0,tsy=0,tst=0;\n  cv.addEventListener(\"pointerdown\",function(e){ tsx=e.clientX; tsy=e.clientY; tst=performance.now(); });\n  cv.addEventListener(\"pointerup\",function(e){ var dx=e.clientX-tsx, dy=e.clientY-tsy, ad=Math.abs(dx), ay=Math.abs(dy);\n    if(ad<24&&ay<24){ hop(\"up\"); return; }                       // tap = hop forward\n    if(ay>ad) hop(dy<0?\"up\":\"down\"); else hop(dx<0?\"left\":\"right\");\n  });\n\n  // ---------- chat ----------\n  var chatBubbles={}, chatIn=document.getElementById(\"chatIn\");\n  function sendChat(){ var t=chatIn.value.trim(); if(!t)return; if(ws&&ws.readyState===1) ws.send(JSON.stringify({t:\"chat\",text:t})); chatIn.value=\"\"; }\n  document.getElementById(\"chatSend\").addEventListener(\"click\",sendChat);\n  chatIn.addEventListener(\"keydown\",function(e){ if(e.key===\"Enter\"){ e.preventDefault(); sendChat(); } });\n\n  // ---------- render ----------\n  var LANE_COL={ meadow:\"#8ed589\", grass:\"#a3dd97\", road:\"#585863\", train:\"#6b5a44\" };\n  function render(now){\n    for(var id in players){ var g=players[id]; var tx=g.col, ty=g.row; g.rx += (tx-g.rx)*0.35; g.ry += (ty-g.ry)*0.35; }\n    var sx=0,sy=0; if(shake>0){ sx=(Math.random()*2-1)*shake; sy=(Math.random()*2-1)*shake; shake*=0.85; if(shake<0.4)shake=0; }\n    ctx.setTransform(1,0,0,1,sx,sy); ctx.clearRect(-20,-20,cv.width+40,cv.height+40);\n    var cell=view.cell;\n    // rows\n    for(var r=0;r<ROWS;r++){ var L=LANES[r]||{type:\"grass\"}; var y=cy(r);\n      ctx.fillStyle=LANE_COL[L.type]||\"#a3dd97\"; ctx.fillRect(view.ox, y, COLS*cell, cell);\n      if(L.type===\"road\"){ ctx.strokeStyle=\"rgba(255,255,255,.5)\"; ctx.lineWidth=Math.max(1,cell*0.05); ctx.setLineDash([cell*0.28,cell*0.22]);\n        ctx.beginPath(); ctx.moveTo(view.ox, y+cell*0.5); ctx.lineTo(view.ox+COLS*cell, y+cell*0.5); ctx.stroke(); ctx.setLineDash([]); }\n      else if(L.type===\"train\"){ ctx.strokeStyle=\"#3a2f22\"; ctx.lineWidth=Math.max(1,cell*0.05);\n        for(var tie=0;tie<COLS*2;tie++){ var txp=view.ox+tie*cell*0.5; ctx.beginPath(); ctx.moveTo(txp,y+cell*0.15); ctx.lineTo(txp,y+cell*0.85); ctx.stroke(); }\n        ctx.strokeStyle=\"#b9b9c2\"; ctx.lineWidth=Math.max(1,cell*0.06);\n        ctx.beginPath(); ctx.moveTo(view.ox,y+cell*0.34); ctx.lineTo(view.ox+COLS*cell,y+cell*0.34); ctx.moveTo(view.ox,y+cell*0.66); ctx.lineTo(view.ox+COLS*cell,y+cell*0.66); ctx.stroke();\n        if(train.s===\"warn\"){ var fl=Math.floor(now/220)%2; if(fl){ ctx.fillStyle=\"rgba(230,60,50,.5)\"; ctx.fillRect(view.ox,y,COLS*cell,cell); } } }\n      else { // meadow/grass flowers\n        ctx.fillStyle=\"rgba(255,255,255,.5)\"; for(var f=0;f<COLS;f+=3){ var fx=view.ox+(f+0.5)*cell + ((r*7)%3)*cell*0.2, fy=y+cell*0.3+((f)%2)*cell*0.35; ctx.beginPath(); ctx.arc(fx,fy,cell*0.05,0,6.28); ctx.fill(); }\n      }\n    }\n    // vehicles\n    for(var r2=0;r2<ROWS;r2++){ var L2=LANES[r2]; if(!L2||L2.type!==\"road\") continue; var o=off[r2]||0,\
    \ n=Math.ceil(COLS/L2.gap)+1, yv=cy(r2);\n      ctx.font=(cell*0.8)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.textBaseline=\"middle\";\n      for(var i=0;i<n;i++){ var p=((i*L2.gap+o)%COLS+COLS)%COLS; drawVehicle(L2.v, view.ox+(p+L2.len/2)*cell, yv+cell*0.5, cell, L2.dir); if(p+L2.len>COLS) drawVehicle(L2.v, view.ox+(p+L2.len/2-COLS)*cell, yv+cell*0.5, cell, L2.dir); }\n    }\n    // train\n    if(train.s===\"run\"){ var ty2=cy(TRAIN_ROW)+cell*0.5;\n      ctx.font=(cell*0.92)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.textBaseline=\"middle\";\n      for(var seg=0;seg<TRAIN_LEN;seg++){ var segx=view.ox+(train.x+seg+0.5)*cell; drawVehicle(seg===(train.d>0?TRAIN_LEN-1:0)?\"\U0001F682\":\"\U0001F683\", segx, ty2, cell, train.d); }\n    }\n    // players\n    var ids=Object.keys(players).sort(function(a,b){ return players[a].ry-players[b].ry; });\n    for(var k=0;k<ids.length;k++) drawSheep(ids[k], now);\n    // pops\n    for(var pi=pops.length-1;pi>=0;pi--){ var P=pops[pi], age=(now-P.t)/1100; if(age>=1){ pops.splice(pi,1); continue; }\n      var px=cx(P.x)+cell*0.5, py=cy(P.y)+cell*0.5 - age*cell*0.8; ctx.globalAlpha=1-age; ctx.font=(cell*0.7)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.textBaseline=\"middle\";\n      ctx.fillText(P.kind===\"cross\"?\"\U0001F389\":P.kind===\"train\"?\"\U0001F4A5\":\"\U0001F4AB\", px, py); ctx.globalAlpha=1; }\n    requestAnimationFrame(render);\n  }\n  function drawVehicle(emoji, xc, yc, cell, dir){ ctx.save(); ctx.translate(xc,yc); if(dir<0) ctx.scale(-1,1); ctx.fillText(emoji,0,0); ctx.restore(); }\n  function drawSheep(id, now){\n    var g=players[id], info=roster[id]||{name:\"\",hue:0}, cell=view.cell, x=cx(g.rx)+cell*0.5, y=cy(g.ry)+cell*0.5, u=cell*0.5, mine=(+id===myId);\n    ctx.fillStyle=\"rgba(20,40,15,.18)\"; ctx.beginPath(); ctx.ellipse(x,y+u*0.5,u*0.7,u*0.28,0,0,6.28); ctx.fill();\n    // fluffy body\n    ctx.fillStyle=mine?\"#fffef8\":\"#f2eee2\";\n    var body=[[0,0,.6],[-.42,.05,.36],[.42,.05,.36],[-.24,-.34,.36],[.28,-.34,.36],[0,-.5,.32]];\n    for(var i=0;i<body.length;i++){ ctx.beginPath(); ctx.arc(x+body[i][0]*u, y+body[i][1]*u, body[i][2]*u, 0, 6.28); ctx.fill(); }\n    // head (facing up = toward goal)\n    ctx.fillStyle=\"#3f3128\"; ctx.beginPath(); ctx.arc(x, y-u*0.62, u*0.3, 0, 6.28); ctx.fill();\n    ctx.fillStyle=\"#fff\"; ctx.beginPath(); ctx.arc(x-u*0.1,y-u*0.66,u*0.06,0,6.28); ctx.arc(x+u*0.1,y-u*0.66,u*0.06,0,6.28); ctx.fill();\n    if(mine){ ctx.strokeStyle=\"rgba(242,193,78,.95)\"; ctx.lineWidth=u*0.12; ctx.beginPath(); ctx.arc(x,y-u*0.1,u*0.95,0,6.28); ctx.stroke(); }\n    if(info.name){ ctx.font=\"700 \"+(cell*0.24)+\"px 'Courier New',monospace\"; ctx.textAlign=\"center\"; ctx.textBaseline=\"alphabetic\";\n      ctx.fillStyle=\"rgba(10,30,10,.5)\"; ctx.fillText(info.name,x+1,y-u*1.05+1); ctx.fillStyle=mine?\"#fff\":\"hsl(\"+info.hue+\",70%,90%)\"; ctx.fillText(info.name,x,y-u*1.05); }\n    var cb=chatBubbles[id]; if(cb){ if(now-cb.t>5500){ delete chatBubbles[id]; } else { drawBubble(x, y-u*1.4, cb.text, cell); } }\n  }\n  function drawBubble(cx0, baseY, text, cell){ var u=cell; ctx.font=\"600 \"+(cell*0.3)+\"px system-ui,sans-serif\"; ctx.textBaseline=\"alphabetic\";\n    if(text.length>26) text=text.slice(0,25)+\"…\";\n    var w=ctx.measureText(text).width, padX=u*0.2, bw=w+padX*2, bh=cell*0.5, bx=cx0-bw/2, by=baseY-bh;\n    ctx.fillStyle=\"rgba(255,253,243,.96)\"; ctx.strokeStyle=\"rgba(40,58,36,.4)\"; ctx.lineWidth=Math.max(1,cell*0.02);\n    rr(bx,by,bw,bh,cell*0.16); ctx.fill(); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(cx0-u*0.12,by+bh-1); ctx.lineTo(cx0+u*0.12,by+bh-1); ctx.lineTo(cx0,by+bh+u*0.18); ctx.closePath(); ctx.fillStyle=\"rgba(255,253,243,.96)\"; ctx.fill();\n    ctx.fillStyle=\"#2c3a24\"; ctx.textAlign=\"center\"; ctx.fillText(text,cx0,by+bh*0.66);\n  }\n  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }\n  requestAnimationFrame(render);\n\n  // train warning banner\n  var warnEl=document.getElementById(\"\
    warn\");\n  setInterval(function(){ warnEl.classList.toggle(\"show\", train.s===\"warn\"); }, 120);\n})();\n</script>\n"
  hall.html: "<meta charset=\"utf-8\" />\n<title>Hall of Chill — Chill Farm</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<meta name=\"description\" content=\"The Hall of Chill: the most relaxed sheep at Chill Farm, ranked by hours grazed — not hustle.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#4a2f1c\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"Hall of Chill — Chill Farm\" />\n<meta property=\"og:description\" content=\"The most relaxed sheep at only-chill.com, ranked by hours grazed — not hustle.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/hall/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<script>if(\"serviceWorker\" in navigator)addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/sw.js\").catch(function(){});});</script>\n<style>\n  :root{\n    --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#4a2f1c; --terra:#c15a34;\n    --parch:#f4ead0; --parch-2:#ece0c2; --ink:#33261a; --ink-soft:#5c4a38; --card:#fbf4e2; --line:#d8c6a0;\n    --page-bg:#f4ead0; --shadow:rgba(74,47,28,.20);\n    --display:\"Rockwell\",\"Rockwell Nova\",\"Roboto Slab\",\"Courier New\",Georgia,serif;\n    --body:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n    --mono:\"Courier New\",ui-monospace,monospace;\n  }\n  @media (prefers-color-scheme: dark){ :root{\n    --parch:#221a24; --parch-2:#1a141c; --ink:#f0e4cf; --ink-soft:#c3b199; --card:#2a2030; --line:#43364a;\n    --page-bg:#1a141c; --shadow:rgba(0,0,0,.45);\n  }}\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--page-bg);line-height:1.6;}\n  h1,h2{font-family:var(--display);font-weight:700;line-height:1.02;margin:0;text-wrap:balance;}\n  a{color:inherit;}\n  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;\n    padding:.7rem clamp(1rem,4vw,2.4rem);backdrop-filter:blur(6px);\n    background:color-mix(in srgb, var(--page-bg) 72%, transparent);border-bottom:1px solid color-mix(in srgb, var(--ink) 12%, transparent);}\n  .brand{display:flex;align-items:center;gap:.55rem;font-family:var(--display);font-size:1.05rem;letter-spacing:.04em;text-decoration:none;}\n  .brand .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--wheat);color:var(--saddle-dk);border-radius:50%;font-size:1rem;box-shadow:inset 0 0 0 2px var(--saddle-dk);}\n  .navlinks{display:flex;gap:1.3rem;align-items:center;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;}\n  .navlinks a{text-decoration:none;opacity:.8;}\n  .navlinks a:hover{opacity:1;}\n  .band{padding:clamp(3rem,8vw,5.5rem) clamp(1.2rem,6vw,3rem);}\n  .wrap{max-width:720px;margin:0 auto;}\n  .eyebrow{font-family:var(--mono);font-size:.76rem;letter-spacing:.34em;text-transform:uppercase;color:var(--wheat-deep);display:inline-flex;align-items:center;gap:.6rem;}\n  .eyebrow::before{content:\"\";width:26px;height:2px;background:var(--wheat-deep);display:inline-block;}\n  h1.title{font-size:clamp(2rem,6vw,3.2rem);text-transform:uppercase;margin:.5rem 0 .8rem;}\n  .lead{font-size:clamp(1.05rem,2.4vw,1.25rem);color:var(--ink-soft);max-width:56ch;}\n  .hall{list-style:none;counter-reset:h;margin:2.4rem 0 0;padding:0;display:flex;flex-direction:column;gap:.6rem;}\n  .hall li{counter-increment:h;display:flex;align-items:center;gap:1rem;background:var(--card);border:2px solid var(--line);\n    border-radius:12px;padding:.85rem 1.1rem;box-shadow:0 8px 20px var(--shadow);}\n  .hall li::before{content:counter(h);font-family:var(--display);font-size:1.4rem;color:var(--wheat-deep);min-width:1.8rem;text-align:center;}\n  .hall li:first-child{border-color:var(--wheat);}\n  .hall li:first-child::before{content:\"\U0001F947\";} .hall\
    \ li:nth-child(2)::before{content:\"\U0001F948\";} .hall li:nth-child(3)::before{content:\"\U0001F949\";}\n  .hall .nm{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.02em;}\n  .hall .ti{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);}\n  .hall .pts{margin-left:auto;font-family:var(--mono);color:var(--wheat-deep);white-space:nowrap;font-size:1rem;}\n  .hall-empty{justify-content:center;color:var(--ink-soft);}\n  .cta{display:inline-block;margin-top:2rem;text-decoration:none;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;\n    color:#f4ead0;background:var(--terra);padding:.75rem 1.6rem;border-radius:40px;border:2px solid var(--saddle-dk);box-shadow:0 5px 0 var(--saddle-dk);}\n  footer{background:var(--saddle-dk);color:#e9d7b5;text-align:center;padding:2.5rem 1.5rem;font-family:var(--mono);font-size:.78rem;}\n  footer a{color:#ffe6ad;}\n\n/* ===== cozy-ranch pass: consistent rounded + pillow chrome across the site ===== */\n:root{ --cozy-ease:cubic-bezier(.34,1.56,.64,1); }\n.btn,.cta,.pill,.tag,.dd-toggle{ border-radius:16px !important;\n  transition:transform .12s var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.btn,.cta,.dd-toggle{ box-shadow:0 5px 0 rgba(74,47,28,.28) !important; }\n.btn:active,.cta:active,.dd-toggle:active{ transform:translateY(3px) !important; box-shadow:0 2px 0 rgba(74,47,28,.28) !important; }\n.btn:hover,.cta:hover{ transform:translateY(-2px); }\n.dd-menu{ border-radius:18px !important; overflow:hidden;\n  box-shadow:0 8px 0 rgba(74,47,28,.2), 0 14px 24px rgba(20,12,6,.28) !important; }\n.dd-menu a{ transition:background .12s ease; }\n.badge,.badgecard{ box-shadow:0 3px 0 rgba(74,47,28,.28) !important; }\n.chill-modal__card,.chill-police__card,.ledger-panel,.badgecard{ border-radius:22px !important; }\n.navlinks a{ border-radius:12px !important; }\n</style>\n\n<header class=\"topbar\">\n  <a class=\"brand\" href=\"/\"><span class=\"badge\">\U0001F3C6</span> Chill&nbsp;Farm</a>\n  <nav class=\"navlinks\">\n    <a href=\"/\">Home</a>\n    <a href=\"/pasture/\">The Pasture</a>\n  </nav>\n</header>\n\n<section class=\"band\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">The Hall of Chill</span>\n    <h1 class=\"title\">Chillest of the Chill</h1>\n    <p class=\"lead\">Ranked not by hustle but by hours grazed — the most relaxed sheep in the meadow. Earn chill just by being present; complete the daily challenge for bonus badges.</p>\n    <ol class=\"hall\" id=\"hallList\"><li class=\"hall-empty\">Loading the leaderboard…</li></ol>\n    <a class=\"cta\" href=\"/pasture/\">\U0001F411 Go earn your chill →</a>\n  </div>\n</section>\n\n<footer>\n  \U0001F3C6 Hall of Chill · <a href=\"/\">only-chill.com</a> · ranked by pure relaxation\n</footer>\n\n<script>\n(function(){\n  function loadHall(){\n    fetch(\"/ws/leaderboard\", { cache:\"no-store\" }).then(function(r){ return r.json(); }).then(function(list){\n      var el = document.getElementById(\"hallList\"); if (!el) return;\n      if (!list.length){ el.innerHTML = '<li class=\"hall-empty\">No chillers ranked yet — be the first!</li>'; return; }\n      el.innerHTML = \"\";\n      list.forEach(function(p){\n        var li = document.createElement(\"li\");\n        var info = document.createElement(\"div\");\n        var nm = document.createElement(\"div\"); nm.className = \"nm\"; nm.textContent = p.name; info.appendChild(nm);\n        var ti = document.createElement(\"div\"); ti.className = \"ti\"; ti.textContent = p.title + (p.badges ? (\" · \U0001F3C5 \" + p.badges) : \"\"); info.appendChild(ti);\n        li.appendChild(info);\n        var pts = document.createElement(\"span\"); pts.className = \"pts\"; pts.textContent = \"\U0001F33F \" + p.points; li.appendChild(pts);\n        el.appendChild(li);\n      });\n    }).catch(function(){});\n  }\n  loadHall(); setInterval(loadHall, 30000);\n})();\n</script>\n"
  news.html: "<meta charset=\"utf-8\" />\n<title>The Chill Farm Gazette — only-chill.com</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n<meta name=\"description\" content=\"The Chill Farm Gazette — today's whimsical, freshly-written ranch headlines. All the news that's fit to nap through.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#3a2416\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"The Chill Farm Gazette\" />\n<meta property=\"og:description\" content=\"Today's whimsical, freshly-written ranch headlines. All the news that's fit to nap through.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/news/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<script>if(\"serviceWorker\" in navigator)addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/sw.js\").catch(function(){});});</script>\n<style>\n  :root{\n    --paper:#f3ead3; --ink:#2a2118; --ink-soft:#6b5b45; --rule:#c9b48a; --accent:#8a3a1e;\n    --serif:Georgia,\"Times New Roman\",serif; --display:\"Rockwell\",\"Roboto Slab\",Georgia,serif; --mono:\"Courier New\",monospace;\n  }\n  @media (prefers-color-scheme: dark){ :root{ --paper:#211b14; --ink:#ece0c8; --ink-soft:#b6a281; --rule:#4a3d29; --accent:#e0895a; } }\n  *{box-sizing:border-box;}\n  body{margin:0;background:#5a4a32;font-family:var(--serif);color:var(--ink);line-height:1.5;\n    background-image:radial-gradient(circle at 50% 0,#6b5940,#4a3c28);min-height:100vh;padding:clamp(1rem,4vw,3rem) 1rem;}\n  .paper{max-width:760px;margin:0 auto;background:var(--paper);padding:clamp(1.4rem,5vw,3rem);\n    box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--rule);}\n  .top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.7rem;\n    text-transform:uppercase;letter-spacing:.15em;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:.5rem;}\n  .top a{color:var(--accent);text-decoration:none;}\n  .masthead{text-align:center;padding:1.2rem 0 .6rem;border-bottom:3px double var(--ink);}\n  .masthead h1{font-family:var(--display);font-size:clamp(2rem,8vw,3.6rem);margin:0;letter-spacing:.01em;line-height:1;font-weight:700;}\n  .masthead .sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:.5rem;}\n  .dateline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;\n    text-transform:uppercase;color:var(--ink-soft);padding:.5rem 0;border-bottom:1px solid var(--rule);}\n  .stories{margin-top:1rem;}\n  .story{padding:1.1rem 0;border-bottom:1px solid var(--rule);}\n  .story:first-child .hl{font-size:clamp(1.5rem,5vw,2.2rem);}\n  .story .kick{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem;}\n  .story .hl{font-family:var(--display);font-size:clamp(1.2rem,3.8vw,1.7rem);line-height:1.12;font-weight:700;}\n  .story .by{font-family:var(--mono);font-size:.66rem;color:var(--ink-soft);margin-top:.4rem;}\n  .footer{text-align:center;font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin-top:1.4rem;letter-spacing:.1em;}\n  .footer a{color:var(--accent);text-decoration:none;}\n  .loading{padding:2rem 0;text-align:center;color:var(--ink-soft);font-style:italic;}\n\n/* ===== cozy-ranch pass: consistent rounded + pillow chrome across the site ===== */\n:root{ --cozy-ease:cubic-bezier(.34,1.56,.64,1); }\n.btn,.cta,.pill,.tag,.dd-toggle{ border-radius:16px !important;\n  transition:transform .12s var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.btn,.cta,.dd-toggle{ box-shadow:0 5px 0 rgba(74,47,28,.28) !important; }\n.btn:active,.cta:active,.dd-toggle:active{ transform:translateY(3px) !important;\
    \ box-shadow:0 2px 0 rgba(74,47,28,.28) !important; }\n.btn:hover,.cta:hover{ transform:translateY(-2px); }\n.dd-menu{ border-radius:18px !important; overflow:hidden;\n  box-shadow:0 8px 0 rgba(74,47,28,.2), 0 14px 24px rgba(20,12,6,.28) !important; }\n.dd-menu a{ transition:background .12s ease; }\n.badge,.badgecard{ box-shadow:0 3px 0 rgba(74,47,28,.28) !important; }\n.chill-modal__card,.chill-police__card,.ledger-panel,.badgecard{ border-radius:22px !important; }\n.navlinks a{ border-radius:12px !important; }\n</style>\n\n<div class=\"paper\">\n  <div class=\"top\">\n    <span>No. <span id=\"issue\">—</span> · Price: one nap</span>\n    <a href=\"/\">← only-chill.com</a>\n  </div>\n  <div class=\"masthead\">\n    <h1>The Chill Farm Gazette</h1>\n    <div class=\"sub\">★ All the news that's fit to nap through ★</div>\n  </div>\n  <div class=\"dateline\">\n    <span id=\"dateline\">Loading…</span>\n    <span>Weather: chill, with naps</span>\n  </div>\n  <div class=\"stories\" id=\"stories\"><div class=\"loading\">The editor is waking up from a nap to write today's edition…</div></div>\n  <div class=\"footer\">\n    Freshly written every morning by the ranch's AI editor · <a href=\"/\">only-chill.com</a> · <a href=\"/pasture/\">visit the meadow</a>\n  </div>\n</div>\n\n<script>\n(function(){\n  var BYLINES = [\"— A. Sheep, staff writer\",\"— filed from a hammock\",\"— The Gazette\",\"— our man at the pond\",\"— reported at sunset\",\"— dictated mid-nap\"];\n  var KICKS = [\"Ranch Life\",\"Breaking (slowly)\",\"Meadow Watch\",\"Local News\",\"Pond Report\",\"Exclusive\"];\n  function render(items, date){\n    var el = document.getElementById(\"stories\"); el.innerHTML = \"\";\n    if (!items || !items.length){ el.innerHTML = '<div class=\"loading\">No news today — everyone was too relaxed to report. Check back tomorrow.</div>'; return; }\n    items.forEach(function(h, i){\n      var s = document.createElement(\"div\"); s.className = \"story\";\n      var k = document.createElement(\"div\"); k.className = \"kick\"; k.textContent = KICKS[i % KICKS.length];\n      var hl = document.createElement(\"div\"); hl.className = \"hl\"; hl.textContent = h;\n      var by = document.createElement(\"div\"); by.className = \"by\"; by.textContent = BYLINES[i % BYLINES.length];\n      s.appendChild(k); s.appendChild(hl); s.appendChild(by); el.appendChild(s);\n    });\n  }\n  function load(){\n    fetch(\"/ws/news\", { cache:\"no-store\" }).then(function(r){ return r.json(); }).then(function(d){\n      render(d.items, d.date);\n      if (d.date){ var dt = new Date(d.date + \"T12:00:00\");\n        document.getElementById(\"dateline\").textContent = dt.toLocaleDateString(undefined, { weekday:\"long\", year:\"numeric\", month:\"long\", day:\"numeric\" });\n        document.getElementById(\"issue\").textContent = Math.floor((dt - new Date(\"2026-07-01T12:00:00\"))/86400000) + 1;\n      }\n    }).catch(function(){ render([]); });\n  }\n  load();\n})();\n</script>\n"
  manifest.json: "{\n  \"name\": \"Chill Farm\",\n  \"short_name\": \"Chill Farm\",\n  \"description\": \"A ranch for professional relaxers. Graze, chill, and hang out at only-chill.com.\",\n  \"start_url\": \"/\",\n  \"scope\": \"/\",\n  \"display\": \"standalone\",\n  \"orientation\": \"any\",\n  \"background_color\": \"#2b2a4a\",\n  \"theme_color\": \"#4a2f1c\",\n  \"categories\": [\"games\", \"lifestyle\", \"entertainment\"],\n  \"icons\": [\n    { \"src\": \"/icon-192.png\", \"sizes\": \"192x192\", \"type\": \"image/png\", \"purpose\": \"any maskable\" },\n    { \"src\": \"/icon-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\", \"purpose\": \"any maskable\" }\n  ]\n}\n"
  sw.js: "/* Chill Farm service worker — installable + offline-friendly app shell */\nconst CACHE = 'chill-farm-v1';\nconst SHELL = ['/', '/careers/', '/pasture/', '/ranch/', '/manifest.json', '/icon-192.png', '/icon-512.png'];\n\nself.addEventListener('install', (e) => {\n  e.waitUntil(caches.open(CACHE).then((c) => c.addAll(SHELL).catch(() => {})).then(() => self.skipWaiting()));\n});\nself.addEventListener('activate', (e) => {\n  e.waitUntil(caches.keys().then((ks) => Promise.all(ks.filter((k) => k !== CACHE).map((k) => caches.delete(k)))).then(() => self.clients.claim()));\n});\nself.addEventListener('fetch', (e) => {\n  const req = e.request;\n  if (req.method !== 'GET') return;\n  const url = new URL(req.url);\n  if (url.origin !== location.origin) return;                 // leave cross-origin alone\n  if (url.pathname.startsWith('/ws') || url.pathname.startsWith('/rw')) return;  // never cache live game/stats\n  if (req.mode === 'navigate') {                              // fresh pages when online, cached when offline\n    e.respondWith(\n      fetch(req).then((r) => { const cp = r.clone(); caches.open(CACHE).then((c) => c.put(req, cp)); return r; })\n        .catch(() => caches.match(req).then((m) => m || caches.match('/')))\n    );\n    return;\n  }\n  e.respondWith(                                              // cache-first for static assets\n    caches.match(req).then((m) => m || fetch(req).then((r) => { const cp = r.clone(); caches.open(CACHE).then((c) => c.put(req, cp)); return r; }).catch(() => m))\n  );\n});\n"
  splash.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<title>Super Soaker Splash \U0001F4A6 · Chill Farm</title>\n<meta name=\"theme-color\" content=\"#e0a83c\">\n<meta property=\"og:title\" content=\"Super Soaker Splash \U0001F4A6 · Chill Farm\">\n<meta property=\"og:description\" content=\"A wholesome water-gun free-for-all. Soak your friends, dry off in the sun, no hard feelings.\">\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\">\n<style>\n  :root{\n    /* Cozy Ranch palette — shared with the rest of Chill Farm */\n    --ink:#3a2a1c; --ink-soft:#6b5844; --cream:#fff8ea; --parch:#f6ecd6;\n    --grass:#bfe0a0; --grass2:#a9cf7e; --sky:#cfe6ea; --sun:#f0c860;\n    --water:#7cc7ff; --water2:#3f96e0;            /* water stays blue (it's a squirt gun!) */\n    --wheat:#e0a83c; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#4a2f1c; --terra:#c15a34;\n    --pink:#c15a34;                                 /* legacy accent name → terracotta */\n    --panel:#fff8ea; --shadow:#e2cfa8;\n    --ease:cubic-bezier(.34,1.56,.64,1);\n    --display:\"Rockwell\",\"Rockwell Nova\",\"Roboto Slab\",\"Courier New\",Georgia,serif;\n    font-family:ui-rounded,\"Baloo 2\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);\n    touch-action:none;overscroll-behavior:none;user-select:none}\n  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n  canvas{display:block;image-rendering:auto;border-radius:26px;\n    box-shadow:0 18px 0 rgba(120,150,90,.35),0 26px 40px rgba(60,80,40,.35);\n    max-width:100%;max-height:100%}\n\n  /* ---- top bar ---- */\n  .top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;\n    flex-wrap:wrap;z-index:20;pointer-events:none}\n  .chip{pointer-events:auto;background:var(--panel);border:3px solid #fff;\n    border-radius:18px;padding:7px 13px;font-weight:800;font-size:14px;\n    box-shadow:0 4px 0 var(--shadow);display:flex;align-items:center;gap:6px}\n  .chip small{font-weight:700;opacity:.6;font-size:11px}\n  .brand{background:linear-gradient(#fff,#fdeede);color:var(--terra)}\n  a.chip{text-decoration:none;color:var(--ink)}\n  .grow{flex:1}\n  #tankChip b{color:var(--water2)}\n\n  /* ---- leaderboard ---- */\n  #board{position:fixed;top:56px;right:10px;width:180px;background:var(--panel);\n    border:3px solid #fff;border-radius:20px;padding:10px 12px;z-index:15;\n    box-shadow:0 6px 0 var(--shadow);font-size:13px}\n  #board h4{margin:0 0 6px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;\n    color:var(--terra);display:flex;justify-content:space-between}\n  .row{display:flex;align-items:center;gap:6px;padding:3px 0;font-weight:700}\n  .row .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.15)}\n  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .row .sc{font-weight:800;color:var(--water2)}\n  .row.me{background:#fff3d6;border-radius:10px;padding-left:6px;margin-left:-6px}\n  @media(max-width:620px){#board{display:none}}\n\n  /* ---- controls ---- */\n  #stick{position:fixed;left:22px;bottom:22px;width:118px;height:118px;border-radius:50%;\n    background:rgba(255,255,255,.5);border:4px solid rgba(255,255,255,.85);z-index:18;\n    box-shadow:0 5px 0 rgba(120,120,90,.25);display:none}\n  #nub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;\n    border-radius:50%;background:linear-gradient(#fff,#f6e6c8);border:3px solid #fff;\n    box-shadow:0 4px 0 var(--shadow)}\n  #fireBtn{position:fixed;right:22px;bottom:26px;width:104px;height:104px;border-radius:50%;\n    background:radial-gradient(circle at 38% 32%,#aee0ff,var(--water2));border:5px solid #fff;\n    color:#fff;font-size:38px;z-index:18;box-shadow:0\
    \ 7px 0 #2f7dc0;display:none;\n    align-items:center;justify-content:center;transition:transform .08s var(--ease)}\n  #fireBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #2f7dc0}\n  .touch #stick,.touch #fireBtn{display:flex}\n  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:16;\n    background:rgba(255,253,246,.92);border-radius:16px;padding:7px 15px;font-weight:700;\n    font-size:13px;box-shadow:0 4px 0 var(--shadow);text-align:center}\n  .touch #hint{display:none}\n\n  /* ---- chat ---- */\n  #chatWrap{position:fixed;left:10px;bottom:150px;width:min(300px,60vw);z-index:16;\n    display:flex;flex-direction:column;gap:5px}\n  .touch #chatWrap{bottom:160px;left:150px;width:min(240px,44vw)}\n  #chatLog{display:flex;flex-direction:column;gap:4px;max-height:120px;overflow:hidden}\n  .cmsg{background:rgba(255,253,246,.9);border-radius:14px 14px 14px 4px;padding:5px 10px;\n    font-size:13px;font-weight:600;box-shadow:0 2px 0 var(--shadow);align-self:flex-start;\n    animation:pop .3s var(--ease)}\n  .cmsg b{color:var(--terra)}\n  #chatRow{display:flex;gap:6px}\n  #chatIn{flex:1;border:3px solid #fff;border-radius:16px;padding:8px 12px;font-size:14px;\n    font-family:inherit;font-weight:600;background:var(--panel);box-shadow:0 3px 0 var(--shadow);\n    outline:none;min-width:0}\n  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}\n\n  /* ---- name gate ---- */\n  #gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;\n    background:linear-gradient(160deg,#f6ecd6,#e7ecc8);padding:20px}\n  .card{background:var(--panel);border:5px solid #fff;border-radius:30px;padding:26px 26px 22px;\n    max-width:360px;width:100%;text-align:center;box-shadow:0 14px 0 var(--shadow),0 24px 40px rgba(60,80,40,.25)}\n  .card h1{margin:.1em 0 .1em;font-size:30px;color:var(--terra);font-family:var(--display);letter-spacing:.3px}\n  .card p{margin:.3em 0 1em;font-weight:600;opacity:.8;font-size:15px}\n  .card input{width:100%;border:3px solid #e9d3ad;border-radius:18px;padding:13px 16px;\n    font-size:17px;font-family:inherit;font-weight:700;text-align:center;outline:none;margin-bottom:14px}\n  .btn{background:radial-gradient(circle at 40% 30%,#aee0ff,var(--water2));color:#fff;border:none;\n    border-radius:20px;padding:14px 22px;font-size:18px;font-weight:800;font-family:inherit;\n    width:100%;box-shadow:0 6px 0 #2f7dc0;cursor:pointer;transition:transform .1s var(--ease)}\n  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #2f7dc0}\n  .tips{margin-top:14px;font-size:12.5px;font-weight:600;opacity:.7;line-height:1.5}\n\n  #over{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;\n    background:rgba(120,150,90,.35);backdrop-filter:blur(3px);padding:20px}\n  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-80px);z-index:30;\n    background:var(--panel);border:3px solid #fff;border-radius:18px;padding:10px 18px;\n    font-weight:800;box-shadow:0 6px 0 var(--shadow);opacity:0;transition:.4s var(--ease);pointer-events:none}\n  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}\n</style>\n</head>\n<body>\n<div id=\"stage\"><canvas id=\"c\"></canvas></div>\n\n<div class=\"top\">\n  <a class=\"chip brand\" href=\"/\">\U0001F33E Chill Farm</a>\n  <div class=\"chip\">\U0001F4A6 <span>Super Soaker Splash</span></div>\n  <div class=\"grow\"></div>\n  <div class=\"chip\" id=\"soakChip\">\U0001F3AF <b id=\"soakN\">0</b> <small>soaks</small></div>\n  <div class=\"chip\" id=\"tankChip\">\U0001F52B <b id=\"tankN\">100</b><small>%</small></div>\n</div>\n\n<div id=\"board\"><h4><span>\U0001F4A6 Splashers</span><span id=\"pc\">0</span></h4><div id=\"rows\"></div></div>\n\n<div id=\"chatWrap\">\n  <div id=\"chatLog\"></div>\n  <div id=\"chatRow\"><input id=\"chatIn\" placeholder=\"say hi \U0001F4AC\" maxlength=\"160\" autocomplete=\"off\"></div>\n</div>\n\n<div id=\"stick\"><div id=\"nub\"></div></div>\n<button id=\"fireBtn\" aria-label=\"squirt\">\U0001F4A6</button>\n\
    <div id=\"hint\"><b>WASD</b>/arrows move · <b>mouse</b> aims · <b>hold click / space</b> to squirt \U0001F4A6</div>\n<div id=\"toast\"></div>\n\n<div id=\"gate\">\n  <div class=\"card\">\n    <div style=\"font-size:52px;line-height:1\">\U0001F4A6\U0001F411</div>\n    <h1>Super Soaker Splash</h1>\n    <p>A wholesome water-fight in the yard. Soak your pals, dry off in the sun, no hard feelings. Bone dry? Refill at the well \U0001FAA3</p>\n    <input id=\"nameIn\" maxlength=\"18\" placeholder=\"your sheep name\" autocomplete=\"off\">\n    <button class=\"btn\" id=\"go\">Grab a squirt gun \U0001F4A6</button>\n    <div class=\"tips\">Get someone to 100% wet to <b>soak</b> them — they'll flop in a puddle, dry off, and hop right back in. It's all in good fun. \U0001F31E</div>\n  </div>\n</div>\n\n<div id=\"over\"><div class=\"card\">\n  <div style=\"font-size:48px\">\U0001F411\U0001F4A6</div>\n  <h1 style=\"font-size:24px\">You're grazing in another window</h1>\n  <p>Only one splashing sheep per browser. Want to squirt from here instead?</p>\n  <button class=\"btn\" id=\"takeover\">\U0001F4A6 Splash from here</button>\n</div></div>\n\n<script>\n(function(){\n  'use strict';\n  var $=function(s){return document.querySelector(s)};\n  var canvas=$('#c'),ctx=canvas.getContext('2d');\n  var W=1200,H=760,WELL={x:600,y:380,r:70};\n  var myId=null, players=new Map(), roster=new Map();\n  var streams=[], puddles=[], pops=[];\n  var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;\n  if(isTouch) document.body.classList.add('touch');\n\n  // identity\n  var token=localStorage.getItem('chillId');\n  if(!token){token='sh_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('chillId',token);}\n  var myName=localStorage.getItem('chill-name')||'';\n\n  /* ---------- canvas sizing ---------- */\n  var view={scale:1,ox:0,oy:0,cw:0,ch:0,dpr:1};\n  function resize(){\n    var dpr=Math.min(2,window.devicePixelRatio||1);\n    var maxW=window.innerWidth-16, maxH=window.innerHeight-16;\n    var scale=Math.min(maxW/W, maxH/H);\n    var cw=Math.round(W*scale), ch=Math.round(H*scale);\n    canvas.style.width=cw+'px'; canvas.style.height=ch+'px';\n    canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);\n    view.scale=scale; view.cw=cw; view.ch=ch; view.dpr=dpr;\n    var r=canvas.getBoundingClientRect();\n    view.ox=r.left; view.oy=r.top;\n  }\n  window.addEventListener('resize',resize);\n  window.addEventListener('orientationchange',function(){setTimeout(resize,200)});\n  resize();\n  // keep screen->world offset fresh\n  setInterval(function(){var r=canvas.getBoundingClientRect();view.ox=r.left;view.oy=r.top;},400);\n\n  function worldToScreenScale(){return view.scale}\n  function screenToWorld(sx,sy){return {x:(sx-view.ox)/view.scale, y:(sy-view.oy)/view.scale}}\n\n  /* ---------- websocket ---------- */\n  var ws=null, wsReady=false;\n  function connect(){\n    var proto=location.protocol==='https:'?'wss':'ws';\n    ws=new WebSocket(proto+'://'+location.host+'/xw');\n    ws.onopen=function(){wsReady=true; send({t:'hello',token:token,name:myName});};\n    ws.onclose=function(){wsReady=false; setTimeout(connect,1500);};\n    ws.onerror=function(){try{ws.close()}catch(e){}};\n    ws.onmessage=onMsg;\n  }\n  function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }\n\n  function onMsg(ev){\n    var m; try{m=JSON.parse(ev.data)}catch(e){return}\n    if(m.t==='welcome'){ myId=m.id; W=m.w; H=m.h; WELL=m.well; resize(); }\n    else if(m.t==='s'){\n      var seen={};\n      for(var i=0;i<m.players.length;i++){\n        var a=m.players[i], id=a[0];\n        seen[id]=1;\n        var p=players.get(id);\n        if(!p){ p={rx:a[1],ry:a[2]}; players.set(id,p); }\n        p.x=a[1]; p.y=a[2]; p.aim=a[3]/100; p.wet=a[4]; p.firing=a[5]; p.drenched=a[6]; p.tank=a[7];\n      }\n      players.forEach(function(p,id){ if(!seen[id]) players.delete(id); });\n      var me=players.get(myId);\n      if(me){ $('#tankN').textContent=Math.round(me.tank); }\n    }\n    else if(m.t==='r'){\n      roster.clear();\n\
    \      m.players.forEach(function(p){roster.set(p.id,p)});\n      renderBoard();\n      var mine=roster.get(myId); if(mine) $('#soakN').textContent=mine.score;\n      $('#pc').textContent=m.n;\n    }\n    else if(m.t==='soak'){\n      var who=players.get(m.who);\n      if(who){ for(var k=0;k<14;k++) pops.push(mkPop(who.x,who.y,'\U0001F4A7')); }\n      if(m.by===myId){ toast('\U0001F4A6 Soaked '+(roster.get(m.who)?roster.get(m.who).name:'a sheep')+'!'); ping(660); }\n      else if(m.who===myId){ toast('\U0001FAE7 You got drenched! Drying off…'); ping(330); }\n    }\n    else if(m.t==='chat'){ addChat(m.m); }\n    else if(m.t==='bye'){ /* takeover */ }\n  }\n  // takeover close code\n  var origClose=WebSocket.prototype.close;\n\n  function renderBoard(){\n    var arr=[...roster.values()].sort(function(a,b){return b.score-a.score}).slice(0,8);\n    var html='';\n    arr.forEach(function(p){\n      html+='<div class=\"row'+(p.id===myId?' me':'')+'\"><span class=\"dot\" style=\"background:hsl('+p.hue+',70%,62%)\"></span>'\n        +'<span class=\"nm\">'+esc(p.name)+'</span><span class=\"sc\">'+p.score+'</span></div>';\n    });\n    $('#rows').innerHTML=html||'<div class=\"row\" style=\"opacity:.5\">no splashers yet</div>';\n  }\n  function esc(s){return String(s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}\n\n  /* ---------- input: keyboard + mouse (desktop) ---------- */\n  var keys={}, mvSent={dx:0,dy:0}, aimSent=0, firing=false, lastAim=0;\n  function pushMove(){\n    var dx=(keys.d||keys.right?1:0)-(keys.a||keys.left?1:0);\n    var dy=(keys.s||keys.down?1:0)-(keys.w||keys.up?1:0);\n    if(joyActive){ dx=joyVec.x; dy=joyVec.y; }\n    if(dx!==mvSent.dx||dy!==mvSent.dy){ mvSent={dx:dx,dy:dy}; send({t:'mv',dx:dx,dy:dy}); }\n  }\n  window.addEventListener('keydown',function(e){\n    if(gateOpen) return;\n    var k=e.key.toLowerCase();\n    if(document.activeElement===$('#chatIn')){ if(k==='enter'){sendChat();} return; }\n    if(k===' '){ if(!firing){firing=true;send({t:'fire',on:true});} e.preventDefault(); }\n    if(k==='w'||k==='arrowup'){keys.w=1;e.preventDefault()}\n    if(k==='s'||k==='arrowdown'){keys.s=1;e.preventDefault()}\n    if(k==='a'||k==='arrowleft'){keys.a=1;e.preventDefault()}\n    if(k==='d'||k==='arrowright'){keys.d=1;e.preventDefault()}\n    pushMove();\n  });\n  window.addEventListener('keyup',function(e){\n    var k=e.key.toLowerCase();\n    if(k===' '){ if(firing){firing=false;send({t:'fire',on:false});} }\n    if(k==='w'||k==='arrowup')keys.w=0;\n    if(k==='s'||k==='arrowdown')keys.s=0;\n    if(k==='a'||k==='arrowleft')keys.a=0;\n    if(k==='d'||k==='arrowright')keys.d=0;\n    pushMove();\n  });\n  // mouse aim (desktop)\n  var mouse={x:0,y:0,has:false};\n  canvas.addEventListener('mousemove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.has=true; });\n  canvas.addEventListener('mousedown',function(e){ if(e.button===0&&!firing){firing=true;send({t:'fire',on:true});} });\n  window.addEventListener('mouseup',function(e){ if(e.button===0&&firing){firing=false;send({t:'fire',on:false});} });\n  // send aim ~20/s toward mouse from my sheep\n  setInterval(function(){\n    if(gateOpen) return;\n    var me=players.get(myId); if(!me) return;\n    if(!isTouch && mouse.has){\n      var w=screenToWorld(mouse.x,mouse.y);\n      var a=Math.atan2(w.y-me.ry, w.x-me.rx);\n      if(Math.abs(a-lastAim)>0.02){ lastAim=a; send({t:'aim',a:a}); }\n    }\n  },55);\n\n  /* ---------- input: touch (mobile twin-stick) ---------- */\n  var joyActive=false, joyVec={x:0,y:0}, joyId=null, joyCX=0, joyCY=0;\n  var stick=$('#stick'), nub=$('#nub'), fireBtn=$('#fireBtn');\n  function stickStart(t){\n    joyId=t.identifier; joyActive=true;\n    var r=stick.getBoundingClientRect(); joyCX=r.left+r.width/2; joyCY=r.top+r.height/2;\n    stickMove(t);\n  }\n  function stickMove(t){\n    var dx=t.clientX-joyCX, dy=t.clientY-joyCY, d=Math.hypot(dx,dy), max=44;\n    var cl=Math.min(d,max);\n    var nx=d>0?dx/d*cl:0, ny=d>0?dy/d*cl:0;\n    nub.style.transform='translate('+nx+'px,'+ny+'px)';\n    joyVec={x:d>0?dx/d*Math.min(1,d/max):0,\
    \ y:d>0?dy/d*Math.min(1,d/max):0};\n    pushMove();\n  }\n  function stickEnd(){ joyActive=false; joyVec={x:0,y:0}; nub.style.transform=''; pushMove(); }\n  stick.addEventListener('touchstart',function(e){e.preventDefault();stickStart(e.changedTouches[0]);},{passive:false});\n\n  // fire button aims toward nearest other sheep OR movement dir, and fires\n  var fireId=null;\n  fireBtn.addEventListener('touchstart',function(e){e.preventDefault();fireId=e.changedTouches[0].identifier;\n    if(!firing){firing=true;send({t:'fire',on:true});}},{passive:false});\n\n  // right-side drag to aim (anywhere not on stick/fire)\n  var aimTouchId=null;\n  window.addEventListener('touchmove',function(e){\n    for(var i=0;i<e.changedTouches.length;i++){\n      var t=e.changedTouches[i];\n      if(t.identifier===joyId){stickMove(t);}\n      else if(t.identifier===aimTouchId){aimFromTouch(t);}\n    }\n  },{passive:false});\n  window.addEventListener('touchstart',function(e){\n    if(gateOpen) return;\n    for(var i=0;i<e.changedTouches.length;i++){\n      var t=e.changedTouches[i], el=document.elementFromPoint(t.clientX,t.clientY);\n      if(el===stick||stick.contains(el)) continue;\n      if(el===fireBtn) continue;\n      if(el&&el.closest&&el.closest('#chatWrap')) continue;\n      // treat as aim touch on the play area (right side)\n      if(aimTouchId===null && t.clientX>window.innerWidth*0.42){ aimTouchId=t.identifier; aimFromTouch(t); if(!firing){firing=true;send({t:'fire',on:true});} }\n    }\n  },{passive:true});\n  function aimFromTouch(t){\n    var me=players.get(myId); if(!me) return;\n    var w=screenToWorld(t.clientX,t.clientY);\n    var a=Math.atan2(w.y-me.ry, w.x-me.rx);\n    send({t:'aim',a:a});\n  }\n  window.addEventListener('touchend',function(e){\n    for(var i=0;i<e.changedTouches.length;i++){\n      var id=e.changedTouches[i].identifier;\n      if(id===joyId){joyId=null;stickEnd();}\n      if(id===fireId){fireId=null; if(firing&&aimTouchId===null){firing=false;send({t:'fire',on:false});}}\n      if(id===aimTouchId){aimTouchId=null; if(firing&&fireId===null){firing=false;send({t:'fire',on:false});}}\n    }\n  });\n  // touch fire also needs an aim; if no aim touch, aim toward nearest sheep\n  setInterval(function(){\n    if(!isTouch||!firing||aimTouchId!==null) return;\n    var me=players.get(myId); if(!me) return;\n    var best=null,bd=1e9;\n    players.forEach(function(p,id){ if(id===myId||p.drenched)return; var d=Math.hypot(p.rx-me.rx,p.ry-me.ry); if(d<bd){bd=d;best=p;} });\n    if(best){ send({t:'aim',a:Math.atan2(best.ry-me.ry,best.rx-me.rx)}); }\n    else if(joyActive){ send({t:'aim',a:Math.atan2(joyVec.y,joyVec.x)}); }\n  },90);\n\n  /* ---------- chat ---------- */\n  function sendChat(){\n    var v=$('#chatIn').value.trim(); if(!v) return;\n    send({t:'chat',text:v}); $('#chatIn').value=''; $('#chatIn').blur();\n  }\n  $('#chatIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();sendChat();} });\n  var chatMsgs=[];\n  function addChat(m){\n    var d=document.createElement('div'); d.className='cmsg';\n    d.innerHTML='<b style=\"color:hsl('+m.hue+',60%,45%)\">'+esc(m.name)+'</b> '+esc(m.text);\n    $('#chatLog').appendChild(d);\n    chatMsgs.push({d:d,t:Date.now()});\n    while($('#chatLog').children.length>5) $('#chatLog').removeChild($('#chatLog').firstChild);\n    var p=players.get(m.id); if(p){ p.bubble=m.text; p.bubbleT=Date.now(); }\n  }\n  setInterval(function(){\n    var now=Date.now();\n    for(var i=chatMsgs.length-1;i>=0;i--){ if(now-chatMsgs[i].t>9000){ if(chatMsgs[i].d.parentNode)chatMsgs[i].d.parentNode.removeChild(chatMsgs[i].d); chatMsgs.splice(i,1);} }\n  },1000);\n\n  /* ---------- fx ---------- */\n  function mkPop(x,y,em){ return {x:x,y:y,vy:-1.2-Math.random()*1.2,vx:(Math.random()-.5)*2,life:1,em:em}; }\n  function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show')},1600); }\n  var audio=null;\n  function ping(freq){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)();\n\
    \    var o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=freq; o.type='sine';\n    o.connect(g); g.connect(audio.destination); g.gain.value=.12;\n    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3); o.start(); o.stop(audio.currentTime+.3);\n  }catch(e){} }\n\n  /* ---------- render ---------- */\n  var lastT=performance.now();\n  function frame(now){\n    var dt=Math.min(50,now-lastT)/1000; lastT=now;\n    // interpolate positions\n    players.forEach(function(p){\n      p.rx=(p.rx==null?p.x:p.rx)+((p.x-p.rx)*Math.min(1,dt*12));\n      p.ry=(p.ry==null?p.y:p.ry)+((p.y-p.ry)*Math.min(1,dt*12));\n    });\n    draw(dt);\n    requestAnimationFrame(frame);\n  }\n  function draw(dt){\n    var s=view.scale, dpr=view.dpr;\n    ctx.setTransform(s*dpr,0,0,s*dpr,0,0);\n    // grass\n    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#c9edb0'); g.addColorStop(1,'#a9dc8c');\n    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);\n    // soft grass texture dots\n    ctx.globalAlpha=.18;\n    for(var gx=0;gx<W;gx+=48) for(var gy=0;gy<H;gy+=48){ ctx.fillStyle='#8fce74'; ctx.beginPath(); ctx.arc(gx+((gy/48)%2)*24,gy,3,0,7); ctx.fill(); }\n    ctx.globalAlpha=1;\n    // fence border\n    ctx.strokeStyle='#e9d3a8'; ctx.lineWidth=10; ctx.strokeRect(5,5,W-10,H-10);\n    ctx.strokeStyle='#d8bd86'; ctx.lineWidth=4; ctx.strokeRect(5,5,W-10,H-10);\n\n    // puddles\n    for(var i=puddles.length-1;i>=0;i--){ var pu=puddles[i]; pu.life-=dt*0.4;\n      if(pu.life<=0){puddles.splice(i,1);continue;}\n      ctx.globalAlpha=pu.life*0.5; ctx.fillStyle='#8fd0ff';\n      ctx.beginPath(); ctx.ellipse(pu.x,pu.y,pu.r,pu.r*0.55,0,0,7); ctx.fill(); ctx.globalAlpha=1;\n    }\n\n    // well\n    drawWell();\n\n    // water streams (from firing players)\n    players.forEach(function(p){ if(p.firing){ drawStream(p); if(Math.random()<0.5) puddles.push({x:p.rx+Math.cos(p.aim)*(180+Math.random()*80),y:p.ry+Math.sin(p.aim)*(180+Math.random()*80),r:8+Math.random()*10,life:1}); } });\n\n    // sheep sorted by y\n    var arr=[...players.entries()].sort(function(a,b){return a[1].ry-b[1].ry});\n    arr.forEach(function(e){ drawSheep(e[0],e[1]); });\n\n    // pops\n    for(var j=pops.length-1;j>=0;j--){ var po=pops[j]; po.x+=po.vx; po.y+=po.vy; po.vy+=0.05; po.life-=dt*1.2;\n      if(po.life<=0){pops.splice(j,1);continue;}\n      ctx.globalAlpha=Math.max(0,po.life); ctx.font='20px serif'; ctx.textAlign='center';\n      ctx.fillText(po.em,po.x,po.y); ctx.globalAlpha=1;\n    }\n  }\n  function drawWell(){\n    var w=WELL;\n    // water puddle ring\n    ctx.fillStyle='#bfe6ff'; ctx.beginPath(); ctx.ellipse(w.x,w.y+8,w.r+22,(w.r+22)*0.5,0,0,7); ctx.fill();\n    // stone base\n    ctx.fillStyle='#cbb79a'; ctx.beginPath(); ctx.ellipse(w.x,w.y,w.r,w.r*0.62,0,0,7); ctx.fill();\n    ctx.fillStyle='#8fbfe0'; ctx.beginPath(); ctx.ellipse(w.x,w.y-4,w.r*0.6,w.r*0.36,0,0,7); ctx.fill();\n    // roof posts + roof\n    ctx.strokeStyle='#a9855a'; ctx.lineWidth=8;\n    ctx.beginPath(); ctx.moveTo(w.x-w.r*0.7,w.y);ctx.lineTo(w.x-w.r*0.7,w.y-70); ctx.moveTo(w.x+w.r*0.7,w.y);ctx.lineTo(w.x+w.r*0.7,w.y-70); ctx.stroke();\n    ctx.fillStyle='#e28d8d'; ctx.beginPath(); ctx.moveTo(w.x-w.r-8,w.y-64); ctx.lineTo(w.x+w.r+8,w.y-64); ctx.lineTo(w.x,w.y-102); ctx.closePath(); ctx.fill();\n    ctx.font='16px serif'; ctx.textAlign='center'; ctx.fillText('\U0001FAA3',w.x,w.y+3);\n  }\n  function drawStream(p){\n    var n=10;\n    for(var i=0;i<n;i++){\n      var spread=(Math.random()-0.5)*0.34;\n      var ang=p.aim+spread;\n      var dist=30+Math.random()*260*(0.4+ (p.tank||100)/160);\n      var x=p.rx+Math.cos(ang)*dist, y=p.ry+Math.sin(ang)*dist;\n      var r=2+Math.random()*4*(1-dist/320);\n      ctx.globalAlpha=0.55*(1-dist/340);\n      ctx.fillStyle=i%3?'#9fd8ff':'#6fbdf5';\n      ctx.beginPath(); ctx.arc(x,y,Math.max(1,r),0,7); ctx.fill();\n    }\n    ctx.globalAlpha=1;\n  }\n  function drawSheep(id,p){\n    var x=p.rx, y=p.ry, wet=p.wet||0, r=roster.get(id);\n    var hue=r?r.hue:200, name=r?r.name:'', mine=(id===myId);\n    ctx.save(); ctx.translate(x,y);\n    //\
    \ shadow\n    ctx.fillStyle='rgba(60,90,40,.18)'; ctx.beginPath(); ctx.ellipse(0,24,26,9,0,0,7); ctx.fill();\n\n    if(p.drenched){\n      // sitting in a puddle, dripping\n      ctx.fillStyle='rgba(120,200,255,.55)'; ctx.beginPath(); ctx.ellipse(0,20,34,12,0,0,7); ctx.fill();\n    }\n    // facing flip for gun\n    var faceRight=Math.cos(p.aim)>=0;\n    // wool body — pastel, tinted bluer when wet\n    var wl=wet/100;\n    var bodyCol='hsl('+hue+','+(52-wl*30)+'%,'+(88-wl*22)+'%)';\n    // wool bumps\n    ctx.fillStyle=bodyCol;\n    var bumps=[[-16,-2,15],[0,-10,17],[16,-2,15],[-9,8,13],[9,8,13],[0,4,16]];\n    bumps.forEach(function(b){ctx.beginPath();ctx.arc(b[0],b[1],b[2],0,7);ctx.fill();});\n    // wet sheen\n    if(wl>0.05){ ctx.globalAlpha=wl*0.5; ctx.fillStyle='#bfe6ff'; ctx.beginPath(); ctx.arc(0,-2,20,0,7); ctx.fill(); ctx.globalAlpha=1; }\n    // face\n    var fx=faceRight?12:-12;\n    ctx.fillStyle='#5a4a40'; ctx.beginPath(); ctx.ellipse(fx,2,10,11,0,0,7); ctx.fill();\n    ctx.fillStyle='#fff';\n    ctx.beginPath(); ctx.arc(fx+(faceRight?2:-2),-1,2.3,0,7); ctx.fill();\n    // squirt gun (little nozzle pointing at aim)\n    if(!p.drenched){\n      ctx.rotate(p.aim);\n      ctx.fillStyle='#ff8fb0'; ctx.fillRect(14,-4,16,8);\n      ctx.fillStyle='var(--terra)'; ctx.fillRect(28,-3,5,6);\n      ctx.rotate(-p.aim);\n    }\n    // drips when wet\n    if(wl>0.35 && Math.random()<0.3){ pops.push(mkPop(x+(Math.random()-.5)*26, y+14, '\U0001F4A7')); }\n    ctx.restore();\n\n    // wetness bar\n    if(wet>3 && !p.drenched){\n      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(x-20,y-34,40,7);\n      ctx.fillStyle=wet>75?'#4aa8f0':'#8fd0ff'; ctx.fillRect(x-20,y-34,40*wet/100,7);\n    }\n    // name\n    ctx.font='bold 13px sans-serif'; ctx.textAlign='center';\n    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillText(name,x,y-40);\n    ctx.fillStyle=mine?'var(--terra)':'#4a3b32'; ctx.fillText(name,x,y-41);\n    if(mine){ ctx.fillStyle='var(--terra)'; ctx.beginPath(); ctx.arc(x,y-54,3,0,7); ctx.fill(); }\n    // chat bubble\n    if(p.bubble && Date.now()-p.bubbleT<5000){\n      var txt=p.bubble.slice(0,40);\n      ctx.font='12px sans-serif'; var tw=ctx.measureText(txt).width+16;\n      ctx.fillStyle='rgba(255,253,246,.95)';\n      roundRect(x-tw/2,y-72,tw,22,10); ctx.fill();\n      ctx.fillStyle='#4a3b32'; ctx.fillText(txt,x,y-57);\n    }\n  }\n  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }\n\n  /* ---------- gate ---------- */\n  var gateOpen=true;\n  if(myName) $('#nameIn').value=myName;\n  function startGame(){\n    var v=$('#nameIn').value.trim(); if(v){ myName=v; localStorage.setItem('chill-name',v); }\n    else { myName='Sheep'; }\n    gateOpen=false; $('#gate').style.display='none';\n    connect(); requestAnimationFrame(frame);\n    // resume audio on gesture\n    try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume(); }catch(e){}\n  }\n  $('#go').addEventListener('click',startGame);\n  $('#nameIn').addEventListener('keydown',function(e){ if(e.key==='Enter')startGame(); });\n\n  // takeover overlay (4001)\n  var _c=WebSocket; // not needed; handle via close code\n  // Detect 4001 via onclose code:\n  (function(){\n    var origConnect=connect;\n    connect=function(){\n      var proto=location.protocol==='https:'?'wss':'ws';\n      ws=new WebSocket(proto+'://'+location.host+'/xw');\n      ws.onopen=function(){wsReady=true; send({t:'hello',token:token,name:myName});};\n      ws.onclose=function(ev){ wsReady=false; if(ev&&ev.code===4001){ $('#over').style.display='flex'; return; } setTimeout(connect,1500); };\n      ws.onerror=function(){try{ws.close()}catch(e){}};\n      ws.onmessage=onMsg;\n    };\n  })();\n  $('#takeover').addEventListener('click',function(){ $('#over').style.display='none'; connect(); });\n})();\n</script>\n</body>\n</html>\n"
