      var root = document.documentElement, tBtn = document.getElementById("themeBtn"), banner = document.querySelector(".banner");
      var MODES = ["auto","day","night"], mode = "auto";
      try { var sm = localStorage.getItem("chill-mode"); if (MODES.indexOf(sm) >= 0) mode = sm; } catch(e){}
      var SKY = [
        { h:0,l:[[20,18,48],[58,37,69]] },{ h:6,l:[[90,74,123],[240,161,90]] },{ h:9,l:[[125,180,224],[242,230,190]] },
        { h:13,l:[[109,176,232],[233,241,218]] },{ h:17,l:[[111,168,216],[244,165,92]] },{ h:19,l:[[106,90,154],[242,184,74]] },
        { h:20.5,l:[[43,42,90],[194,91,84]] },{ h:22,l:[[23,20,54],[74,44,72]] },{ h:24,l:[[20,18,48],[58,37,69]] }
      ];
      function lerp(a,b,t){ return a+(b-a)*t; }
      function rgb(a){ return "rgb("+Math.round(a[0])+","+Math.round(a[1])+","+Math.round(a[2])+")"; }
      function skyAt(h){
        for (var i=0;i<SKY.length-1;i++) if (h>=SKY[i].h && h<=SKY[i+1].h){
          var t=(h-SKY[i].h)/(SKY[i+1].h-SKY[i].h), o=[];
          for (var k=0;k<2;k++) o.push([lerp(SKY[i].l[k][0],SKY[i+1].l[k][0],t),lerp(SKY[i].l[k][1],SKY[i+1].l[k][1],t),lerp(SKY[i].l[k][2],SKY[i+1].l[k][2],t)]);
          return o;
        }
        return SKY[0].l;
      }
      function effHour(){ if (mode==="day") return 13; if (mode==="night") return 22.5; var d=new Date(); return d.getHours()+d.getMinutes()/60; }
      function applyScene(){
        var h=effHour(), night=(h<6||h>=19.5), c=skyAt(h);
        banner.style.background = "linear-gradient(180deg,"+rgb(c[0])+","+rgb(c[1])+" 130%)";
        root.setAttribute("data-theme", night ? "dark" : "light");
        tBtn.textContent = mode==="auto" ? "🕐" : (mode==="day" ? "☀️" : "🌙");
        tBtn.title = "Time of day: " + mode + (mode==="auto" ? " — follows your local time" : " (locked)");
      }
      tBtn.addEventListener("click", function(){
        mode = MODES[(MODES.indexOf(mode)+1) % MODES.length];
        try { localStorage.setItem("chill-mode", mode); } catch(e){}
