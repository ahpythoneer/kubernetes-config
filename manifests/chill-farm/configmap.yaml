var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.btn,.cta,.dd-toggle{ box-shadow:0 5px 0 rgba(74,47,28,.28) !important; }\n.btn:active,.cta:active,.dd-toggle:active{ transform:translateY(3px) !important; box-shadow:0 2px 0 rgba(74,47,28,.28) !important; }\n.btn:hover,.cta:hover{ transform:translateY(-2px); }\n.dd-menu{ border-radius:18px !important; overflow:hidden;\n  box-shadow:0 8px 0 rgba(74,47,28,.2), 0 14px 24px rgba(20,12,6,.28) !important; }\n.dd-menu a{ transition:background .12s ease; }\n.badge,.badgecard{ box-shadow:0 3px 0 rgba(74,47,28,.28) !important; }\n.chill-modal__card,.chill-police__card,.ledger-panel,.badgecard{ border-radius:22px !important; }\n.navlinks a{ border-radius:12px !important; }\n</style>\n\n<header class=\"topbar\">\n  <a class=\"brand\" href=\"/\"><span class=\"badge\">\U0001F920</span> Chill&nbsp;Farm</a>\n  <nav class=\"navlinks\">\n    <a href=\"/\" class=\"home-link\">Home</a>\n    <a href=\"/#crew\">The Crew</a>\n    <a href=\"/#values\">How We Chill</a>\n    <div class=\"dropdown\">\n      <button type=\"button\" class=\"dd-toggle\" aria-haspopup=\"true\" aria-expanded=\"false\">Chill Zone ▾</button>\n      <div class=\"dd-menu\">\n        <a href=\"/pasture/\">\U0001F411 The Pasture</a>\n        <a href=\"/ranch/\">\U0001F319 The Ranch</a>\n        <a href=\"/pond/\">\U0001F3A3 The Pond</a>\n        <a href=\"/cross/\">\U0001F6A6 Hoof It!</a>\n      </div>\n    </div>\n    <button class=\"theme-toggle\" id=\"themeBtn\" aria-label=\"Change the time of day\" title=\"Sunrise / Sunset\">\U0001F324️</button>\n  </nav>\n</header>\n\n<section class=\"banner\">\n  <div class=\"sun\" aria-hidden=\"true\"></div>\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Now Hiring · Always Open</span>\n    <h1>Come Work<br>Absolutely Nothing</h1>\n    <p class=\"lead\">We've got so much chill in the backlog that we simply cannot get to it all ourselves. If you can sit still and mean it, there's a hammock here with your name on it.</p>\n    <span class=\"pill\">Salary: paid in sunsets \U0001F305 · Benefits: shade, snacks, silence</span>\n\
    \  </div>\n</section>\n\n<main>\n  <section class=\"band\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Open Roles</span>\n      </div>\n      <div class=\"jobs\">\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F6D6</div>\n          <div class=\"dept\">Relaxation Engineering</div>\n          <h3>Senior Hammock Engineer</h3>\n          <p>Architect, load-test, and personally occupy hammocks across the ranch. Must have strong opinions on the ideal sway frequency.</p>\n          <div class=\"meta\"><span class=\"tag\">Full-recline</span><span class=\"tag\">On-site (a tree)</span><span class=\"tag\">Sr. level</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F634</div>\n          <div class=\"dept\">Executive Lounge</div>\n          <h3>VP of Doing Nothing</h3>\n          <p>Lead by example. Set the strategic direction for our nothing initiatives and hold zero meetings. Extensive nothing experience required.</p>\n          <div class=\"meta\"><span class=\"tag\">Leadership</span><span class=\"tag\">Fully idle</span><span class=\"tag\">Equity in naps</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️☀️☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F305</div>\n          <div class=\"dept\">Ambiance</div>\n          <h3>Sunset Coordination Lead</h3>\n          <p>Own the golden hour end-to-end. Ensure every evening lands on exactly the right shade of amber. Cloud-arranging a plus.</p>\n          <div class=\"meta\"><span class=\"tag\">Evenings only</span><span class=\"tag\">Outdoors</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F34B</div>\n          <div class=\"dept\">Hospitality</div>\n          <h3>Head of Lemonade</h3>\n          <p>Keep every pitcher full and every glass clinking. You'll set our refreshment roadmap and taste-test aggressively. Own the whole squeeze.</p>\n          <div class=\"meta\"><span class=\"tag\">Shade provided</span><span class=\"tag\">Snacks incl.</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F408</div>\n          <div class=\"dept\">R&amp;D · Rest &amp; Dreams</div>\n          <h3>Junior Nap Quality Analyst</h3>\n          <p>Report directly to the Chief Napping Officer. Rigorously evaluate nap depth, blanket softness, and afternoon-light quality. Yawning encouraged.</p>\n          <div class=\"meta\"><span class=\"tag\">Entry level</span><span class=\"tag\">Cushions supplied</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">☁️</div>\n          <div class=\"dept\">Observation</div>\n          <h3>Cloud Watcher</h3>\n          <p>Lie on your back and identify shapes. Strictly no cloud <em>infrastructure</em> experience required — in fact, we'd prefer you forgot all that.</p>\n          <div class=\"meta\"><span class=\"tag\">Remote (a field)</span><span class=\"tag\">Flexible</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F3B8</div>\n          <div class=\"dept\">Culture</div>\n          <h3>Porch Vibes Curator</h3>\n          <p>From\
    \ a rocking chair, curate the ranch's acoustic ambiance. Gentle strumming, tasteful humming. Must own at least one comfortable hat.</p>\n          <div class=\"meta\"><span class=\"tag\">Part-time</span><span class=\"tag\">BYO hat</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n        <article class=\"job reveal\">\n          <div class=\"ji\">\U0001F33E</div>\n          <div class=\"dept\">Grounds</div>\n          <h3>Tumbleweed Wrangler</h3>\n          <p>Gently redirect our free-range tumbleweeds toward more scenic routes. The only hard requirement: you must move slowly at all times.</p>\n          <div class=\"meta\"><span class=\"tag\">Seasonal</span><span class=\"tag\">Low urgency</span></div>\n          <div class=\"foot\"><span class=\"pay\">☀️☀️</span><button class=\"btn js-apply\" type=\"button\">Apply</button></div>\n        </article>\n\n      </div>\n    </div>\n  </section>\n\n  <section class=\"band closing\">\n    <div class=\"wrap reveal\">\n      <h2>Don't See Your Dream Nap?</h2>\n      <p>We're flexible. If your particular flavor of doing-very-little isn't listed, tell us about it — eventually.</p>\n      <button class=\"btn big js-apply\" type=\"button\">Apply to Chill Anyway</button>\n    </div>\n  </section>\n</main>\n\n<footer>\n  <div class=\"fbrand\">\U0001F920 Chill Farm</div>\n  <div class=\"crew\">\n    Aman Patel · CEO &nbsp;|&nbsp; Cody Beeston · CTO<br>\n    Joseph Taylor · COO &nbsp;|&nbsp; Elias Torres · CFO<br>\n    Francisco Ramos · CPO\n  </div>\n  <div class=\"fine\">\n    <a href=\"/\">← back to the ranch</a><br>\n    only-chill.com — all positions permanently, blissfully open.\n  </div>\n</footer>\n\n<a class=\"presence\" id=\"presence\" href=\"/pasture/\" title=\"Join the herd\"><span class=\"dot\"></span><b id=\"presCount\">0</b>&nbsp;grazing in The Commons →</a>\n\n<div class=\"chill-police\" id=\"chillPolice\" aria-hidden=\"true\">\n  <div class=\"chill-police__card\">\n    <div class=\"cp-emoji\" id=\"cpEmoji\">\U0001F422</div>\n    <h3 id=\"cpTitle\">Whoa there, partner</h3>\n    <p id=\"cpMsg\">Careers are a marathon, not a sprint. Actually — neither. Slow down.</p>\n  </div>\n</div>\n\n<div class=\"chill-modal\" id=\"chillModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cmTitle\">\n  <div class=\"chill-modal__card\">\n    <div class=\"cm-emoji\">\U0001F334</div>\n    <h2 id=\"cmTitle\">Chill, lad —<br>you're working too hard</h2>\n    <p>Applications are closed on account of it being a <em>beautiful day</em>. Go find a hammock — we'll notice you eventually.</p>\n    <button class=\"btn\" type=\"button\" data-close style=\"margin-top:1.4rem;\">Okay, I'll relax \U0001F60C</button>\n  </div>\n</div>\n\n<script>\n(function(){\n  \"use strict\";\n  // time-of-day: the ranch matches your real clock (light lifts the banner sky, night lowers a moon)\n  var root = document.documentElement, tBtn = document.getElementById(\"themeBtn\"), banner = document.querySelector(\".banner\");\n  var MODES = [\"auto\",\"day\",\"night\"], mode = \"auto\";\n  try { var sm = localStorage.getItem(\"chill-mode\"); if (MODES.indexOf(sm) >= 0) mode = sm; } catch(e){}\n  var SKY = [\n    { h:0,l:[[20,18,48],[58,37,69]] },{ h:6,l:[[90,74,123],[240,161,90]] },{ h:9,l:[[125,180,224],[242,230,190]] },\n    { h:13,l:[[109,176,232],[233,241,218]] },{ h:17,l:[[111,168,216],[244,165,92]] },{ h:19,l:[[106,90,154],[242,184,74]] },\n    { h:20.5,l:[[43,42,90],[194,91,84]] },{ h:22,l:[[23,20,54],[74,44,72]] },{ h:24,l:[[20,18,48],[58,37,69]] }\n  ];\n  function lerp(a,b,t){ return a+(b-a)*t; }\n  function rgb(a){ return \"rgb(\"+Math.round(a[0])+\",\"+Math.round(a[1])+\",\"+Math.round(a[2])+\")\"; }\n  function skyAt(h){\n    for (var i=0;i<SKY.length-1;i++) if (h>=SKY[i].h && h<=SKY[i+1].h){\n      var t=(h-SKY[i].h)/(SKY[i+1].h-SKY[i].h), o=[];\n      for (var k=0;k<2;k++) o.push([lerp(SKY[i].l[k][0],SKY[i+1].l[k][0],t),lerp(SKY[i].l[k][1],SKY[i+1].l[k][1],t),lerp(SKY[i].l[k][2],SKY[i+1].l[k][2],t)]);\n\
    \      return o;\n    }\n    return SKY[0].l;\n  }\n  function effHour(){ if (mode===\"day\") return 13; if (mode===\"night\") return 22.5; var d=new Date(); return d.getHours()+d.getMinutes()/60; }\n  function applyScene(){\n    var h=effHour(), night=(h<6||h>=19.5), c=skyAt(h);\n    banner.style.background = \"linear-gradient(180deg,\"+rgb(c[0])+\",\"+rgb(c[1])+\" 130%)\";\n    root.setAttribute(\"data-theme\", night ? \"dark\" : \"light\");\n    tBtn.textContent = mode===\"auto\" ? \"\U0001F550\" : (mode===\"day\" ? \"☀️\" : \"\U0001F319\");\n    tBtn.title = \"Time of day: \" + mode + (mode===\"auto\" ? \" — follows your local time\" : \" (locked)\");\n  }\n  tBtn.addEventListener(\"click\", function(){\n    mode = MODES[(MODES.indexOf(mode)+1) % MODES.length];\n    try { localStorage.setItem(\"chill-mode\", mode); } catch(e){}\n    applyScene();\n  });\n  applyScene(); setInterval(applyScene, 60000);\n\n  // live presence from the pasture\n  var presEl = document.getElementById(\"presence\"), presCount = document.getElementById(\"presCount\");\n  function pollPresence(){\n    fetch(\"/ws/stats\", { cache:\"no-store\" }).then(function(r){ return r.json(); }).then(function(d){\n      if (d && d.sheep > 0){ presCount.textContent = d.sheep; presEl.classList.add(\"show\"); }\n      else presEl.classList.remove(\"show\");\n    }).catch(function(){});\n  }\n  pollPresence(); setInterval(pollPresence, 5000);\n\n  // Chill Zone dropdown\n  document.querySelectorAll(\".dropdown\").forEach(function(dd){\n    var btn = dd.querySelector(\".dd-toggle\");\n    btn.addEventListener(\"click\", function(e){ e.stopPropagation(); var open = dd.classList.toggle(\"open\"); btn.setAttribute(\"aria-expanded\", open ? \"true\" : \"false\"); });\n  });\n  document.addEventListener(\"click\", function(){ document.querySelectorAll(\".dropdown.open\").forEach(function(dd){ dd.classList.remove(\"open\"); dd.querySelector(\".dd-toggle\").setAttribute(\"aria-expanded\",\"false\"); }); });\n  document.addEventListener(\"keydown\", function(e){ if (e.key === \"Escape\") document.querySelectorAll(\".dropdown.open\").forEach(function(dd){ dd.classList.remove(\"open\"); }); });\n\n  var io = new IntersectionObserver(function(entries){\n    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add(\"in\"); io.unobserve(e.target); } });\n  }, { threshold:.12, rootMargin:\"0px 0px -8% 0px\" });\n  document.querySelectorAll(\".reveal\").forEach(function(el){ io.observe(el); });\n\n  var modal = document.getElementById(\"chillModal\");\n  function openModal(){ modal.classList.add(\"open\"); var b = modal.querySelector(\"[data-close]\"); if (b) b.focus(); }\n  function closeModal(){ modal.classList.remove(\"open\"); }\n  document.querySelectorAll(\".js-apply\").forEach(function(el){ el.addEventListener(\"click\", function(e){ e.preventDefault(); openModal(); }); });\n  modal.addEventListener(\"click\", function(e){ if (e.target === modal || e.target.hasAttribute(\"data-close\")) closeModal(); });\n  addEventListener(\"keydown\", function(e){ if (e.key === \"Escape\" && modal.classList.contains(\"open\")) closeModal(); });\n\n  /* scroll cop */\n  var CP = document.getElementById(\"chillPolice\"),\n      cpEmoji = document.getElementById(\"cpEmoji\"), cpTitle = document.getElementById(\"cpTitle\"), cpMsg = document.getElementById(\"cpMsg\");\n  var CP_MSGS = [\n    { e:\"\U0001F422\", t:\"Whoa there, partner\", m:\"This is a chill farm — ease off the throttle.\" },\n    { e:\"\U0001F60E\", t:\"Too much hustle\", m:\"You're scrolling like it's a Monday. Breathe.\" },\n    { e:\"\U0001F335\", t:\"Easy, cowboy\", m:\"These jobs aren't going anywhere. Neither should you.\" },\n    { e:\"\U0001F9D8\", t:\"Please relax\", m:\"Detected: excessive productivity energy. Slow it down.\" },\n    { e:\"\U0001F379\", t:\"Sip, don't gulp\", m:\"Read the listings at ranch speed.\" }\n  ];\n  var cpCount = 0, cpCool = false, cpHideT, cpSamples = [];\n  function pnow(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }\n  function\
    \ cpFire(){\n    if (cpCool) return;\n    var m = (cpCount >= CP_MSGS.length + 2)\n      ? { e:\"\U0001F624\", t:\"Okay, showoff\", m:\"You're speed-running our whole vibe on purpose now.\" }\n      : CP_MSGS[cpCount % CP_MSGS.length];\n    cpCount++;\n    cpEmoji.textContent = m.e; cpTitle.textContent = m.t; cpMsg.textContent = m.m;\n    CP.classList.add(\"show\");\n    clearTimeout(cpHideT); cpHideT = setTimeout(function(){ CP.classList.remove(\"show\"); }, 2200);\n    cpCool = true; setTimeout(function(){ cpCool = false; }, 9000);\n  }\n  addEventListener(\"scroll\", function(){\n    var t = pnow(), y = window.scrollY || document.documentElement.scrollTop || 0;\n    cpSamples.push([t, y]);\n    while (cpSamples.length > 1 && t - cpSamples[0][0] > 450) cpSamples.shift();\n    if (cpSamples.length > 1){\n      var span = t - cpSamples[0][0], dist = Math.abs(y - cpSamples[0][1]);\n      if (span > 0 && dist > 500 && dist / span > 2.3) cpFire();\n    }\n  }, { passive: true });\n\n  try { console.log(\"%c\U0001F920 Chill Farm careers — you're already overqualified.\",\"font:13px monospace;color:#7a4a26;\"); } catch(_){}\n})();\n</script>\n"
  pasture.html: "<meta charset=\"utf-8\" />\n<title>The Commons — Chill Farm Pasture</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\" />\n<meta name=\"description\" content=\"A shared, slow multiplayer meadow. Everyone who visits is a sheep. Move your pointer to graze. No score, no rush.\" />\n<link rel=\"manifest\" href=\"/manifest.json\" />\n<meta name=\"theme-color\" content=\"#2b2a4a\" />\n<link rel=\"apple-touch-icon\" href=\"/icon-192.png\" />\n<link rel=\"icon\" href=\"/icon-192.png\" />\n<meta property=\"og:title\" content=\"The Pasture — Chill Farm\" />\n<meta property=\"og:description\" content=\"A shared, slow multiplayer meadow. Everyone who visits is a sheep. Graze, nap, and chat with the AI C-suite. No score, no rush.\" />\n<meta property=\"og:image\" content=\"https://only-chill.com/og-image.png\" />\n<meta property=\"og:url\" content=\"https://only-chill.com/pasture/\" />\n<meta property=\"og:type\" content=\"website\" />\n<meta name=\"twitter:card\" content=\"summary_large_image\" />\n<script>if(\"serviceWorker\" in navigator)addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/sw.js\").catch(function(){});});</script>\n<style>\n  :root{\n    --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#4a2f1c; --terra:#c15a34;\n    --parch:#f4ead0; --ink:#33261a; --ink-soft:#5c4a38;\n    --display:\"Rockwell\",\"Rockwell Nova\",\"Roboto Slab\",\"Courier New\",Georgia,serif;\n    --body:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n    --mono:\"Courier New\",ui-monospace,monospace;\n    --ease:cubic-bezier(.22,.61,.36,1);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;overflow:hidden;background:#4a6b32;font-family:var(--body);color:var(--ink);}\n  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;}\n\n  .hud{position:fixed;z-index:5;pointer-events:none;font-family:var(--mono);}\n  .top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;padding:.8rem 1rem;\n    background:linear-gradient(180deg, rgba(30,20,12,.55), transparent);}\n  .top a,.top button{pointer-events:auto;}\n  .brand{display:flex;align-items:center;gap:.5rem;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;\n    color:#fff;text-decoration:none;text-shadow:0 2px 4px rgba(0,0,0,.5);}\n  .brand .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--wheat);color:var(--saddle-dk);\n    border-radius:50%;font-size:1rem;box-shadow:inset 0 0 0 2px var(--saddle-dk);}\n  .stats{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;}\n  .chip{background:rgba(30,20,12,.6);color:#ffe6ad;border:1px solid rgba(217,164,65,.5);border-radius:30px;\n    padding:.35rem .8rem;font-size:.76rem;letter-spacing:.06em;white-space:nowrap;backdrop-filter:blur(3px);}\n  .chip b{color:#fff;font-variant-numeric:tabular-nums;}\n\n  .meter{margin-top:.3rem;width:150px;height:9px;border-radius:6px;background:rgba(0,0,0,.4);\n    border:1px solid rgba(255,255,255,.2);overflow:hidden;}\n  .meter>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--wheat),#8bd06a);transition:width .5s var(--ease);}\n\n  .hint{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:5;pointer-events:none;\n    background:rgba(30,20,12,.6);color:#f4ead0;border:1px solid rgba(217,164,65,.4);border-radius:30px;\n    padding:.5rem 1.1rem;font-family:var(--mono);font-size:.76rem;letter-spacing:.05em;backdrop-filter:blur(3px);\n    text-align:center;max-width:92vw;transition:opacity 1s var(--ease);}\n  .hint.fade{opacity:0;}\n\n  .conn{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(30,20,12,.75);\n    color:#ffe6ad;font-family:var(--mono);font-size:.9rem;letter-spacing:.08em;text-align:center;transition:opacity .6s;}\n  .conn.hide{opacity:0;pointer-events:none;}\n  .conn .big{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;margin-bottom:.4rem;color:#fff;}\n\
    \  .conn #takeover{margin-top:1rem;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:1rem;\n    color:#f4ead0;background:var(--terra);border:2px solid var(--saddle-dk);border-radius:30px;padding:.6rem 1.6rem;cursor:pointer;box-shadow:0 5px 0 var(--saddle-dk);}\n  .conn #takeover[hidden]{display:none;}\n\n  .cpanel{position:fixed;top:60px;right:12px;z-index:9;width:min(280px,92vw);background:rgba(30,20,12,.9);\n    border:2px solid var(--wheat);border-radius:16px;padding:.9rem 1rem;backdrop-filter:blur(6px);\n    box-shadow:0 14px 40px rgba(0,0,0,.5);font-family:var(--mono);color:#ffe6ad;font-size:.8rem;}\n  .cpanel[hidden]{display:none;}\n  .cpanel h4{margin:0 0 .6rem;font-family:var(--display);font-size:1rem;letter-spacing:.05em;color:#fff;text-transform:uppercase;}\n  .cpanel label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#cbb187;margin:.5rem 0 .3rem;}\n  .cpanel input{width:100%;font:inherit;font-size:16px;border-radius:20px;border:2px solid var(--wheat);\n    background:rgba(251,244,226,.95);color:#33261a;padding:.45rem .7rem;outline:none;}\n  .cpanel .row{display:flex;flex-wrap:wrap;gap:.4rem;}\n  .cpanel .sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0;}\n  .cpanel .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--wheat);}\n  .cpanel .ht{min-width:30px;height:30px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer;\n    background:rgba(255,255,255,.08);font-size:1rem;line-height:1;padding:0;color:#fff;}\n  .cpanel .ht.on{border-color:var(--wheat);background:rgba(217,164,65,.25);}\n  .cpanel .done{margin-top:.8rem;width:100%;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;\n    background:var(--terra);color:#f4ead0;border:2px solid var(--saddle-dk);border-radius:20px;padding:.5rem;cursor:pointer;}\n\n  .askbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;display:flex;gap:.4rem;align-items:center;\n    background:rgba(30,20,12,.92);border:2px solid var(--wheat);border-radius:30px;padding:.4rem .5rem .4rem .9rem;\n    backdrop-filter:blur(6px);box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:94vw;font-family:var(--mono);color:#ffe6ad;}\n  .askbar[hidden]{display:none;}\n  .askbar #askLabel{white-space:nowrap;font-size:.72rem;letter-spacing:.06em;}\n  .askbar input{font:inherit;font-size:16px;border:none;outline:none;background:rgba(251,244,226,.96);color:#33261a;border-radius:20px;padding:.45rem .7rem;width:min(44vw,240px);}\n  .askbar button{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border:none;border-radius:20px;padding:.45rem .8rem;background:var(--terra);color:#f4ead0;}\n  .askbar #askClose{background:transparent;color:#ffe6ad;padding:.3rem .5rem;font-family:var(--mono);}\n  .mbanner{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:8;background:var(--saddle-dk);color:#ffe6ad;\n    border:2px solid var(--wheat);border-radius:30px;padding:.4rem 1.1rem;font-family:var(--mono);font-size:.8rem;letter-spacing:.04em;\n    box-shadow:0 10px 26px rgba(0,0,0,.45);animation:mb .5s var(--ease);}\n  .mbanner[hidden]{display:none;}\n  @keyframes mb{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translate(-50%,0);}}\n  .midbanner{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(20,15,40,.85);\n    color:#fff6c8;border:2px solid var(--wheat);border-radius:16px;padding:.8rem 1.4rem;font-family:var(--display);\n    text-transform:uppercase;letter-spacing:.04em;font-size:clamp(1rem,3.5vw,1.4rem);box-shadow:0 14px 40px rgba(0,0,0,.5);\n    backdrop-filter:blur(4px);text-align:center;pointer-events:none;animation:midpop .6s var(--ease);}\n  .midbanner[hidden]{display:none;}\n  @keyframes midpop{from{opacity:0;transform:translate(-50%,-50%) scale(.8);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}\n\n  .bookpanel{max-height:74vh;}\n  .booklist{max-height:40vh;overflow-y:auto;margin:.3rem 0 .6rem;display:flex;flex-direction:column;gap:.35rem;font-size:.78rem;}\n\
    \  .booklist .bk{color:#f0e4cf;line-height:1.3;word-wrap:break-word;}\n  .booklist .bk b{color:#ffd86b;font-family:var(--mono);}\n  .emotebar{position:fixed;right:12px;bottom:12px;z-index:9;display:flex;gap:.3rem;background:rgba(30,20,12,.8);\n    border:1px solid rgba(217,164,65,.5);border-radius:30px;padding:.3rem .4rem;backdrop-filter:blur(4px);box-shadow:0 8px 22px rgba(0,0,0,.4);}\n  .emotebar button{width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.08);cursor:pointer;font-size:1.05rem;line-height:1;padding:0;}\n  .emotebar button:hover{background:rgba(217,164,65,.3);}\n  @media (max-width:520px){ .emotebar button{width:30px;height:30px;font-size:.95rem;} }\n  .chatdock{position:fixed;left:12px;bottom:12px;z-index:16;display:flex;gap:.4rem;align-items:center;\n    background:rgba(30,20,12,.78);border:1px solid rgba(217,164,65,.5);border-radius:30px;padding:.35rem .4rem .35rem .9rem;\n    backdrop-filter:blur(5px);width:min(340px,52vw);}\n  .chatdock input{flex:1;min-width:0;font:inherit;font-size:16px;border:none;outline:none;background:transparent;color:#fff;}\n  .chatdock input::placeholder{color:rgba(255,255,255,.5);}\n  .chatdock #chatSend{flex:0 0 auto;border:none;border-radius:50%;width:32px;height:32px;background:var(--wheat);color:var(--saddle-dk);cursor:pointer;font-size:1rem;padding:0;}\n  .chatlog{position:fixed;left:12px;bottom:62px;z-index:15;width:min(340px,60vw);display:flex;flex-direction:column;gap:.2rem;pointer-events:none;align-items:flex-start;}\n  .chatlog .cm{background:rgba(30,20,12,.6);border-radius:12px;padding:.25rem .6rem;font-size:.8rem;color:#f0e4cf;max-width:100%;\n    word-wrap:break-word;animation:cmIn .3s var(--ease);transition:opacity .6s;}\n  .chatlog .cm.fade{opacity:0;}\n  .chatlog .cm b{color:#ffd98a;font-family:var(--mono);font-size:.72rem;margin-right:.3rem;}\n  @keyframes cmIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}\n  @media (max-width:600px){ .emotebar{bottom:60px;} .chatdock{width:calc(100vw - 24px);} .chatlog{width:60vw;bottom:110px;} }\n  .ptoast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(160%);z-index:12;\n    background:var(--saddle-dk);color:#ffe6ad;border:2px solid var(--wheat);border-radius:30px;padding:.6rem 1.2rem;\n    font-family:var(--mono);font-size:.82rem;letter-spacing:.03em;box-shadow:0 12px 30px rgba(0,0,0,.5);\n    opacity:0;visibility:hidden;transition:transform .5s var(--ease),opacity .4s,visibility .5s;max-width:92vw;text-align:center;}\n  .ptoast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;}\n  .chbox{background:rgba(217,164,65,.14);border:1px solid var(--wheat);border-radius:10px;padding:.5rem .7rem;margin-bottom:.6rem;font-size:.78rem;color:#ffe6ad;line-height:1.4;}\n  .chbox b{color:#fff;} .chbox .ok{color:#8bd06a;font-weight:700;}\n\n/* ===== cozy pass (Animal-Crossing-ish): rounder, pillow shadows, springy taps ===== */\n:root{ --cozy-ease:cubic-bezier(.34,1.56,.64,1); }\n.chip,.castbtn,.chatdock,.dock,.hud,.cpanel,.bookpanel,.askbar,.emotebar,.chbox,.inputs{ border-radius:20px !important; }\n.chip{ border:2.5px solid rgba(255,247,232,.85) !important; box-shadow:0 4px 0 rgba(74,47,28,.35) !important;\n  transition:transform .12s var(--cozy-ease), box-shadow .12s var(--cozy-ease); }\n.chip:hover{ transform:translateY(-2px); }\n.chip:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(74,47,28,.35) !important; }\n.chatdock,.dock,.hud,.cpanel,.bookpanel,.askbar,.emotebar{ border:3px solid rgba(255,247,232,.72) !important;\n  box-shadow:0 8px 0 rgba(74,47,28,.22), 0 14px 26px rgba(20,12,6,.32) !important; }\n.castbtn{ border-radius:26px !important; border:4px solid #fff7e8 !important;\n  box-shadow:0 7px 0 var(--saddle-dk,#4a2f1c) !important;\n  transition:transform .1s var(--cozy-ease), box-shadow .1s var(--cozy-ease); }\n.castbtn:active{ transform:translateX(-50%) translateY(4px) !important; box-shadow:0 3px 0 var(--saddle-dk,#4a2f1c) !important; }\n.badge{ border-radius:50% !important; box-shadow:0 3px 0 rgba(74,47,28,.3)\
    \ !important; }\ninput,textarea{ border-radius:16px !important; }\nbutton{ transition:transform .12s var(--cozy-ease); }\n</style>\n\n<canvas id=\"c\"></canvas>\n\n<div class=\"hud top\">\n  <a class=\"brand\" href=\"/\"><span class=\"badge\">\U0001F411</span> The Commons</a>\n  <div style=\"display:flex;flex-direction:column;align-items:flex-end;\">\n    <div class=\"stats\">\n      <a class=\"chip\" href=\"/ranch/\" style=\"text-decoration:none\">\U0001F319 Ranch</a>\n      <a class=\"chip\" href=\"/pond/\" style=\"text-decoration:none\">\U0001F3A3 Pond</a>\n      <a class=\"chip\" href=\"/cross/\" style=\"text-decoration:none\">\U0001F6A6 Hoof It</a>\n      <a class=\"chip\" href=\"/splash/\" style=\"text-decoration:none\">\U0001F4A6 Splash</a>\n      <a class=\"chip\" href=\"/hall/\" style=\"text-decoration:none\">\U0001F3C6 Hall</a>\n      <button class=\"chip\" id=\"custBtn\" style=\"cursor:pointer\" title=\"Customize your sheep\">✎ your sheep</button>\n      <button class=\"chip\" id=\"bookBtn\" style=\"cursor:pointer\" title=\"The fence guestbook\">\U0001F4D6 fence</button>\n      <button class=\"chip\" id=\"voiceBtn\" style=\"cursor:pointer\" title=\"Let the sheep speak\">\U0001F5E3️ voice</button>\n      <button class=\"chip\" id=\"sndBtn\" style=\"cursor:pointer\" title=\"Ambient sound\">\U0001F508 sound</button>\n      <span class=\"chip\" id=\"wxChip\">☀️ clear</span>\n      <span class=\"chip\">\U0001F411 <b id=\"nSheep\">–</b> chilling</span>\n      <span class=\"chip\">\U0001F33F grazed <b id=\"nGraze\">0</b></span>\n      <span class=\"chip\">you're <b id=\"youName\">…</b> · \U0001F33F<b id=\"chillPts\">0</b> · \U0001F3C5<b id=\"badges\">0</b> · <span id=\"youTitle\" style=\"color:#ffd86b\"></span></span>\n    </div>\n    <div class=\"meter\" title=\"Meadow Chill\"><i id=\"chillBar\"></i></div>\n  </div>\n</div>\n\n<div class=\"cpanel\" id=\"cpanel\" hidden>\n  <h4>\U0001F411 Your Sheep</h4>\n  <label>Name</label>\n  <input id=\"cName\" maxlength=\"18\" placeholder=\"name your sheep\" autocomplete=\"off\" />\n  <label>Fleece</label>\n  <div class=\"row\" id=\"cColors\"></div>\n  <label>Hat</label>\n  <div class=\"row\" id=\"cHats\"></div>\n  <button class=\"done\" id=\"cDone\">done</button>\n</div>\n\n<div class=\"mbanner\" id=\"mbanner\" hidden>\U0001F4CB <b id=\"mtopic\"></b></div>\n<div class=\"midbanner\" id=\"midbanner\" hidden>\U0001F319 Meadow Midnight — make a wish ✨</div>\n\n<div class=\"cpanel bookpanel\" id=\"bookpanel\" hidden>\n  <h4>\U0001F4D6 The Fence</h4>\n  <div class=\"chbox\" id=\"challengeBox\"></div>\n  <div class=\"booklist\" id=\"booklist\"></div>\n  <input id=\"carveIn\" maxlength=\"100\" placeholder=\"carve a note…\" autocomplete=\"off\" />\n  <button class=\"done\" id=\"carveBtn\">carve it</button>\n</div>\n\n<div class=\"ptoast\" id=\"ptoast\"></div>\n\n<div class=\"emotebar\" id=\"emotebar\">\n  <button type=\"button\" data-e=\"\U0001F49B\">\U0001F49B</button><button type=\"button\" data-e=\"\U0001F4A4\">\U0001F4A4</button><button type=\"button\" data-e=\"\U0001F3B5\">\U0001F3B5</button><button type=\"button\" data-e=\"\U0001F602\">\U0001F602</button><button type=\"button\" data-e=\"✨\">✨</button><button type=\"button\" data-e=\"\U0001F33F\">\U0001F33F</button>\n</div>\n\n<div class=\"chatlog\" id=\"chatlog\"></div>\n<div class=\"chatdock\" id=\"chatdock\">\n  <input id=\"chatIn\" maxlength=\"160\" placeholder=\"say something to the herd…\" autocomplete=\"off\" enterkeyhint=\"send\" />\n  <button type=\"button\" id=\"chatSend\" aria-label=\"send\">➤</button>\n</div>\n\n<div class=\"askbar\" id=\"askbar\" hidden>\n  <span id=\"askLabel\">Ask</span>\n  <input id=\"askIn\" maxlength=\"140\" placeholder=\"type your question…\" autocomplete=\"off\" enterkeyhint=\"send\" />\n  <button id=\"askSend\" type=\"button\">ask</button>\n  <button id=\"askClose\" type=\"button\" aria-label=\"close\">✕</button>\n</div>\n\n<div class=\"hint\" id=\"hint\">move your pointer (or drag) — your \U0001F920 sheep ambles over · tap an exec \U0001F454 to ask them anything · tap grass to baa</div>\n\n\
    <div class=\"conn\" id=\"conn\"><div><div class=\"big\">\U0001F33E finding the meadow…</div><div id=\"connMsg\">connecting you to the pasture</div><button id=\"takeover\" type=\"button\" hidden>\U0001F411 Take over here</button></div></div>\n\n<script>\n(function(){\n  \"use strict\";\n  var reduce = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n  var cv = document.getElementById(\"c\"), ctx = cv.getContext(\"2d\");\n  var W = 1600, H = 900, COLS = 40, ROWS = 24, CW = W/COLS, CH = H/ROWS;\n  var myId = null, myName = \"…\";\n  var roster = {};                 // id -> {name,hue}\n  var sheep = {};                  // id -> {x,y,rx,ry,state,face}\n  var grass = new Array(COLS*ROWS).fill(6);\n  var baas = [];                   // {x,y,t}\n  var execBubbles = {};            // id -> {text, t}  (AI banter above the exec sheep)\n  var qBubbles = {};               // id -> {text, t}  (visitor questions above the asker)\n  var chatBubbles = {};            // id -> {text, t}  (player chat above their sheep)\n  var askTarget = null;            // exec id currently being asked\n  var guestbook = [];              // carved names on the fence\n  var emotes = [];                 // {id, e, t}  floating emotes above sheep\n  var nuzzles = [];                // {x, y, t}   auto hearts between close sheep\n  var challengeText = \"\", challengeDone = false;\n  var pointer = { x: W/2, y: H/2, active:false };\n  var meadowHour = 13;                   // shared meadow time-of-day (0-24), from server\n  var rainbowUntil = 0, midnightUntil = 0, midnightSparkles = [], shootStars = [], nextShoot = 0, seasonParticles = [];\n  var weather = 0;                       // 0 clear, 1 cloudy, 2 rain (shared, from server)\n  var WX = [{e:\"☀️\",t:\"clear\"},{e:\"⛅\",t:\"cloudy\"},{e:\"\U0001F327️\",t:\"rain\"}];\n  var wxChip = document.getElementById(\"wxChip\");\n  function setWeather(w){ if (w===weather) return; weather=w; wxChip.textContent = WX[w].e+\" \"+WX[w].t; }\n  var rain = [];\n  function seedRain(){ rain=[]; for (var i=0;i<220;i++) rain.push({ x:Math.random()*cv.width, y:Math.random()*cv.height, l:8+Math.random()*12, sp:9+Math.random()*7 }); }\n  var HATS = { CEO:\"\U0001F920\", CTO:\"\U0001F6E0️\", COO:\"\U0001F9E2\", CFO:\"\U0001F4B0\", CPO:\"\U0001F324️\" };\n\n  // ---------- responsive canvas + world<->screen transform ----------\n  var view = { s:1, ox:0, oy:0, dpr:1 };\n  var flies = [];\n  function seedFlies(){ flies = []; for (var i=0;i<18;i++) flies.push({ x:Math.random()*cv.width, y:cv.height*(0.38+Math.random()*0.56), p:Math.random()*6, sp:0.2+Math.random()*0.5 }); }\n  function resize(){\n    var dpr = Math.min(window.devicePixelRatio||1, 2);\n    view.dpr = dpr;\n    cv.width = Math.floor(innerWidth*dpr); cv.height = Math.floor(innerHeight*dpr);\n    var s = Math.max(cv.width/W, cv.height/H);   // cover\n    view.s = s;\n    view.ox = (cv.width - W*s)/2;\n    view.oy = (cv.height - H*s)/2;\n    seedFlies(); seedRain(); seedSeason();\n  }\n  function seasonInfo(){\n    var mo = (new Date()).getMonth();          // northern-hemisphere seasons\n    if (mo === 11 || mo <= 1) return { name:\"winter\", wash:\"rgba(200,220,255,.10)\", p:\"❄\" };\n    if (mo <= 4) return { name:\"spring\", wash:\"rgba(255,180,210,.06)\", p:\"\U0001F338\" };\n    if (mo <= 7) return { name:\"summer\", wash:null, p:\"\" };\n    return { name:\"autumn\", wash:\"rgba(200,120,40,.07)\", p:\"\U0001F342\" };\n  }\n  function seedSeason(){ seasonParticles = []; if (!seasonInfo().p) return;\n    for (var i=0;i<26;i++) seasonParticles.push({ x:Math.random()*cv.width, y:Math.random()*cv.height, sp:18+Math.random()*30, drift:Math.random()*20-10, ph:Math.random()*6, sz:12+Math.random()*10 }); }\n  // 0 = day, 1 = deep night, based on the visitor's real local time\n  function nightness(){\n    var h = meadowHour;                  // shared across everyone in the meadow\n    if (h >= 7 && h < 18) return 0;\n    if (h >= 18 && h < 20) return (h-18)/2;\n    if (h >= 5 && h < 7) return (7-h)/2;\n    return 1;\n  }\n  function toScreenX(x){ return view.ox\
    \ + x*view.s; }\n  function toScreenY(y){ return view.oy + y*view.s; }\n  function toWorld(px,py){\n    return { x:(px*view.dpr - view.ox)/view.s, y:(py*view.dpr - view.oy)/view.s };\n  }\n  addEventListener(\"resize\", resize); resize();\n\n  // ---------- websocket ----------\n  var ws, retry = 0, replaced = false, connEl = document.getElementById(\"conn\"), connMsg = document.getElementById(\"connMsg\");\n  var token; try { token = localStorage.getItem(\"pastureId\"); if (!token){ token = \"s\" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(\"pastureId\", token); } } catch(e){ token = \"s\" + Math.random().toString(36).slice(2); }\n  var myCustom = { name:\"\", color:-1, hat:\"\" };\n  try { myCustom.name = localStorage.getItem(\"chill-name\") || \"\"; myCustom.color = +(localStorage.getItem(\"chill-color\")); if (isNaN(myCustom.color)) myCustom.color = -1; myCustom.hat = localStorage.getItem(\"chill-hat\") || \"\"; } catch(e){}\n  function sendCustom(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:\"custom\", name: myCustom.name||undefined, color: myCustom.color, hat: myCustom.hat })); }\n  function connect(){\n    if (replaced) return;\n    var proto = location.protocol === \"https:\" ? \"wss\" : \"ws\";\n    try { ws = new WebSocket(proto + \"://\" + location.host + \"/ws\"); }\n    catch(e){ scheduleRetry(); return; }\n    ws.onopen = function(){\n      retry = 0; connEl.classList.add(\"hide\");\n      ws.send(JSON.stringify({ t:\"hello\", token: token, name: myCustom.name || undefined }));\n      if (myCustom.color >= 0 || myCustom.hat || myCustom.name) sendCustom();\n    };\n    ws.onclose = function(ev){\n      if (ev && ev.code === 4001){                    // taken over by another tab/window of the same browser\n        replaced = true; connEl.classList.remove(\"hide\");\n        connEl.querySelector(\".big\").textContent = \"\U0001F411 Already grazing\";\n        connMsg.textContent = \"Your sheep is active in another tab or window.\";\n        document.getElementById(\"takeover\").hidden = false;\n        return;\n      }\n      connEl.classList.remove(\"hide\"); connMsg.textContent = \"reconnecting…\"; scheduleRetry();\n    };\n    ws.onerror = function(){ try{ ws.close(); }catch(e){} };\n    ws.onmessage = function(ev){ onMsg(ev.data); };\n  }\n  function scheduleRetry(){ if (replaced) return; retry = Math.min(retry+1, 6); setTimeout(connect, 500*retry); }\n  document.getElementById(\"takeover\").addEventListener(\"click\", function(){\n    this.hidden = true; replaced = false; retry = 0;\n    connEl.querySelector(\".big\").textContent = \"\U0001F33E taking your spot back…\"; connMsg.textContent = \"reconnecting…\";\n    connect();\n  });\n  function onMsg(data){\n    var m; try { m = JSON.parse(data); } catch(e){ return; }\n    if (m.t === \"welcome\"){\n      myId = m.id; myName = m.name; W=m.w; H=m.h; COLS=m.cols; ROWS=m.rows; CW=W/COLS; CH=H/ROWS;\n      grass = new Array(COLS*ROWS).fill(6); resize();\n      document.getElementById(\"youName\").textContent = myName;\n    } else if (m.t === \"r\"){\n      roster = {}; for (var k in m.roster){ var e=m.roster[k]; roster[k] = { name:e[0], hue:e[1], role:e[2]||\"\", color:(e[3]==null?-1:e[3]), hat:e[4]||\"\", points:e[5]||0, title:e[6]||\"\", badges:e[7]||0 }; }\n      if (myId!=null && roster[myId]){\n        document.getElementById(\"youName\").textContent = roster[myId].name;      // real (customized) name\n        document.getElementById(\"chillPts\").textContent = roster[myId].points;\n        document.getElementById(\"youTitle\").textContent = roster[myId].title;\n        document.getElementById(\"badges\").textContent = roster[myId].badges;\n      }\n    } else if (m.t === \"challenge\"){\n      challengeText = m.text; challengeDone = m.done; renderChallenge();\n      if (!m.done && m.text) showPToast(\"\U0001F3AF Today's Challenge: \" + m.text, 6500);\n    } else if (m.t === \"challenge-done\"){\n      challengeDone = true; renderChallenge();\n      showPToast(\"\U0001F3C5 Challenge complete! +10\
