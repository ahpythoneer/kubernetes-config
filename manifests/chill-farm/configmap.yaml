    \ p=seasonParticles[i];\n      p.y += p.sp*view.s*0.016; p.x += Math.sin(now/1000 + p.ph)*p.drift*view.s*0.006;\n      if (p.y > cv.height+20){ p.y=-20; p.x=Math.random()*cv.width; }\n      ctx.font = (p.sz*view.s)+\"px sans-serif\"; ctx.fillText(s.p, p.x, p.y);\n    }\n    ctx.globalAlpha = 1;\n  }\n  function triggerMidnight(){\n    var now = performance.now(); midnightUntil = now + 6500; midnightSparkles = [];\n    for (var i=0;i<52;i++) midnightSparkles.push({ x:Math.random()*cv.width, y:cv.height*(0.5+Math.random()*0.5), delay:Math.random()*1600, sp:40+Math.random()*70, ph:Math.random()*6 });\n    var mb = document.getElementById(\"midbanner\"); if (mb){ mb.hidden=false; clearTimeout(mb._t); mb._t=setTimeout(function(){ mb.hidden=true; }, 6000); }\n  }\n  function drawMidnight(now){\n    if (now >= midnightUntil || reduce) return;\n    var life = midnightUntil - now;\n    for (var i=0;i<midnightSparkles.length;i++){ var s=midnightSparkles[i]; var t=now - (midnightUntil-6500) - s.delay; if (t<0) continue;\n      var y = s.y - (t/1000)*s.sp*view.s; if (y < -10) continue;\n      ctx.globalAlpha = Math.min(1, life/1500) * (0.5+0.5*Math.sin(now/120+s.ph));\n      ctx.fillStyle = \"#fff6c8\"; ctx.font = (view.s*11)+\"px sans-serif\"; ctx.textAlign=\"center\";\n      ctx.fillText(\"✦\", s.x + Math.sin(now/300+s.ph)*view.s*6, y);\n    }\n    ctx.globalAlpha = 1;\n  }\n\n  // campfire the herd gathers around; flames flicker, glow strengthens at night\n  function drawCampfire(now){\n    var cx = toScreenX(W*0.5), cy = toScreenY(H*0.6);\n    var u = view.s, nf = nightness();\n    var flick = reduce ? 1 : (0.85 + 0.15*Math.sin(now/90) + 0.08*Math.sin(now/37));\n    // glow\n    var glowR = u*70*(0.6 + nf*0.8);\n    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);\n    g.addColorStop(0, \"rgba(255,150,50,\" + (0.10 + nf*0.28) + \")\");\n    g.addColorStop(1, \"rgba(255,150,50,0)\");\n    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, 6.28); ctx.fill();\n    // logs\n    ctx.strokeStyle = \"#5a3a20\"; ctx.lineWidth = u*4; ctx.lineCap = \"round\";\n    ctx.beginPath(); ctx.moveTo(cx-u*14, cy+u*6); ctx.lineTo(cx+u*14, cy+u*8);\n    ctx.moveTo(cx-u*12, cy+u*9); ctx.lineTo(cx+u*13, cy+u*4); ctx.stroke();\n    ctx.lineCap = \"butt\";\n    // flames\n    var flames = [[\"rgba(196,40,20,.9)\",18],[\"rgba(240,120,30,.95)\",13],[\"rgba(255,200,70,.95)\",8]];\n    for (var fl=0; fl<flames.length; fl++){\n      var hgt = flames[fl][1]*u*flick;\n      ctx.fillStyle = flames[fl][0];\n      ctx.beginPath();\n      ctx.moveTo(cx - hgt*0.5, cy);\n      ctx.quadraticCurveTo(cx - hgt*0.35, cy - hgt*0.7, cx, cy - hgt);\n      ctx.quadraticCurveTo(cx + hgt*0.35, cy - hgt*0.7, cx + hgt*0.5, cy);\n      ctx.quadraticCurveTo(cx, cy + hgt*0.2, cx - hgt*0.5, cy); ctx.fill();\n    }\n    // sparks at night\n    if (nf > 0.4 && !reduce){\n      for (var sp=0; sp<5; sp++){\n        var ph = now/600 + sp*1.7, life = (ph % 1);\n        ctx.globalAlpha = (1-life) * (nf);\n        ctx.fillStyle = \"#ffd27a\";\n        ctx.beginPath(); ctx.arc(cx + Math.sin(ph*4+sp)*u*8, cy - life*u*46, u*1.4, 0, 6.28); ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  function drawSheep(id){\n    var s = sheep[id], info = roster[id] || { name:\"\", hue:0, color:-1, hat:\"\" };\n    var x = toScreenX(s.rx), y = toScreenY(s.ry), u = view.s;   // u = world->screen unit\n    var mine = (+id === myId);\n    var isTrain = info.role === \"TRAIN\";\n    var asleep = s.state === 3, grazing = s.state === 2, walking = s.state === 1;\n    var wob = walking && !reduce ? Math.sin(performance.now()/120 + id*1.3) * u*2 : 0;\n\n    // shadow\n    ctx.fillStyle = \"rgba(20,35,15,.28)\";\n    ctx.beginPath(); ctx.ellipse(x, y + u*10, u*20, u*7, 0, 0, 6.28); ctx.fill();\n\n    // legs\n    ctx.strokeStyle = \"#6b5540\"; ctx.lineWidth = u*3;\n    ctx.beginPath();\n    ctx.moveTo(x-u*8, y+u*6); ctx.lineTo(x-u*8, y+u*12);\n    ctx.moveTo(x+u*8, y+u*6); ctx.lineTo(x+u*8, y+u*12); ctx.stroke();\n\n    // fluffy body (cluster of circles) — fleece can be tinted\
    \ a pastel colour (The Train is black)\n    ctx.fillStyle = isTrain ? \"#2b2b30\" : (info.color != null && info.color >= 0) ? \"hsl(\"+info.color+\",50%,90%)\" : (mine ? \"#fffdf5\" : \"#f3efe4\");\n    var body = [[0,-2,17],[-11,-4,10],[11,-4,10],[-6,-12,10],[7,-12,10],[0,-16,9]];\n    for (var i=0;i<body.length;i++){ ctx.beginPath(); ctx.arc(x+body[i][0]*u+wob, y+body[i][1]*u, body[i][2]*u, 0, 6.28); ctx.fill(); }\n\n    // head (front-left), lowers when grazing\n    var hx = x - u*14 + wob, hy = y - (grazing ? u*2 : u*8);\n    ctx.fillStyle = \"#42352a\";\n    ctx.beginPath(); ctx.ellipse(hx, hy, u*7, u*8, -0.3, 0, 6.28); ctx.fill();\n    // ears\n    ctx.beginPath(); ctx.ellipse(hx-u*5, hy-u*4, u*3, u*2, -0.6, 0, 6.28);\n    ctx.ellipse(hx+u*2, hy-u*6, u*3, u*2, 0.4, 0, 6.28); ctx.fill();\n    // face\n    ctx.fillStyle = \"#fff\";\n    if (asleep){\n      ctx.strokeStyle = \"#fff\"; ctx.lineWidth = u*1.4;\n      ctx.beginPath(); ctx.moveTo(hx-u*4, hy-u*1); ctx.lineTo(hx-u*1, hy+u*1);\n      ctx.moveTo(hx+u*1, hy-u*1); ctx.lineTo(hx+u*4, hy+u*1); ctx.stroke();\n      // zzz\n      ctx.fillStyle = \"#fff\"; ctx.font = \"700 \"+(u*13)+\"px 'Courier New',monospace\"; ctx.textAlign=\"left\";\n      var zt = (performance.now()/500)%1;\n      ctx.globalAlpha = 1-zt; ctx.fillText(\"z\", x+u*8, y-u*20 - zt*u*14); ctx.globalAlpha = 1;\n    } else {\n      ctx.beginPath(); ctx.arc(hx-u*2, hy-u*1, u*1.6, 0, 6.28); ctx.arc(hx+u*3, hy-u*1, u*1.6, 0, 6.28); ctx.fill();\n    }\n\n    // hats: your own \U0001F920 with a ring, or an exec's signature hat\n    if (mine){\n      ctx.strokeStyle = \"rgba(255,214,80,.9)\"; ctx.lineWidth = u*2;\n      ctx.beginPath(); ctx.arc(x, y-u*2, u*24, 0, 6.28); ctx.stroke();\n      ctx.font = (u*20)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.fillText(\"\U0001F920\", hx, hy - u*10);\n    } else if (isTrain){\n      ctx.font = (u*18)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.fillText(\"\U0001F620\", hx, hy - u*10);\n    } else if (info.role && HATS[info.role]){\n      ctx.font = (u*20)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.fillText(HATS[info.role], hx, hy - u*10);\n    } else if (info.hat){\n      ctx.font = (u*18)+\"px sans-serif\"; ctx.textAlign=\"center\"; ctx.fillText(info.hat, hx, hy - u*10);\n    }\n\n    // name label (execs get a gold \"Name · ROLE\" plate)\n    if (info.name){\n      ctx.textAlign = \"center\";\n      var label = (info.role && !isTrain) ? (info.name + \" · \" + info.role) : info.name;\n      ctx.font = \"700 \"+(u*11)+\"px 'Courier New',monospace\";\n      ctx.fillStyle = \"rgba(20,30,12,.55)\"; ctx.fillText(label, x+1, y-u*26+1);\n      ctx.fillStyle = mine ? \"#fff\" : isTrain ? \"#e07a6a\" : (info.role ? \"#ffd86b\" : \"hsl(\"+info.hue+\",70%,88%)\");\n      ctx.fillText(label, x, y-u*27);\n    }\n\n    // The Train's cage (drawn in front)\n    if (isTrain){\n      ctx.strokeStyle = \"#7a7a86\"; ctx.lineWidth = u*2.4; ctx.lineCap = \"round\";\n      var cw = u*52, chh = u*60, cyy = y - u*8;\n      for (var bar=-2; bar<=2; bar++){ ctx.beginPath(); ctx.moveTo(x + bar*cw/4, cyy - chh/2); ctx.lineTo(x + bar*cw/4, cyy + chh/2); ctx.stroke(); }\n      ctx.beginPath(); ctx.moveTo(x-cw/2, cyy-chh/2); ctx.lineTo(x+cw/2, cyy-chh/2);\n      ctx.moveTo(x-cw/2, cyy+chh/2); ctx.lineTo(x+cw/2, cyy+chh/2); ctx.stroke();\n      ctx.lineCap = \"butt\";\n    }\n  }\n  requestAnimationFrame(render);\n\n  // ---------- ambient sound (opt-in): wind + birds by day, crickets at night ----------\n  var audio = { on:false, ac:null, master:null, wind:null, windLp:null, nextChirp:0 };\n  function buildAudio(){\n    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;\n    var ac = new AC(); audio.ac = ac;\n    var master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); audio.master = master;\n    var buf = ac.createBuffer(1, Math.floor(ac.sampleRate*2), ac.sampleRate), d = buf.getChannelData(0);\n    for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*0.6;\n    var src = ac.createBufferSource(); src.buffer = buf; src.loop\
    \ = true;\n    var lp = ac.createBiquadFilter(); lp.type = \"lowpass\"; lp.frequency.value = 480;\n    var wg = ac.createGain(); wg.gain.value = 0.04;\n    src.connect(lp); lp.connect(wg); wg.connect(master); src.start();\n    audio.wind = wg; audio.windLp = lp;\n    return true;\n  }\n  function chirp(night){\n    var ac = audio.ac; if (!ac) return; var t = ac.currentTime;\n    if (night){                                   // cricket: fast high pulses\n      for (var k=0;k<4;k++){ var o=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();\n        o.type=\"square\"; o.frequency.value = 4300 + Math.random()*300;\n        bp.type=\"bandpass\"; bp.frequency.value = 4500; bp.Q.value = 8;\n        o.connect(bp); bp.connect(g); g.connect(audio.master);\n        var st = t + k*0.03; g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.06, st+0.004); g.gain.linearRampToValueAtTime(0, st+0.02);\n        o.start(st); o.stop(st+0.03); }\n    } else {                                      // bird: short rising warble\n      var o2=ac.createOscillator(), g2=ac.createGain(); o2.type=\"sine\"; o2.connect(g2); g2.connect(audio.master);\n      o2.frequency.setValueAtTime(1900+Math.random()*400, t);\n      o2.frequency.linearRampToValueAtTime(2500+Math.random()*500, t+0.08);\n      o2.frequency.linearRampToValueAtTime(2100, t+0.16);\n      g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.05, t+0.02); g2.gain.linearRampToValueAtTime(0, t+0.22);\n      o2.start(t); o2.stop(t+0.24);\n    }\n  }\n  // soft generative lo-fi note that follows the sky (brighter by day, mellower at night)\n  function playNote(){\n    var ac = audio.ac; if (!ac) return; var t = ac.currentTime, nf = nightness();\n    var baseMidi = 50 - nf*5, scale = [0,2,4,7,9,12];\n    var semi = scale[(Math.random()*scale.length)|0] + (Math.random()<0.3 ? 12 : 0);\n    var freq = 440*Math.pow(2, (baseMidi+semi-69)/12);\n    var o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();\n    o.type = nf>0.5 ? \"sine\" : \"triangle\"; o.frequency.value = freq;\n    lp.type = \"lowpass\"; lp.frequency.value = 1300 - nf*450;\n    o.connect(lp); lp.connect(g); g.connect(audio.master);\n    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t+0.4); g.gain.linearRampToValueAtTime(0, t+2.3);\n    o.start(t); o.stop(t+2.4);\n  }\n  function ambientTick(now){\n    if (!audio.on || !audio.ac) return;\n    if (audio.wind){ var tg = weather===2 ? 0.11 : weather===1 ? 0.06 : 0.035; audio.wind.gain.value += (tg - audio.wind.gain.value)*0.02; }\n    if (audio.windLp){ var lt = weather===2 ? 900 : 480; audio.windLp.frequency.value += (lt - audio.windLp.frequency.value)*0.02; }\n    if (now > audio.nextChirp){\n      var night = nightness() > 0.5; chirp(night);\n      audio.nextChirp = now + (night ? (900 + Math.random()*1800) : (3000 + Math.random()*5000));\n    }\n    if (now > (audio.nextNote || 0)){ playNote(); audio.nextNote = now + 2600 + Math.random()*3200; }\n  }\n  var sndBtn = document.getElementById(\"sndBtn\");\n  sndBtn.addEventListener(\"click\", function(){\n    if (!audio.on){\n      if (!audio.ac && !buildAudio()) return;\n      if (audio.ac.state === \"suspended\") audio.ac.resume();\n      audio.on = true; audio.nextChirp = performance.now() + 700;\n      audio.master.gain.setTargetAtTime(0.6, audio.ac.currentTime, 0.4);\n      sndBtn.textContent = \"\U0001F50A sound\";\n    } else {\n      audio.on = false;\n      if (audio.master) audio.master.gain.setTargetAtTime(0, audio.ac.currentTime, 0.3);\n      sndBtn.textContent = \"\U0001F508 sound\";\n    }\n  });\n\n  // ---------- customize your sheep (name + fleece colour + hat) ----------\n  (function(){\n    var COLORS = [-1, 20, 45, 95, 150, 200, 260, 320];      // -1 = classic white\n    var HAT_LIST = [\"\", \"\U0001F3A9\", \"\U0001F380\", \"\U0001F452\", \"\U0001F338\", \"\U0001F9E2\", \"⭐\", \"\U0001F335\", \"\U0001F3A7\"];\n    var cName = document.getElementById(\"cName\"), cColors = document.getElementById(\"cColors\"),\n        cHats = document.getElementById(\"\
    cHats\"), cDone = document.getElementById(\"cDone\"),\n        custBtn = document.getElementById(\"custBtn\"), cpanel = document.getElementById(\"cpanel\");\n    cName.value = myCustom.name;\n    function apply(){\n      try { localStorage.setItem(\"chill-name\", myCustom.name); localStorage.setItem(\"chill-color\", myCustom.color); localStorage.setItem(\"chill-hat\", myCustom.hat); } catch(e){}\n      sendCustom();\n      if (myCustom.name) document.getElementById(\"youName\").textContent = myCustom.name;\n    }\n    COLORS.forEach(function(h){\n      var b = document.createElement(\"button\"); b.className = \"sw\" + (h===myCustom.color?\" on\":\"\");\n      b.style.background = h<0 ? \"#f3efe4\" : \"hsl(\"+h+\",50%,88%)\"; b.title = h<0 ? \"classic white\" : \"coloured fleece\";\n      b.addEventListener(\"click\", function(){ myCustom.color = h;\n        Array.prototype.forEach.call(cColors.children, function(x){ x.classList.remove(\"on\"); }); b.classList.add(\"on\"); apply(); });\n      cColors.appendChild(b);\n    });\n    HAT_LIST.forEach(function(ht){\n      var b = document.createElement(\"button\"); b.className = \"ht\" + (ht===myCustom.hat?\" on\":\"\"); b.textContent = ht || \"∅\";\n      b.addEventListener(\"click\", function(){ myCustom.hat = ht;\n        Array.prototype.forEach.call(cHats.children, function(x){ x.classList.remove(\"on\"); }); b.classList.add(\"on\"); apply(); });\n      cHats.appendChild(b);\n    });\n    cName.addEventListener(\"input\", function(){ myCustom.name = cName.value.trim(); });\n    cName.addEventListener(\"change\", apply);\n    cName.addEventListener(\"keydown\", function(e){ if (e.key===\"Enter\"){ e.preventDefault(); apply(); cName.blur(); } });\n    custBtn.addEventListener(\"click\", function(){ cpanel.hidden = !cpanel.hidden; });\n    cDone.addEventListener(\"click\", function(){ myCustom.name = cName.value.trim(); apply(); cpanel.hidden = true; });\n  })();\n\n  // ---------- guestbook (the fence) + emotes + nuzzles ----------\n  function renderBook(){\n    var bl = document.getElementById(\"booklist\"); if (!bl) return; bl.innerHTML = \"\";\n    for (var i=Math.max(0, guestbook.length-40); i<guestbook.length; i++){ var g=guestbook[i];\n      var d=document.createElement(\"div\"); d.className=\"bk\";\n      var b=document.createElement(\"b\"); b.textContent=g.name; d.appendChild(b);\n      d.appendChild(document.createTextNode(\" — \" + g.text)); bl.appendChild(d); }\n    bl.scrollTop = bl.scrollHeight;\n  }\n  var challengeBox = document.getElementById(\"challengeBox\");\n  function renderChallenge(){\n    if (!challengeBox) return; challengeBox.innerHTML = \"\";\n    if (!challengeText){ challengeBox.textContent = \"\U0001F3AF Today's challenge is loading…\"; return; }\n    var lab = document.createElement(\"span\"); lab.innerHTML = \"\U0001F3AF <b>Today's Challenge:</b> \";\n    challengeBox.appendChild(lab);\n    challengeBox.appendChild(document.createTextNode(challengeText + \" \"));\n    if (challengeDone){ var ok = document.createElement(\"span\"); ok.className = \"ok\"; ok.textContent = \"✓ done!\"; challengeBox.appendChild(ok); }\n  }\n  var ptoast = document.getElementById(\"ptoast\"), ptoastT;\n  function showPToast(text, ms){ ptoast.textContent = text; ptoast.classList.add(\"show\"); clearTimeout(ptoastT); ptoastT = setTimeout(function(){ ptoast.classList.remove(\"show\"); }, ms || 4000); }\n\n  var bookpanel = document.getElementById(\"bookpanel\"), carveIn = document.getElementById(\"carveIn\");\n  document.getElementById(\"bookBtn\").addEventListener(\"click\", function(){ bookpanel.hidden = !bookpanel.hidden; if (!bookpanel.hidden) renderBook(); });\n  function carve(){ var t = carveIn.value.trim(); if (!t) return; if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:\"carve\", text:t })); carveIn.value=\"\"; }\n  document.getElementById(\"carveBtn\").addEventListener(\"click\", carve);\n  carveIn.addEventListener(\"keydown\", function(e){ if (e.key===