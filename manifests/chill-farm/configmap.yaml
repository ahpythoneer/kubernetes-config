            <div class="value reveal"><div class="ic">🪑</div><h3>Comfort First</h3><p>Every chair reclines. Every deadline is a suggestion. If a task can't be done from a hammock, we question whether it needs doing.</p></div>
            <div class="value reveal"><div class="ic">🤝</div><h3>Radical Ease</h3><p>We over-communicate the vibes and under-commit the timelines. Honesty about how relaxed we are is our whole culture.</p></div>
