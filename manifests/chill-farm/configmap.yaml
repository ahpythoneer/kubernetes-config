        var dpr = Math.min(window.devicePixelRatio||1, 2);
        view.dpr = dpr;
        cv.width = Math.floor(innerWidth*dpr); cv.height = Math.floor(innerHeight*dpr);
        var s = Math.max(cv.width/W, cv.height/H);   // cover
        view.s = s;
        view.ox = (cv.width - W*s)/2;
        view.oy = (cv.height - H*s)/2;
        seedFlies(); seedRain();
      }
      // 0 = day, 1 = deep night, based on the visitor's real local time
      function nightness(){
        var h = meadowHour;                  // shared across everyone in the meadow
        if (h >= 7 && h < 18) return 0;
        if (h >= 18 && h < 20) return (h-18)/2;
        if (h >= 5 && h < 7) return (7-h)/2;
        return 1;
      }
      function toScreenX(x){ return view.ox + x*view.s; }
      function toScreenY(y){ return view.oy + y*view.s; }
      function toWorld(px,py){
        return { x:(px*view.dpr - view.ox)/view.s, y:(py*view.dpr - view.oy)/view.s };
      }
      addEventListener("resize", resize); resize();

      // ---------- websocket ----------
      var ws, retry = 0, replaced = false, connEl = document.getElementById("conn"), connMsg = document.getElementById("connMsg");
      var token; try { token = localStorage.getItem("pastureId"); if (!token){ token = "s" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("pastureId", token); } } catch(e){ token = "s" + Math.random().toString(36).slice(2); }
      var myCustom = { name:"", color:-1, hat:"" };
      try { myCustom.name = localStorage.getItem("chill-name") || ""; myCustom.color = +(localStorage.getItem("chill-color")); if (isNaN(myCustom.color)) myCustom.color = -1; myCustom.hat = localStorage.getItem("chill-hat") || ""; } catch(e){}
      function sendCustom(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:"custom", name: myCustom.name||undefined, color: myCustom.color, hat: myCustom.hat })); }
      function connect(){
        if (replaced) return;
        var proto = location.protocol === "https:" ? "wss" : "ws";
        try { ws = new WebSocket(proto + "://" + location.host + "/ws"); }
        catch(e){ scheduleRetry(); return; }
        ws.onopen = function(){
          retry = 0; connEl.classList.add("hide");
          ws.send(JSON.stringify({ t:"hello", token: token, name: myCustom.name || undefined }));
          if (myCustom.color >= 0 || myCustom.hat || myCustom.name) sendCustom();
        };
        ws.onclose = function(ev){
          if (ev && ev.code === 4001){                    // taken over by another tab of the same browser
            replaced = true; connEl.classList.remove("hide");
            connEl.querySelector(".big").textContent = "🐑 Already grazing";
            connMsg.textContent = "You're chilling in another tab. Refresh here to bring your sheep back.";
            return;
          }
          connEl.classList.remove("hide"); connMsg.textContent = "reconnecting…"; scheduleRetry();
        };
        ws.onerror = function(){ try{ ws.close(); }catch(e){} };
        ws.onmessage = function(ev){ onMsg(ev.data); };
      }
      function scheduleRetry(){ if (replaced) return; retry = Math.min(retry+1, 6); setTimeout(connect, 500*retry); }
      function onMsg(data){
        var m; try { m = JSON.parse(data); } catch(e){ return; }
        if (m.t === "welcome"){
          myId = m.id; myName = m.name; W=m.w; H=m.h; COLS=m.cols; ROWS=m.rows; CW=W/COLS; CH=H/ROWS;
          grass = new Array(COLS*ROWS).fill(6); resize();
          document.getElementById("youName").textContent = myName;
        } else if (m.t === "r"){
          roster = {}; for (var k in m.roster){ var e=m.roster[k]; roster[k] = { name:e[0], hue:e[1], role:e[2]||"", color:(e[3]==null?-1:e[3]), hat:e[4]||"" }; }
          if (myId!=null && roster[myId]) document.getElementById("youName").textContent = roster[myId].name;   // reflect the real (customized) name
        } else if (m.t === "s"){
          var seen = {};
          for (var i=0;i<m.sheep.length;i++){
            var a = m.sheep[i], id = a[0];
            seen[id] = 1;
            var s = sheep[id];
            if (!s){ s = sheep[id] = { x:a[1], y:a[2], rx:a[1], ry:a[2], state:a[3], face:1 }; }
            s.x = a[1]; s.y = a[2]; s.state = a[3]; s.vip = a[4] > 0;
          }
          for (var id2 in sheep) if (!seen[id2]) delete sheep[id2];   // left the meadow
          if (typeof m.w === "number") setWeather(m.w);
          if (typeof m.mt === "number") meadowHour = m.mt;
          document.getElementById("nSheep").textContent = m.n;
          document.getElementById("nGraze").textContent = m.graze.toLocaleString();
          document.getElementById("chillBar").style.width = m.chill + "%";
        } else if (m.t === "g"){
          for (var j=0;j<m.grass.length && j<grass.length;j++) grass[j] = +m.grass[j];
        } else if (m.t === "b"){
          var bs = sheep[m.id]; if (bs) baas.push({ id:m.id, t: performance.now() });
        } else if (m.t === "say"){
          execBubbles[m.id] = { text: m.text, t: performance.now() };
        } else if (m.t === "q"){
          qBubbles[m.id] = { text: m.text, t: performance.now() };
        } else if (m.t === "meeting"){
          document.getElementById("mtopic").textContent = "Board Meeting — " + m.topic;
          document.getElementById("mbanner").hidden = false;
        } else if (m.t === "meeting-end"){
          document.getElementById("mbanner").hidden = true;
        }
      }
      connect();

      // ---------- input ----------
      function setPointerFromEvent(e){
        var px = (e.touches ? e.touches[0].clientX : e.clientX);
        var py = (e.touches ? e.touches[0].clientY : e.clientY);
        var w = toWorld(px, py);
        pointer.x = Math.max(0, Math.min(W, w.x));
        pointer.y = Math.max(0, Math.min(H, w.y));
        pointer.active = true;
        hideHint();
      }
      addEventListener("pointermove", setPointerFromEvent, { passive:true });
      addEventListener("pointerdown", function(e){
        if (e.target && e.target.closest && e.target.closest(".askbar, .cpanel, .hud")) return;  // ignore UI taps
        setPointerFromEvent(e);
        var hit = execAtScreen(e);
        if (hit != null) openAsk(hit); else baa();
      });
      function baa(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:"baa" })); }

      // find an exec sheep near a tap/click (screen CSS pixels)
      function execAtScreen(e){
        var px = (e.touches ? e.touches[0].clientX : e.clientX), py = (e.touches ? e.touches[0].clientY : e.clientY);
        var best = null, bestD = 1e9;
        for (var id in sheep){ var info = roster[id]; if (!info || !info.role) continue;
          var sx = toScreenX(sheep[id].rx)/view.dpr, sy = toScreenY(sheep[id].ry)/view.dpr;
          var d = Math.hypot(px - sx, py - sy);
          if (d < 46 && d < bestD){ bestD = d; best = id; }
        }
        return best;
      }
      var askbar = document.getElementById("askbar"), askIn = document.getElementById("askIn");
      function openAsk(id){
        askTarget = id; var info = roster[id] || { name:"", role:"" };
        document.getElementById("askLabel").textContent = "Ask " + info.name + (info.role ? " (" + info.role + ")" : "") + ":";
        askbar.hidden = false; askIn.value = ""; askIn.focus();
      }
      function closeAsk(){ askbar.hidden = true; askTarget = null; }
      function sendAsk(){
        var q = askIn.value.trim(); if (!q || askTarget == null) return;
        if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:"ask", id:+askTarget, q:q }));
        closeAsk();
      }
      document.getElementById("askSend").addEventListener("click", sendAsk);
      document.getElementById("askClose").addEventListener("click", closeAsk);
      askIn.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); sendAsk(); } else if (e.key==="Escape"){ closeAsk(); } });
      // stream pointer target to server, throttled
      setInterval(function(){
        if (ws && ws.readyState===1 && pointer.active){
          ws.send(JSON.stringify({ t:"move", x:Math.round(pointer.x), y:Math.round(pointer.y) }));
        }
      }, 60);

      var hintEl = document.getElementById("hint"), hintTimer = setTimeout(hideHint, 9000);
      function hideHint(){ hintEl.classList.add("fade"); clearTimeout(hintTimer); }

      // ---------- render ----------
      var grassColors = buildGrassRamp();
      function buildGrassRamp(){
        // 0 = bare dirt -> 9 = lush green
        var ramp = [];
        for (var i=0;i<=9;i++){
          var t = i/9;
          var r = Math.round(120 - 66*t + (t<0.4?18:0));
          var g = Math.round(78 + 92*t);
          var b = Math.round(48 + 20*t);
          ramp.push("rgb("+r+","+g+","+b+")");
        }
        return ramp;
      }

      function render(now){
        // interpolate sheep toward latest server pos
        var lf = reduce ? 1 : 0.18;
        for (var id in sheep){ var s = sheep[id]; s.rx += (s.x - s.rx)*lf; s.ry += (s.y - s.ry)*lf; }

        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,cv.width,cv.height);
        // base
        ctx.fillStyle = "#3f5a2c"; ctx.fillRect(0,0,cv.width,cv.height);

        // grass grid
        for (var cy=0; cy<ROWS; cy++){
          for (var cx=0; cx<COLS; cx++){
            var v = grass[cy*COLS+cx]|0;
            ctx.fillStyle = grassColors[v];
            var x0 = toScreenX(cx*CW), y0 = toScreenY(cy*CH);
            var x1 = toScreenX((cx+1)*CW), y1 = toScreenY((cy+1)*CH);
            ctx.fillRect(x0, y0, x1-x0+1, y1-y0+1);
          }
        }
        // subtle tuft texture on lush cells
        ctx.strokeStyle = "rgba(30,60,20,.18)"; ctx.lineWidth = Math.max(1, view.s*1.2);
        for (var cy2=0; cy2<ROWS; cy2++) for (var cx2=0; cx2<COLS; cx2++){
          var vv = grass[cy2*COLS+cx2]|0; if (vv < 6) continue;
          var gx = toScreenX((cx2+0.5)*CW), gy = toScreenY((cy2+0.7)*CH);
          ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx - view.s*3, gy - view.s*7);
          ctx.moveTo(gx, gy); ctx.lineTo(gx + view.s*3, gy - view.s*7); ctx.stroke();
        }

        // campfire (sheep gather round it) — glows brighter after dark
        drawCampfire(now);

        // sheep sorted by y (painter's)
        var ids = Object.keys(sheep).sort(function(a,b){ return sheep[a].ry - sheep[b].ry; });
        for (var k=0;k<ids.length;k++) drawSheep(ids[k]);

        // visitor question bubbles
        for (var qid in qBubbles){
          var qb = qBubbles[qid]; if (now - qb.t > 6000){ delete qBubbles[qid]; continue; }
          var qs = sheep[qid]; if (!qs) continue;
          ctx.globalAlpha = (now - qb.t > 5200) ? Math.max(0, (6000-(now-qb.t))/800) : 1;
          drawSpeechBubble(toScreenX(qs.rx), toScreenY(qs.ry) - view.s*44, qb.text);
          ctx.globalAlpha = 1;
        }
        // exec AI speech bubbles (drawn above the herd)
        for (var eid in execBubbles){
          var eb = execBubbles[eid]; if (now - eb.t > 7000){ delete execBubbles[eid]; continue; }
          var es = sheep[eid]; if (!es) continue;
          ctx.globalAlpha = (now - eb.t > 6200) ? Math.max(0, (7000-(now-eb.t))/800) : 1;
          drawSpeechBubble(toScreenX(es.rx), toScreenY(es.ry) - view.s*44, eb.text);
          ctx.globalAlpha = 1;
        }

        // baa bubbles
        for (var bi=baas.length-1; bi>=0; bi--){
          var ba = baas[bi], age = (now - ba.t)/1200, ss = sheep[ba.id];
          if (age >= 1 || !ss){ baas.splice(bi,1); continue; }
          var bx = toScreenX(ss.rx), by = toScreenY(ss.ry) - view.s*70 - age*view.s*40;
          ctx.globalAlpha = 1-age;
          ctx.font = "700 "+(view.s*26)+"px "+"'Courier New',monospace"; ctx.fillStyle = "#fff";
          ctx.textAlign = "center"; ctx.fillText("baa~", bx, by);
          ctx.font = (view.s*22)+"px sans-serif"; ctx.fillText("💛", bx + view.s*24, by - view.s*6*Math.sin(age*6));
          ctx.globalAlpha = 1;
        }

        // time-of-day wash: warm at golden hour, deep blue at night, + fireflies (shared meadow clock)
        var hh = meadowHour;
        var gold = Math.max(0, 1 - Math.abs(hh - 18.7)/1.6);
        if (gold > 0){ ctx.fillStyle = "rgba(240,150,70," + (gold*0.16) + ")"; ctx.fillRect(0,0,cv.width,cv.height); }
        var nf = nightness();
        if (nf > 0){
          ctx.fillStyle = "rgba(18,22,60," + (nf*0.5) + ")"; ctx.fillRect(0,0,cv.width,cv.height);
          if (nf > 0.4 && !reduce){
            for (var fi=0; fi<flies.length; fi++){ var f = flies[fi];
              var gx = f.x + Math.sin(now/1000*f.sp + f.p)*26, gy = f.y + Math.cos(now/1200*f.sp + f.p)*16;
              ctx.globalAlpha = (nf-0.4)/0.6 * (0.4 + 0.5*(0.5+0.5*Math.sin(now/500 + f.p)));
              ctx.fillStyle = "#eaff8a"; ctx.shadowColor = "#c8ff5a"; ctx.shadowBlur = 10;
              ctx.beginPath(); ctx.arc(gx, gy, 2, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0;
            }
            ctx.globalAlpha = 1;
          }
        }

        // weather: a grey wash when cloudy/rainy, plus falling rain
        if (weather === 1){ ctx.fillStyle = "rgba(70,76,92,.14)"; ctx.fillRect(0,0,cv.width,cv.height); }
        if (weather === 2){
          ctx.fillStyle = "rgba(55,60,78,.28)"; ctx.fillRect(0,0,cv.width,cv.height);
          if (!reduce){
            ctx.strokeStyle = "rgba(180,200,230,.45)"; ctx.lineWidth = Math.max(1, view.s*0.9);
            ctx.beginPath();
            for (var ri=0; ri<rain.length; ri++){ var dp = rain[ri];
              dp.y += dp.sp * view.s; dp.x += view.s*1.6;
              if (dp.y > cv.height){ dp.y = -10; dp.x = Math.random()*cv.width; }
              ctx.moveTo(dp.x, dp.y); ctx.lineTo(dp.x - view.s*2.5, dp.y - dp.l*view.s);
            }
            ctx.stroke();
          }
        }

        // your cursor target marker
        if (pointer.active){
          var txs = toScreenX(pointer.x), tys = toScreenY(pointer.y);
          ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = view.s*1.5;
          ctx.beginPath(); ctx.arc(txs, tys, view.s*7 + Math.sin(now/300)*view.s*2, 0, 6.28); ctx.stroke();
        }

        ambientTick(now);
        requestAnimationFrame(render);
      }

      function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
      function drawSpeechBubble(cx, baseY, text){
        var u = view.s;
        ctx.font = "600 " + (u*11) + "px system-ui, -apple-system, sans-serif";
        var words = text.split(" "), lines = [], cur = "";
        for (var i=0;i<words.length;i++){ var tst = cur ? cur+" "+words[i] : words[i];
          if (ctx.measureText(tst).width > u*175 && cur){ lines.push(cur); cur = words[i]; } else cur = tst; }
        if (cur) lines.push(cur);
        if (lines.length > 4){ lines = lines.slice(0,4); lines[3] = lines[3].slice(0,26) + "…"; }
        var w = 0; for (var l=0;l<lines.length;l++) w = Math.max(w, ctx.measureText(lines[l]).width);
        var padX = u*9, padY = u*6, lh = u*14;
        var bw = w + padX*2, bh = lines.length*lh + padY*2, bx = cx - bw/2, by = baseY - bh;
        ctx.fillStyle = "rgba(251,244,226,.96)"; ctx.strokeStyle = "rgba(74,47,28,.5)"; ctx.lineWidth = Math.max(1, u*1.2);
        roundRect(bx, by, bw, bh, u*8); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx-u*6, by+bh-u*0.5); ctx.lineTo(cx+u*6, by+bh-u*0.5); ctx.lineTo(cx, by+bh+u*8); ctx.closePath();
        ctx.fillStyle = "rgba(251,244,226,.96)"; ctx.fill();
        ctx.fillStyle = "#33261a"; ctx.textAlign = "center";
        for (var l2=0;l2<lines.length;l2++) ctx.fillText(lines[l2], cx, by + padY + lh*(l2+1) - u*3.5);
      }

      // campfire the herd gathers around; flames flicker, glow strengthens at night
      function drawCampfire(now){
        var cx = toScreenX(W*0.5), cy = toScreenY(H*0.6);
        var u = view.s, nf = nightness();
        var flick = reduce ? 1 : (0.85 + 0.15*Math.sin(now/90) + 0.08*Math.sin(now/37));
        // glow
        var glowR = u*70*(0.6 + nf*0.8);
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
        g.addColorStop(0, "rgba(255,150,50," + (0.10 + nf*0.28) + ")");
        g.addColorStop(1, "rgba(255,150,50,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, 6.28); ctx.fill();
        // logs
        ctx.strokeStyle = "#5a3a20"; ctx.lineWidth = u*4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(cx-u*14, cy+u*6); ctx.lineTo(cx+u*14, cy+u*8);
        ctx.moveTo(cx-u*12, cy+u*9); ctx.lineTo(cx+u*13, cy+u*4); ctx.stroke();
        ctx.lineCap = "butt";
        // flames
        var flames = [["rgba(196,40,20,.9)",18],["rgba(240,120,30,.95)",13],["rgba(255,200,70,.95)",8]];
        for (var fl=0; fl<flames.length; fl++){
          var hgt = flames[fl][1]*u*flick;
          ctx.fillStyle = flames[fl][0];
          ctx.beginPath();
          ctx.moveTo(cx - hgt*0.5, cy);
          ctx.quadraticCurveTo(cx - hgt*0.35, cy - hgt*0.7, cx, cy - hgt);
          ctx.quadraticCurveTo(cx + hgt*0.35, cy - hgt*0.7, cx + hgt*0.5, cy);
          ctx.quadraticCurveTo(cx, cy + hgt*0.2, cx - hgt*0.5, cy); ctx.fill();
        }
        // sparks at night
        if (nf > 0.4 && !reduce){
          for (var sp=0; sp<5; sp++){
            var ph = now/600 + sp*1.7, life = (ph % 1);
            ctx.globalAlpha = (1-life) * (nf);
            ctx.fillStyle = "#ffd27a";
            ctx.beginPath(); ctx.arc(cx + Math.sin(ph*4+sp)*u*8, cy - life*u*46, u*1.4, 0, 6.28); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      }

      function drawSheep(id){
        var s = sheep[id], info = roster[id] || { name:"", hue:0, color:-1, hat:"" };
        var x = toScreenX(s.rx), y = toScreenY(s.ry), u = view.s;   // u = world->screen unit
        var mine = (+id === myId);
        var asleep = s.state === 3, grazing = s.state === 2, walking = s.state === 1;
        var wob = walking && !reduce ? Math.sin(performance.now()/120 + id*1.3) * u*2 : 0;

        // shadow
        ctx.fillStyle = "rgba(20,35,15,.28)";
        ctx.beginPath(); ctx.ellipse(x, y + u*10, u*20, u*7, 0, 0, 6.28); ctx.fill();

        // legs
        ctx.strokeStyle = "#6b5540"; ctx.lineWidth = u*3;
        ctx.beginPath();
        ctx.moveTo(x-u*8, y+u*6); ctx.lineTo(x-u*8, y+u*12);
        ctx.moveTo(x+u*8, y+u*6); ctx.lineTo(x+u*8, y+u*12); ctx.stroke();

        // fluffy body (cluster of circles) — fleece can be tinted a pastel colour
        ctx.fillStyle = (info.color != null && info.color >= 0) ? "hsl("+info.color+",50%,90%)" : (mine ? "#fffdf5" : "#f3efe4");
        var body = [[0,-2,17],[-11,-4,10],[11,-4,10],[-6,-12,10],[7,-12,10],[0,-16,9]];
        for (var i=0;i<body.length;i++){ ctx.beginPath(); ctx.arc(x+body[i][0]*u+wob, y+body[i][1]*u, body[i][2]*u, 0, 6.28); ctx.fill(); }

        // head (front-left), lowers when grazing
        var hx = x - u*14 + wob, hy = y - (grazing ? u*2 : u*8);
        ctx.fillStyle = "#42352a";
        ctx.beginPath(); ctx.ellipse(hx, hy, u*7, u*8, -0.3, 0, 6.28); ctx.fill();
        // ears
        ctx.beginPath(); ctx.ellipse(hx-u*5, hy-u*4, u*3, u*2, -0.6, 0, 6.28);
        ctx.ellipse(hx+u*2, hy-u*6, u*3, u*2, 0.4, 0, 6.28); ctx.fill();
        // face
        ctx.fillStyle = "#fff";
        if (asleep){
          ctx.strokeStyle = "#fff"; ctx.lineWidth = u*1.4;
          ctx.beginPath(); ctx.moveTo(hx-u*4, hy-u*1); ctx.lineTo(hx-u*1, hy+u*1);
          ctx.moveTo(hx+u*1, hy-u*1); ctx.lineTo(hx+u*4, hy+u*1); ctx.stroke();
          // zzz
          ctx.fillStyle = "#fff"; ctx.font = "700 "+(u*13)+"px 'Courier New',monospace"; ctx.textAlign="left";
          var zt = (performance.now()/500)%1;
          ctx.globalAlpha = 1-zt; ctx.fillText("z", x+u*8, y-u*20 - zt*u*14); ctx.globalAlpha = 1;
        } else {
          ctx.beginPath(); ctx.arc(hx-u*2, hy-u*1, u*1.6, 0, 6.28); ctx.arc(hx+u*3, hy-u*1, u*1.6, 0, 6.28); ctx.fill();
        }

        // hats: your own 🤠 with a ring, or an exec's signature hat
        if (mine){
          ctx.strokeStyle = "rgba(255,214,80,.9)"; ctx.lineWidth = u*2;
          ctx.beginPath(); ctx.arc(x, y-u*2, u*24, 0, 6.28); ctx.stroke();
          ctx.font = (u*20)+"px sans-serif"; ctx.textAlign="center"; ctx.fillText("🤠", hx, hy - u*10);
        } else if (info.role && HATS[info.role]){
          ctx.font = (u*20)+"px sans-serif"; ctx.textAlign="center"; ctx.fillText(HATS[info.role], hx, hy - u*10);
        } else if (info.hat){
          ctx.font = (u*18)+"px sans-serif"; ctx.textAlign="center"; ctx.fillText(info.hat, hx, hy - u*10);
        }

        // name label (execs get a gold "Name · ROLE" plate)
        if (info.name){
          ctx.textAlign = "center";
          var label = info.role ? (info.name + " · " + info.role) : info.name;
          ctx.font = "700 "+(u*11)+"px 'Courier New',monospace";
          ctx.fillStyle = "rgba(20,30,12,.55)"; ctx.fillText(label, x+1, y-u*26+1);
          ctx.fillStyle = mine ? "#fff" : (info.role ? "#ffd86b" : "hsl("+info.hue+",70%,88%)");
          ctx.fillText(label, x, y-u*27);
        }
      }
      requestAnimationFrame(render);

      // ---------- ambient sound (opt-in): wind + birds by day, crickets at night ----------
      var audio = { on:false, ac:null, master:null, wind:null, windLp:null, nextChirp:0 };
      function buildAudio(){
        var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
        var ac = new AC(); audio.ac = ac;
        var master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); audio.master = master;
        var buf = ac.createBuffer(1, Math.floor(ac.sampleRate*2), ac.sampleRate), d = buf.getChannelData(0);
        for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*0.6;
        var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 480;
        var wg = ac.createGain(); wg.gain.value = 0.04;
        src.connect(lp); lp.connect(wg); wg.connect(master); src.start();
        audio.wind = wg; audio.windLp = lp;
        return true;
      }
      function chirp(night){
        var ac = audio.ac; if (!ac) return; var t = ac.currentTime;
        if (night){                                   // cricket: fast high pulses
          for (var k=0;k<4;k++){ var o=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();
            o.type="square"; o.frequency.value = 4300 + Math.random()*300;
            bp.type="bandpass"; bp.frequency.value = 4500; bp.Q.value = 8;
            o.connect(bp); bp.connect(g); g.connect(audio.master);
            var st = t + k*0.03; g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.06, st+0.004); g.gain.linearRampToValueAtTime(0, st+0.02);
            o.start(st); o.stop(st+0.03); }
        } else {                                      // bird: short rising warble
          var o2=ac.createOscillator(), g2=ac.createGain(); o2.type="sine"; o2.connect(g2); g2.connect(audio.master);
          o2.frequency.setValueAtTime(1900+Math.random()*400, t);
          o2.frequency.linearRampToValueAtTime(2500+Math.random()*500, t+0.08);
          o2.frequency.linearRampToValueAtTime(2100, t+0.16);
          g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.05, t+0.02); g2.gain.linearRampToValueAtTime(0, t+0.22);
          o2.start(t); o2.stop(t+0.24);
        }
      }
      function ambientTick(now){
        if (!audio.on || !audio.ac) return;
        if (audio.wind){ var tg = weather===2 ? 0.11 : weather===1 ? 0.06 : 0.035; audio.wind.gain.value += (tg - audio.wind.gain.value)*0.02; }
        if (audio.windLp){ var lt = weather===2 ? 900 : 480; audio.windLp.frequency.value += (lt - audio.windLp.frequency.value)*0.02; }
        if (now > audio.nextChirp){
          var night = nightness() > 0.5; chirp(night);
          audio.nextChirp = now + (night ? (900 + Math.random()*1800) : (3000 + Math.random()*5000));
        }
      }
      var sndBtn = document.getElementById("sndBtn");
      sndBtn.addEventListener("click", function(){
        if (!audio.on){
          if (!audio.ac && !buildAudio()) return;
          if (audio.ac.state === "suspended") audio.ac.resume();
          audio.on = true; audio.nextChirp = performance.now() + 700;
          audio.master.gain.setTargetAtTime(0.6, audio.ac.currentTime, 0.4);
          sndBtn.textContent = "🔊 sound";
        } else {
          audio.on = false;
          if (audio.master) audio.master.gain.setTargetAtTime(0, audio.ac.currentTime, 0.3);
          sndBtn.textContent = "🔈 sound";
        }
      });

      // ---------- customize your sheep (name + fleece colour + hat) ----------
      (function(){
        var COLORS = [-1, 20, 45, 95, 150, 200, 260, 320];      // -1 = classic white
        var HAT_LIST = ["", "🎩", "🎀", "👒", "🌸", "🧢", "⭐", "🌵", "🎧"];
        var cName = document.getElementById("cName"), cColors = document.getElementById("cColors"),
            cHats = document.getElementById("cHats"), cDone = document.getElementById("cDone"),
            custBtn = document.getElementById("custBtn"), cpanel = document.getElementById("cpanel");
        cName.value = myCustom.name;
        function apply(){
          try { localStorage.setItem("chill-name", myCustom.name); localStorage.setItem("chill-color", myCustom.color); localStorage.setItem("chill-hat", myCustom.hat); } catch(e){}
          sendCustom();
          if (myCustom.name) document.getElementById("youName").textContent = myCustom.name;
        }
        COLORS.forEach(function(h){
          var b = document.createElement("button"); b.className = "sw" + (h===myCustom.color?" on":"");
          b.style.background = h<0 ? "#f3efe4" : "hsl("+h+",50%,88%)"; b.title = h<0 ? "classic white" : "coloured fleece";
          b.addEventListener("click", function(){ myCustom.color = h;
            Array.prototype.forEach.call(cColors.children, function(x){ x.classList.remove("on"); }); b.classList.add("on"); apply(); });
          cColors.appendChild(b);
        });
        HAT_LIST.forEach(function(ht){
          var b = document.createElement("button"); b.className = "ht" + (ht===myCustom.hat?" on":""); b.textContent = ht || "∅";
          b.addEventListener("click", function(){ myCustom.hat = ht;
            Array.prototype.forEach.call(cHats.children, function(x){ x.classList.remove("on"); }); b.classList.add("on"); apply(); });
          cHats.appendChild(b);
        });
        cName.addEventListener("input", function(){ myCustom.name = cName.value.trim(); });
        cName.addEventListener("change", apply);
        cName.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); apply(); cName.blur(); } });
        custBtn.addEventListener("click", function(){ cpanel.hidden = !cpanel.hidden; });
        cDone.addEventListener("click", function(){ myCustom.name = cName.value.trim(); apply(); cpanel.hidden = true; });
      })();
    })();
    </script>
  ranch.html: |
    <meta charset="utf-8" />
    <title>The Ranch — Chill Farm Lounge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A cozy evening lounge. Swing in a hammock, set your name, and chat with whoever's chilling at Chill Farm right now." />
    <style>
      :root{
        --wheat:#d9a441; --wheat-deep:#b5822c; --saddle:#7a4a26; --saddle-dk:#3a2416; --terra:#c15a34;
        --ink:#f0e4cf; --ink-soft:#c9b79a;
        --display:"Rockwell","Rockwell Nova","Roboto Slab","Courier New",Georgia,serif;
        --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        --mono:"Courier New",ui-monospace,monospace;
        --ease:cubic-bezier(.22,.61,.36,1);
      }
      *{box-sizing:border-box;}
      html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);
        background:#241a3a;-webkit-text-size-adjust:100%;}

      /* evening sky — this page commits to one cozy dusk world on purpose */
      .scene{position:fixed;inset:0;overflow:hidden;
        background:linear-gradient(180deg,#1a1436 0%,#3a2550 40%,#7d4a5a 72%,#c8794a 100%);}
      .stars{position:absolute;inset:0;height:70%;pointer-events:none;}
      .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fdf5d8;opacity:.85;
        animation:tw 4s ease-in-out infinite;}
      @keyframes tw{0%,100%{opacity:.3;}50%{opacity:.9;}}
      .moon{position:absolute;top:8%;right:12%;width:80px;height:80px;border-radius:50%;
        background:radial-gradient(circle at 38% 35%,#fbf5db,#e9e0c2 65%);box-shadow:0 0 50px 14px rgba(240,230,190,.35);}
      .hills{position:absolute;left:-5%;width:110%;bottom:0;height:26%;background:#2a1e30;border-radius:50% 50% 0 0/100% 100% 0 0;}
      .hills.b{bottom:0;height:18%;background:#1d1422;}

      /* string lights */
      .lights{position:absolute;top:0;left:0;right:0;height:60px;pointer-events:none;}
      .bulb{position:absolute;top:0;width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px 2px currentColor;
        animation:glow 3s ease-in-out infinite;}
      @keyframes glow{0%,100%{opacity:.55;}50%{opacity:1;}}

      /* hammocks */
      .hammocks{position:absolute;inset:0;}
      .hammock{position:absolute;transform:translate(-50%,-50%);width:150px;text-align:center;z-index:2;}
      .hammock .swing{display:inline-block;transform-origin:top center;animation:sway 5s ease-in-out infinite;}
      .hammock:nth-child(even) .swing{animation-duration:6.2s;}
      @keyframes sway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
      .rope{position:relative;width:132px;height:2px;margin:0 auto;background:#c79a5c;}
      .rope::before,.rope::after{content:"";position:absolute;top:0;width:2px;height:30px;background:#c79a5c;transform-origin:top;}
      .rope::before{left:0;transform:rotate(24deg);}
      .rope::after{right:0;transform:rotate(-24deg);}
      .cloth{width:112px;height:40px;margin:26px auto 0;border-radius:6px 6px 56px 56px/6px 6px 60px 60px;
        background:repeating-linear-gradient(90deg,#caa15e 0 7px,#b98a48 7px 14px);
        box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.3);}
      .rider{position:relative;margin-top:-52px;font-size:2rem;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));}
      .nm{margin-top:14px;font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;color:var(--ink);
        text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .hammock.me .cloth{background:repeating-linear-gradient(90deg,#ffd98a 0 7px,#e9b45c 7px 14px);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 0 0 2px rgba(255,214,80,.5),0 6px 14px rgba(0,0,0,.35);}
      .hammock.me .nm{color:#ffe6ad;}

      .bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-6px);z-index:5;
        background:#fbf4e2;color:#33261a;font-size:.82rem;line-height:1.3;padding:.5rem .7rem;border-radius:12px;
        max-width:200px;min-width:36px;box-shadow:0 8px 20px rgba(0,0,0,.35);word-wrap:break-word;
        animation:pop .3s var(--ease);}
      .bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
        border:7px solid transparent;border-top-color:#fbf4e2;}
      @keyframes pop{from{opacity:0;transform:translate(-50%,4px) scale(.8);}to{opacity:1;transform:translate(-50%,-6px) scale(1);}}
      .bubble.leaving{opacity:0;transition:opacity .6s;}

      /* top bar */
      .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
        gap:.6rem;padding:.7rem 1rem;background:linear-gradient(180deg,rgba(20,15,30,.55),transparent);}
      .brand{display:flex;align-items:center;gap:.5rem;font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;
        color:#fff;text-decoration:none;text-shadow:0 2px 4px rgba(0,0,0,.5);}
      .brand .badge{width:26px;height:26px;display:grid;place-items:center;background:var(--wheat);color:var(--saddle-dk);
        border-radius:50%;font-size:1rem;box-shadow:inset 0 0 0 2px var(--saddle-dk);}
      .top nav{display:flex;gap:1rem;align-items:center;font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;}
      .top nav a{color:#f0e4cf;text-decoration:none;opacity:.85;}
      .top nav a:hover{opacity:1;}
      .count{background:rgba(20,15,30,.55);border:1px solid rgba(217,164,65,.5);border-radius:30px;padding:.3rem .7rem;
        color:#ffe6ad;white-space:nowrap;}

      /* chat dock */
      .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:.6rem;display:flex;flex-direction:column;gap:.5rem;
        background:linear-gradient(0deg,rgba(20,14,28,.82),rgba(20,14,28,.4) 70%,transparent);}
      .log{max-width:720px;width:100%;margin:0 auto;max-height:26vh;overflow-y:auto;display:flex;flex-direction:column;gap:.25rem;
        font-size:.86rem;padding:0 .2rem;}
      .line{line-height:1.35;text-shadow:0 1px 2px rgba(0,0,0,.5);word-wrap:break-word;}
      .line b{font-family:var(--mono);font-size:.8rem;}
      .line.sys{color:var(--ink-soft);font-style:italic;font-size:.78rem;}
      .inputs{max-width:720px;width:100%;margin:0 auto;display:flex;gap:.5rem;flex-wrap:wrap;}
      .inputs input{font-family:var(--body);font-size:16px;border-radius:30px;border:2px solid var(--wheat);
        background:rgba(251,244,226,.95);color:#33261a;padding:.6rem .9rem;outline:none;}
      #nameIn{flex:0 0 130px;min-width:110px;font-family:var(--mono);}
      #msgIn{flex:1 1 200px;min-width:140px;}
      #sendBtn,#orderBtn{flex:0 0 auto;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:.95rem;
        color:#f4ead0;background:var(--terra);border:2px solid var(--saddle-dk);border-radius:30px;padding:.55rem 1.2rem;
        cursor:pointer;box-shadow:0 4px 0 var(--saddle-dk);}
      #orderBtn{background:var(--wheat-deep);padding:.55rem .8rem;}
      #sendBtn:active,#orderBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--saddle-dk);}
      @media (max-width:520px){ #nameIn{flex:1 1 100%;} }

      .conn{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(20,15,30,.8);
        color:#ffe6ad;font-family:var(--mono);text-align:center;padding:1.5rem;transition:opacity .5s;}
      .conn.hide{opacity:0;pointer-events:none;}
      .conn .big{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;margin-bottom:.4rem;color:#fff;}

      @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;}
      }
    </style>

    <div class="scene">
      <div class="stars" id="stars"></div>
      <div class="moon"></div>
      <div class="lights" id="lights"></div>
      <div class="hills"></div>
      <div class="hills b"></div>
      <div class="hammocks" id="hammocks"></div>
    </div>

    <header class="top">
      <a class="brand" href="/"><span class="badge">🌙</span> The Ranch</a>
      <nav>
        <a href="/pasture/">Pasture</a>
        <a href="/">Home</a>
        <button id="sndBtn" class="count" style="cursor:pointer;font-family:var(--mono);font-size:.76rem">🔈 sound</button>
        <span class="count">🛖 <b id="count">–</b> loungin'</span>
      </nav>
    </header>

    <div class="dock">
      <div class="log" id="log"></div>
      <div class="inputs">
        <input id="nameIn" maxlength="18" placeholder="your name" autocomplete="off" />
        <input id="msgIn" maxlength="240" placeholder="say something chill…" autocomplete="off" enterkeyhint="send" />
        <button id="orderBtn" type="button" title="Order a drink from Sam">🍹</button>
        <button id="sendBtn" type="button">Send</button>
      </div>
    </div>

    <div class="conn" id="conn"><div><div class="big">🌙 finding the ranch…</div><div id="connMsg">pulling up a hammock for you</div></div></div>

    <script>
    (function(){
      "use strict";
      // starfield + string lights (decorative)
      var starC = document.getElementById("stars");
      for (var i=0;i<70;i++){ var s=document.createElement("div"); s.className="star";
        s.style.left=(Math.random()*100)+"%"; s.style.top=(Math.random()*100)+"%";
        s.style.animationDelay=(Math.random()*4)+"s"; starC.appendChild(s); }
      var lightC = document.getElementById("lights"), lcols=["#ffd36b","#ff8f6b","#8fe0ff","#c9ff8f","#ff6ba1"];
      for (var b=0;b<24;b++){ var bl=document.createElement("div"); bl.className="bulb";
        bl.style.left=(b/23*100)+"%"; bl.style.top=(6+Math.sin(b/23*Math.PI)* -14 + 14)+"px";
        bl.style.color=lcols[b%lcols.length]; bl.style.animationDelay=(Math.random()*3)+"s"; lightC.appendChild(bl); }

      var hammocksEl = document.getElementById("hammocks"), logEl = document.getElementById("log"),
          countEl = document.getElementById("count"), nameIn = document.getElementById("nameIn"),
          msgIn = document.getElementById("msgIn"), sendBtn = document.getElementById("sendBtn"),
          connEl = document.getElementById("conn"), connMsg = document.getElementById("connMsg");
      var myId = null, hammocks = {};   // id -> element

      // stable per-browser identity + saved name (shared with the pasture sheep)
      var token; try { token = localStorage.getItem("chillId"); if (!token){ token = "r"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("chillId", token); } } catch(e){ token = "r"+Math.random().toString(36).slice(2); }
      try { var savedName = localStorage.getItem("chill-name"); if (savedName) nameIn.value = savedName; } catch(e){}

      function slotPos(slot){
        var perRow = Math.max(3, Math.min(5, Math.floor(innerWidth/220)));
        var row = Math.floor(slot/perRow), col = slot % perRow;
        var span = 76 / perRow;
        var x = 12 + col*span + span/2 + (row%2 ? span/2.5 : 0);
        var y = 30 + (row % 3)*18 + (Math.floor(row/3)*4);
        return { x: Math.min(90, x), y: Math.min(72, y) };
      }
      function riderFor(g){ return g.emoji || (g.id===myId ? "🤠" : "😌"); }
      function makeHammock(g){
        var h = document.createElement("div"); h.className = "hammock" + (g.id===myId ? " me":"") + (g.host ? " host":"");
        h.innerHTML = '<div class="swing"><div class="rope"></div><div class="cloth"></div>'+
          '<div class="rider">'+riderFor(g)+'</div></div><div class="nm"></div>';
        h.querySelector(".nm").textContent = g.name;
        var p = slotPos(g.slot); h.style.left = p.x+"%"; h.style.top = p.y+"%";
        hammocksEl.appendChild(h); return h;
      }
      function reconcile(guests){
        var seen = {};
        for (var i=0;i<guests.length;i++){ var g=guests[i]; seen[g.id]=1;
          var h = hammocks[g.id];
          if (!h){ h = hammocks[g.id] = makeHammock(g); }
          else { var p=slotPos(g.slot); h.style.left=p.x+"%"; h.style.top=p.y+"%"; h.querySelector(".nm").textContent=g.name; }
          h.classList.toggle("me", g.id===myId);
          h.querySelector(".rider").textContent = riderFor(g);
        }
        for (var id in hammocks) if (!seen[id]){ hammocks[id].remove(); delete hammocks[id]; }
      }
      addEventListener("resize", function(){ if (lastGuests) reconcile(lastGuests); });

      function addLine(name, hue, text, sys){
        var d = document.createElement("div"); d.className = "line" + (sys ? " sys":"");
        if (sys){ d.textContent = text; }
        else { var nb=document.createElement("b"); nb.style.color="hsl("+hue+",70%,78%)"; nb.textContent=name;
          d.appendChild(nb); d.appendChild(document.createTextNode(" " + text)); }
        logEl.appendChild(d);
        while (logEl.children.length > 80) logEl.removeChild(logEl.firstChild);
        logEl.scrollTop = logEl.scrollHeight;
      }
      function bubble(id, text){
        var h = hammocks[id]; if (!h) return;
        var prev = h.querySelector(".bubble"); if (prev) prev.remove();
        var bub = document.createElement("div"); bub.className="bubble"; bub.textContent = text;
        h.querySelector(".swing").appendChild(bub);
        setTimeout(function(){ bub.classList.add("leaving"); setTimeout(function(){ bub.remove(); }, 600); }, 5200);
      }

      var lastGuests = null, curGuests = {};
      // ---- websocket ----
      var ws, retry=0, replaced=false;
      function connect(){
        if (replaced) return;
        var proto = location.protocol==="https:" ? "wss":"ws";
        try { ws = new WebSocket(proto+"://"+location.host+"/rw"); } catch(e){ scheduleRetry(); return; }
        ws.onopen = function(){ retry=0; connEl.classList.add("hide");
          ws.send(JSON.stringify({ t:"hello", token:token, name:(nameIn.value.trim()||undefined) })); };
        ws.onclose = function(ev){
          if (ev && ev.code===4001){ replaced=true; connEl.classList.remove("hide");
            connEl.querySelector(".big").textContent="🛖 Already loungin'";
            connMsg.textContent="You're chilling in another tab. Refresh here to bring your hammock back."; return; }
          connEl.classList.remove("hide"); connMsg.textContent="reconnecting…"; scheduleRetry(); };
        ws.onerror = function(){ try{ ws.close(); }catch(e){} };
        ws.onmessage = function(ev){ onMsg(ev.data); };
      }
      function scheduleRetry(){ if (replaced) return; retry=Math.min(retry+1,6); setTimeout(connect, 500*retry); }
      function onMsg(data){
        var m; try { m=JSON.parse(data); } catch(e){ return; }
        if (m.t==="welcome"){ myId=m.id; }
        else if (m.t==="hist"){ logEl.innerHTML=""; for (var i=0;i<m.msgs.length;i++){ var x=m.msgs[i]; addLine(x.name,x.hue,x.text,false); } }
        else if (m.t==="r"){ lastGuests=m.guests; curGuests={}; for (var j=0;j<m.guests.length;j++) curGuests[m.guests[j].id]=m.guests[j]; reconcile(m.guests); countEl.textContent=m.n; }
        else if (m.t==="chat"){ addLine(m.m.name, m.m.hue, m.m.text, false); bubble(m.m.id, m.m.text); }
      }
      connect();

      // ---- send + name ----
      function sendChat(){
        var t = msgIn.value.trim(); if (!t || !ws || ws.readyState!==1) return;
        ws.send(JSON.stringify({ t:"chat", text:t })); msgIn.value="";
      }
      sendBtn.addEventListener("click", sendChat);
      msgIn.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); sendChat(); } });
      var orderBtn = document.getElementById("orderBtn");
      orderBtn.addEventListener("click", function(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:"order" })); });
      function setName(){
        var n = nameIn.value.trim(); if (!n) return;
        try { localStorage.setItem("chill-name", n); } catch(e){}
        if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:"name", name:n }));
      }
      nameIn.addEventListener("change", setName);
      nameIn.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); setName(); msgIn.focus(); } });

      // ---------- opt-in evening ambience: soft wind + crickets ----------
      var audio = { on:false, ac:null, master:null, timer:0 };
      function buildAudio(){
        var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
        var ac = new AC(); audio.ac = ac;
        var master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); audio.master = master;
        var buf = ac.createBuffer(1, Math.floor(ac.sampleRate*2), ac.sampleRate), d = buf.getChannelData(0);
        for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*0.5;
        var src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        var lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 420;
        var wg = ac.createGain(); wg.gain.value = 0.04;
        src.connect(lp); lp.connect(wg); wg.connect(master); src.start();
        return true;
      }
      function cricket(){
        var ac = audio.ac; if (!ac || !audio.on) return; var t = ac.currentTime;
        for (var k=0;k<4;k++){ var o=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();
          o.type="square"; o.frequency.value = 4300 + Math.random()*300; bp.type="bandpass"; bp.frequency.value=4500; bp.Q.value=8;
          o.connect(bp); bp.connect(g); g.connect(audio.master);
          var st=t+k*0.03; g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.06,st+0.004); g.gain.linearRampToValueAtTime(0,st+0.02);
          o.start(st); o.stop(st+0.03); }
        audio.timer = setTimeout(cricket, 800 + Math.random()*1800);
      }
      var sndBtn = document.getElementById("sndBtn");
      sndBtn.addEventListener("click", function(){
        if (!audio.on){
          if (!audio.ac && !buildAudio()) return;
          if (audio.ac.state === "suspended") audio.ac.resume();
          audio.on = true; audio.master.gain.setTargetAtTime(0.6, audio.ac.currentTime, 0.4);
          sndBtn.textContent = "🔊 sound"; cricket();
        } else {
          audio.on = false; clearTimeout(audio.timer);
          if (audio.master) audio.master.gain.setTargetAtTime(0, audio.ac.currentTime, 0.3);
          sndBtn.textContent = "🔈 sound";
        }
      });
    })();
    </script>
