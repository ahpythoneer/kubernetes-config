apiVersion: v1
kind: ConfigMap
metadata:
  name: chill-splash-src
  namespace: chill-farm
data:
  server.js: "'use strict';\n/* ============================================================\n   Chill Farm — \"/splash\" : Super Soaker Splash \U0001F4A6\n   A wholesome water-gun free-for-all. Sheep chase each other with\n   squirt guns; get soaked, sit in a puddle, dry off in the sun,\n   hop back in. No elimination — just wet, happy chaos.\n   Server-authoritative. Dependency-free WebSocket server.\n   ============================================================ */\nconst http = require('http');\nconst crypto = require('crypto');\n\nconst PORT = process.env.PORT || 8080;\nconst GUID = '258EAFA5-E914-47DA-95CA-C5AB0DC85B11';\nconst W = 1200, H = 760, TICK = 50;\nconst SPEED = 240;                 // px/s move\nconst FIRE_RANGE = 300, FIRE_CONE = 0.42;\nconst WET_RATE = 62, DRY_RATE = 11;\nconst TANK_MAX = 100, TANK_FIRE = 34, TANK_REGEN = 9, TANK_REGEN_WELL = 46;\nconst DRENCH_MS = 2600;\nconst WELL = { x: W / 2, y: H / 2, r: 70 };\n\nconst clients = new Map();\nconst byToken = new Map();\nlet nextId = 1;\n\nfunction clean(s, max) { return String(s == null ? '' : s).replace(/[\\x00-\\x1f\\x7f]/g, '').slice(0, max).trim(); }\n\nfunction encode(str) {\n  const p = Buffer.from(str); const n = p.length; let head;\n  if (n < 126) head = Buffer.from([0x81, n]);\n  else if (n < 65536) { head = Buffer.alloc(4); head[0] = 0x81; head[1] = 126; head.writeUInt16BE(n, 2); }\n  else { head = Buffer.alloc(10); head[0] = 0x81; head[1] = 127; head.writeBigUInt64BE(BigInt(n), 2); }\n  return Buffer.concat([head, p]);\n}\nfunction sendRaw(c, buf) { try { c.sock.write(buf); } catch (e) { drop(c); } }\nfunction send(c, obj) { sendRaw(c, encode(JSON.stringify(obj))); }\nfunction broadcast(obj) { const b = encode(JSON.stringify(obj)); for (const c of clients.values()) sendRaw(c, b); }\nconst PING = Buffer.from([0x89, 0]);\nfunction closeFrame(code) { const b = Buffer.alloc(4); b[0] = 0x88; b[1] = 2; b.writeUInt16BE(code, 2); return b; }\n\nconst server = http.createServer((req, res) => {\n  const url = req.url || '/';\n  if (url.endsWith('/healthz')) { res.writeHead(200); res.end('ok'); return; }\n  if (url.endsWith('/stats')) {\n    res.writeHead(200, { 'content-type': 'application/json', 'cache-control': 'no-store', 'access-control-allow-origin': '*' });\n    res.end(JSON.stringify({ players: clients.size }));\n    return;\n  }\n  res.writeHead(200, { 'content-type': 'text/plain' });\n  res.end('super soaker splash :: ' + clients.size + ' getting wet');\n});\n\nserver.on('upgrade', (req, sock) => {\n  const key = req.headers['sec-websocket-key'];\n  if (!key) { sock.destroy(); return; }\n  const accept = crypto.createHash('sha1').update(key + GUID).digest('base64');\n  sock.write('HTTP/1.1 101 Switching Protocols\\r\\nUpgrade: websocket\\r\\nConnection: Upgrade\\r\\nSec-WebSocket-Accept: ' + accept + '\\r\\n\\r\\n');\n  onConnect(sock);\n});\n\nfunction onConnect(sock) {\n  const id = nextId++;\n  const c = {\n    id, sock, buf: Buffer.alloc(0),\n    name: 'Sheep ' + id, hue: (id * 47) % 360,\n    x: 100 + Math.random() * (W - 200), y: 100 + Math.random() * (H - 200),\n    mvx: 0, mvy: 0, aim: 0, wet: 0, tank: TANK_MAX, score: 0,\n    firing: false, state: 'ok', drenchUntil: 0, lastHitBy: 0,\n    lastSeen: Date.now(), token: null, alive: true,\n  };\n  clients.set(id, c);\n  sock.setNoDelay(true);\n  sock.on('data', (chunk) => onData(c, chunk));\n  sock.on('close', () => drop(c));\n  sock.on('error', () => drop(c));\n  send(c, { t: 'welcome', id, w: W, h: H, well: WELL });\n  broadcastRoster();\n}\n\nfunction drop(c) {\n  if (!c.alive) return;\n  c.alive = false;\n  clients.delete(c.id);\n  if (c.token && byToken.get(c.token) === c.id) byToken.delete(c.token);\n  try { c.sock.destroy(); } catch (e) {}\n  broadcastRoster();\n}\n\nfunction onData(c, chunk) {\n  c.lastSeen = Date.now();\n  c.buf = Buffer.concat([c.buf, chunk]);\n  while (true) {\n    const b = c.buf; if (b.length < 2) return;\n    const opcode = b[0] & 0x0f, masked = b[1] & 0x80;\n    let len = b[1] & 0x7f, off = 2;\n    if (len === 126) { if (b.length < 4) return; len = b.readUInt16BE(2);\
    \ off = 4; }\n    else if (len === 127) { if (b.length < 10) return; len = Number(b.readBigUInt64BE(2)); off = 10; }\n    if (len > 1_000_000) { drop(c); return; }\n    let mask; if (masked) { if (b.length < off + 4) return; mask = b.slice(off, off + 4); off += 4; }\n    if (b.length < off + len) return;\n    let pay = b.slice(off, off + len);\n    if (masked) { const o = Buffer.alloc(len); for (let i = 0; i < len; i++) o[i] = pay[i] ^ mask[i & 3]; pay = o; }\n    c.buf = b.slice(off + len);\n    if (opcode === 0x8) { drop(c); return; }\n    else if (opcode === 0x9) { sendRaw(c, Buffer.concat([Buffer.from([0x8a, pay.length & 0x7f]), pay])); }\n    else if (opcode === 0x1) { onMessage(c, pay.toString()); }\n  }\n}\n\nfunction onMessage(c, str) {\n  let m; try { m = JSON.parse(str); } catch (e) { return; }\n  if (m.t === 'hello') {\n    if (typeof m.token === 'string' && m.token.length <= 64) {\n      const prev = byToken.get(m.token);\n      if (prev && prev !== c.id && clients.has(prev)) { const old = clients.get(prev); try { old.sock.write(closeFrame(4001)); } catch (e) {} drop(old); }\n      c.token = m.token; byToken.set(m.token, c.id);\n    }\n    const nm = clean(m.name, 18); if (nm) c.name = nm;\n    broadcastRoster();\n  } else if (m.t === 'name') {\n    const nm = clean(m.name, 18); if (nm) { c.name = nm; broadcastRoster(); }\n  } else if (m.t === 'mv') {\n    if (typeof m.dx === 'number' && typeof m.dy === 'number') { c.mvx = Math.max(-1, Math.min(1, m.dx)); c.mvy = Math.max(-1, Math.min(1, m.dy)); }\n  } else if (m.t === 'aim') {\n    if (typeof m.a === 'number' && isFinite(m.a)) c.aim = m.a;\n  } else if (m.t === 'fire') {\n    c.firing = !!m.on;\n  } else if (m.t === 'chat') {\n    const text = clean(m.text, 160);\n    if (!text || Date.now() - (c.lastChat || 0) < 700) return;\n    c.lastChat = Date.now();\n    broadcast({ t: 'chat', m: { id: c.id, name: c.name, hue: c.hue, text } });\n  }\n}\n\nfunction coneHit(sx, sy, aim, px, py) {\n  const dx = px - sx, dy = py - sy, dist = Math.hypot(dx, dy);\n  if (dist < 22 || dist > FIRE_RANGE) return false;\n  let da = Math.abs(Math.atan2(dy, dx) - aim); if (da > Math.PI) da = 2 * Math.PI - da;\n  return da < FIRE_CONE * (1 - Math.min(0.6, dist / FIRE_RANGE * 0.6));  // tighter cone at range\n}\n\nfunction broadcastRoster() {\n  const players = [];\n  for (const c of clients.values()) players.push({ id: c.id, name: c.name, hue: c.hue, score: c.score });\n  broadcast({ t: 'r', players, n: clients.size });\n}\n\nlet last = Date.now();\nsetInterval(() => {\n  const now = Date.now(), dt = (now - last) / 1000; last = now;\n  const list = [...clients.values()];\n  // hit accumulation this tick\n  const hitBonus = new Map();\n  for (const c of list) {\n    if (c.state === 'drenched') { if (now > c.drenchUntil) { c.state = 'ok'; c.wet = 0; } continue; }\n    // move by input vector (twin-stick)\n    let mx = c.mvx, my = c.mvy; const len = Math.hypot(mx, my);\n    if (len > 0.01) { if (len > 1) { mx /= len; my /= len; } c.x = Math.max(0, Math.min(W, c.x + mx * SPEED * dt)); c.y = Math.max(0, Math.min(H, c.y + my * SPEED * dt)); }\n    // dry off + tank regen\n    c.wet = Math.max(0, c.wet - DRY_RATE * dt);\n    const nearWell = Math.hypot(c.x - WELL.x, c.y - WELL.y) < WELL.r + 60;\n    c.tank = Math.min(TANK_MAX, c.tank + (nearWell ? TANK_REGEN_WELL : TANK_REGEN) * dt);\n  }\n  // firing + collisions\n  for (const c of list) {\n    if (c.state !== 'ok' || !c.firing || c.tank <= 0) continue;\n    c.tank = Math.max(0, c.tank - TANK_FIRE * dt);\n    for (const p of list) {\n      if (p === c || p.state !== 'ok') continue;\n      if (coneHit(c.x, c.y, c.aim, p.x, p.y)) {\n        p.wet += WET_RATE * dt; p.lastHitBy = c.id;\n        if (p.wet >= 100) { p.state = 'drenched'; p.drenchUntil = now + DRENCH_MS; p.wet = 100;\n          hitBonus.set(c.id, (hitBonus.get(c.id) || 0) + 1); broadcast({ t: 'soak', by: c.id, who: p.id }); }\n      }\n    }\n  }\n  for (const [id, n] of hitBonus) { const c = clients.get(id); if (c) c.score += n; }\n  if (hitBonus.size) broadcastRoster();\n  //\
    \ broadcast state @ 20Hz\n  const players = [];\n  for (const c of list) players.push([c.id, Math.round(c.x), Math.round(c.y), Math.round(c.aim * 100), Math.round(c.wet), (c.firing && c.state === 'ok' && c.tank > 0) ? 1 : 0, c.state === 'drenched' ? 1 : 0, Math.round(c.tank)]);\n  broadcast({ t: 's', players });\n}, TICK);\n\nsetInterval(() => {\n  const now = Date.now();\n  for (const c of clients.values()) { if (now - c.lastSeen > 32000) { drop(c); continue; } sendRaw(c, PING); }\n}, 12000);\n\nserver.listen(PORT, () => console.log('super soaker splash listening on :' + PORT));\n"
