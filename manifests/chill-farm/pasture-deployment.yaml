apiVersion: apps/v1
kind: Deployment
metadata:
  name: chill-pasture
  namespace: chill-farm
  labels:
    app: chill-pasture
spec:
  # single replica on purpose: authoritative in-memory game state (one shared meadow)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chill-pasture
  template:
    metadata:
      labels:
        app: chill-pasture
      annotations:
        # bump to force a rollout when server.js changes
        chill-pasture/src-rev: "14"
    spec:
      initContainers:
      # make the NFS-backed data dir writable by the non-root app (uid 1000)
      - name: fix-perms
        image: busybox:1.36
        command: ["sh", "-c", "chmod 777 /data || true"]
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 0
      containers:
      - name: pasture
        image: node:20-alpine
        imagePullPolicy: IfNotPresent
        command: ["node", "/app/server.js"]
        env:
        - name: PORT
          value: "8080"
        - name: OLLAMA_URL          # DGX Spark Ollama for exec AI banter (LAN, bypasses CF Access)
          value: "http://10.0.129.94:11434"
        - name: OLLAMA_MODEL
          value: "llama3.1:8b"
        - name: DATA_FILE           # persistent state (chill points, saved sheep, guestbook)
          value: "/data/state.json"
        ports:
        - name: ws
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: src
          mountPath: /app/server.js
          subPath: server.js
          readOnly: true
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "48Mi"
            cpu: "50m"
          limits:
            memory: "192Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: ws
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: ws
          initialDelaySeconds: 5
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
      volumes:
      - name: src
        configMap:
          name: chill-pasture-src
          items:
          - key: server.js
            path: server.js
      - name: data
        persistentVolumeClaim:
          claimName: chill-pasture-data
