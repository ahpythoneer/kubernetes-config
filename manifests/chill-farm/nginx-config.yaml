apiVersion: v1
kind: ConfigMap
metadata:
  name: chill-farm-nginx
  namespace: chill-farm
  labels:
    app: chill-farm
data:
  # Included in nginx's http{} context (conf.d/*.conf); makes nginx emit
  # Content-Type: text/html; charset=utf-8 so emoji/dashes render correctly.
  charset.conf: |
    charset utf-8;
    charset_types text/html text/css application/javascript text/plain;
    # keep directory redirects (e.g. /careers -> /careers/) relative so the
    # https scheme isn't downgraded behind the Cloudflare tunnel
    absolute_redirect off;

    # ---- cache-control (http context; inherited by the server/location) ----
    # Without an explicit Cache-Control, Cloudflare applies its default 4h
    # Browser Cache TTL to static files (e.g. sw.js), which pins visitors on a
    # stale service worker and old cached pages. Set sane values by path:
    #   - sw.js / manifest / html  -> always revalidate (instant updates)
    #   - images/fonts             -> cache a day (they're content-hashed by name)
    map $uri $chill_cc {
        default                                      "no-cache";
        ~*^/sw\.js$                                   "no-store, must-revalidate";
        ~*^/manifest\.json$                           "no-cache";
        ~*\.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$    "public, max-age=86400";
    }
    add_header Cache-Control $chill_cc always;
