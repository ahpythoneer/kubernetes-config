apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chill-farm
  namespace: chill-farm
  annotations:
    # Traffic arrives via the Cloudflare Tunnel, which terminates TLS at the edge
    # and connects to this ingress over HTTP. No cert-manager / no external-dns
    # entry is needed for the only-chill.com zone. HTTP-only here on purpose.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # keep long-lived WebSocket connections (/ws -> pasture game server) alive
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: only-chill.com
    http:
      paths:
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chill-pasture
            port:
              number: 8080
      - path: /rw
        pathType: Prefix
        backend:
          service:
            name: chill-ranch
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chill-farm
            port:
              number: 80
  - host: www.only-chill.com
    http:
      paths:
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chill-pasture
            port:
              number: 8080
      - path: /rw
        pathType: Prefix
        backend:
          service:
            name: chill-ranch
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chill-farm
            port:
              number: 80
