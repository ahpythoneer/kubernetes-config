apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chill-farm
  namespace: chill-farm
  annotations:
    # Traffic arrives via the Cloudflare Tunnel, which terminates TLS at the edge
    # and connects to this ingress over HTTP. No cert-manager / no external-dns
    # entry is needed for the only-chill.com zone — the tunnel public hostname
    # creates the DNS record. HTTP-only here on purpose.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: only-chill.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chill-farm
            port:
              number: 80
  - host: www.only-chill.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chill-farm
            port:
              number: 80
