apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipdrop
  namespace: clips
  labels:
    app: clipdrop
spec:
  # single replica on purpose: the daily crawl runs in-process and owns the JSON store
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clipdrop
  template:
    metadata:
      labels:
        app: clipdrop
      annotations:
        # bump to force a rollout when the source ConfigMap changes
        clipdrop/src-rev: "1"
    spec:
      initContainers:
      # make the NFS-backed data dir writable by the non-root app (uid 1000)
      - name: fix-perms
        image: busybox:1.36
        command: ["sh", "-c", "chmod 777 /data || true"]
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 0
      containers:
      - name: clipdrop
        image: node:20-alpine
        imagePullPolicy: IfNotPresent
        command: ["node", "/app/server.js"]
        env:
        - name: PORT
          value: "8080"
        - name: TZ
          value: "America/Chicago"
        - name: CRAWL_HOUR          # daily crawl at 06:00 local
          value: "6"
        - name: DATA_DIR
          value: "/data"
        - name: OLLAMA_URLS         # DGX Spark first (LAN, bypasses CF Access), in-cluster Ollama as fallback
          value: "http://10.0.128.110:11434,http://ollama.ollama:11434"
        - name: OLLAMA_MODEL
          value: "llama3.1:8b"
        - name: ADMIN_TOKEN         # runtime-only Secret (repo is public): kubectl -n clips create secret generic clipdrop-admin --from-literal=token=...
          valueFrom:
            secretKeyRef:
              name: clipdrop-admin
              key: token
              optional: true
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: src
          mountPath: /app
          readOnly: true
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
      volumes:
      - name: src
        configMap:
          name: clipdrop-src
      - name: data
        persistentVolumeClaim:
          claimName: clipdrop-data
