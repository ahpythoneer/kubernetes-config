# ClipDrop app source (dev copy: ~/clips-app/src). Regenerate with:
#   kubectl create configmap clipdrop-src -n clips --from-file=~/clips-app/src --dry-run=client -o yaml
apiVersion: v1
data:
  crawler.js: |
    "use strict";
    // Daily crawl. Sources (all robots.txt-allowed, fetched politely, once a day):
    //  1. Slickdeals thread sitemaps (/attachment/sitemaps/threads-*.xml.gz) → threads
    //     whose slug mentions Great Clips → the thread page (/f/<id>) for title, body,
    //     post date and the offers.greatclips.com coupon link. We only LINK to
    //     offers.greatclips.com (its robots.txt disallows crawling), never fetch it.
    //  2. greatclips.com/promotions/ (+ its sub-pages) for nationwide perks/campaigns.
    // The LLM turns each post into structured fields; regex stays the source of
    // truth for dates and prices when it can find them.
    const zlib = require("zlib");
    const crypto = require("crypto");
    const store = require("./store");
    const geo = require("./geo");
    const llm = require("./llm");

    const UA = process.env.CRAWL_UA || "ClipDropBot/1.0 (+https://clips.racktocloud.com; daily, polite)";
    const MAX_AGE_DAYS = +(process.env.MAX_AGE_DAYS || 45);
    const MAX_THREADS = +(process.env.MAX_THREADS || 60);
    const DELAY_MS = +(process.env.CRAWL_DELAY_MS || 2500);

    let busy = false;
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const running = () => busy;

    async function get(url, { binary = false } = {}) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 30000);
      try {
        const r = await fetch(url, { headers: { "user-agent": UA, "accept-language": "en-US" }, signal: ctl.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
        return binary ? Buffer.from(await r.arrayBuffer()) : await r.text();
      } finally { clearTimeout(t); }
    }

    const decode = s => s.replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&nbsp;/g, " ").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n));
    const text = h => decode(h.replace(/<(script|style|svg)[^>]*>[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ")).replace(/\s+/g, " ").trim();
    const meta = (h, p) => { const m = h.match(new RegExp(`<meta[^>]+(?:property|name)="${p}"[^>]+content="([^"]*)"`, "i")); return m ? decode(m[1]).trim() : ""; };

    // ---- deterministic parsing -------------------------------------------------
    const MONTHS = "jan feb mar apr may jun jul aug sep oct nov dec".split(" ");
    function parseExpiry(s, ref) {
      const refY = ref.getUTCFullYear();
      let m = s.match(/(?:expir\w*|valid (?:through|thru|until)|ends?|good (?:through|thru|until)|thru|through)\s*:?\s*(?:on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i);
      let y, mo, d;
      if (m) { mo = +m[1]; d = +m[2]; y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
      else {
        m = s.match(/(?:expir\w*|valid (?:through|thru|until)|ends?|through|thru|until)\s*:?\s*(?:on\s+)?([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/i);
        if (!m || MONTHS.indexOf(m[1].toLowerCase()) < 0) return null;
        mo = MONTHS.indexOf(m[1].toLowerCase()) + 1; d = +m[2]; y = m[3] ? +m[3] : null;
      }
      if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
      if (!y) { // no year: the next occurrence on/after the post date
        y = refY;
        if (new Date(Date.UTC(y, mo - 1, d)) < new Date(ref.getTime() - 7 * 86400e3)) y++;
      }
      return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }

    const priceIn = s => { const m = s.match(/\$\s?(\d{1,2}(?:\.\d{2})?)\s*(off)?/i); return m ? { amount: +m[1], off: !!m[2] } : null; };

    // "$9.99" / "$10.99 Great Clips coupon" -> "$9.99 haircut"; keep good model headlines.
    function offerText(o, post) {
      o = String(o || "").trim();
      const p = priceIn(post.title) || priceIn(o) || priceIn(post.body);
      return p ? (p.off ? `$${p.amount} off a haircut` : `$${p.amount} haircut`) : (o || post.title).slice(0, 60);
    }

    // ---- LLM extraction --------------------------------------------------------
    async function extract(post) {
      const prompt = `You extract Great Clips haircut coupon details from a deal-forum post.
    Return ONLY JSON with these keys:
    {"is_haircut_coupon": boolean,   // true only if it is a coupon/price deal on a Great Clips haircut service (not gift cards, not products, not job posts, not questions)
     "offer": string,                // short headline in the form "$9.99 haircut" or "$5 off a haircut"
     "scope": "national" | "local",  // national = valid at participating salons nationwide
     "markets": [{"city": string|null, "state": "two-letter US state code"}], // every metro area named, e.g. "Austin area" -> [{"city":"Austin","state":"TX"}]; "Cleveland, Akron & Canton" -> three entries; use city null ONLY when the post names a whole state or region with no city
     "salon_name": string | null,    // only if the offer is for ONE specific salon, e.g. "Rice Hope"
     "salon_city": string | null,    // that salon's city, e.g. "Port Wentworth"
     "salon_state": string | null,   // that salon's two-letter state, inferred from the address if needed
     "expires": "YYYY-MM-DD" | null,
     "terms": string | null          // one sentence of important conditions, or null
    }
    Posted on: ${post.posted || "unknown"}
    Title: ${post.title}
    Text: ${post.body.slice(0, 1500)}`;
      return llm.json(prompt);
    }

    const NATIONAL = /nation\s?wide|all (?:u\.?s\.? )?locations|participating u\.?s\.?|u\.s\. (?:salons|stores)/i;

    // Heuristic fallback when no LLM endpoint is reachable.
    function heuristic(post) {
      const s = post.title + " " + post.body;
      const p = priceIn(post.title) || priceIn(s);
      if (!/great\s?clips/i.test(s) || /gift\s?card|stylist|hiring|job/i.test(post.title) || !p) return null;
      return { is_haircut_coupon: true, offer: p.off ? `$${p.amount} off a haircut` : `$${p.amount} haircut`,
        scope: NATIONAL.test(s) ? "national" : "local", markets: [], expires: null, terms: null };
    }

    // ---- geography -------------------------------------------------------------
    // Market location is decided deterministically wherever possible: the model's
    // guess only fills gaps, because it varies run to run (one day "Austin, TX",
    // the next just "TX" — which matched every Texas ZIP).
    const STATES = { AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",
      DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",
      IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",
      MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",
      NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",
      OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",
      UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming" };

    let cityIndex = null; // "austin" -> Map(state -> {lat, lon, n})
    function cities() {
      if (cityIndex) return cityIndex;
      const tbl = geo._table();
      if (!tbl) return new Map();
      cityIndex = new Map();
      for (const [lat, lon, c, st] of Object.values(tbl)) {
        const k = c.toLowerCase();
        const byState = cityIndex.get(k) || new Map();
        const a = byState.get(st) || { lat: 0, lon: 0, n: 0 };
        a.lat += lat; a.lon += lon; a.n++;
        byState.set(st, a); cityIndex.set(k, byState);
      }
      return cityIndex;
    }

    // States a text explicitly names ("TX", "Texas", "NJ, PA & DE").
    function statesIn(text) {
      const out = new Set();
      for (const [ab, name] of Object.entries(STATES)) {
        if (new RegExp(`(^|[^A-Za-z])${ab}([^A-Za-z]|$)`).test(text) || new RegExp(`\\b${name}\\b`, "i").test(text)) out.add(ab);
      }
      return out;
    }

    // Place a city name. Prefer the hinted state, then a state the text names,
    // then the state where that city name is biggest (most ZIPs).
    function placeCity(name, hints) {
      const clean = String(name || "").replace(/^(the\s+)?(greater|metro|northern|southern|western|eastern|central)\s+/i, "")
        .replace(/\s+(area|metro(politan)?|region|and surrounding areas?)$/i, "").trim();
      // "Great Clips Austin" -> try "Great Clips Austin", "Clips Austin", "Austin"
      const words = clean.split(/\s+/);
      let byState = null, name2 = clean;
      for (let i = 0; i < words.length && !byState; i++) { name2 = words.slice(i).join(" "); byState = cities().get(name2.toLowerCase()); }
      if (!byState || /^(great|clips|great clips|salon|salons)$/i.test(name2)) return null;
      const clean2 = name2;
      let st = hints.find(h => byState.has(h));
      if (!st) st = [...byState.entries()].sort((a, b) => b[1].n - a[1].n)[0][0];
      const a = byState.get(st);
      return { city: clean2.replace(/\b\w/g, ch => ch.toUpperCase()), state: st, lat: a.lat / a.n, lon: a.lon / a.n };
    }

    // City names written the way deal posts write them: "Austin area",
    // "participating Cleveland, Akron, Canton & Sandusky area", "Greater X", "... in Louisville."
    function citiesIn(text) {
      const names = [];
      const CAP = "[A-Z][a-zA-Z.'-]+(?: [A-Z][a-zA-Z.'-]+){0,2}";
      const lists = [...text.matchAll(new RegExp(`((?:${CAP})(?:\\s*(?:,|&|and|/|-)\\s*(?:${CAP}))*)\\s+(?:[Aa]rea|[Mm]etro)\\b`, "g"))];
      for (const m of lists) names.push(...m[1].split(/\s*(?:,|&|\band\b|\/|-(?=[A-Z][a-z]+ [A-Z]))\s*/));
      for (const m of text.matchAll(new RegExp(`Greater (${CAP})`, "g"))) names.push(m[1]);
      for (const m of text.matchAll(new RegExp(` in (${CAP})(?:,\\s*([A-Z]{2}))?[.|]`, "g"))) names.push(m[1]);
      return names.map(s => s.replace(/^(participating|select|only at|at)\s+/i, "").trim()).filter(Boolean);
    }

    // markets: model's [{city, state}] (may be junk). text: the post text.
    // salonCity/salonState: set for single-salon offers.
    function locate(markets, text, salon) {
      const named = statesIn(text);
      const hints = [...(salon && salon.state ? [salon.state] : []),
        ...(markets || []).map(m => String(m.state || "").toUpperCase().trim()).filter(s => STATES[s]), ...named];
      const out = [];
      const add = (l, extra) => { if (l && !out.some(o => o.city === l.city && o.state === l.state)) out.push(Object.assign(l, extra)); };

      if (salon && salon.city) add(placeCity(salon.city, hints), { salon: salon.name || null });
      if (!out.length) {
        for (const n of citiesIn(text)) add(placeCity(n, hints));
        for (const m of markets || []) if (m.city) add(placeCity(m.city, hints));
      }
      // A post that names its states ("Select NJ, PA & DE") can't have cities elsewhere:
      // drop placements like "Fort Worth" -> "Worth, IL".
      if (named.size) for (let i = out.length - 1; i >= 0; i--) if (!out[i].salon && !named.has(out[i].state)) out.splice(i, 1);
      // Whole-state markets only when the post itself names the state and we
      // found no city in it; a model-invented state is never enough.
      for (const m of markets || []) {
        const st = String(m.state || "").toUpperCase().trim();
        if (!m.city && STATES[st] && named.has(st) && !out.some(o => o.state === st)) out.push({ city: null, state: st });
      }
      return out;
    }

    // ---- sources ---------------------------------------------------------------
    async function slickdealsThreads(log) {
      const idx = await get("https://slickdeals.net/attachment/sitemaps/sitemap.xml");
      const maps = [...idx.matchAll(/<loc>([^<]+threads-(daily|weekly)-(\d+)\.xml\.gz)<\/loc>/g)]
        .map(m => ({ url: m[1], kind: m[2], n: +m[3] }));
      // daily sitemaps + the two newest weekly ones cover well over MAX_AGE_DAYS
      const weekly = maps.filter(m => m.kind === "weekly").sort((a, b) => b.n - a.n).slice(0, 2);
      const pick = [...maps.filter(m => m.kind === "daily"), ...weekly];
      const cutoff = Date.now() - MAX_AGE_DAYS * 86400e3;
      const found = new Map();
      for (const m of pick) {
        await sleep(DELAY_MS);
        const xml = zlib.gunzipSync(await get(m.url, { binary: true })).toString("utf8");
        for (const u of xml.matchAll(/<url>\s*<loc>([^<]+)<\/loc>\s*(?:<lastmod>([^<]+)<\/lastmod>)?/g)) {
          if (!/\/f\/\d+-[^/]*great-?clips/i.test(u[1])) continue;
          const mod = u[2] ? Date.parse(u[2]) : Date.now();
          if (mod >= cutoff) found.set(u[1], mod);
        }
      }
      log(`slickdeals: ${found.size} Great Clips threads in the last ${MAX_AGE_DAYS} days`);
      const threads = [...found].sort((a, b) => b[1] - a[1]).slice(0, MAX_THREADS);
      const posts = [];
      for (const [url, mod] of threads) {
        await sleep(DELAY_MS);
        let h;
        try { h = await get(url); } catch (e) { log(`  skip ${url}: ${e.message}`); continue; }
        const prod = (h.match(/"product":\{[^}]*"store":"([^"]*)"/) || [])[1] || "";
        if (prod && !/great clips/i.test(prod)) continue;
        const ogt = meta(h, "og:title");
        const dm = ogt.match(/ - (\d{4}-\d{2}-\d{2})$/);
        const title = ogt.replace(/ - \d{4}-\d{2}-\d{2}$/, "");
        const bodyM = h.match(/class="dealDetailsRawHtml[^"]*"[^>]*>([\s\S]{0,6000}?)<\/div>/);
        const body = (bodyM ? text(bodyM[1]) : meta(h, "og:description")).replace(/Community (Notes|Voting)[\s\S]*$/, "").trim();
        const links = [...new Set([...h.matchAll(/https?:\/\/offers\.greatclips\.com\/([A-Za-z0-9]{5,10})/g)].map(m => m[0]))];
        posts.push({ source: "Slickdeals", url, title, body, posted: dm ? dm[1] : new Date(mod).toISOString().slice(0, 10), couponUrl: links[0] || null });
      }
      return posts;
    }

    // greatclips.coupons (robots.txt: allow all). Its price pages paste the text of
    // individual offers.greatclips.com coupons, one block per link — usually a
    // single salon ("$4.99 at Great Clips Rice Hope at 7934 GA Hwy 21 in Port
    // Wentworth.") or a market ("...participating Phoenix area salons"). No expiry
    // is shown and we don't fetch offers.greatclips.com, so these stay "unverified".
    async function greatclipsCoupons(log) {
      const base = "https://www.greatclips.coupons";
      const sm = await get(base + "/post-sitemap.xml");
      const pages = [...sm.matchAll(/<loc>([^<]+)<\/loc>\s*(?:<lastmod>([^<]+)<\/lastmod>)?/g)]
        .map(m => ({ url: m[1], mod: m[2] ? m[2].slice(0, 10) : null }))
        .filter(p => /clips|\d+-\d+|off|coupon/i.test(p.url) && !/uber|subway|doordash|shein|canada/i.test(p.url));
      const posts = [], seenIds = new Set();
      let stale = 0;
      for (const p of pages) {
        await sleep(DELAY_MS);
        let h;
        try { h = await get(p.url); } catch (e) { log(`  skip ${p.url}: ${e.message}`); continue; }
        // Text with a marker at each offer link, then split: each block is the text
        // leading up to its link.
        // Links appear both as <a href> and as bare URLs in the text; mark both.
        const marked = h.replace(/<a[^>]+href="https?:\/\/offers\.greatclips\.com\/([A-Za-z0-9]+)[^"]*"[^>]*>/g, " \u0001$1\u0002 ");
        const t = text(marked).replace(/(?:https?:\/\/)?offers\.greatclips\.com\/([A-Za-z0-9]+)\/?/g, " \u0001$1\u0002 ");
        const parts = t.split(/\u0001([A-Za-z0-9]+)\u0002/).map((x, i) => i % 2 ? "https://offers.greatclips.com/" + x : x);
        for (let i = 1; i < parts.length; i += 2) {
          const link = parts[i], id = link.split("/").pop();
          if (seenIds.has(id)) continue;
          seenIds.add(id);
          let block = parts[i - 1].slice(-700).replace(/\b(SAVE|Print (code|coupon)|GET CODE)\b/gi, " ").replace(/\s+/g, " ").trim();
          // The site keeps some dead offers inline ("Expired codes ... Victoria area");
          // the rest are settled by checking the coupon page itself.
          if (/expired|has ended|no longer valid/i.test(block)) { stale++; continue; }
          if (!/\$\s?\d/.test(block)) {
            // Salon-only rows ("Wolf Pen Plaza at 1901 Texas Ave S in College Station")
            // take their price from the nearest heading above them on the page.
            const before = parts.slice(0, i).filter((_, j) => j % 2 === 0).join(" ");
            const heads = [...before.matchAll(/[^.|!]{0,80}\$\s?\d+(?:\.\d{2})?(?:\s*off)?/gi)];
            if (!heads.length) continue;
            block = `Price on page: ${heads[heads.length - 1][0].trim()}. Salon: ${block.slice(-250)}`;
          }
          // "<Salon> at <street> in <City>[, ST]." at the end of the block names the salon's city.
          const sm2 = block.match(/(?:Great Clips\s+)?([A-Z][\w'&.-]*(?:\s+[A-Z0-9][\w'&.-]*){0,5}) at \d[^|]*? in ([A-Z][a-zA-Z.'-]+(?:\s[A-Z][a-zA-Z.'-]+){0,2})(?:,\s*([A-Z]{2}))?[.,]?\s*$/);
          const salonHint = sm2 ? { name: sm2[1].replace(/^(Salon:|SAVE|[A-Z]{3,9}\s+\d{4})\s*/i, "").trim(),
            city: sm2[2].replace(/[.,]+$/, ""), state: sm2[3] || null } : null;
          // Card subtitle: the salon when we know it, else the offer's own last sentence.
          const street = sm2 ? (block.match(/ at (\d[^|]*?) in [A-Z]/) || [])[1] : null;
          const title = salonHint ? `Great Clips ${salonHint.name}${street ? ", " + street.trim() : ""}, ${salonHint.city}`
            : block.replace(/^Price on page:.*?Salon:\s*/, "").split(/(?<=[.!])\s+/).filter(x => /\$|area|salon/i.test(x)).slice(-1)[0] || block.slice(-120);
          posts.push({ source: "greatclips.coupons", url: p.url, title: title.slice(0, 140), body: block, salonHint,
            posted: p.mod || new Date().toISOString().slice(0, 10), couponUrl: link, unverified: true });
        }
      }
      log(`greatclips.coupons: ${pages.length} pages, ${posts.length} coupon links (${stale} skipped as expired/old)`);
      return posts;
    }

    async function greatclipsPromos(log) {
      const base = "https://www.greatclips.com";
      const h = await get(base + "/promotions/");
      const t = text(h);
      const perks = [];
      if (/\$2 off/i.test(t) && /email/i.test(t))
        perks.push({ key: "gc-email-2off", offer: "$2 off your next haircut", title: "Join the Great Clips email list",
          terms: "One-time coupon, emailed to newly subscribed addresses only. Not valid with other offers.", url: base + "/promotions/" });
      if (/senior/i.test(t))
        perks.push({ key: "gc-senior", offer: "Senior discount (65+)", title: "Every day at participating salons",
          terms: "No coupon needed. The amount varies by salon, so ask at check-in.", url: base + "/promotions/senior-discounts" });
      // Campaign pages (sports partnerships etc.) occasionally carry a nationwide haircut offer.
      const posts = [];
      const subs = [...new Set([...h.matchAll(/href="(\/promotions\/[a-z0-9-]+)"/g)].map(m => m[1]))]
        .filter(p => !/senior|haircare-sale/.test(p));
      for (const p of subs) {
        await sleep(DELAY_MS);
        try {
          const sh = await get(base + p);
          posts.push({ source: "greatclips.com", url: base + p, title: meta(sh, "og:title") || p, body: text(sh).slice(0, 4000),
            posted: new Date().toISOString().slice(0, 10), couponUrl: null, official: true });
        } catch (e) { log(`  skip ${p}: ${e.message}`); }
      }
      log(`greatclips.com: ${perks.length} standing perks, ${posts.length} campaign pages`);
      return { perks, posts };
    }

    // ---- coupon-page verification ------------------------------------------------
    // Owner-approved (2026-09-26): read each offers.greatclips.com page at most
    // once a day to get its real "Offer expires" date and market, even though that
    // host's robots.txt disallows crawlers. Read-only: never "Redeem" (that burns a
    // single-use code). Slow and capped.
    const CHECK_DELAY_MS = +(process.env.CHECK_DELAY_MS || 4000);
    const CHECK_MAX = +(process.env.CHECK_MAX || 150);
    let checksThisRun = 0;

    async function checkOffer(url, db) {
      const id = url.split("/").pop();
      db.checks = db.checks || {};
      const prev = db.checks[id];
      if (prev && Date.now() - Date.parse(prev.at) < 20 * 3600e3) return prev;
      if (checksThisRun >= CHECK_MAX) return prev || null;
      checksThisRun++;
      await sleep(CHECK_DELAY_MS);
      let r;
      try {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
        r = await fetch(url, { headers: { "user-agent": UA }, signal: ctl.signal }).finally(() => clearTimeout(t));
      } catch (e) { return prev || null; }
      const res = { at: new Date().toISOString(), http: r.status, expires: null, market: null, descr: null, rolling: false };
      if (r.ok) {
        const t = text(await r.text());
        // Market coupons say "Offer expires 10/09/2026", single-salon ones "Expires 08/19/2025".
        const terms = (t.match(/Terms and Conditions\s+(.{0,600}?)All Great Clips/i) || [])[1] || t;
        const em = terms.match(/(?:Offer\s+)?expires?:?\s+(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
        if (em) res.expires = `${em[3]}-${em[1].padStart(2, "0")}-${em[2].padStart(2, "0")}`;
        res.rolling = /within \d+ days of (initial )?code generation/i.test(t);
        const mm = terms.match(/Valid (?:only )?at participating ([^.]{3,120}?) Great Clips salons?/i);
        if (mm) res.market = mm[1].trim();
        // "Valid at Great Clips Sherwood Plaza at 3384 Robinhood Rd in Winston-Salem, NC."
        const sm = terms.match(/Valid (?:only )?at Great Clips (.{2,60}?) at (\d[^.]{2,80}?) in ([A-Z][A-Za-z .'-]{1,40}?),\s*([A-Z]{2})\b/);
        if (sm) res.salon = { name: sm[1].trim(), street: sm[2].trim(), city: sm[3].trim(), state: sm[4] };
        const dm = t.match(/Description\s+(.{10,300}?)(?:\s+To redeem|\s+Terms and Conditions)/i);
        if (dm) res.descr = dm[1].trim();
      }
      db.checks[id] = res;
      return res;
    }

    // ---- main ------------------------------------------------------------------
    async function run() {
      if (busy) return;
      busy = true;
      const started = new Date();
      const lines = [];
      const log = s => { console.log("[crawl] " + s); lines.push(s); };
      const report = { at: started.toISOString(), sources: {}, found: 0, llm: null };
      try {
        await geo.load(store.DATA_DIR);
        const db = store.db();
        const now = started.toISOString();
        const seen = new Set();

        const upsert = (c) => {
          const prev = db.coupons[c.id];
          db.coupons[c.id] = Object.assign({}, prev || {}, c, { firstSeen: prev ? prev.firstSeen : now, lastSeen: now });
          seen.add(c.id);
        };

        // Wake the model first so a cold load doesn't eat the first post's timeout.
        await llm.json('Reply with {"ok":true}');

        let posts = [];
        try { const p = await slickdealsThreads(log); posts.push(...p); report.sources.slickdeals = { ok: true, posts: p.length }; }
        catch (e) { log("slickdeals failed: " + e.message); report.sources.slickdeals = { ok: false, error: e.message }; }
        try { const p = await greatclipsCoupons(log); posts.push(...p); report.sources.greatclipsCoupons = { ok: true, links: p.length }; }
        catch (e) { log("greatclips.coupons failed: " + e.message); report.sources.greatclipsCoupons = { ok: false, error: e.message }; }
        try {
          const g = await greatclipsPromos(log);
          for (const p of g.perks) upsert({ id: p.key, scope: "national", evergreen: true, source: "greatclips.com", url: p.url,
            offer: p.offer, title: p.title, terms: p.terms, expires: null, posted: now.slice(0, 10), confidence: 1, locs: [] });
          posts.push(...g.posts);
          report.sources.greatclips = { ok: true, perks: g.perks.length, pages: g.posts.length };
        } catch (e) { log("greatclips.com failed: " + e.message); report.sources.greatclips = { ok: false, error: e.message }; }

        checksThisRun = 0;
        const today = now.slice(0, 10);
        let dead = 0, verified = 0;
        for (const post of posts) {
          // Check the coupon page first: expired ones never reach the model, and a
          // live one gets its real end date and market from the page's terms.
          if (post.couponUrl) {
            const chk = await checkOffer(post.couponUrl, db);
            if (chk) {
              if (chk.http === 404 || chk.http === 410 || (chk.expires && chk.expires < today)) { dead++; continue; }
              if (chk.http === 200 && (chk.expires || chk.rolling)) {
                verified++;
                post.unverified = false;
                post.checked = chk;
                // Terms are authoritative: put them first so the parsers see them.
                const ex = chk.expires ? ` Offer expires ${chk.expires.slice(5, 7)}/${chk.expires.slice(8)}/${chk.expires.slice(0, 4)}.` : "";
                if (chk.salon) {
                  // The page names the exact salon, so it overrides whatever the listing said.
                  post.salonHint = { name: chk.salon.name, city: chk.salon.city, state: chk.salon.state };
                  post.title = `Great Clips ${chk.salon.name}, ${chk.salon.street}, ${chk.salon.city}, ${chk.salon.state}`;
                  post.body = `${chk.descr || ""}${ex} ${post.body}`;
                } else {
                  post.body = `${chk.descr || ""} Valid only at participating ${chk.market || ""} Great Clips salons.${ex} ${post.body}`;
                }
              }
            }
          }
          let x = await extract(post);
          if (x) report.llm = llm.endpoint();
          else x = post.official ? null : heuristic(post);
          if (!x || !x.is_haircut_coupon) { log(`  not a coupon: ${post.title}`); continue; }

          const ref = new Date((post.posted || now.slice(0, 10)) + "T12:00:00Z");
          const all = post.title + " " + post.body;
          if (NATIONAL.test(all) || (x.markets || []).some(m => /^(US|USA)$/i.test(String(m.state || "")))) x.scope = "national";
          // Coupon-list sites: nationwide only when the text says so (the model
          // over-guesses it), and the email sign-up perk is already an evergreen card.
          if (post.unverified && x.scope === "national" && !NATIONAL.test(all)) x.scope = "local";
          if (post.unverified && /mailing list|email list|sign[- ]?up/i.test(all) && /\$\s?2\b/.test(all)) { log(`  skip sign-up perk dup`); continue; }
          const exp = (post.checked && post.checked.expires) || parseExpiry(post.title + " " + post.body, ref) || (/^\d{4}-\d{2}-\d{2}$/.test(x.expires || "") ? x.expires : null);
          const h = post.salonHint;
          const salon = h ? { name: h.name, city: h.city, state: (h.state || String(x.salon_state || "")).toUpperCase() }
            : x.salon_city ? { name: x.salon_name || null, city: x.salon_city, state: String(x.salon_state || "").toUpperCase() } : null;
          const locs = x.scope === "national" ? [] : locate(x.markets, all, salon);
          if (x.scope !== "national" && !locs.length) { log(`  no market for: ${post.title.slice(0, 90)}`); continue; }
          const key = post.couponUrl || `${x.offer}|${locs.map(l => l.city + l.state).join(",")}|${exp}`;
          const id = crypto.createHash("sha1").update(key).digest("hex").slice(0, 12);
          if (seen.has(id)) continue; // same coupon link already taken from a better source this run
          upsert({
            id,
            scope: x.scope === "national" ? "national" : "local",
            offer: offerText(x.offer, post), title: post.title.slice(0, 140),
            terms: x.terms ? String(x.terms).slice(0, 300) : null, expires: exp, posted: post.posted,
            source: post.source, url: post.couponUrl || post.url, thread: post.url, locs,
            unverified: !!post.unverified, checkedAt: post.checked ? post.checked.at : null,
            confidence: post.unverified ? 0.5 : report.llm ? 0.9 : 0.6,
          });
          log(`  + ${x.scope} ${offerText(x.offer, post)} ${locs.map(l => (l.city || "*") + "," + l.state + (l.salon ? " [" + l.salon + "]" : "")).join(" ")} exp=${exp}${post.unverified ? " (unverified)" : ""}`);
        }
        // A coupon its source no longer lists (or now filters out as expired) is
        // removed right away when that source crawled fine; if the source was down,
        // it keeps its last state.
        const okSource = { "Slickdeals": report.sources.slickdeals?.ok, "greatclips.coupons": report.sources.greatclipsCoupons?.ok };
        for (const [id, c] of Object.entries(db.coupons))
          if (!c.evergreen && !seen.has(id) && okSource[c.source]) { delete db.coupons[id]; delete db.votes[id]; }
        // Standing perks that vanished from the official page are dropped.
        for (const [id, c] of Object.entries(db.coupons)) if (c.evergreen && !seen.has(id) && report.sources.greatclips?.ok) delete db.coupons[id];
        // Forget anything long gone.
        for (const [id, c] of Object.entries(db.coupons))
          if (Date.now() - Date.parse(c.lastSeen) > 90 * 86400e3) { delete db.coupons[id]; delete db.votes[id]; }

        report.checks = { fetched: checksThisRun, verified, dead };
        log(`coupon pages: ${checksThisRun} fetched, ${verified} verified live, ${dead} expired/gone`);
        // Forget checks for links we no longer see anywhere.
        for (const id of Object.keys(db.checks || {})) if (Date.now() - Date.parse(db.checks[id].at) > 14 * 86400e3) delete db.checks[id];
        report.found = seen.size;
        report.ms = Date.now() - started.getTime();
        db.crawls.push(report);
        db.crawls = db.crawls.slice(-30);
        store.save(true);
        log(`done: ${seen.size} coupons in ${Math.round(report.ms / 1000)}s (llm: ${report.llm || "none"})`);
      } finally { busy = false; }
      return lines;
    }

    module.exports = { run, running, parseExpiry, locate, citiesIn };
  geo.js: |
    "use strict";
    // ZIP -> {lat, lon, city, state} from the GeoNames US postal code dump
    // (CC-BY 4.0, https://download.geonames.org/export/zip/). Downloaded once and
    // cached as JSON on the data volume.
    const fs = require("fs");
    const zlib = require("zlib");
    const path = require("path");

    const SRC = "https://download.geonames.org/export/zip/US.zip";
    let table = null; // { "55401": [lat, lon, "Minneapolis", "MN"] }

    // Extract one named file from a .zip archive (no dependency on unzip). Walks the
    // central directory, since local headers may defer sizes to a data descriptor.
    function extract(buf, want) {
      const eocd = buf.lastIndexOf(Buffer.from([0x50, 0x4b, 0x05, 0x06]));
      if (eocd < 0) throw new Error("not a zip");
      let p = buf.readUInt32LE(eocd + 16);
      const n = buf.readUInt16LE(eocd + 10);
      for (let i = 0; i < n; i++) {
        const method = buf.readUInt16LE(p + 10), csize = buf.readUInt32LE(p + 20);
        const nameLen = buf.readUInt16LE(p + 28), extraLen = buf.readUInt16LE(p + 30), cmtLen = buf.readUInt16LE(p + 32);
        const local = buf.readUInt32LE(p + 42);
        const name = buf.toString("utf8", p + 46, p + 46 + nameLen);
        if (name === want) {
          const start = local + 30 + buf.readUInt16LE(local + 26) + buf.readUInt16LE(local + 28);
          const data = buf.subarray(start, start + csize);
          return method === 8 ? zlib.inflateRawSync(data) : data;
        }
        p += 46 + nameLen + extraLen + cmtLen;
      }
      return null;
    }

    async function load(dataDir) {
      if (table) return table;
      const cache = path.join(dataDir, "zips.json");
      try { table = JSON.parse(fs.readFileSync(cache, "utf8")); return table; } catch {}
      const r = await fetch(SRC);
      if (!r.ok) throw new Error("geonames HTTP " + r.status);
      const zip = Buffer.from(await r.arrayBuffer());
      const raw = extract(zip, "US.txt");
      if (!raw) throw new Error("US.txt not found in archive");
      const txt = raw.toString("utf8");
      table = {};
      for (const line of txt.split("\n")) {
        const f = line.split("\t");
        if (f.length < 11) continue;
        table[f[1]] = [+f[9], +f[10], f[2], f[4]];
      }
      fs.writeFileSync(cache, JSON.stringify(table));
      return table;
    }

    function lookup(zip) {
      const z = table && table[String(zip).slice(0, 5)];
      return z ? { zip: String(zip).slice(0, 5), lat: z[0], lon: z[1], city: z[2], state: z[3] } : null;
    }

    function miles(a, b) {
      const R = 3958.8, rad = x => x * Math.PI / 180;
      const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    module.exports = { load, lookup, miles, _table: () => table };
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ClipDrop — fresh haircut coupons, daily</title>
    <meta name="description" content="Haircut coupons for Great Clips salons near you, found fresh every morning. Search your ZIP, grab one, go.">
    <meta name="theme-color" content="#0f766e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <style>
    :root{
      --bg:#f6f4ef; --ink:#1c1b19; --muted:#6b675f; --card:#fffdf8; --line:#e4dfd4;
      --brand:#0f766e; --brand-ink:#fff; --accent:#e8572a; --ok:#15803d; --warn:#b45309;
      --stub:#fef3c7; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.25);
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#12110f; --ink:#f1ede4; --muted:#a39e93; --card:#1c1a17; --line:#302d28;
        --brand:#2dd4bf; --brand-ink:#062a26; --accent:#fb7c52; --ok:#4ade80; --warn:#fbbf24;
        --stub:#2a2416; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.8); }
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    a{color:var(--brand)}
    .wrap{max-width:960px;margin:0 auto;padding:0 16px}
    header{padding:28px 0 8px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
    .logo .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);
      display:grid;place-items:center;font-size:20px;transform:rotate(-8deg)}
    .hero h1{font-size:clamp(28px,6vw,44px);line-height:1.05;letter-spacing:-.03em;margin:22px 0 8px}
    .hero h1 em{font-style:normal;color:var(--accent)}
    .hero p{color:var(--muted);margin:0 0 20px;max-width:560px}
    form.search{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:8px;box-shadow:var(--shadow);max-width:560px}
    form.search input,form.search select{font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:10px 12px}
    form.search input{flex:1 1 140px;min-width:0;font-size:18px;letter-spacing:.08em}
    form.search select{border-left:1px solid var(--line);flex:0 0 auto}
    .btn{display:inline-block;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:11px;padding:10px 18px;cursor:pointer;
      background:var(--brand);color:var(--brand-ink)}
    .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    .btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .meta{font-size:13px;color:var(--muted);margin:12px 0 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
    section{margin:34px 0}
    section h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 12px;
      display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .ticket{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
      border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .ticket .top{padding:16px 16px 12px}
    .offer{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
    .title{margin:0 0 8px;color:var(--muted);font-size:14px}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .tag.hot{border-color:transparent;background:var(--accent);color:#fff}
    .tag.soon{color:var(--warn);border-color:currentColor}
    .tag.unv{border-style:dashed}
    .tag.ok{color:var(--ok);border-color:currentColor}
    .perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 12px}
    .perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;
      background:var(--bg);border:1px solid var(--line)}
    .perf::before{left:-23px}.perf::after{right:-23px}
    .stub{background:var(--stub);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}
    .code{font:700 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
    .small{font-size:12px;color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .foot{padding:10px 16px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
    .vote{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);
      border-radius:999px;padding:4px 10px;cursor:pointer}
    .vote[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
    .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted)}
    .empty strong{color:var(--ink)}
    details.terms{font-size:13px;color:var(--muted);margin-top:8px}
    details.terms summary{cursor:pointer}
    footer{padding:30px 0 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
    .skel{height:170px;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));
      background-size:200% 100%;animation:sk 1.2s infinite}
    @keyframes sk{to{background-position:-200% 0}}
    @media (prefers-reduced-motion:reduce){.skel{animation:none}}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
      padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
    .toast.on{opacity:1}

    /* ---- Drop Map ---- */
    :root{ --land:#e9e3d6; --land-line:#f6f4ef; --pin:#0f766e; --pin-new:#f5b301; --pin-soon:#e8572a; --cut:#1c1b19; }
    @media (prefers-color-scheme: dark){ :root{ --land:#2a2722; --land-line:#12110f; --pin:#2dd4bf; --pin-new:#fcd34d; --pin-soon:#fb7c52; --cut:#f1ede4; } }
    .mapwrap{position:relative;margin:26px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
    .maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 0}
    .maphead h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
    .maptools{display:flex;gap:8px;flex-wrap:wrap}
    .chip{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
    .chip:hover{border-color:var(--ink)}
    #map{display:block;width:100%;height:auto;aspect-ratio:975/610;touch-action:manipulation;user-select:none}
    #map .st{fill:var(--land);stroke:var(--land-line);stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .3s;cursor:pointer}
    #map .st:hover{filter:brightness(.96)}
    #map .pin{cursor:pointer}
    #map .pin .body{fill:var(--pin);stroke:var(--card);stroke-width:1.5}
    #map .pin.new .body{fill:var(--pin-new)}
    #map .pin.soon .body{fill:var(--pin-soon)}
    #map .pin .snip{stroke:var(--card);stroke-width:1.4;fill:none;stroke-linecap:round}
    #map .pin .cnt{font:800 9px system-ui,sans-serif;fill:var(--card);text-anchor:middle}
    #map .pin .ring{fill:none;stroke:var(--pin-soon);stroke-width:2;opacity:0}
    #map .pin.soon .ring{animation:ring 1.8s ease-out infinite}
    #map .pin:hover .body,#map .pin.sel .body{stroke:var(--ink);stroke-width:2}
    #map .drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
    @keyframes drop{0%{transform:translateY(-140px);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
    @keyframes ring{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
    #map .you circle.dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
    #map .you circle.halo{fill:var(--accent);opacity:.25;animation:halo 2s ease-out infinite}
    @keyframes halo{0%{r:6;opacity:.35}100%{r:26;opacity:0}}
    #map .you text{font:800 10px system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}
    #map .city circle{fill:var(--muted)}
    #map .city text{font:600 11px system-ui,sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:3px}
    #map .radius{fill:var(--accent);fill-opacity:.06;stroke:var(--accent);stroke-opacity:.6;stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
    #map .rlabel{font-weight:800;fill:var(--accent);paint-order:stroke;stroke:var(--card);stroke-width:.25em}
    #map .cut{fill:none;stroke:var(--cut);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
    #map .scissors .blade{stroke:var(--cut);stroke-width:1.6;stroke-linecap:round}
    #map .scissors .handle{fill:none;stroke:var(--accent);stroke-width:1.6}
    .ticker{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:10px 16px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);scrollbar-width:none}
    .ticker b{color:var(--ink)}
    .legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 16px 0;font-size:12px;color:var(--muted)}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
    .pop{position:absolute;z-index:5;width:250px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;
      box-shadow:0 14px 40px -12px rgba(0,0,0,.45);padding:12px 14px;transform:translate(-50%,calc(-100% - 18px));pointer-events:auto}
    .pop::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
    .pop.sheet{position:relative;left:auto;top:auto;width:auto;max-width:none;transform:none;margin:4px 12px 12px;box-shadow:none}
    .pop.sheet::after{display:none}
    .pop .po{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
    .pop .pp{font-size:13px;color:var(--muted);margin:2px 0 8px}
    .pop .row{justify-content:space-between}
    .pop .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
    .pop .more{font-size:12px;color:var(--muted);margin:8px 0 0}
    .flash{animation:flash 1.4s ease-out}
    @keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
    @media (prefers-reduced-motion:reduce){#map .drop,#map .pin.soon .ring,#map .you circle.halo{animation:none}}
