      if(s.cheapest) bits.push("cheapest <b>$"+s.cheapest.price.toFixed(2)+"</b> in "+s.cheapest.city+", "+s.cheapest.state);
      if(s.newToday) bits.push("<b>"+s.newToday+"</b> new today");
      if(s.endingSoon) bits.push("<b>"+s.endingSoon+"</b> end this week");
