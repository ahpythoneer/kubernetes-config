    function fit(x0,y0,x1,y1,pad,minW){
      pad=pad==null?60:pad; minW=minW||140;
      var w=Math.max(x1-x0,minW)+pad*2, h=Math.max(y1-y0,minW*.62)+pad*2, cx=(x0+x1)/2, cy=(y0+y1)/2;
      if(w/h > W/H) h=w*H/W; else w=h*W/H;
      if(w>W){ return [0,0,W,H]; }
      return [cx-w/2, cy-h/2, w, h];
    }

    // ---- pins ----
    function pinEl(g, i){
      var cls="pin"+(g.soon?" soon":g.isNew?" new":"");
      var outer=mk("g",{"class":cls,tabindex:"0",role:"button","aria-label":g.label}, document.getElementById("lPins"));
      var inner=mk("g",{"class":reduce?"":"drop",style:"animation-delay:"+(300+i*70)+"ms"}, outer);
      mk("circle",{"class":"ring",cx:0,cy:-16,r:6}, inner);
      mk("path",{"class":"body",d:"M0 0 C-2 -5 -10 -9 -10 -17 A10 10 0 1 1 10 -17 C10 -9 2 -5 0 0Z"}, inner);
      if(g.items.length>1){ var t=mk("text",{"class":"cnt",x:0,y:-13.5}, inner); t.textContent=g.items.length; }
      else { // tiny scissors
        mk("circle",{"class":"snip",cx:-3.2,cy:-13,r:2}, inner); mk("circle",{"class":"snip",cx:3.2,cy:-13,r:2}, inner);
        mk("path",{"class":"snip",d:"M-2 -14.6 L4 -22 M2 -14.6 L-4 -22"}, inner);
      }
      outer.addEventListener("click", function(ev){ ev.stopPropagation(); show(g); });
      outer.addEventListener("keydown", function(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); show(g); } });
      return outer;
    }

    function build(data){
      // group pins in the same city/salon spot
      var by={};
      data.pins.forEach(function(p){ var xy=proj([p.lon,p.lat]); if(!xy) return;
        var key=Math.round(xy[0]/6)+","+Math.round(xy[1]/6);
        (by[key]=by[key]||{x:xy[0],y:xy[1],items:[]}).items.push(p); });
      groups=Object.keys(by).map(function(k){ var g=by[k];
        g.isNew=g.items.some(function(p){return p.isNew;});
        g.soon=g.items.some(function(p){ var n=days(p.expires); return n!=null && n<=3; });
        g.label=g.items.length+" deal"+(g.items.length>1?"s":"")+" in "+g.items[0].city+", "+g.items[0].state;
        return g; }).sort(function(a,b){ return a.x-b.x; });            // drop west to east
      groups.forEach(function(g,i){ g.el=pinEl(g,i); });
      // tint states by live deal count
      document.querySelectorAll("#map .st").forEach(function(el){
        var n=data.states[el.dataset.ab]||0;
        if(n) el.style.fill="color-mix(in srgb, var(--pin) "+Math.min(12+n*9,48)+"%, var(--land))";
