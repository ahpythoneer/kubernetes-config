      var go=document.createElement("a"); go.className="btn"; go.href=first.url; go.target="_blank"; go.rel="noopener nofollow"; go.textContent="Get coupon"; row.appendChild(go);
      var see=document.createElement("button"); see.className="chip"; see.type="button"; see.textContent="Details";
      see.onclick=function(){ seeCard(first); }; row.appendChild(see);
      p.appendChild(row);
      if(g.items.length>1){ var m=document.createElement("p"); m.className="more";
        m.textContent="+"+(g.items.length-1)+" more here: "+g.items.slice(1,4).map(function(i){ return i.offer+(i.salon?" at "+i.salon:""); }).join(" · ")+(g.items.length>4?" …":""); p.appendChild(m); }
      var wrap=document.getElementById("mapwrap");
      if(wrap.clientWidth<560){ p.classList.add("sheet"); wrap.insertBefore(p, document.getElementById("ticker")); }   // phones: under the map
