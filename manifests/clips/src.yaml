    </head>
    <body>
    <div class="wrap">
      <header><div class="logo"><span class="mark" aria-hidden="true">✂︎</span>ClipDrop</div></header>

      <div class="hero">
        <h1>Cheaper haircuts,<br><em>found every morning.</em></h1>
        <p>We check coupon sites every day for Great Clips deals, weed out the fake and expired ones, and list what's left here. Enter your ZIP, grab a coupon, get your haircut.</p>
        <form class="search" id="f">
          <label class="sr" for="zip" hidden>ZIP code</label>
          <input id="zip" inputmode="numeric" pattern="\d{5}" maxlength="5" placeholder="Your ZIP" autocomplete="postal-code" aria-label="ZIP code">
          <select id="radius" aria-label="Search radius">
            <option value="15">15 mi</option><option value="40" selected>40 mi</option><option value="100">100 mi</option>
          </select>
          <button class="btn">Find deals</button>
        </form>
        <div class="meta" id="meta"></div>
      </div>

      <div class="mapwrap" id="mapwrap">
        <div class="maphead">
          <h2>The Drop Map</h2>
          <div class="maptools">
            <button class="chip" id="snippy" type="button">✂ Feeling snippy?</button>
            <button class="chip" id="usa" type="button" hidden>⤢ Whole USA</button>
          </div>
        </div>
        <div class="legend" aria-hidden="true"><span><i style="background:var(--pin-new)"></i>new today</span><span><i style="background:var(--pin-soon)"></i>ends within 3 days</span><span><i style="background:var(--pin)"></i>live deal</span></div>
        <svg id="map" viewBox="0 0 975 610" role="img" aria-label="Map of live Great Clips coupons across the US">
          <g id="lStates"></g><g id="lCities"></g><g id="lCut"></g><g id="lPins"></g><g id="lYou"></g><g id="lSnip"></g>
        </svg>
        <div class="ticker" id="ticker" aria-live="polite"></div>
      </div>

      <section id="localSec" hidden>
        <h2><span id="localHead">Near you</span><span id="localCount"></span></h2>
        <div id="local" class="grid"></div>
      </section>

      <section id="stateSec" hidden>
        <h2><span id="stateHead">Elsewhere in your state</span><span id="stateCount"></span></h2>
        <p class="small" style="margin:-4px 0 12px">These deals are valid at select salons across the state, but the coupon doesn't say which ones. Check the terms before you go.</p>
        <div id="state" class="grid"></div>
      </section>

      <section id="natSec">
        <h2><span>Good anywhere</span><span id="natCount"></span></h2>
        <div id="national" class="grid"><div class="skel"></div><div class="skel"></div></div>
      </section>

      <section id="alwaysSec">
        <h2><span>Always available</span></h2>
        <div id="always" class="grid"></div>
      </section>

      <footer>
        ClipDrop is a fan-made coupon board and is <strong>not affiliated with, endorsed by, or sponsored by Great Clips, Inc.</strong>
        "Great Clips" is a trademark of its owner, used here only to describe the coupons. Great Clips salons are independently owned franchises,
        so each salon decides whether to accept a coupon. Check the terms and call ahead if you're unsure. Every coupon links to the page where we found it.
        <br><br>ZIP data © <a href="https://www.geonames.org/" rel="noopener">GeoNames</a> (CC BY 4.0).
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
    (function(){
    "use strict";
    var $ = function(id){ return document.getElementById(id); };
    var store = { get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
                  set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
    function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(function(){t.classList.remove("on");},1800); }
    function daysLeft(d){ if(!d) return null; return Math.ceil((Date.parse(d+"T23:59:59")-Date.now())/864e5); }
    function ago(iso){ var m=Math.round((Date.now()-Date.parse(iso))/6e4); if(m<60) return m+" min ago"; var h=Math.round(m/60); return h<48? h+" h ago" : Math.round(h/24)+" days ago"; }
    function nice(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }catch(e){ return d; } }
    function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return "source"; } }

    function ticket(c){
      var t=el("article","ticket"); t.dataset.id=c.id;
      var top=el("div","top");
      top.appendChild(el("p","offer",c.offer||c.title));
      if(c.offer && c.title && c.title!==c.offer) top.appendChild(el("p","title",c.title));
      var tags=el("div","tags");
      var dl=daysLeft(c.expires);
      if(dl!=null) tags.appendChild(el("span","tag"+(dl<=3?" soon":""), dl<=0?"ends today":dl===1?"ends tomorrow":"ends in "+dl+" days"));
      else if(!c.evergreen) tags.appendChild(el("span","tag",(c.unverified?"listed ":"posted ")+nice(c.posted)));
      if(c.miles!=null) tags.appendChild(el("span","tag",c.miles+" mi · "+c.place));
      else if(c.markets && c.markets.length) tags.appendChild(el("span","tag",c.markets.slice(0,3).join(" · ")));
      if(c.scope==="national" && !c.evergreen) tags.appendChild(el("span","tag","nationwide"));
      if(c.checkedAt){ var k=el("span","tag ok","✓ verified"); k.title="We checked this coupon's own page on "+new Date(c.checkedAt).toLocaleDateString()+" and it was still valid."; tags.appendChild(k); }
      if(c.unverified){ var u=el("span","tag unv","unverified"); u.title="Listed by a coupon site with no end date. It may have expired, so check the coupon page and tap Worked or Didn't work."; tags.appendChild(u); }
      if(!c.evergreen && Date.now()-Date.parse(c.firstSeen)<36e5*30) tags.appendChild(el("span","tag hot","new today"));
      top.appendChild(tags);
      if(c.terms){ var d=el("details","terms"); d.appendChild(el("summary",null,"Fine print")); d.appendChild(el("p",null,c.terms)); top.appendChild(d); }
      t.appendChild(top);
      t.appendChild(el("div","perf"));
      var stub=el("div","stub");
      var how = c.evergreen ? "From greatclips.com" : /offers\.greatclips\.com/.test(c.url) ? "Opens the coupon. Show it on your phone at checkout." : "Full details and the coupon link are in the post";
      stub.appendChild(el("span","small",how));
      var go=el("a","btn",c.evergreen?"Details":"Get coupon"); go.href=c.url; go.target="_blank"; go.rel="noopener nofollow";
      stub.appendChild(go);
      t.appendChild(stub);
      var foot=el("div","foot");
      var src=el("a","small","via "+host(c.thread||c.url)+" ↗"); src.href=c.thread||c.url; src.target="_blank"; src.rel="noopener nofollow";
      foot.appendChild(src);
      var votes=el("div","row"); if(c.evergreen){ foot.appendChild(votes); t.appendChild(foot); return t; }
      var mine=store.get("v:"+c.id);
      [["worked","✓ Worked"],["expired","✕ Didn't work"]].forEach(function(p){
        var b=el("button","vote",p[1]+(c.votes[p[0]]? " · "+c.votes[p[0]]:"")); b.type="button";
        b.setAttribute("aria-pressed", mine===p[0]?"true":"false");
        b.disabled=!!mine;
        b.onclick=function(){
          fetch("/api/vote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:c.id,v:p[0]})})
            .then(function(r){ return r.ok? r.json():null; }).then(function(v){
              store.set("v:"+c.id,p[0]); if(v){ c.votes=v; } t.replaceWith(ticket(c)); toast("Thanks, that helps everyone!");
            });
        };
        votes.appendChild(b);
      });
      foot.appendChild(votes);
      t.appendChild(foot);
      return t;
    }


    function fill(box, list, countEl){
      box.textContent="";
      list.forEach(function(c){ box.appendChild(ticket(c)); });
      countEl.textContent=list.length? list.length+(list.length===1?" deal":" deals"):"";
    }

    function empty(box, html){ box.textContent=""; var d=el("div","empty"); box.appendChild(d); html(d); }

    function load(){
      var zip=$("zip").value.trim(), radius=$("radius").value;
      var q = /^\d{5}$/.test(zip)? "?zip="+zip+"&radius="+radius : "";
      fetch("/api/coupons"+q).then(function(r){return r.json();}).then(function(d){
        var meta=$("meta"); meta.textContent="";
        if(d.lastCrawl){ var s=el("span"); s.appendChild(el("span","dot")); s.appendChild(document.createTextNode("Checked "+ago(d.lastCrawl.at))); meta.appendChild(s); }
        else meta.appendChild(el("span",null,"First crawl in progress, check back in a few minutes."));
        fill($("national"), d.national, $("natCount"));
        if(!d.national.length) empty($("national"), function(e){ e.textContent="No nationwide coupons right now. Most Great Clips deals are local to one area, so search your ZIP above."; });
        fill($("always"), d.always, {textContent:""}); $("alwaysSec").hidden=!d.always.length;
        $("stateSec").hidden=true;
        if(!q){ $("localSec").hidden=true; return; }
        $("localSec").hidden=false;
        if(d.unknownZip){ $("localHead").textContent="Near you"; $("localCount").textContent=""; empty($("local"),function(e){ e.textContent="We don't recognize that ZIP code. Please check it and try again."; }); return; }
        $("localHead").textContent="Near "+d.where.city+", "+d.where.state;
        if(window.ClipMap) window.ClipMap.focus(d.where, d.local);
        fill($("local"), d.local, $("localCount"));
        if(d.state && d.state.length){ $("stateSec").hidden=false; $("stateHead").textContent="Elsewhere in "+d.where.state; fill($("state"), d.state, $("stateCount")); }
        if(!d.local.length){
          empty($("local"), function(e){
            e.appendChild(el("strong",null,"No local coupons within "+d.radius+" mi right now. "));
            e.appendChild(document.createTextNode("Great Clips salons release local deals every few weeks, and we check every morning. Try a bigger radius or come back soon."));
            if(d.elsewhere.length){ e.appendChild(el("br")); e.appendChild(el("br")); e.appendChild(document.createTextNode("Live right now in: "+d.elsewhere.join(" · "))); }
          });
        }
      }).catch(function(){ toast("Couldn't load deals, please try again"); });
    }

    $("f").onsubmit=function(e){ e.preventDefault(); var z=$("zip").value.trim(); if(z && !/^\d{5}$/.test(z)){ toast("Enter a 5-digit ZIP"); return; } store.set("zip",z); store.set("radius",$("radius").value); load(); };
    var z=store.get("zip"); if(z) $("zip").value=z;
    var r=store.get("radius"); if(r) $("radius").value=r;
    load();
    })();
    </script>

    <script src="/vendor/d3-array.min.js"></script>
    <script src="/vendor/d3-geo.min.js"></script>
    <script src="/vendor/topojson-client.min.js"></script>
    <script>
