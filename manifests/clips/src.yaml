    function setView(v){ view=v; svg.setAttribute("viewBox", v.join(" ")); var s=k()*1.15;
      var zoomed=v[2]<520, kk=k(), kept=[];
      cityEls.forEach(function(c){
        var sx=(c._x-v[0])/kk, sy=(c._y-v[1])/kk, inView=sx>-10&&sy>-10&&sx<v[2]/kk+10&&sy<v[3]/kk+10;
        var ok=zoomed&&inView&&kept.every(function(q){ return Math.abs(q[0]-sx)>95||Math.abs(q[1]-sy)>18; });
        if(ok&&you){ var ux=(you._x-v[0])/kk, uy=(you._y-v[1])/kk; if(Math.abs(ux-sx)<110&&Math.abs(uy+14-sy)<22) ok=false; }
        c.style.display=ok?"":"none";
        if(ok){ kept.push([sx,sy]); c.setAttribute("transform","translate("+c._x+","+c._y+") scale("+kk+")"); }
      });
      if(ringLabel) ringLabel.setAttribute("font-size", 12*k()); groups.forEach(function(g){ g.el.setAttribute("transform","translate("+g.x+","+g.y+") scale("+s+")"); }); if(you) you.setAttribute("transform","translate("+you._x+","+you._y+") scale("+s+")"); placePop(); }
    function zoomTo(target, ms){
      var from=view.slice(), t0=performance.now(); ms=reduce?0:(ms||900);
      return new Promise(function(done){
        (function step(now){ var t=ms? Math.min(1,(now-t0)/ms) : 1, e=ease(t);
          setView(from.map(function(v,i){ return v+(target[i]-v)*e; }));
          if(t<1) requestAnimationFrame(step); else done(); })(performance.now());
