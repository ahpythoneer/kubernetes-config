      var p=document.createElement("div"); p.className="pop"; p.setAttribute("role","dialog");
      var first=g.items[0];
      var x=document.createElement("button"); x.className="x"; x.type="button"; x.setAttribute("aria-label","Close"); x.textContent="×"; x.onclick=close; p.appendChild(x);
      var o=document.createElement("p"); o.className="po"; o.textContent=first.offer; p.appendChild(o);
