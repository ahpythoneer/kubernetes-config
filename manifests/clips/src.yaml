      var half=Math.min(125,(wrap.width-24)/2);
      openPop.el.style.left=Math.max(12+half, Math.min(wrap.width-12-half, pt.x-wrap.left))+"px";
      openPop.el.style.top=Math.max(openPop.el.offsetHeight+30, pt.y-wrap.top)+"px";
    }
    function close(){ if(openPop){ openPop.el.remove(); openPop=null; } groups.forEach(function(x){ x.el.classList.remove("sel"); }); }
    function seeCard(p){
      var c=document.querySelector('[data-id="'+p.id+'"]');
      if(c){ c.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }
      else window.open(p.url,"_blank","noopener");
    }
    svg.addEventListener("click", function(){ close(); });
    window.addEventListener("resize", function(){ setView(view); });

    // ---- "cut along the dotted line": scissors snip from A to B ----
    function snip(x0,y0,x1,y1){
      var lc=document.getElementById("lCut"), ls=document.getElementById("lSnip");
      lc.textContent=""; ls.textContent="";
      var dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy)||1, bend=Math.min(60,len*.25);
      var cx=(x0+x1)/2 - dy/len*bend, cy=(y0+y1)/2 + dx/len*bend;
      var d="M"+x0+" "+y0+" Q"+cx+" "+cy+" "+x1+" "+y1;
      var path=mk("path",{"class":"cut",d:"M"+x0+" "+y0}, lc);
      var ref=mk("path",{d:d,fill:"none",stroke:"none"}, lc), L=ref.getTotalLength();
      // grow the curve itself: split the quadratic at t (de Casteljau)
      function partial(t){ var ax=x0+(cx-x0)*t, ay=y0+(cy-y0)*t, bx=cx+(x1-cx)*t, by=cy+(y1-cy)*t;
        return "M"+x0+" "+y0+" Q"+ax+" "+ay+" "+(ax+(bx-ax)*t)+" "+(ay+(by-ay)*t); }
      var sc=mk("g",{"class":"scissors"}, ls);
      var b1=mk("path",{"class":"blade",d:"M0 0 L11 -2.5"}, sc), b2=mk("path",{"class":"blade",d:"M0 0 L11 2.5"}, sc);
      mk("circle",{"class":"handle",cx:-4.5,cy:-3.2,r:2.8}, sc); mk("circle",{"class":"handle",cx:-4.5,cy:3.2,r:2.8}, sc);
      var ms=reduce?0:Math.max(1400, Math.min(2400, 700+len*3)), t0=performance.now();
      return new Promise(function(done){
        (function step(now){
          var t=ms? Math.min(1,(now-t0)/ms) : 1, e=ease(t);
          path.setAttribute("d", partial(Math.max(e,.001)));
          var q=ref.getPointAtLength(L*e), q2=ref.getPointAtLength(Math.min(L,L*e+.5)), q0=ref.getPointAtLength(Math.max(0,L*e-.5));
          if(e>=1){ q2=q; q=q0; }
          var ang=Math.atan2(q2.y-q.y,q2.x-q.x)*180/Math.PI, open=Math.abs(Math.sin(now/70))*14;   // snip snip
          var at=e>=1? q2 : q;
          b1.setAttribute("transform","rotate("+(-open)+")"); b2.setAttribute("transform","rotate("+open+")");
          sc.setAttribute("transform","translate("+at.x+","+at.y+") rotate("+ang+") scale("+(k()*1.6)+")");
          if(t<1) requestAnimationFrame(step); else { setTimeout(function(){ sc.remove(); }, 400); done(); }
        })(performance.now());
      });
    }

    function placeYou(x,y,label,where,radius){
      var ly=document.getElementById("lYou"); ly.textContent="";
      // search-radius ring: project a point `radius` miles north to get its size in map units
      var n=proj([where.lon, where.lat+radius/69]);
      if(n){ var r=Math.hypot(n[0]-x,n[1]-y); mk("circle",{"class":"radius",cx:x,cy:y,r:r}, ly);
        var rt=mk("text",{"class":"rlabel",x:x,y:y-r-2,"text-anchor":"middle"}, ly); rt.textContent=radius+" mi"; ringLabel=rt; }
      you=mk("g",{"class":"you"}, ly); you._x=x; you._y=y;
      mk("circle",{"class":"halo",r:6}, you); mk("circle",{"class":"dot",r:6}, you);
      var t=mk("text",{x:0,y:20,"text-anchor":"middle"}, you); t.textContent=label;
      setView(view);
    }

    var api={
      // called by the ZIP search with the searched place and its local deals
      focus: function(where, local){
        close(); if(!where) return;
        var xy=proj([where.lon, where.lat]); if(!xy) return;
        placeYou(xy[0], xy[1], "You · "+where.city, where, +document.getElementById("radius").value||40);
        document.getElementById("usa").hidden=false;
        // nearest pin among the deals the list found (fall back to nearest overall)
        var ids={}; (local||[]).forEach(function(c){ ids[c.id]=1; });
        var best=null;
        groups.forEach(function(g){ if(local && local.length && !g.items.some(function(p){ return ids[p.id]; })) return;
          var dd=Math.hypot(g.x-xy[0], g.y-xy[1]); if(!best||dd<best.d) best={g:g,d:dd}; });
        document.getElementById("mapwrap").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
        if(!best){ zoomTo(fit(xy[0]-80,xy[1]-60,xy[0]+80,xy[1]+60)); return; }
        var g=best.g, dist=Math.hypot(g.x-xy[0], g.y-xy[1]);
        // Frame the trip so the cut line fills a good part of the view, even for
        // a deal 15 miles away (~13 map units at this projection).
        zoomTo(fit(Math.min(xy[0],g.x),Math.min(xy[1],g.y),Math.max(xy[0],g.x),Math.max(xy[1],g.y), Math.max(10,dist*.45), Math.max(70,dist*1.1))).then(function(){
          return snip(xy[0],xy[1],g.x,g.y-6*k());
        }).then(function(){ show(g); });
      }
    };
    window.ClipMap=api;

    document.getElementById("usa").onclick=function(){ close(); document.getElementById("lCut").textContent=""; this.hidden=true; zoomTo([0,0,W,H]); };
    document.getElementById("snippy").onclick=function(){
      if(!groups.length) return;
      close();
      var g=groups[Math.floor(Math.random()*groups.length)];
      var from=you? [you._x,you._y] : [view[0]+view[2]*0.1, view[1]+view[3]*0.1];
      zoomTo([0,0,W,H],500).then(function(){ return snip(from[0],from[1],g.x,g.y-6*k()); })
        .then(function(){ return zoomTo(fit(g.x-30,g.y-30,g.x+30,g.y+20,10,60)); }).then(function(){ document.getElementById("usa").hidden=false; show(g); });
    };

    Promise.all([fetch("/vendor/states-albers-10m.json").then(function(r){ return r.json(); }), fetch("/api/map").then(function(r){ return r.json(); })])
      .then(function(res){
        var us=res[0], data=res[1], path=d3.geoPath(), ls=document.getElementById("lStates");
        var rev={}; Object.keys(ABBR).forEach(function(a){ rev[ABBR[a]]=a; });
        topojson.feature(us, us.objects.states).features.forEach(function(f){
          var el=mk("path",{"class":"st",d:path(f)}, ls); el.dataset.ab=rev[f.properties.name]||"";
          var t=mk("title",{}, el); var n=data.states[el.dataset.ab]||0; t.textContent=f.properties.name+(n?" · "+n+" live deal"+(n>1?"s":""):"");
          el.addEventListener("click", function(ev){ ev.stopPropagation(); close(); var b=el.getBBox(); document.getElementById("usa").hidden=false; zoomTo(fit(b.x,b.y,b.x+b.width,b.y+b.height,30)); });
        });
        var lc=document.getElementById("lCities");
        CITIES.forEach(function(c){ var xy=proj([c[2],c[1]]); if(!xy) return;
          var g=mk("g",{"class":"city"}, lc); g._x=xy[0]; g._y=xy[1]; mk("circle",{r:2.2}, g); var t=mk("text",{x:5,y:3.5}, g); t.textContent=c[0]; cityEls.push(g); });
        build(data);
      }).catch(function(){ document.getElementById("mapwrap").hidden=true; });
    })();
    </script>
    </body>
    </html>
  llm.js: |
    "use strict";
    // Tiny Ollama client with ordered fallback: try each endpoint in OLLAMA_URLS
    // (DGX Spark first, in-cluster Ollama second) and remember which one answered.

    const URLS = (process.env.OLLAMA_URLS || "http://10.0.128.110:11434,http://ollama.ollama:11434")
      .split(",").map(s => s.trim()).filter(Boolean);
    const MODEL = process.env.OLLAMA_MODEL || "llama3.1:8b";
    const TIMEOUT_MS = +(process.env.OLLAMA_TIMEOUT_MS || 150000);

    let lastGood = null;

    async function tryOne(base, body) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
      try {
        const r = await fetch(base + "/api/generate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
          signal: ctl.signal,
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        return d.response || "";
      } finally { clearTimeout(t); }
    }

    // Ask for strict JSON. Returns parsed object or null.
    async function json(prompt, { model = MODEL } = {}) {
      const body = { model, prompt, stream: false, format: "json", keep_alive: "30m",
                     options: { temperature: 0 } };
      const order = lastGood ? [lastGood, ...URLS.filter(u => u !== lastGood)] : URLS;
      for (const base of order) {
        try {
          const out = await tryOne(base, body);
          lastGood = base;
          try { return JSON.parse(out); } catch { return null; }
        } catch (e) {
          console.log(`[llm] ${base} failed: ${e.message}`);
        }
      }
      return null;
    }

    function endpoint() { return lastGood; }

    module.exports = { json, endpoint, MODEL };
  server.js: |
    "use strict";
    // ClipDrop — daily-crawled Great Clips coupon board. Dependency-free Node.
    const http = require("http");
    const fs = require("fs");
    const path = require("path");
    const store = require("./store");
    const geo = require("./geo");
    const crawler = require("./crawler");

    const PORT = +(process.env.PORT || 8080);
    const ADMIN_TOKEN = process.env.ADMIN_TOKEN || "";
    const CRAWL_HOUR = +(process.env.CRAWL_HOUR || 6); // local hour (TZ env) for the daily crawl
    const PAGE = path.join(__dirname, "index.html");

    // ---- helpers ---------------------------------------------------------------
    const today = () => new Date().toISOString().slice(0, 10);

    const NO_DATE_DAYS = 21;        // an undated forum post is assumed stale after this long
    const NO_DATE_DAYS_LISTED = 45; // coupon-list sites re-list offers less often

    function isLive(c) {
      const v = store.db().votes[c.id];
      if (v && v.expired >= 3 && v.expired > v.worked * 2) return false; // visitors say it's dead
      if (Date.now() - Date.parse(c.lastSeen) > 3 * 86400e3) return false; // gone from the source
      if (c.expires) return c.expires >= today();
      // No fixed end date ("use within 14 days of generation") but its page was
      // checked live in the last 2 days: trust the check over the post's age.
      if (c.checkedAt && Date.now() - Date.parse(c.checkedAt) < 2 * 86400e3) return true;
      const days = c.unverified ? NO_DATE_DAYS_LISTED : NO_DATE_DAYS;
      return c.evergreen || Date.now() - Date.parse(c.posted + "T12:00:00Z") < days * 86400e3;
    }

    // A deal matches when its market centre (or salon's city) is within the
    // visitor's radius, and the card shows exactly that distance.
    function nearest(c, where, radius) {
      let best = null;
      for (const l of c.locs || []) {
        if (l.lat == null) continue;
        const mi = geo.miles(where, l);
        if (mi <= radius && (!best || mi < best.miles))
          best = { miles: Math.round(mi), place: l.salon ? `${l.salon}, ${l.city}, ${l.state}` : `${l.city} area, ${l.state}` };
      }
      return best;
    }

    // State-only markets ("Select NJ, PA & DE locations") can't be placed on a map,
    // so they are listed separately for visitors in that state, never as "0 mi".
    function statewide(c, where) {
      return (c.locs || []).some(l => l.lat == null && l.state === where.state);
    }

    function publicCoupon(c, near) {
      const v = store.db().votes[c.id] || { worked: 0, expired: 0 };
      return {
        id: c.id, title: c.title, offer: c.offer, terms: c.terms || null,
        expires: c.expires || null, scope: c.scope, evergreen: !!c.evergreen, source: c.source,
        url: c.url, thread: c.thread && c.thread !== c.url ? c.thread : null,
        markets: (c.locs || []).map(l => l.salon ? `${l.salon}, ${l.city}, ${l.state}` : l.city ? `${l.city} area, ${l.state}` : `select ${l.state} salons`),
        miles: near ? near.miles : null, place: near ? near.place : null,
        posted: c.posted, firstSeen: c.firstSeen, votes: v, unverified: !!c.unverified, checkedAt: c.checkedAt || null,
      };
    }

    const hits = new Map(); // ip|key -> last time
    function limited(ip, key, ms) {
      const k = ip + "|" + key, now = Date.now();
      if (hits.size > 50000) hits.clear();
      if (now - (hits.get(k) || 0) < ms) return true;
      hits.set(k, now); return false;
    }

    function send(res, code, body, type = "application/json") {
      res.writeHead(code, { "content-type": type, "cache-control": "no-store",
        "x-content-type-options": "nosniff" });
      res.end(type === "application/json" ? JSON.stringify(body) : body);
    }

    function readBody(req) {
      return new Promise((ok) => {
        let s = "";
        req.on("data", d => { s += d; if (s.length > 4096) req.destroy(); });
        req.on("end", () => { try { ok(JSON.parse(s || "{}")); } catch { ok({}); } });
      });
    }

    const clientIp = req => (req.headers["cf-connecting-ip"] || req.headers["x-forwarded-for"] || req.socket.remoteAddress || "").split(",")[0].trim();

    const VENDOR = {
      "states-albers-10m.json": "https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json",
      "d3-array.min.js": "https://cdn.jsdelivr.net/npm/d3-array@3/dist/d3-array.min.js",
      "d3-geo.min.js": "https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js",
      "topojson-client.min.js": "https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js",
    };
    const vendorMem = {};
    async function vendor(name) {
      if (vendorMem[name]) return vendorMem[name];
      const file = path.join(store.DATA_DIR, "vendor", name);
      try { return (vendorMem[name] = fs.readFileSync(file)); } catch {}
      try {
        const r = await fetch(VENDOR[name]);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const buf = Buffer.from(await r.arrayBuffer());
        fs.mkdirSync(path.dirname(file), { recursive: true });
        fs.writeFileSync(file, buf);
        return (vendorMem[name] = buf);
      } catch (e) { console.log("[vendor]", name, e.message); return null; }
    }

    // ---- routes ----------------------------------------------------------------
    async function handle(req, res) {
      const u = new URL(req.url, "http://x");
      const ip = clientIp(req);
      const db = store.db();

      if (req.method === "GET" && (u.pathname === "/" || u.pathname === "/index.html"))
        return send(res, 200, fs.readFileSync(PAGE), "text/html; charset=utf-8");
      if (u.pathname === "/healthz") return send(res, 200, { ok: true });

      if (req.method === "GET" && u.pathname === "/api/coupons") {
        const zip = (u.searchParams.get("zip") || "").trim();
        const radius = Math.min(250, Math.max(5, +(u.searchParams.get("radius") || 40)));
        const where = /^\d{5}$/.test(zip) ? geo.lookup(zip) : null;
        const live = Object.values(db.coupons).filter(isLive);
        const byNew = (a, b) => (b.posted || "").localeCompare(a.posted || "");
        const national = live.filter(c => c.scope === "national" && !c.evergreen).map(c => publicCoupon(c)).sort(byNew);
        const always = live.filter(c => c.evergreen).map(c => publicCoupon(c));
        let local = [], state = [];
        if (where) {
          const locals = live.filter(c => c.scope === "local");
          local = locals.map(c => { const n = nearest(c, where, radius); return n && publicCoupon(c, n); })
            .filter(Boolean).sort((a, b) => (a.unverified - b.unverified) || a.miles - b.miles || byNew(a, b));
          const near = new Set(local.map(c => c.id));
          state = locals.filter(c => !near.has(c.id) && statewide(c, where)).map(c => publicCoupon(c)).sort(byNew);
        }
        // Other markets with live deals right now: shown as a teaser when nothing is local.
        const elsewhere = [...new Set(live.filter(c => c.scope === "local")
          .flatMap(c => (c.locs || []).map(l => l.city ? `${l.city}, ${l.state}` : l.state)))].sort().slice(0, 20);
        const last = db.crawls[db.crawls.length - 1] || null;
        return send(res, 200, {
          where, radius, local, state, national, always, elsewhere,
          unknownZip: !!zip && !where,
          lastCrawl: last && { at: last.at, found: last.found },
        });
      }

      if (req.method === "POST" && u.pathname === "/api/vote") {
        const { id, v } = await readBody(req);
        if (!db.coupons[id] || !["worked", "expired"].includes(v)) return send(res, 400, { error: "bad vote" });
        if (limited(ip, "vote:" + id, 12 * 3600e3)) return send(res, 429, { error: "already voted" });
        const t = db.votes[id] || (db.votes[id] = { worked: 0, expired: 0 });
        t[v]++; store.save();
        return send(res, 200, t);
      }

      // Everything the Drop Map needs in one call: a pin per placed market/salon,
      // per-state counts for the tint, and a few headline stats for the ticker.
      if (req.method === "GET" && u.pathname === "/api/map") {
        const live = Object.values(db.coupons).filter(isLive);
        const pins = [], states = {};
        const price = c => { const m = String(c.offer).match(/\$(\d+(?:\.\d{2})?)/); return m ? +m[1] : null; };
        for (const c of live.filter(c => c.scope === "local")) {
          for (const l of c.locs || []) {
            states[l.state] = (states[l.state] || 0) + 1;
            if (l.lat == null) continue;
            pins.push({ id: c.id, offer: c.offer, price: price(c), off: /off/i.test(c.offer), lat: +l.lat.toFixed(4), lon: +l.lon.toFixed(4),
              salon: l.salon || null, city: l.city, state: l.state, expires: c.expires || null, url: c.url,
              verified: !!c.checkedAt, isNew: Date.now() - Date.parse(c.firstSeen) < 30 * 3600e3 });
          }
        }
        const priced = pins.filter(p => p.price && !p.off).sort((a, b) => a.price - b.price);
        const soon = new Set(pins.filter(p => p.expires && (Date.parse(p.expires) - Date.now()) < 7 * 86400e3).map(p => p.id));
        const last = db.crawls[db.crawls.length - 1] || null;
        return send(res, 200, {
          pins, states,
          national: live.filter(c => c.scope === "national" && !c.evergreen).map(c => ({ id: c.id, offer: c.offer, url: c.url })),
          stats: { deals: new Set(pins.map(p => p.id)).size, places: new Set(pins.map(p => p.city + p.state)).size,
            cheapest: priced[0] ? { price: priced[0].price, city: priced[0].city, state: priced[0].state } : null,
            endingSoon: soon.size, newToday: new Set(pins.filter(p => p.isNew).map(p => p.id)).size },
          lastCrawl: last && last.at,
        });
      }

      // Map geometry + tiny libs, cached on the data volume on first use so the
      // page never depends on a third-party CDN being up.
      if (req.method === "GET" && u.pathname.startsWith("/vendor/")) {
        const name = u.pathname.slice(8);
        if (!VENDOR[name]) return send(res, 404, { error: "not found" });
        const body = await vendor(name);
        if (!body) return send(res, 502, { error: "unavailable" });
        res.writeHead(200, { "content-type": name.endsWith(".json") ? "application/json" : "text/javascript",
          "cache-control": "public, max-age=604800", "x-content-type-options": "nosniff" });
        return res.end(body);
      }

      if (req.method === "GET" && u.pathname === "/api/status") {
        return send(res, 200, { crawls: db.crawls.slice(-7), running: crawler.running(),
          coupons: Object.keys(db.coupons).length, live: Object.values(db.coupons).filter(isLive).length });
      }

      if (req.method === "POST" && u.pathname === "/api/crawl") {
        if (!ADMIN_TOKEN || req.headers.authorization !== "Bearer " + ADMIN_TOKEN)
          return send(res, 401, { error: "unauthorized" });
        if (crawler.running()) return send(res, 409, { error: "crawl already running" });
        crawler.run().catch(e => console.log("[crawl] failed:", e));
        return send(res, 202, { started: true });
      }

      send(res, 404, { error: "not found" });
    }

    // ---- daily schedule --------------------------------------------------------
    function lastCrawlAt() {
      const c = store.db().crawls; return c.length ? Date.parse(c[c.length - 1].at) : 0;
    }
    setInterval(() => {
      const now = new Date();
      if (now.getHours() === CRAWL_HOUR && Date.now() - lastCrawlAt() > 20 * 3600e3 && !crawler.running())
        crawler.run().catch(e => console.log("[crawl] failed:", e));
    }, 60e3);

    (async () => {
      await geo.load(store.DATA_DIR).catch(e => console.log("[geo] load failed:", e.message));
      http.createServer((req, res) => handle(req, res).catch(e => {
        console.log("[http]", e); send(res, 500, { error: "server error" });
      })).listen(PORT, () => console.log(`clipdrop listening on :${PORT}`));
      // Fresh volume or pod down over the crawl hour → crawl now.
      if (Date.now() - lastCrawlAt() > 26 * 3600e3) setTimeout(() => crawler.run().catch(e => console.log("[crawl] failed:", e)), 5000);
    })();

    for (const sig of ["SIGTERM", "SIGINT"]) process.on(sig, () => { store.save(true); process.exit(0); });
  store.js: |
    "use strict";
    // JSON-file store on the data volume. Small enough to keep fully in memory;
    // writes are atomic (tmp + rename) and debounced.
    const fs = require("fs");
    const path = require("path");

    const DATA_DIR = process.env.DATA_DIR || "/data";
    const FILE = path.join(DATA_DIR, "coupons.json");

    let db = { coupons: {}, crawls: [], votes: {} };
    try { db = Object.assign(db, JSON.parse(fs.readFileSync(FILE, "utf8"))); } catch {}

    let timer = null;
    function save(now = false) {
      const write = () => {
        timer = null;
        try {
          fs.writeFileSync(FILE + ".tmp", JSON.stringify(db));
          fs.renameSync(FILE + ".tmp", FILE);
        } catch (e) { console.log("[store] save failed:", e.message); }
      };
      if (now) { clearTimeout(timer); return write(); }
      if (!timer) timer = setTimeout(write, 2000);
    }

    module.exports = { db: () => db, save, DATA_DIR };
