# ClipDrop app source (dev copy: ~/clips-app/src). Regenerate with:
#   kubectl create configmap clipdrop-src -n clips --from-file=~/clips-app/src --dry-run=client -o yaml
apiVersion: v1
data:
  crawler.js: |
    "use strict";
    // Daily crawl. Sources (all robots.txt-allowed, fetched politely, once a day):
    //  1. Slickdeals thread sitemaps (/attachment/sitemaps/threads-*.xml.gz) → threads
    //     whose slug mentions Great Clips → the thread page (/f/<id>) for title, body,
    //     post date and the offers.greatclips.com coupon link. We only LINK to
    //     offers.greatclips.com (its robots.txt disallows crawling), never fetch it.
    //  2. greatclips.com/promotions/ (+ its sub-pages) for nationwide perks/campaigns.
    // The LLM turns each post into structured fields; regex stays the source of
    // truth for dates and prices when it can find them.
    const zlib = require("zlib");
    const crypto = require("crypto");
    const store = require("./store");
    const geo = require("./geo");
    const llm = require("./llm");

    const UA = process.env.CRAWL_UA || "ClipDropBot/1.0 (+https://clips.racktocloud.com; daily, polite)";
    const MAX_AGE_DAYS = +(process.env.MAX_AGE_DAYS || 45);
    const MAX_THREADS = +(process.env.MAX_THREADS || 60);
    const DELAY_MS = +(process.env.CRAWL_DELAY_MS || 2500);

    let busy = false;
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const running = () => busy;

    async function get(url, { binary = false } = {}) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 30000);
      try {
        const r = await fetch(url, { headers: { "user-agent": UA, "accept-language": "en-US" }, signal: ctl.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
        return binary ? Buffer.from(await r.arrayBuffer()) : await r.text();
      } finally { clearTimeout(t); }
    }

    const decode = s => s.replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&nbsp;/g, " ").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n));
    const text = h => decode(h.replace(/<(script|style|svg)[^>]*>[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ")).replace(/\s+/g, " ").trim();
    const meta = (h, p) => { const m = h.match(new RegExp(`<meta[^>]+(?:property|name)="${p}"[^>]+content="([^"]*)"`, "i")); return m ? decode(m[1]).trim() : ""; };

    // ---- deterministic parsing -------------------------------------------------
    const MONTHS = "jan feb mar apr may jun jul aug sep oct nov dec".split(" ");
    function parseExpiry(s, ref) {
      const refY = ref.getUTCFullYear();
      let m = s.match(/(?:expir\w*|valid (?:through|thru|until)|ends?|good (?:through|thru|until)|thru|through)\s*:?\s*(?:on\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/i);
      let y, mo, d;
      if (m) { mo = +m[1]; d = +m[2]; y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
      else {
        m = s.match(/(?:expir\w*|valid (?:through|thru|until)|ends?|through|thru|until)\s*:?\s*(?:on\s+)?([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/i);
        if (!m || MONTHS.indexOf(m[1].toLowerCase()) < 0) return null;
        mo = MONTHS.indexOf(m[1].toLowerCase()) + 1; d = +m[2]; y = m[3] ? +m[3] : null;
      }
      if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
      if (!y) { // no year: the next occurrence on/after the post date
        y = refY;
        if (new Date(Date.UTC(y, mo - 1, d)) < new Date(ref.getTime() - 7 * 86400e3)) y++;
      }
      return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }

    const priceIn = s => { const m = s.match(/\$\s?(\d{1,2}(?:\.\d{2})?)\s*(off)?/i); return m ? { amount: +m[1], off: !!m[2] } : null; };

    // "$9.99" / "$10.99 Great Clips coupon" -> "$9.99 haircut"; keep good model headlines.
    function offerText(o, post) {
      o = String(o || "").trim();
      const p = priceIn(post.title) || priceIn(o) || priceIn(post.body);
      return p ? (p.off ? `$${p.amount} off a haircut` : `$${p.amount} haircut`) : (o || post.title).slice(0, 60);
    }

    // ---- LLM extraction --------------------------------------------------------
    async function extract(post) {
      const prompt = `You extract Great Clips haircut coupon details from a deal-forum post.
    Return ONLY JSON with these keys:
    {"is_haircut_coupon": boolean,   // true only if it is a coupon/price deal on a Great Clips haircut service (not gift cards, not products, not job posts, not questions)
     "offer": string,                // short headline in the form "$9.99 haircut" or "$5 off a haircut"
     "scope": "national" | "local",  // national = valid at participating salons nationwide
     "markets": [{"city": string|null, "state": "two-letter US state code"}], // every metro area named, e.g. "Austin area" -> [{"city":"Austin","state":"TX"}]; "Cleveland, Akron & Canton" -> three entries; use city null ONLY when the post names a whole state or region with no city
     "expires": "YYYY-MM-DD" | null,
     "terms": string | null          // one sentence of important conditions, or null
    }
    Posted on: ${post.posted || "unknown"}
    Title: ${post.title}
    Text: ${post.body.slice(0, 1500)}`;
      return llm.json(prompt);
    }

    const NATIONAL = /nation\s?wide|all (?:u\.?s\.? )?locations|participating u\.?s\.?|u\.s\. (?:salons|stores)/i;

    // Heuristic fallback when no LLM endpoint is reachable.
    function heuristic(post) {
      const s = post.title + " " + post.body;
      const p = priceIn(post.title) || priceIn(s);
      if (!/great\s?clips/i.test(s) || /gift\s?card|stylist|hiring|job/i.test(post.title) || !p) return null;
      return { is_haircut_coupon: true, offer: p.off ? `$${p.amount} off a haircut` : `$${p.amount} haircut`,
        scope: NATIONAL.test(s) ? "national" : "local", markets: [], expires: null, terms: null };
    }

    // ---- geography -------------------------------------------------------------
    let cityIndex = null;
    function cityCentroid(city, state) {
      if (!cityIndex) {
        const tbl = geo._table();
        if (!tbl) return null;
        cityIndex = new Map();
        for (const [zip, [lat, lon, c, st]] of Object.entries(tbl)) {
          for (const k of [`${c}|${st}`.toLowerCase(), `*|${st}`.toLowerCase()]) {
            const a = cityIndex.get(k) || { lat: 0, lon: 0, n: 0 };
            a.lat += lat; a.lon += lon; a.n++; cityIndex.set(k, a);
          }
        }
      }
      const a = cityIndex.get(`${city || "*"}|${state}`.toLowerCase());
      return a ? { lat: a.lat / a.n, lon: a.lon / a.n } : null;
    }

    function locate(markets) {
      const out = [];
      for (const m of markets || []) {
        const st = String(m.state || "").toUpperCase().trim();
        if (!/^[A-Z]{2}$/.test(st) || st === "US") continue;
        const city = m.city && String(m.city).replace(/^(greater|metro)\s+|\s+(area|metro(politan)?|region)$/gi, "").trim();
        const c = city ? cityCentroid(city, st) : null;
        if (c) out.push({ city, state: st, lat: c.lat, lon: c.lon });
        else out.push({ city: null, state: st }); // whole state (or city we couldn't place)
      }
      // A state-wide entry is redundant when we placed a city in that state.
      const placed = new Set(out.filter(l => l.city).map(l => l.state));
      const seen = new Set();
      return out.filter(l => {
        const k = (l.city || "*") + l.state;
        if (seen.has(k) || (!l.city && placed.has(l.state))) return false;
        seen.add(k); return true;
      });
    }

    // ---- sources ---------------------------------------------------------------
    async function slickdealsThreads(log) {
      const idx = await get("https://slickdeals.net/attachment/sitemaps/sitemap.xml");
      const maps = [...idx.matchAll(/<loc>([^<]+threads-(daily|weekly)-(\d+)\.xml\.gz)<\/loc>/g)]
        .map(m => ({ url: m[1], kind: m[2], n: +m[3] }));
      // daily sitemaps + the two newest weekly ones cover well over MAX_AGE_DAYS
      const weekly = maps.filter(m => m.kind === "weekly").sort((a, b) => b.n - a.n).slice(0, 2);
      const pick = [...maps.filter(m => m.kind === "daily"), ...weekly];
      const cutoff = Date.now() - MAX_AGE_DAYS * 86400e3;
      const found = new Map();
      for (const m of pick) {
        await sleep(DELAY_MS);
        const xml = zlib.gunzipSync(await get(m.url, { binary: true })).toString("utf8");
        for (const u of xml.matchAll(/<url>\s*<loc>([^<]+)<\/loc>\s*(?:<lastmod>([^<]+)<\/lastmod>)?/g)) {
          if (!/\/f\/\d+-[^/]*great-?clips/i.test(u[1])) continue;
          const mod = u[2] ? Date.parse(u[2]) : Date.now();
          if (mod >= cutoff) found.set(u[1], mod);
        }
      }
      log(`slickdeals: ${found.size} Great Clips threads in the last ${MAX_AGE_DAYS} days`);
      const threads = [...found].sort((a, b) => b[1] - a[1]).slice(0, MAX_THREADS);
      const posts = [];
      for (const [url, mod] of threads) {
        await sleep(DELAY_MS);
        let h;
        try { h = await get(url); } catch (e) { log(`  skip ${url}: ${e.message}`); continue; }
        const prod = (h.match(/"product":\{[^}]*"store":"([^"]*)"/) || [])[1] || "";
        if (prod && !/great clips/i.test(prod)) continue;
        const ogt = meta(h, "og:title");
        const dm = ogt.match(/ - (\d{4}-\d{2}-\d{2})$/);
        const title = ogt.replace(/ - \d{4}-\d{2}-\d{2}$/, "");
        const bodyM = h.match(/class="dealDetailsRawHtml[^"]*"[^>]*>([\s\S]{0,6000}?)<\/div>/);
        const body = (bodyM ? text(bodyM[1]) : meta(h, "og:description")).replace(/Community (Notes|Voting)[\s\S]*$/, "").trim();
        const links = [...new Set([...h.matchAll(/https?:\/\/offers\.greatclips\.com\/([A-Za-z0-9]{5,10})/g)].map(m => m[0]))];
        posts.push({ source: "Slickdeals", url, title, body, posted: dm ? dm[1] : new Date(mod).toISOString().slice(0, 10), couponUrl: links[0] || null });
      }
      return posts;
    }

    async function greatclipsPromos(log) {
      const base = "https://www.greatclips.com";
      const h = await get(base + "/promotions/");
      const t = text(h);
      const perks = [];
      if (/\$2 off/i.test(t) && /email/i.test(t))
        perks.push({ key: "gc-email-2off", offer: "$2 off your next haircut", title: "Join the Great Clips email list",
          terms: "One-time coupon, emailed to newly subscribed addresses only. Not valid with other offers.", url: base + "/promotions/" });
      if (/senior/i.test(t))
        perks.push({ key: "gc-senior", offer: "Senior discount (65+)", title: "Every day at participating salons",
          terms: "No coupon needed. The amount varies by salon, so ask at check-in.", url: base + "/promotions/senior-discounts" });
      // Campaign pages (sports partnerships etc.) occasionally carry a nationwide haircut offer.
      const posts = [];
      const subs = [...new Set([...h.matchAll(/href="(\/promotions\/[a-z0-9-]+)"/g)].map(m => m[1]))]
        .filter(p => !/senior|haircare-sale/.test(p));
      for (const p of subs) {
        await sleep(DELAY_MS);
        try {
          const sh = await get(base + p);
          posts.push({ source: "greatclips.com", url: base + p, title: meta(sh, "og:title") || p, body: text(sh).slice(0, 4000),
            posted: new Date().toISOString().slice(0, 10), couponUrl: null, official: true });
        } catch (e) { log(`  skip ${p}: ${e.message}`); }
      }
      log(`greatclips.com: ${perks.length} standing perks, ${posts.length} campaign pages`);
      return { perks, posts };
    }

    // ---- main ------------------------------------------------------------------
    async function run() {
      if (busy) return;
      busy = true;
      const started = new Date();
      const lines = [];
      const log = s => { console.log("[crawl] " + s); lines.push(s); };
      const report = { at: started.toISOString(), sources: {}, found: 0, llm: null };
      try {
        await geo.load(store.DATA_DIR);
        const db = store.db();
        const now = started.toISOString();
        const seen = new Set();

        const upsert = (c) => {
          const prev = db.coupons[c.id];
          db.coupons[c.id] = Object.assign({}, prev || {}, c, { firstSeen: prev ? prev.firstSeen : now, lastSeen: now });
          seen.add(c.id);
        };

        // Wake the model first so a cold load doesn't eat the first post's timeout.
        await llm.json('Reply with {"ok":true}');

        let posts = [];
        try { const p = await slickdealsThreads(log); posts.push(...p); report.sources.slickdeals = { ok: true, posts: p.length }; }
        catch (e) { log("slickdeals failed: " + e.message); report.sources.slickdeals = { ok: false, error: e.message }; }
        try {
          const g = await greatclipsPromos(log);
          for (const p of g.perks) upsert({ id: p.key, scope: "national", evergreen: true, source: "greatclips.com", url: p.url,
            offer: p.offer, title: p.title, terms: p.terms, expires: null, posted: now.slice(0, 10), confidence: 1, locs: [] });
          posts.push(...g.posts);
          report.sources.greatclips = { ok: true, perks: g.perks.length, pages: g.posts.length };
        } catch (e) { log("greatclips.com failed: " + e.message); report.sources.greatclips = { ok: false, error: e.message }; }

        for (const post of posts) {
          let x = await extract(post);
          if (x) report.llm = llm.endpoint();
          else x = post.official ? null : heuristic(post);
          if (!x || !x.is_haircut_coupon) { log(`  not a coupon: ${post.title}`); continue; }

          const ref = new Date((post.posted || now.slice(0, 10)) + "T12:00:00Z");
          const all = post.title + " " + post.body;
          if (NATIONAL.test(all) || (x.markets || []).some(m => /^(US|USA)$/i.test(String(m.state || "")))) x.scope = "national";
          const exp = parseExpiry(post.title + " " + post.body, ref) || (/^\d{4}-\d{2}-\d{2}$/.test(x.expires || "") ? x.expires : null);
          const locs = x.scope === "national" ? [] : locate(x.markets);
          if (x.scope !== "national" && !locs.length) { log(`  no market for: ${post.title}`); continue; }
          const key = post.couponUrl || `${x.offer}|${locs.map(l => l.city + l.state).join(",")}|${exp}`;
          upsert({
            id: crypto.createHash("sha1").update(key).digest("hex").slice(0, 12),
            scope: x.scope === "national" ? "national" : "local",
            offer: offerText(x.offer, post), title: post.title.slice(0, 140),
            terms: x.terms ? String(x.terms).slice(0, 300) : null, expires: exp, posted: post.posted,
            source: post.source, url: post.couponUrl || post.url, thread: post.url, locs,
            confidence: report.llm ? 0.9 : 0.5,
          });
          log(`  + ${x.scope} ${x.offer} ${locs.map(l => (l.city || "*") + "," + l.state).join(" ")} exp=${exp}`);
        }
        // Standing perks that vanished from the official page are dropped.
        for (const [id, c] of Object.entries(db.coupons)) if (c.evergreen && !seen.has(id) && report.sources.greatclips?.ok) delete db.coupons[id];
        // Forget anything long gone.
        for (const [id, c] of Object.entries(db.coupons))
          if (Date.now() - Date.parse(c.lastSeen) > 90 * 86400e3) { delete db.coupons[id]; delete db.votes[id]; }

        report.found = seen.size;
        report.ms = Date.now() - started.getTime();
        db.crawls.push(report);
        db.crawls = db.crawls.slice(-30);
        store.save(true);
        log(`done: ${seen.size} coupons in ${Math.round(report.ms / 1000)}s (llm: ${report.llm || "none"})`);
      } finally { busy = false; }
      return lines;
    }

    module.exports = { run, running, parseExpiry };
  geo.js: |
    "use strict";
    // ZIP -> {lat, lon, city, state} from the GeoNames US postal code dump
    // (CC-BY 4.0, https://download.geonames.org/export/zip/). Downloaded once and
    // cached as JSON on the data volume.
    const fs = require("fs");
    const zlib = require("zlib");
    const path = require("path");

    const SRC = "https://download.geonames.org/export/zip/US.zip";
    let table = null; // { "55401": [lat, lon, "Minneapolis", "MN"] }

    // Extract one named file from a .zip archive (no dependency on unzip). Walks the
    // central directory, since local headers may defer sizes to a data descriptor.
    function extract(buf, want) {
      const eocd = buf.lastIndexOf(Buffer.from([0x50, 0x4b, 0x05, 0x06]));
      if (eocd < 0) throw new Error("not a zip");
      let p = buf.readUInt32LE(eocd + 16);
      const n = buf.readUInt16LE(eocd + 10);
      for (let i = 0; i < n; i++) {
        const method = buf.readUInt16LE(p + 10), csize = buf.readUInt32LE(p + 20);
        const nameLen = buf.readUInt16LE(p + 28), extraLen = buf.readUInt16LE(p + 30), cmtLen = buf.readUInt16LE(p + 32);
        const local = buf.readUInt32LE(p + 42);
        const name = buf.toString("utf8", p + 46, p + 46 + nameLen);
        if (name === want) {
          const start = local + 30 + buf.readUInt16LE(local + 26) + buf.readUInt16LE(local + 28);
          const data = buf.subarray(start, start + csize);
          return method === 8 ? zlib.inflateRawSync(data) : data;
        }
        p += 46 + nameLen + extraLen + cmtLen;
      }
      return null;
    }

    async function load(dataDir) {
      if (table) return table;
      const cache = path.join(dataDir, "zips.json");
      try { table = JSON.parse(fs.readFileSync(cache, "utf8")); return table; } catch {}
      const r = await fetch(SRC);
      if (!r.ok) throw new Error("geonames HTTP " + r.status);
      const zip = Buffer.from(await r.arrayBuffer());
      const raw = extract(zip, "US.txt");
      if (!raw) throw new Error("US.txt not found in archive");
      const txt = raw.toString("utf8");
      table = {};
      for (const line of txt.split("\n")) {
        const f = line.split("\t");
        if (f.length < 11) continue;
        table[f[1]] = [+f[9], +f[10], f[2], f[4]];
      }
      fs.writeFileSync(cache, JSON.stringify(table));
      return table;
    }

    function lookup(zip) {
      const z = table && table[String(zip).slice(0, 5)];
      return z ? { zip: String(zip).slice(0, 5), lat: z[0], lon: z[1], city: z[2], state: z[3] } : null;
    }

    function miles(a, b) {
      const R = 3958.8, rad = x => x * Math.PI / 180;
      const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    module.exports = { load, lookup, miles, _table: () => table };
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ClipDrop — fresh haircut coupons, daily</title>
    <meta name="description" content="Haircut coupons for Great Clips salons near you, found fresh every morning. Search your ZIP, grab one, go.">
    <meta name="theme-color" content="#0f766e">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <style>
    :root{
      --bg:#f6f4ef; --ink:#1c1b19; --muted:#6b675f; --card:#fffdf8; --line:#e4dfd4;
      --brand:#0f766e; --brand-ink:#fff; --accent:#e8572a; --ok:#15803d; --warn:#b45309;
      --stub:#fef3c7; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.25);
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#12110f; --ink:#f1ede4; --muted:#a39e93; --card:#1c1a17; --line:#302d28;
        --brand:#2dd4bf; --brand-ink:#062a26; --accent:#fb7c52; --ok:#4ade80; --warn:#fbbf24;
        --stub:#2a2416; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.8); }
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    a{color:var(--brand)}
    .wrap{max-width:960px;margin:0 auto;padding:0 16px}
    header{padding:28px 0 8px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
    .logo .mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);
      display:grid;place-items:center;font-size:20px;transform:rotate(-8deg)}
    .hero h1{font-size:clamp(28px,6vw,44px);line-height:1.05;letter-spacing:-.03em;margin:22px 0 8px}
    .hero h1 em{font-style:normal;color:var(--accent)}
    .hero p{color:var(--muted);margin:0 0 20px;max-width:560px}
    form.search{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:8px;box-shadow:var(--shadow);max-width:560px}
    form.search input,form.search select{font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:10px 12px}
    form.search input{flex:1 1 140px;min-width:0;font-size:18px;letter-spacing:.08em}
    form.search select{border-left:1px solid var(--line);flex:0 0 auto}
    .btn{display:inline-block;text-decoration:none;font:inherit;font-weight:700;border:0;border-radius:11px;padding:10px 18px;cursor:pointer;
      background:var(--brand);color:var(--brand-ink)}
    .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    .btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .meta{font-size:13px;color:var(--muted);margin:12px 0 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
    section{margin:34px 0}
    section h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 12px;
      display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .ticket{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
      border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .ticket .top{padding:16px 16px 12px}
    .offer{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
    .title{margin:0 0 8px;color:var(--muted);font-size:14px}
    .tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
    .tag.hot{border-color:transparent;background:var(--accent);color:#fff}
    .tag.soon{color:var(--warn);border-color:currentColor}
    .perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 12px}
    .perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;
      background:var(--bg);border:1px solid var(--line)}
    .perf::before{left:-23px}.perf::after{right:-23px}
    .stub{background:var(--stub);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}
    .code{font:700 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
    .small{font-size:12px;color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .foot{padding:10px 16px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}
    .vote{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);
      border-radius:999px;padding:4px 10px;cursor:pointer}
    .vote[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
    .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted)}
    .empty strong{color:var(--ink)}
    details.terms{font-size:13px;color:var(--muted);margin-top:8px}
    details.terms summary{cursor:pointer}
    footer{padding:30px 0 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
    .skel{height:170px;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));
      background-size:200% 100%;animation:sk 1.2s infinite}
    @keyframes sk{to{background-position:-200% 0}}
    @media (prefers-reduced-motion:reduce){.skel{animation:none}}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
      padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
    .toast.on{opacity:1}
    </style>
    </head>
    <body>
    <div class="wrap">
      <header><div class="logo"><span class="mark" aria-hidden="true">✂︎</span>ClipDrop</div></header>

      <div class="hero">
        <h1>Cheaper haircuts,<br><em>found every morning.</em></h1>
        <p>We check coupon sites every day for Great Clips deals, weed out the fake and expired ones, and list what's left here. Enter your ZIP, grab a coupon, get your haircut.</p>
        <form class="search" id="f">
          <label class="sr" for="zip" hidden>ZIP code</label>
          <input id="zip" inputmode="numeric" pattern="\d{5}" maxlength="5" placeholder="Your ZIP" autocomplete="postal-code" aria-label="ZIP code">
          <select id="radius" aria-label="Search radius">
            <option value="15">15 mi</option><option value="40" selected>40 mi</option><option value="100">100 mi</option>
          </select>
          <button class="btn">Find deals</button>
        </form>
        <div class="meta" id="meta"></div>
      </div>

      <section id="localSec" hidden>
        <h2><span id="localHead">Near you</span><span id="localCount"></span></h2>
        <div id="local" class="grid"></div>
      </section>

      <section id="natSec">
        <h2><span>Good anywhere</span><span id="natCount"></span></h2>
        <div id="national" class="grid"><div class="skel"></div><div class="skel"></div></div>
      </section>

      <section id="alwaysSec">
        <h2><span>Always available</span></h2>
        <div id="always" class="grid"></div>
      </section>

      <footer>
        ClipDrop is a fan-made coupon board and is <strong>not affiliated with, endorsed by, or sponsored by Great Clips, Inc.</strong>
        "Great Clips" is a trademark of its owner, used here only to describe the coupons. Great Clips salons are independently owned franchises,
        so each salon decides whether to accept a coupon. Check the terms and call ahead if you're unsure. Every coupon links to the page where we found it.
        <br><br>ZIP data © <a href="https://www.geonames.org/" rel="noopener">GeoNames</a> (CC BY 4.0).
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
    (function(){
    "use strict";
    var $ = function(id){ return document.getElementById(id); };
    var store = { get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
                  set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
    function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(function(){t.classList.remove("on");},1800); }
    function daysLeft(d){ if(!d) return null; return Math.ceil((Date.parse(d+"T23:59:59")-Date.now())/864e5); }
    function ago(iso){ var m=Math.round((Date.now()-Date.parse(iso))/6e4); if(m<60) return m+" min ago"; var h=Math.round(m/60); return h<48? h+" h ago" : Math.round(h/24)+" days ago"; }
    function nice(d){ try{ return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }catch(e){ return d; } }
    function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return "source"; } }

    function ticket(c){
      var t=el("article","ticket");
      var top=el("div","top");
      top.appendChild(el("p","offer",c.offer||c.title));
      if(c.offer && c.title && c.title!==c.offer) top.appendChild(el("p","title",c.title));
      var tags=el("div","tags");
      var dl=daysLeft(c.expires);
      if(dl!=null) tags.appendChild(el("span","tag"+(dl<=3?" soon":""), dl<=0?"ends today":dl===1?"ends tomorrow":"ends in "+dl+" days"));
      else if(!c.evergreen) tags.appendChild(el("span","tag","posted "+nice(c.posted)));
      if(c.miles!=null) tags.appendChild(el("span","tag",c.miles+" mi · "+c.place));
      else if(c.markets && c.markets.length) tags.appendChild(el("span","tag",c.markets.slice(0,3).join(" · ")));
      if(c.scope==="national" && !c.evergreen) tags.appendChild(el("span","tag","nationwide"));
      if(!c.evergreen && Date.now()-Date.parse(c.firstSeen)<36e5*30) tags.appendChild(el("span","tag hot","new today"));
      top.appendChild(tags);
      if(c.terms){ var d=el("details","terms"); d.appendChild(el("summary",null,"Fine print")); d.appendChild(el("p",null,c.terms)); top.appendChild(d); }
      t.appendChild(top);
      t.appendChild(el("div","perf"));
      var stub=el("div","stub");
      var how = c.evergreen ? "From greatclips.com" : /offers\.greatclips\.com/.test(c.url) ? "Opens the coupon. Show it on your phone at checkout." : "Full details and the coupon link are in the post";
      stub.appendChild(el("span","small",how));
      var go=el("a","btn",c.evergreen?"Details":"Get coupon"); go.href=c.url; go.target="_blank"; go.rel="noopener nofollow";
      stub.appendChild(go);
      t.appendChild(stub);
      var foot=el("div","foot");
      var src=el("a","small","via "+host(c.thread||c.url)+" ↗"); src.href=c.thread||c.url; src.target="_blank"; src.rel="noopener nofollow";
      foot.appendChild(src);
      var votes=el("div","row"); if(c.evergreen){ foot.appendChild(votes); t.appendChild(foot); return t; }
      var mine=store.get("v:"+c.id);
      [["worked","✓ Worked"],["expired","✕ Didn't work"]].forEach(function(p){
        var b=el("button","vote",p[1]+(c.votes[p[0]]? " · "+c.votes[p[0]]:"")); b.type="button";
        b.setAttribute("aria-pressed", mine===p[0]?"true":"false");
        b.disabled=!!mine;
        b.onclick=function(){
          fetch("/api/vote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:c.id,v:p[0]})})
            .then(function(r){ return r.ok? r.json():null; }).then(function(v){
              store.set("v:"+c.id,p[0]); if(v){ c.votes=v; } t.replaceWith(ticket(c)); toast("Thanks, that helps everyone!");
            });
        };
        votes.appendChild(b);
      });
      foot.appendChild(votes);
      t.appendChild(foot);
      return t;
    }


    function fill(box, list, countEl){
      box.textContent="";
      list.forEach(function(c){ box.appendChild(ticket(c)); });
      countEl.textContent=list.length? list.length+(list.length===1?" deal":" deals"):"";
    }

    function empty(box, html){ box.textContent=""; var d=el("div","empty"); box.appendChild(d); html(d); }

    function load(){
      var zip=$("zip").value.trim(), radius=$("radius").value;
      var q = /^\d{5}$/.test(zip)? "?zip="+zip+"&radius="+radius : "";
      fetch("/api/coupons"+q).then(function(r){return r.json();}).then(function(d){
        var meta=$("meta"); meta.textContent="";
        if(d.lastCrawl){ var s=el("span"); s.appendChild(el("span","dot")); s.appendChild(document.createTextNode("Checked "+ago(d.lastCrawl.at))); meta.appendChild(s); }
        else meta.appendChild(el("span",null,"First crawl in progress, check back in a few minutes."));
        fill($("national"), d.national, $("natCount"));
        if(!d.national.length) empty($("national"), function(e){ e.textContent="No nationwide coupons right now. Most Great Clips deals are local to one area, so search your ZIP above."; });
        fill($("always"), d.always, {textContent:""}); $("alwaysSec").hidden=!d.always.length;
        if(!q){ $("localSec").hidden=true; return; }
        $("localSec").hidden=false;
        if(d.unknownZip){ $("localHead").textContent="Near you"; $("localCount").textContent=""; empty($("local"),function(e){ e.textContent="We don't recognize that ZIP code. Please check it and try again."; }); return; }
        $("localHead").textContent="Near "+d.where.city+", "+d.where.state;
        fill($("local"), d.local, $("localCount"));
        if(!d.local.length){
          empty($("local"), function(e){
            e.appendChild(el("strong",null,"No local coupons within "+d.radius+" mi right now. "));
            e.appendChild(document.createTextNode("Great Clips salons release local deals every few weeks, and we check every morning. Try a bigger radius or come back soon."));
            if(d.elsewhere.length){ e.appendChild(el("br")); e.appendChild(el("br")); e.appendChild(document.createTextNode("Live right now in: "+d.elsewhere.join(" · "))); }
          });
        }
      }).catch(function(){ toast("Couldn't load deals, please try again"); });
    }

    $("f").onsubmit=function(e){ e.preventDefault(); var z=$("zip").value.trim(); if(z && !/^\d{5}$/.test(z)){ toast("Enter a 5-digit ZIP"); return; } store.set("zip",z); store.set("radius",$("radius").value); load(); };
    var z=store.get("zip"); if(z) $("zip").value=z;
    var r=store.get("radius"); if(r) $("radius").value=r;
    load();
    })();
    </script>
    </body>
    </html>
  llm.js: |
    "use strict";
    // Tiny Ollama client with ordered fallback: try each endpoint in OLLAMA_URLS
    // (DGX Spark first, in-cluster Ollama second) and remember which one answered.

    const URLS = (process.env.OLLAMA_URLS || "http://10.0.128.110:11434,http://ollama.ollama:11434")
      .split(",").map(s => s.trim()).filter(Boolean);
    const MODEL = process.env.OLLAMA_MODEL || "llama3.1:8b";
    const TIMEOUT_MS = +(process.env.OLLAMA_TIMEOUT_MS || 150000);

    let lastGood = null;

    async function tryOne(base, body) {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
      try {
        const r = await fetch(base + "/api/generate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
          signal: ctl.signal,
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        return d.response || "";
      } finally { clearTimeout(t); }
    }

    // Ask for strict JSON. Returns parsed object or null.
    async function json(prompt, { model = MODEL } = {}) {
      const body = { model, prompt, stream: false, format: "json", keep_alive: "30m",
                     options: { temperature: 0 } };
      const order = lastGood ? [lastGood, ...URLS.filter(u => u !== lastGood)] : URLS;
      for (const base of order) {
        try {
          const out = await tryOne(base, body);
          lastGood = base;
          try { return JSON.parse(out); } catch { return null; }
        } catch (e) {
          console.log(`[llm] ${base} failed: ${e.message}`);
        }
      }
      return null;
    }

    function endpoint() { return lastGood; }

    module.exports = { json, endpoint, MODEL };
  server.js: |
    "use strict";
    // ClipDrop — daily-crawled Great Clips coupon board. Dependency-free Node.
    const http = require("http");
    const fs = require("fs");
    const path = require("path");
    const store = require("./store");
    const geo = require("./geo");
    const crawler = require("./crawler");

    const PORT = +(process.env.PORT || 8080);
    const ADMIN_TOKEN = process.env.ADMIN_TOKEN || "";
    const CRAWL_HOUR = +(process.env.CRAWL_HOUR || 6); // local hour (TZ env) for the daily crawl
    const PAGE = path.join(__dirname, "index.html");

    // ---- helpers ---------------------------------------------------------------
    const today = () => new Date().toISOString().slice(0, 10);

    const NO_DATE_DAYS = 21; // an undated post is assumed stale after this long

    function isLive(c) {
      const v = store.db().votes[c.id];
      if (v && v.expired >= 3 && v.expired > v.worked * 2) return false; // visitors say it's dead
      if (Date.now() - Date.parse(c.lastSeen) > 3 * 86400e3) return false; // gone from the source
      if (c.expires) return c.expires >= today();
      return c.evergreen || Date.now() - Date.parse(c.posted + "T12:00:00Z") < NO_DATE_DAYS * 86400e3;
    }

    // How close a visitor is to a coupon's market: a city market reaches ~50 mi
    // around the city centre; a state-wide market covers the whole state.
    const CITY_REACH_MI = 50;
    function nearest(c, where, radius) {
      let best = null;
      for (const l of c.locs || []) {
        if (l.lat != null) {
          const mi = geo.miles(where, l);
          if (mi <= radius + CITY_REACH_MI && (!best || mi < best.miles))
            best = { miles: Math.round(mi), place: `${l.city}, ${l.state}` };
        } else if (l.state === where.state && (!best || best.miles > 0)) {
          best = { miles: 0, place: `all of ${l.state}` };
        }
      }
      return best;
    }

    function publicCoupon(c, near) {
      const v = store.db().votes[c.id] || { worked: 0, expired: 0 };
      return {
        id: c.id, title: c.title, offer: c.offer, terms: c.terms || null,
        expires: c.expires || null, scope: c.scope, evergreen: !!c.evergreen, source: c.source,
        url: c.url, thread: c.thread && c.thread !== c.url ? c.thread : null,
        markets: (c.locs || []).map(l => l.city ? `${l.city}, ${l.state}` : l.state),
        miles: near ? near.miles : null, place: near ? near.place : null,
        posted: c.posted, firstSeen: c.firstSeen, votes: v,
      };
    }

    const hits = new Map(); // ip|key -> last time
    function limited(ip, key, ms) {
      const k = ip + "|" + key, now = Date.now();
      if (hits.size > 50000) hits.clear();
      if (now - (hits.get(k) || 0) < ms) return true;
      hits.set(k, now); return false;
    }

    function send(res, code, body, type = "application/json") {
      res.writeHead(code, { "content-type": type, "cache-control": "no-store",
        "x-content-type-options": "nosniff" });
      res.end(type === "application/json" ? JSON.stringify(body) : body);
    }

    function readBody(req) {
      return new Promise((ok) => {
        let s = "";
        req.on("data", d => { s += d; if (s.length > 4096) req.destroy(); });
        req.on("end", () => { try { ok(JSON.parse(s || "{}")); } catch { ok({}); } });
      });
    }

    const clientIp = req => (req.headers["cf-connecting-ip"] || req.headers["x-forwarded-for"] || req.socket.remoteAddress || "").split(",")[0].trim();

    // ---- routes ----------------------------------------------------------------
    async function handle(req, res) {
      const u = new URL(req.url, "http://x");
      const ip = clientIp(req);
      const db = store.db();

      if (req.method === "GET" && (u.pathname === "/" || u.pathname === "/index.html"))
        return send(res, 200, fs.readFileSync(PAGE), "text/html; charset=utf-8");
      if (u.pathname === "/healthz") return send(res, 200, { ok: true });

      if (req.method === "GET" && u.pathname === "/api/coupons") {
        const zip = (u.searchParams.get("zip") || "").trim();
        const radius = Math.min(250, Math.max(5, +(u.searchParams.get("radius") || 40)));
        const where = /^\d{5}$/.test(zip) ? geo.lookup(zip) : null;
        const live = Object.values(db.coupons).filter(isLive);
        const byNew = (a, b) => (b.posted || "").localeCompare(a.posted || "");
        const national = live.filter(c => c.scope === "national" && !c.evergreen).map(c => publicCoupon(c)).sort(byNew);
        const always = live.filter(c => c.evergreen).map(c => publicCoupon(c));
        let local = [];
        if (where) {
          local = live.filter(c => c.scope === "local")
            .map(c => { const n = nearest(c, where, radius); return n && publicCoupon(c, n); })
            .filter(Boolean).sort((a, b) => a.miles - b.miles || byNew(a, b));
        }
        // Other markets with live deals right now: shown as a teaser when nothing is local.
        const elsewhere = [...new Set(live.filter(c => c.scope === "local")
          .flatMap(c => (c.locs || []).map(l => l.city ? `${l.city}, ${l.state}` : l.state)))].slice(0, 12);
        const last = db.crawls[db.crawls.length - 1] || null;
        return send(res, 200, {
          where, radius, local, national, always, elsewhere,
          unknownZip: !!zip && !where,
          lastCrawl: last && { at: last.at, found: last.found },
        });
      }

      if (req.method === "POST" && u.pathname === "/api/vote") {
        const { id, v } = await readBody(req);
        if (!db.coupons[id] || !["worked", "expired"].includes(v)) return send(res, 400, { error: "bad vote" });
        if (limited(ip, "vote:" + id, 12 * 3600e3)) return send(res, 429, { error: "already voted" });
        const t = db.votes[id] || (db.votes[id] = { worked: 0, expired: 0 });
        t[v]++; store.save();
        return send(res, 200, t);
      }

      if (req.method === "GET" && u.pathname === "/api/status") {
        return send(res, 200, { crawls: db.crawls.slice(-7), running: crawler.running(),
          coupons: Object.keys(db.coupons).length, live: Object.values(db.coupons).filter(isLive).length });
      }

      if (req.method === "POST" && u.pathname === "/api/crawl") {
        if (!ADMIN_TOKEN || req.headers.authorization !== "Bearer " + ADMIN_TOKEN)
          return send(res, 401, { error: "unauthorized" });
        if (crawler.running()) return send(res, 409, { error: "crawl already running" });
        crawler.run().catch(e => console.log("[crawl] failed:", e));
        return send(res, 202, { started: true });
      }

      send(res, 404, { error: "not found" });
    }

    // ---- daily schedule --------------------------------------------------------
    function lastCrawlAt() {
      const c = store.db().crawls; return c.length ? Date.parse(c[c.length - 1].at) : 0;
    }
    setInterval(() => {
      const now = new Date();
      if (now.getHours() === CRAWL_HOUR && Date.now() - lastCrawlAt() > 20 * 3600e3 && !crawler.running())
        crawler.run().catch(e => console.log("[crawl] failed:", e));
    }, 60e3);

    (async () => {
      await geo.load(store.DATA_DIR).catch(e => console.log("[geo] load failed:", e.message));
      http.createServer((req, res) => handle(req, res).catch(e => {
        console.log("[http]", e); send(res, 500, { error: "server error" });
      })).listen(PORT, () => console.log(`clipdrop listening on :${PORT}`));
      // Fresh volume or pod down over the crawl hour → crawl now.
      if (Date.now() - lastCrawlAt() > 26 * 3600e3) setTimeout(() => crawler.run().catch(e => console.log("[crawl] failed:", e)), 5000);
    })();

    for (const sig of ["SIGTERM", "SIGINT"]) process.on(sig, () => { store.save(true); process.exit(0); });
  store.js: |
    "use strict";
    // JSON-file store on the data volume. Small enough to keep fully in memory;
    // writes are atomic (tmp + rename) and debounced.
    const fs = require("fs");
    const path = require("path");

    const DATA_DIR = process.env.DATA_DIR || "/data";
    const FILE = path.join(DATA_DIR, "coupons.json");

    let db = { coupons: {}, crawls: [], votes: {} };
    try { db = Object.assign(db, JSON.parse(fs.readFileSync(FILE, "utf8"))); } catch {}

    let timer = null;
    function save(now = false) {
      const write = () => {
        timer = null;
        try {
          fs.writeFileSync(FILE + ".tmp", JSON.stringify(db));
          fs.renameSync(FILE + ".tmp", FILE);
        } catch (e) { console.log("[store] save failed:", e.message); }
      };
      if (now) { clearTimeout(timer); return write(); }
      if (!timer) timer = setTimeout(write, 2000);
    }

    module.exports = { db: () => db, save, DATA_DIR };
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: clipdrop-src
  namespace: clips
