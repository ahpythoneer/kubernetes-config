    // A few big metros for orientation when zoomed in.
    var CITIES=[["New York",40.71,-74.0],["Los Angeles",34.05,-118.24],["Chicago",41.88,-87.63],["Houston",29.76,-95.37],["Phoenix",33.45,-112.07],["Philadelphia",39.95,-75.17],["San Antonio",29.42,-98.49],["San Diego",32.72,-117.16],["Dallas",32.78,-96.8],["Austin",30.27,-97.74],["Jacksonville",30.33,-81.66],["Fort Worth",32.76,-97.33],["Columbus",39.96,-83.0],["Charlotte",35.23,-80.84],["Indianapolis",39.77,-86.16],["San Francisco",37.77,-122.42],["Seattle",47.61,-122.33],["Denver",39.74,-104.99],["Nashville",36.16,-86.78],["Oklahoma City",35.47,-97.52],["El Paso",31.76,-106.49],["Boston",42.36,-71.06],["Portland",45.52,-122.68],["Las Vegas",36.17,-115.14],["Detroit",42.33,-83.05],["Memphis",35.15,-90.05],["Louisville",38.25,-85.76],["Baltimore",39.29,-76.61],["Milwaukee",43.04,-87.91],["Albuquerque",35.08,-106.65],["Tucson",32.22,-110.97],["Kansas City",39.1,-94.58],["Atlanta",33.75,-84.39],["Omaha",41.26,-95.93],["Miami",25.76,-80.19],["Minneapolis",44.98,-93.27],["Tulsa",36.15,-95.99],["Cleveland",41.5,-81.69],["Tampa",27.95,-82.46],["Orlando",28.54,-81.38],["New Orleans",29.95,-90.07],["St. Louis",38.63,-90.2],["Pittsburgh",40.44,-80.0],["Cincinnati",39.1,-84.51],["Salt Lake City",40.76,-111.89],["Corpus Christi",27.8,-97.4],["Waco",31.55,-97.15],["Ocala",29.19,-82.14],["Des Moines",41.59,-93.62],["Boise",43.62,-116.2],["Raleigh",35.78,-78.64],["Richmond",37.54,-77.44],["Sacramento",38.58,-121.49],["Birmingham",33.52,-86.8]];
