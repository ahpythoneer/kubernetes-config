# phpIPAM web UI (LAN-only at 10.0.0.167) + scan agent (ping/discovery every 15m).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-web
  namespace: ipam
  labels:
    app: phpipam-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpipam-web
  template:
    metadata:
      labels:
        app: phpipam-web
    spec:
      containers:
      - name: phpipam
        image: phpipam/phpipam-www:v1.8.3
        env:
        - name: TZ
          value: America/Chicago
        - name: IPAM_DATABASE_HOST
          value: phpipam-db
        - name: IPAM_DATABASE_NAME
          value: phpipam
        - name: IPAM_DATABASE_USER
          value: phpipam
        - name: IPAM_DATABASE_PASS
          valueFrom: {secretKeyRef: {name: phpipam-db, key: password}}
        - name: IPAM_DATABASE_WEBHOST
          value: "%"
        - name: IPAM_DISABLE_INSTALLER
          value: "true"     # schema is loaded directly; no web installer exposed
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpipam-cron
  namespace: ipam
  labels:
    app: phpipam-cron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpipam-cron
  template:
    metadata:
      labels:
        app: phpipam-cron
    spec:
      containers:
      - name: cron
        image: phpipam/phpipam-cron:v1.8.3
        env:
        - name: TZ
          value: America/Chicago
        - name: IPAM_DATABASE_HOST
          value: phpipam-db
        - name: IPAM_DATABASE_NAME
          value: phpipam
        - name: IPAM_DATABASE_USER
          value: phpipam
        - name: IPAM_DATABASE_PASS
          valueFrom: {secretKeyRef: {name: phpipam-db, key: password}}
        - name: SCAN_INTERVAL
          value: 15m
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          capabilities:
            add: ["NET_RAW"]   # fping needs raw ICMP sockets
---
apiVersion: v1
kind: Service
metadata:
  name: phpipam
  namespace: ipam
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.0.0.167   # LAN only — no tunnel route, no DNS
spec:
  type: LoadBalancer
  selector:
    app: phpipam-web
  ports:
  - name: http
    port: 80
    targetPort: http
